  meaning_en: is also used as an indication of money. The tahil hoekoem or djinamée then represents a
    value of five pillar mats
  meaning_nl: wordt ook ter aanduiding van geld gebezigd. De tahil hoekoem of djinamée stelt dan eene
    waarde van vijf pilaarmatten voor
- meaning_id: tahil addat dari salah empat dan tahil atau sabong, juga empat tiang tiang
  meaning_en: the tahil addat of salah four and the tahil djoedi or sabong, also four pillar mats
  meaning_nl: de tahil adat of salah vier en de tahil djoedi of sabong, eveneens vier pilaarmatten
