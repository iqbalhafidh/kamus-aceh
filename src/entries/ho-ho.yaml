part_of_speech: a
definitions:
- meaning_id: luntang-lantung, tidak takut kepada apa pun
  meaning_en: loafing about aimlessly, afraid of nothing
examples:
- aceh: peue tapeugah bak jih ureueng hô-hô
  jawi: ''
  id: Tidak ada gunanya Anda berkata atau menasehati si dungu itu!
  en: There is no use in your speaking or giving advice to that fool!
- aceh: meu hô-hô
  jawi: ''
  id: spt orang dungu
  en: like a fool
- aceh: meu hô-hô keudèh, meu hô-hô keu noe, hana teutap di rumoh
  jawi: ''
  id: lunta ng-lantung ke sana kemari, tidak tetap tinggal di rumah
  en: loafing about here and there, never staying at home
- aceh: peu hô-hô droe
  jawi: ''
  id: bersikap dungu dan luntang-lantung
  en: to act foolishly and loaf about
- aceh: bèk tapeu hô-hô droeteu malam-malam
  jawi: ''
  id: Janganlah Anda luntang-lantung pd malam hari
  en: Do not loaf about at night
