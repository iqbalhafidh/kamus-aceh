- meaning_id: memperdengarkan bunyi –
  meaning_en: hear sound
examples:
- aceh: 'mantong, buet hana, hanya pandai membual tanpa perbuatan (=banyak bual tanpa perbuatan): manok
    ka ji keut''euek'
  jawi: ''
  id: Ayam (betina) sudah berkotak
  en: The hen has begun to cluck
- aceh: meu keut'euek, (=keumeut’euek) melakukan keut’euek
  jawi: ''
  id: sedang berkotek
  en: in the midst of to cluck
- aceh: pakon meu keut'euek keut'euek manok nyan?
  jawi: ''
  id: Mengapakah ayam betina itu berkotek-kotek?
  en: Why is that hen clucking so?
- aceh: pubuet tameu keut'euek atau takeumet’euek lam rumoh, adak beuhe gata, tatrôn keu noe!
  jawi: ''
  id: Apa gunanya Anda berbesar mulut di dl rumah, jika berani, turunlah ke mari!
  en: What use is your big talk indoors? If you dare, come down here!
- aceh: peu keut'euek
  jawi: ''
  id: menyuruh berkotek
  en: to order to cluck
- aceh: bêk tapeu keut'euek manok tôh boh
  jawi: ''
  id: Anda jangan membiarkan ayam betina yg sedang bertelur berkotek (ump dng mengusirnya dr tempatnya)
  en: Do not set the laying hen clucking by driving her off her place
- aceh: raya that
  jawi: ''
  id: (ia) bermulut sangat besar
  en: mouth very big (he)
