ipa: ''
part_of_speech: v
definitions:
- meaning_id: kotek
  meaning_en: ''
- meaning_id: suara ayam betina yang telah atau hendak bertelur
  meaning_en: ''
- meaning_id: suara ayam betina atau jantan jika melihat bintang yang menakutkan (umpamanya ular
  meaning_en: ''
- meaning_id: musang)
  meaning_en: civet
- meaning_id: teriakan seseorang yang akan meni nggal
  meaning_en: ''
- meaning_id: (dalam ari kata terakhir biasanya disebut geumeuréb atau hôi ayôh)
  meaning_en: in the last sense usually called geumeuréb or hôi ayôh
- meaning_id: (selanjutnya sebagai kiasan) membual
  meaning_en: and figuratively, to boast
- meaning_id: beromong-kosong
  meaning_en: to talk nonsense
- meaning_id: berkotek
