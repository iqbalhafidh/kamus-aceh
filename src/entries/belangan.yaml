definitions:
- meaning_id: sejenis pohon dengan cabang berduri, jus buah yang digunakan sebagai grub untuk dislokasi.
    pohon ini juga disebut ranking kileh
  meaning_en: kind of tree with thorny branches, the fruit juice of which is used as a rub for dislocation.
    This tree is also called rank kilih
  meaning_nl: soort van boom met doornige takken, waarvan het sap der vruchten als wrijfmiddel tegen ontwrichting
    wordt gebezigd. Deze boom wordt ook rangkilih genoemd
