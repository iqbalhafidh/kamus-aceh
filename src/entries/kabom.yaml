headword: kabom
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: kemam, gemam, mengulum, menahan dalam mulut (seperti sirih)
  meaning_en: to mumble, to hold in the mouth, to hold in the mouth, as betel
examples:
- aceh: ji kabom
  jawi: ''
  id: bakong, Ia mengemam tembakau
  en: he holds tobacco in his mouth
- aceh: ji kabom ubat lam babah
  jawi: ''
  id: Ia mengemam obat dalam mulut (Ia tidak mau menelannya)
  en: He holds the medicine in his mouth and will not swallow it
- aceh: meu kabom
  jawi: ''
  id: terkulum, tertahab dalam mulut
  en: held in the mouth
- aceh: narit meu kabom
  jawi: ''
  id: kata-kata yang diucapkan secara tidak jelas, komat-kamit, (ump kata-kata marah atau makian)
  en: words muttered indistinctly, as in anger or cursing
- aceh: buet gata meu kabom that
  jawi: ''
  id: perbuatan Anda sangat terselubung (dikatakan terhadap seseorang yang tidak pernah berbuat mengenai
    apa yang diucapkannya)
  en: your conduct is very veiled, said of one who never acts on what he says
- aceh: tapeu kabom droe di rumoh
  jawi: ''
  id: '? Mengapakah Anda menyendiri dirumah?'
  en: Why do you keep to yourself at home?
- aceh: Keumabom
  jawi: ''
  id: tindakan mengemam, sedang mengemam, sedang menahan atau memeram sesuatu dalam mulut
  en: the act of holding something in the mouth
etymology: ''
