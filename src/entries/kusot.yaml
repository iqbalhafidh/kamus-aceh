part_of_speech: a
definitions:
- meaning_id: kusut
  meaning_en: tangled
- meaning_id: keadaan kacau balau
  meaning_en: a state of chaos
- meaning_id: tidak menentu lagi ujung pangkalnya
  meaning_en: ''
examples:
- aceh: buet nyan ka kusot
  jawi: ''
  id: Perkara itu sudah kusut, bertambah sukar
  en: That affair has grown tangled and more difficult
- aceh: beuneung kusot tabôh bak ilang, aneuk moe tajôk bak nang
  jawi: ''
  id: Benang kusut harus digulung di gelendongnya, anak menangis harus diserahkan kpd ibunya, pb menyerahkan
    sesuatu hal kpd ahlinya
  en: '(proverb) Tangled thread goes on the bobbin, a crying child to its mother: leave a matter to the
    one who knows it'
- aceh: meu kusot
  jawi: ''
  id: menjadi kusut
  en: to become tangled
- aceh: ka meu kusot bandum
  jawi: ''
  id: Semuanya sudah kacau-balau
  en: Everything is in confusion
- aceh: peu kusot
  jawi: ''
  id: membuat shg kusut, mengacau-balaukan
  en: to make so that tangled, to throw into confusion
