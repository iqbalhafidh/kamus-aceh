examples:
- aceh: neu-nyoe di yub sange
  jawi: ''
  id: Tempatkan ini di bawah tudung saji
  en: Put this under the food cover
- aceh: pinto khob
  jawi: ''
  id: Pintu gerbang yg berbentuk lengkungan rendah, bekas peninggalan dalam sultan Aceh yg sekarang terletak
    di sebelah barat daya Banda Aceh, dulu hanya boleh dimasuki oleh orang-orang yg berdekatan dng raja
    saja, oleh pandai emas bentuknya sudah dijadikan motif perhiasan wanita dng sebutan 'pintu Aceh'
  en: a low arched gateway, a relic of the Acehnese sultan's palace now south-west of Banda Aceh, formerly
    entered only by those close to the king; goldsmiths have made its shape a motif in women's jewellery
    called the Aceh gate
- aceh: peue ji khob le asee?
  jawi: ''
  id: Apakah yg dimakan oleh anjing?
  en: What did the dog eat?
- aceh: ka khob keu kah!
  jawi: ''
  id: (kata-kata marah) Makanlah olehmny!
  en: (in anger) Eat it yourself!
- aceh: bek ta-pajoh bu bagaih-bagaid lagee asee khob
  jawi: ''
  id: '! Anda jangan makan cepat-cepat spt suara dekap anjing makan'
  en: Do not gulp your food like a dog snapping at its meal
- aceh: meukhob
  jawi: ''
  id: memperdengarkan bunyi
  en: hear sound
- aceh: su asee pumajoh meukhob
  jawi: ''
  id: jika anjing makan, terdengar suara berdekap-dekap
  en: when a dog eats, a snapping sound is heard
- aceh: boh manokkh'ob
  jawi: ''
  id: telur ayam busuk?
  en: ''
- aceh: pat bee bangke? kh'ob that!
  jawi: ''
  id: Di manakah yg berbau bangkai? busuk sekali!
  en: Where is that smell of carrion? It is foul!
- aceh: peukh'ob
  jawi: ''
  id: membuat atau membiarkan sesuatu berbau busuk
  en: ''
