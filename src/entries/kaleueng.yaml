headword: kaleueng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menempatkan tatakan (umpamanya balok kayu dan sebagainya) di bawah sesuatu benda (untuk
    melepaskannya dari bawah atau memperkuat kedudukannya), menggalang, tatakan, sokongan (=keunaleueng)
  meaning_en: to place a support such as a beam under something, to free it from below or steady it, to
    prop up, a rest, a support, a support
examples:
- aceh: lamari ka lôn kaleueng (atau ka lôn bôh keunaleueng)
  jawi: ''
  id: bunoe singêt, (dibawah), saya telah membubuhi tatakan pada lemari yang letaknya miring. Ta kaleueng
    prahô, sokonglah perahu itu dengan membubuhi alas dibawahnya! Bantai kaleueng atau kaleueng keunaleueng,
    bantal pangalas
  en: I put a support under the cupboard that stood askew. Prop the boat with a block beneath it. A bolster
    used as a rest
- aceh: meu kaleueng batang (dl istilah ini dipergunakan juga meukalang batang)
  jawi: ''
  id: huruf seperti batang yang dipergunakan sebagai alas, ji tidak bergerak-gerak, seolah-olah mati,
    (ump orang sakit yang tidak bergerak-gerak)
  en: a letter like a stroke used as a base; motionless as though dead, as a sick person who does not
    stir
- aceh: sakétji ka treb meu kaleueng batang
  jawi: ''
  id: Ia terbaring tidak bergerak-gerak karena sakitnya sudah lama, teu kaleueng, berkalang, tergalang
  en: He lies motionless, having been ill a long time
- aceh: ladôm geukheun keunaleueng lidah
  jawi: ''
  id: bak geupeugah sabda raja, setelah itu ia menyerahkan sebuah dokumen tertulis yang dinamakan sarakata
    (yi surat keputusan raja, dalam hal ini dengan permainan kata carah kata (keterangan atau penjelasan
    untuk kata-kata yang telah diucapkan) yang juga dinamakan keunaleueng lidah tempat menyampaikan titah
    raja
  en: when the king's word is spoken he hands over a written document called a sarakata, the royal decree
etymology: ''
