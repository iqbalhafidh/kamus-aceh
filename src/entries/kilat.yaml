part_of_speech: n
definitions:
- meaning_id: kilat, berkilat, bercahaya
  meaning_en: lightning, gleaming, light
- meaning_id: cuaca cahaya, cuaca, cahaya bersinar, kecemerlangan, bersinar dari objek
  meaning_en: weather light, weathershine, light shine, brilliance, shine of objects
  meaning_nl: weerlicht, weerschijn, lichtglans, schittering, glinsteren van voorwerpen
examples:
