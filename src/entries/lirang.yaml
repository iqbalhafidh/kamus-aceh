headword: lirang
jawi: ليرغ
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: memotong sesuatu sepanjang tulang daun (umpamanya daun pisang)
  meaning_en: to cut something along the midrib, as a banana leaf
- meaning_id: sepanjang pinggir daun (seperti kulit rebana sepanjang simpainya)
  meaning_en: ''
- meaning_id: memotong dua (seperti kain atau tikar)
  meaning_en: to cut up two (like cloth or mat)
- meaning_id: memotong sesuatu sepanjang tepi, biji-bijian atau serat
  meaning_en: cut something along the edge, grain or fiber
  meaning_nl: iets langs den rand, nerf of vezel afsnijden
examples:
- aceh: nyang meuaneuk duek bak geu-pet, nyang cirêt duek bak guha
  jawi: ''
  id: Suruhlah orang kurus memotong daun (secara diterangkan di atas), yg gemuk (menggiling rempah-rempah)
  en: Let the thin man cut the leaves and the stout one grind the spices
- aceh: jang pijut tajueer lirang un
  aceh_1889: jang pidjoet tajoëer lirang oen
  jawi: ''
  id: JE tëmboen bak batée lada, JANG Mänäk kain gëpit, JANG djirit kain goeha, (ZAtj)
  en: jang tëmboen bak batée lada, jang mänäk cloth gëpit, jang djirit cloth goeha, (Atj)
  nl: jang tëmboen bak batée lada, jang mänäk doek bak gëpit, jang djirit doek bak goeha, (Atj
- aceh: spreekw haar
  aceh_1889: spreekw.) haar
  jawi: ''
  id: jika itu adalah kurus, itu harus dilas, daun dipotong sepanjang pembuluh darah mereka, rambut yang
    berat, Anda harus memakai pabrik lada atau roll halus. dia, yang baru saja melahirkan, harus ditempatkan
    di depan watervaatje, dia, yang memiliki sakit perut, harus duduk di dekat gua
  en: if it is skinny, it must be welded, leaves cut along their veins, hair that is heavy, you must put
    on a pepper mill or roll finely. her, who has recently given birth, must be placed in front of a watervaatje;
    she, who has abdominal pain, must sit near a cave
  nl: die mager is, moet ge gelasten, bladeren langs hun nerf af te snijden, haar, die zwaar is, moet
    ge aan het pepermalen of fijn rollen zetten, haar, die pas gebaard heeft, moet ge voor een watervaatje
    plaatsen, zij, die buikpijn heeft, moet bij een grot zitten
