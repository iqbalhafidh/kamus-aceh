headword: lôb
jawi: لوب
alt_spelling:
- lob
ipa: ''
part_of_speech: v
definitions:
- meaning_id: berjalan di bawah sesuatu sambil membungkuk (umpamanya di bawah pagar kawat)
  meaning_en: to walk stooping under something, as under a wire fence
- meaning_id: menyelinap ke dalam sebuah ruang yang gelap atau kecil (umpamanya kandang hewan)
  meaning_en: ''
- meaning_id: terbenam (untuk matahari)
  meaning_en: sunk (for sun)
- meaning_id: cocok (untuk pakaian)
  meaning_en: suitable (for clothing)
- meaning_id: lôt
  meaning_en: ''
- meaning_id: membalik (halaman buku)
  meaning_en: to turn a page
- meaning_id: membuka (buku)
  meaning_en: to open (book)
- meaning_id: menuimpan (tikar tempat tidur)
  meaning_en: ''
- meaning_id: menggulung
  meaning_en: to roll up
- meaning_id: melengkung (umpamanya ujung tombak
  meaning_en: curved for example tip lance
- meaning_id: browse, halaman flip
  meaning_en: browse, flip pages
  meaning_nl: doorbladeren, bladzijden omslaan
examples:
