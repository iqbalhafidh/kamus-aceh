  en: ''
- aceh: peulôb droe
  jawi: ''
  id: menyesuaikan diri, menghias diri
  en: ''
- aceh: 'v meletus, berbunyi (senapan): hana jitém lôb'
  jawi: ''
  id: Ia tidak mau berbunyi atau meletus
  en: It will not sound or go off
