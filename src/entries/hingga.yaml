headword: hingga
jawi: هیفکا
alt_spelling: []
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: hingga, batas yang terjauh, akhir
  meaning_en: limit, the furthest limit, end
- meaning_id: untuk, berakhir
  meaning_en: to, end
  meaning_nl: tot, tot aan, einde
examples:
