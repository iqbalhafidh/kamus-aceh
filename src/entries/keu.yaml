headword: keu
jawi: ''
alt_spelling:
- keuh
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: tekanan pada suatu kata tertentu yang terletak di belakangnya, lebih kurang seperti -lah
  meaning_en: stress on the particular word that follows it, roughly equivalent to -lah
- meaning_id: juga
  meaning_en: also
- meaning_id: kata depan dengan dasar arti penunjuk arah
  meaning_en: a preposition whose basic sense indicates direction
- meaning_id: kebanyakan dipergunakan dalam arti kiasan untuk memberi tekanan kepada sesuatu maksud atau
    tujuan ke
  meaning_en: mostly used figuratively to emphasise an intention or purpose
- meaning_id: kepada
  meaning_en: to
- meaning_id: thdp
  meaning_en: ''
- meaning_id: untuk
  meaning_en: for
- meaning_id: akan
  meaning_en: will
- meaning_id: kata depan untuk membentuk kata bilangan tingkatan
  meaning_en: a preposition forming ordinal numbers
examples:
- aceh: kakeu
  jawi: ''
  id: sudahlah! cukuplah
  en: enough! that will do
- aceh: noe, keu nan, keu dèh
  jawi: ''
  id: ke mari, ke situ, ke sana
  en: hither, thither, yonder
- aceh: tabri keu lôn
  jawi: ''
  id: berikanlah kpd saya
  en: give it to me
- aceh: Nyoe keu cawan
  jawi: ''
  id: ini utk mangkok
  en: this is for the bowl
- aceh: Batèe nyoe lôn peuget keu cawan, batu ini saya perbuat utk saya jadikan mangkok, keu peue nyan?
  jawi: ''
  id: Untuk apa ini?
  en: What is this for?
- aceh: Neupeusisat ulé Allah Ta'ala keu hambaNeu nyang kaphé ubak jalan keujeuhatan
  jawi: ''
  id: Allah Ta'ala menyesatkan orang-orang kafir di antara hamba-hamba-Nya pd jalan kejahatan
  en: God Most High lets the unbelievers among His servants stray into the path of evil
- aceh: sa, keudua
  jawi: ''
  id: dsb, pertama atau kesatu
  en: and so forth; first
