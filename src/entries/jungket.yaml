part_of_speech: v
definitions:
- meaning_id: membangkit-bangkit hal-hal yang telah terjadi
  meaning_en: to keep raking up things that have happened
examples:
- aceh: buet nyang ka bek ta jungkét lé!
  jawi: ''
  id: Janganlah Anda membangkit-bangkit hal-hal yg telah terjadi
  en: Do not keep raking up what has already happened
- aceh: keu peue ta jungkét ureueng nyang ka maté?
  jawi: ''
  id: Utk apa Anda menyebut-nyebut hal orang yg telah meninggal?
  en: Why do you keep speaking of the dead?
- aceh: meu jungkét
  jawi: ''
  id: terbangkit-bangkit
  en: raked up again
- aceh: '''oh beungeh gobnyan habéh meu jungkét nyang ka siplôh thôn teuneuréb'
  jawi: ''
  id: Jika ia marah keluarlah semua hal yg telah terjadi sepuluh tahun yg lalu
  en: When he is angry, everything from ten years ago comes out
