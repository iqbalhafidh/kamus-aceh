definitions:
- meaning_id: ikan yang tidak perlu didistribusikan oleh nelayan dalam perusahaan nelayan, karena ikan
    lain telah merobek sepotong ikan yang tertangkap. juga spesies ikan loebiem, yang memiliki mulut kecil
    dan sulit untuk menggigit hook, tidak perlu dibagi
  meaning_en: fish which does not need to be distributed by the fisherman in a fishing company, because
    another fish has torn a piece of that caught fish. Also the fish species loebiem, which has a small
    mouth and difficult to bite at a hook, need not be divided
  meaning_nl: visch die in een visschersvennootschap door den visscher niet behoeft verdeeld te worden,
    omdat een andere visch een stuk van dien gevangen visch heeft afgescheurd. Ook de vischsoort loebiem,
    die een kleinen muil heeft en moeilijk aan een haak bijt, behoeft men niet te verdeelen
