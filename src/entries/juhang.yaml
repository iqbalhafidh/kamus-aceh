part_of_speech: n
definitions:
- meaning_id: sejenis ikan laut yang bersama-sama menampakkan kepala-nya jika timbul di permukaan air
  meaning_en: a kind of sea fish that shows its head in shoals when it surfaces
examples:
- aceh: bungong juhang
  jawi: ''
  id: sj motif hiasan dr lukisan-lukisan tajam yg berbentuk biku-biku
  en: a kind of ornamental motif of sharp zigzag lines
- aceh: meu juhang
  jawi: ''
  id: menyerupai kepala ikan juahng yg timbul di permukaan air, berbentuk tajam, bertubrukan satu sama
    lain, porak-poranda (dl hik)
  en: like the heads of juahng fish breaking the surface, sharp, colliding with one another, in disarray
    (in hikayat)
