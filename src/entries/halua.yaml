headword: halua
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: halwa, nama untuk berbagai jenis kue manis
  meaning_en: sweetmeat, confection, a name for various kinds of sweet cakes
examples:
- aceh: drien
  jawi: ''
  id: halwa dr daging buah durian dan dikeringkan
  en: sweetmeat made from durian flesh and dried
- aceh: meugeunta, halua gr'ing-gr'ing
  jawi: ''
  id: halwa dr beras ketan dng minyak sapi dan manisan tebu
  en: sweetmeat of glutinous rice with ghee and sugar-cane syrup
- aceh: kacang
  jawi: ''
  id: halwa dr beras ketan, gula, air dan kadang (reuteuek duek)
  en: sweetmeat of glutinous rice, sugar, water and sometimes reuteuek duek
- aceh: leungong
  jawi: ''
  id: halwa dng biji bijan
  en: sweetmeat with sesame seed
- aceh: Meulabari
  jawi: ''
  id: halwa Malabari, dibuat dr tepung beras, telur, jintan hitan (jeura itam), gula dan air
  en: Malabar sweetmeat, made of rice flour, egg, black cumin, sugar and water
- aceh: Meuseukat
  jawi: ''
  id: kue Maskat, dibuat dr tepung beras, telur, gula, minyak sapi dan air
  en: Muscat cake, made of rice flour, egg, sugar, ghee and water
- aceh: pisang
  jawi: ''
  id: dr pisang
  en: from banana
- aceh: pulôt
  jawi: ''
  id: beras ketan yg dikukus dng gula, dicampur santan, dan dibungkus daun pisang
  en: glutinous rice steamed with sugar, mixed with coconut milk and wrapped in banana leaf
