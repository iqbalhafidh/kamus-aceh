headword: leungo
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: lecih lazim, deungo v dengar, dapat didengar
  meaning_en: more usual, to hear, can hear
- meaning_id: bergoyang, bergerak ke sana ke mari, gegar, goyah, (umpamanya lemari yang let-knya tidak
    rata, gigi yang tidak kuat lagi)
  meaning_en: to sway, moving to and fro, concussion, unsteady, as a cupboard standing unevenly, teeth
    no longer firm
examples:
- aceh: u nyoe hanaleungo
  jawi: ''
  id: Buah kelapa ini airnya tidak terdengar (jika digoyang)
  en: You cannot hear the water in this coconut when it is shaken
- aceh: tambo Lam Gut su leungo u Meuraksa
  jawi: ''
  id: Bunyi tabuh kampung LG terdengar sampai ke M
  en: The drum of LG village can be heard as far as M
- aceh: neuleungo leungo bak rumoh lom siat, boh! lôn keumeung jak
  jawi: ''
  id: Dengar-dengarlah di rumah saya sebentar (yi pergilah sewaktu-waktu menengok rumah saya)
  en: Keep an ear on my house now and then
- aceh: eneuk nyan baroe mupok ngon moto 'oh leungo utak-utak
  jawi: ''
  id: Kemarin anak itu ditubruk auto shg gegar otak
  en: Yesterday that child was hit by a car and concussed
- aceh: jipoh 'oh leungo utak-utak
  jawi: ''
  id: Ia memukulnya shg gegar otak
  en: He struck him so hard as to concuss him
- aceh: gigoe lôn ka leungo
  jawi: ''
  id: Gigi saya sudah goyang
  en: My tooth is loose
- aceh: tabôh lapêk, bêkleungo!
  jawi: ''
  id: Bubuhilah alasnya supaya tidak bergoyang (ump di bawah kaki lemari)
  en: Put a wedge under it so it does not wobble, as under a cupboard leg
