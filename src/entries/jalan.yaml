headword: jalan
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: jalan, (kiasan) jalan keluar, cara, jalan besar yang diperbuat dahulu oleh pemerintah Belanda
  meaning_en: walk, walk exit (figuratively), way, the main road built in former times by the Dutch government
examples:
- aceh: 'mita jalan hareukat, mencari nafkah: hana jalan'
  jawi: ''
  id: tidak ada jalan keluar
  en: there is no way out
- aceh: neubri seudeukah bak jalan Allah
  jawi: ''
  id: Berilah sedekah pada jalan Allah
  en: Give alms in the way of God
- aceh: Tuan di jalan
  jawi: ''
  id: nama pusara seorang keramat di Lam Nga dalam Sagi XXVI mukim dahulu
  en: the name of a saint's tomb at Lam Nga in the former Sagi of twenty-six mukim
- aceh: u Indrapuri jipeugêt lé ureueng Cina bak masa Kompeuni
  jawi: ''
  id: Jalan raya ke Indrapuri dikerjakan oleh orang-orang Cina pada masa pemerintahan Belanda dahulu
  en: The highway to Indrapuri was built by Chinese labourers under the former Dutch administration
etymology: ''
