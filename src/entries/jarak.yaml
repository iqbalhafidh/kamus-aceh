definitions:
- meaning_id: jauh
  meaning_en: far
examples:
- aceh: that lôn jak uroe nyoe
  jawi: ''
  id: Jauh sekali saya berjalan hari ini
  en: I have walked a very long way today
- aceh: pana 'oh na jarak di sinoe u gampông nyan?
  jawi: ''
  id: Berapa jauhkah dr sini ke kampung itu?
  en: How far is it from here to that village?
- aceh: bak jioh laknat, bak jarak baya
  jawi: ''
  id: semoga dijauhkan laknat dan bahaya (doa restu yg diucapkan kpd pengantin laki-laki)
  en: may curse and danger be kept far off (a blessing spoken over the bridegroom)
- aceh: meu jarak
  jawi: ''
  id: berjauhan
  en: far
- aceh: peu jarak
  jawi: ''
  id: menjauhkan
  en: to keep at a distance
- aceh: tapeu jarak droeteu, bêk toe ngon gobnyan
  jawi: ''
  id: Jauhkanlah diri Anda, jangan mendekati dia
  en: Keep your distance, do not go near him
