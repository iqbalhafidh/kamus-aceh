part_of_speech: v
definitions:
- meaning_id: mengikat sesuatu dengan banyak gulungan kendati pun tidak kuat
  meaning_en: to bind something with many turns, though not tightly
examples:
- aceh: ikat karê marê, mengikat sesuatu dng banyak ikatan, bek that lagoina meu karê
  jawi: ''
  id: jangan diikat terlalu kuat
  en: do not tie too strong
- aceh: Peu karê = karê atau menyuruh karê, tapen karê tika bak reujang, kapai jimumeulayeue
  jawi: ''
  id: ikatlah tikar dng banyak ikatan cepat-cepat krn kapal hendak berlayar
  en: bind the mats with many turns quickly, for the ship is about to sail
- aceh: Teu karê = meu karê, Keumarê, melakukan karê, Keunarê, cara atau hasil kare
  jawi: ''
  id: atau alat untuk melakukannya
  en: or the implement for doing it
