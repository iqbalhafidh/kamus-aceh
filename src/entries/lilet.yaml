headword: lilet
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: lilit, belit, lingkar, lilitan
  meaning_en: coil, to coil, circle, winding
examples:
- aceh: ta lilet ija bak kong bak keuieng teu
  jawi: ''
  id: Lilitkan kain Anda kuat-kuat di pinggang
  en: Wind your cloth tightly round your waist
- aceh: meung hana tapeutok amanat gob, jeuet keu uret nyang lilet teu uroe dudoe
  jawi: ''
  id: Jika Anda tidak menyampaikan amanat seseorang, di hari kemudian amanat itu akan menjadi tanaman
    jalar yg akan melilit pd tubuh Anda (yi Anda akan menanggung dosa besar)
  en: 'If you fail to deliver a trust, on the last day it will become a creeper winding about your body:
    you will bear a great sin'
- aceh: urèt lilet
  jawi: ''
  id: tanaman jalar
  en: plant to creep
- aceh: lôn lumpoe, hai da, uleue lilet ban saboh badan
  jawi: ''
  id: Saya bermimpi, wahai kakak, dililit ular di seluruh badan
  en: I dreamt, sister, that a snake coiled round my whole body
- aceh: ngon taloe
  jawi: ''
  id: melilit dng tali
  en: ''
- aceh: takue = klah takue
  jawi: ''
  id: leher baju emas
  en: neck shirt gold
- aceh: meu lilet
  jawi: ''
  id: terlilit kaki dng tanaman jalar
  en: ''
- aceh: aneuk nyan meu lilet that bak maji, h'an jitem bak gob
  jawi: ''
  id: Anak itu sangat terikat pd ibunya. Ia tak mau pd orang lain
  en: That child clings to his mother and will not go to anyone else
