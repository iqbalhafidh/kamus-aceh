headword: keumob
jawi: ''
alt_spelling:
- meukeumob
- teukeumob
ipa: ''
part_of_speech: a
definitions:
- meaning_id: mulut mengganggu seperti orang merajuk (umpamanya karena keheranan, sakit hati, atau marah)
  meaning_en: to purse the mouth as if sulking, for instance in astonishment, sick heart, or angry
examples:
- aceh: pakon gata meu keumob 'oh takalon ureueng nyan?
  jawi: ''
  id: Mengapa mulut Anda mengganggu seperti orang merajuk jika melihat orang itu?
  en: Why do you purse your lips as if sulking when you see that man?
- aceh: peu keumob
  jawi: ''
  id: mulut mengganggu, memperlihatkan muka spt orang merajuk
  en: to purse the lips, to look as though sulking
- aceh: pakon tapeu keumob lon!
  jawi: ''
  id: Mengapa Anda merajuk kepada saya!
  en: Why do you sulk at me!
etymology: ''
related_words:
