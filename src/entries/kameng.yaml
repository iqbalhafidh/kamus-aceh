headword: kamèng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kambing
  meaning_en: goat
examples:
- aceh: randòk, landòk, kambing yg tidak dikebiri, kambing bandot, kamèng inong
  jawi: ''
  id: kambing betina
  en: female goat
- aceh: batèe
  jawi: ''
  id: sj kambing batu, kambing hutan, kamèng Benggala, kambing Benggala, sj kambing yg panjang bulunya
    serta banyak susunya
  en: a kind of wild goat; the Bengal goat, long-haired and giving much milk
- aceh: tri
  jawi: ''
  id: sj hantu yg mengembik spt kambing mendengus (utk menakut-nakuti anak-anak)
  en: a kind of spirit that bleats like a goat, used to frighten children
- aceh: mata kamèng
  jawi: ''
  id: mata kambing, sj siput yg rumahnya berduri (terdapat di alur-alur yg berair payau dan dapat dimakan)
  en: goat's eye, a spiny-shelled snail found in brackish channels and edible
- aceh: rot atau kab seutuek, situek
  jawi: ''
  id: spt kambing pemakan upih pinang, (dikatakan thd seseorang yg mengikuti atau meniru perbuatan orang
    lain tanpa berpikir akan akibat-akibatnya)
  en: like a goat eating areca spathe, said of one who copies others without thought for the consequences
- aceh: ka tujoh go u Klèng
  jawi: ''
  id: kambing yang tujuh kali pergi ke negeri Keling (dikatakan thd seseorang yg telah pergi kemana-mana
    karenanya telah sangat berpengalaman)
  en: a goat that has been seven times to the land of the Klings, said of a much-travelled and experienced
    person
- aceh: peue takeumeung peu kamèng ngeut gobnyan, kamèng ka tujòh go u Klèng
  jawi: ''
  id: apakah Anda hendak menipunya? Ia seekor kambing yg telah tujuh kali pergi ke negeri Keling (=seorang
    yg telah sangat berpengalaman)
  en: do you mean to cheat him? He is a goat that has been seven times to the land of the Klings (= a
    very experienced man)
etymology: ''
related_words:
- geumeurèb
- mbèk
dialect_notes: ''
