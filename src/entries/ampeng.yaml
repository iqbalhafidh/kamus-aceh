definitions:
- meaning_id: seseorang untuk pergi ke gemoet, menjemput seseorang, membayar upeti atau kehormatan ėmpang,
    salah satu karung padan dikepang
  meaning_en: someone to go to gemoet, pick someone up, pay tribute or honor. ėmpang, one of pandan braided
    sacks
  meaning_nl: iemand te gemoet gaan, iemand afhalen, iemand hulde of eer bewijzen. امفغ ėmpang, een van
    pandan gevlochten zak
- meaning_id: ampēng Padi, tas Padi
  meaning_en: ampēng padi, padi bag
  meaning_nl: ampēng padi, padi-zak
- meaning_id: ampēng brēs, kantong beras ėmpēk, kēladi, sejenis tanaman dengan tepung, akar yang bisa
    dimakan
  meaning_en: ampēng brēs, rice bag. ėmpēk, kēladi, a kind of plant with flour, edible root
  meaning_nl: ampēng brēs, rijstzak. امفق ėmpēk, kēladi, een soort van plant met meelachtigen, eetbaren
    wortel
