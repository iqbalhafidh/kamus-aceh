headword: huek
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: ketulangan, tersangkut tulang dalam kerongkongan
  meaning_en: bone, to have a bone stuck in the throat
examples:
- aceh: neuseu-lusôh bagaih, aneuk lôn ka huek
  jawi: ''
  id: Cepat-cepatlah Anda memberi air mantra, anak saya sudah ketulangan
  en: Quickly give the charmed water, my child has a bone stuck in his throat
- aceh: di gob geupajoh gajah habêh ngon tuleueng ngon asoe hana gob tupeue, di gata tapajôh karêng êk
    huek teu, êk jitupeue lé gob
  jawi: ''
  id: Orang makan gajah dng tulang dan dagingnya tidak diketahui orang, Anda yg makan ikan teri dpt ketulangan
    sehingga diketahui orang lain
  en: Others eat an elephant, bones and flesh, and no one knows; you eat an anchovy and get a bone stuck,
    so everyone finds out
etymology: ''
