ipa: ''
part_of_speech: v
definitions:
- meaning_id: mata
  meaning_en: eye
- meaning_id: mengedip (dengan mata)
  meaning_en: ''
examples:
- aceh: 'a sekejap mata, sesaat: si klèb siklab'
  jawi: ''
  id: dl beberapa saat atau sekejap mata saja
  en: in a moment, in the blink of an eye
- aceh: si klèb siklab ka habèh
  jawi: ''
  id: Dl sekejap mata saja sudah habis atau selesai. klèb klab, kleb
  en: In the blink of an eye it was finished
- aceh: ji kleb mata, ngon mata
  jawi: ''
  id: Ia mengedipkan matanya. kleb kleb, mengedip ngedipkan mata, selalu mengedip-ngedipkan mata, bermain
    mata
  en: He winked; to blink repeatedly, to make eyes
- aceh: pakon ta kleb kleb mata ateueh lon, peue takeumeung peugah?
  jawi: ''
  id: Mengapakah Anda mengecip-ngecipkan mata kpd saya? Apakah yg hendak Anda katakan?
  en: Why do you keep winking at me? What do you want to say?
