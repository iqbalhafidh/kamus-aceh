headword: goelita
jawi: كوليتا
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: jika begitu gelap, orang bisa melihat apa-apa
  meaning_en: if it's so dark, one can't discern anything
  meaning_nl: als 't zoo duister is, dat men niets meer onderscheiden kan
- meaning_id: ketika angin menangis begitu berat bahwa seseorang dapat mendengar
  meaning_en: when the wind cries so heavy that one can't hear
  meaning_nl: als de wind zoo hevig huilt dat men niet hooren kan
- meaning_id: ketika suara begitu berat bahwa seseorang tidak dapat memahami satu sama lain, pada umumnya,
    ketika seseorang tidak dapat melihat atau mendengar dari satu alasan atau lain
  meaning_en: when the noise is so heavy that one cannot understand one another, in general, when one
    cannot see or hear from one reason or another
  meaning_nl: als het rumoer zoo hevig is, dat men elkaar niet kan verstaan, in 't algemeen als men door
    een of andere oorzaak zien noch hooren kan
