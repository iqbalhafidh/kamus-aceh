ipa: ''
part_of_speech: v
definitions:
- meaning_id: masuk ke dalam sesuatu dengan membungkuk, menyelinap, mendesak ke dalam walaupun ada penahan
    atau bahayanya, (hikayat)
  meaning_en: to enter something stooping, to slip in, to press inside despite an obstacle or danger,
    (in hikayat)
examples:
- aceh: di peulandòk keun ji lui, bak pha keubeue ji-meusom le
  jawi: ''
  id: Sang pelanduk menyelinap ke sana lalu bersembunyi di antara paha kerbau (yg sudah mati). jipot angen
    sapui-sapui
  en: The mousedeer slipped away and hid between the thighs of the dead buffalo
- aceh: kapai ji lui le jiguda
  jawi: ''
  id: Anda Angin bertiup sepoi-sepoi, kapal menembus (gelombang) laksana seekor kuda
  en: A light breeze blows and the ship cuts through the waves like a horse
