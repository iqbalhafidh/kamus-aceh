headword: hieh
jawi: ''
alt_spelling:
- hr'ieh
- h'ieh
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menghias, memperindah
  meaning_en: to adorn, to decorate, beautiful
- meaning_id: mengesang, membuang ingus dari hidung
  meaning_en: to blow the nose, to blow mucus from the nose
examples:
- aceh: ék ji hieh droe sabé
  jawi: ''
  id: Ia selalu menghias diri
  en: She is always adorning herself
- aceh: meu hieh
  jawi: ''
  id: sedang menghias, telah dihias
  en: adorning, already adorned
- aceh: ji h'ieh idông (ji h'ieh ie idông)
  jawi: ''
  id: Ia membuang ingus dr hidung
  en: He blows the mucus from his nose
- aceh: meu h'ieh
  jawi: ''
  id: mengesang
  en: to blow the nose
- aceh: bèk tameu h'ieh baranggapat
  jawi: ''
  id: Jangan engkau mengesang di mana-mana
  en: Do not blow your nose everywhere
- aceh: soe po ie idông nyoe, meu h'ieh bak bintèh?
  jawi: ''
  id: Ingus siapa ini yg dikesangkan di dinding?
  en: Whose mucus is this, blown onto the wall?
- aceh: peu h'ieh
  jawi: ''
  id: menyuruh buang ingus
  en: to make someone blow their nose
- aceh: tapeu h'ieh idông aneuk-teu keudèh!
  jawi: ''
  id: Kesangkan ingus anak Anda ke sana
  en: Wipe your child's nose over there
