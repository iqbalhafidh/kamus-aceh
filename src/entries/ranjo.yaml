headword: ranjo
jawi: رانجو
alt_spelling:
- ranyo
- randjo
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ranjau kayu atau bambu yang dipasang di tepi sungai untuk mencegah agar tidak dirusakkan
    air
  meaning_en: ''
- meaning_id: tempat tidur di sungai, sebenarnya sejenis bendungan sampai diencerkan bagian dari sungai
  meaning_en: crib in a river, actually a kind of dam until diluting a part of a stream
  meaning_nl: krib in een rivier, eigenlijk een soort van dam tot indijking van een gedeelte van een stroom
- meaning_id: mërandjo, berdiri atau duduk dalam satu baris
  meaning_en: mërandjo, stand or sit in one line
  meaning_nl: mërandjo, in één lijn staan of zitten
examples:
- aceh: meu ranjo
  jawi: ''
  id: menyerupai ranjo, beebaris, berjejer
  en: ''
- aceh: ureueng duek meu ranjo, tika duek saboh sapo
  jawi: ''
  id: (teka-teki) orang duduk berbaris-baris, masing-masing duduk di atas tikar, (jawabannya) tiang-tiang
    rumah Aceh yg beralas batu
  en: ''
- aceh: bandum kapai jidoong meu ranjo bak bineh pasi
  jawi: ''
  id: Semua kapal berlabuh berderet-deret di tepi pantai
  en: ''
- aceh: peu ranjo
  jawi: ''
  id: menempatkan dl satu barisan, membentuk barisan atau deret
  en: ''
