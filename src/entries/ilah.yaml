headword: ilah
jawi: ایله
alt_spelling:
- hilah
ipa: ''
part_of_speech: n
definitions:
- meaning_id: hela, cara untuk mencapai atau melepaskan diri dari sesuatu, mengelakkan diri
  meaning_en: to haul, to drag, a means of attaining something or of getting free of it, to evade
- meaning_id: (sebenarnya hilah,.) tipu muslihat, wilayah, migrasi buruk, mencari jalan keluar
  meaning_en: (actually. hilah,..) ruse, region, lousy migration, seeking a way out
  meaning_nl: (eigenl. hilah, حیله) list, streek, looze trek, een uitweg zoeken
