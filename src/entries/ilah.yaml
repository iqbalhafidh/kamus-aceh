- aceh: cangguk ji ilah nibak uleue, tikoih ji ilah nibak mie, kameng ji ilah nibak rimueng
  jawi: ''
  id: Kata menghindari diri dr ular, tikus dr kucing, kambing dr harimau
  en: As one avoids a snake, a mouse a cat, a goat a tiger
