examples:
- aceh: angên jipôt meu'u-'u that uroe nyoe
  jawi: ''
  id: Hari ini angin berembus menderu-deru sekali
  en: ''
- aceh: haba angenpôt
  jawi: ''
  id: khabar yg ditiup angin, khabar angin, khabar yg tidak benar
  en: ''
- aceh: tapôt badan lôn, tutông leupaih na
  jawi: ''
  id: Kipaskan badan saya, udara panas sekali
  en: fan body I, air hot very
- aceh: droe
  jawi: ''
  id: mengipas-ngipas diri
  en: ''
- aceh: bapôt
  jawi: ''
  id: dibawa, diterbangkan angin
  en: carry, to fly wind
- aceh: keureutaih nyan ka angen bapôt
  jawi: ''
  id: Kertas itu sudah diterbangkan angin
  en: ''
- aceh: pupôt
  jawi: ''
  id: membiarkan berembus, diterbangkan (oleh angin) puputan, pengembus
  en: ''
- aceh: jipupôt keureutaih bak angen
  jawi: ''
  id: Ia membiarkan kertas diterbangkan angin. Ia melemparkan kertas ke udara utk diterbangkan angin
  en: ''
- aceh: bêk tapu pôt muka lôn, sijuek that
  jawi: ''
  id: Anda jangan mengipas muka saya, dingin sekali (rasanya)
  en: ''
- aceh: pumupôt, melakukan pôt, pupôt
  jawi: ''
  id: (ki) memboroskan, menghabiskan, punah
  en: ''
