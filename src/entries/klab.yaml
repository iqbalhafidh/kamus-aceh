headword: klab
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kecip
  meaning_en: ''
- meaning_id: gerakan mata yang tertutup amat cepat
  meaning_en: a very rapid closing of the eye
- meaning_id: biasanya dalam istilah sikléb-siklab
  meaning_en: usually in the phrase sikléb-siklab
- meaning_id: berkilat, (umpamanya cahaya), seperti kilat
  meaning_en: gleaming, for instance of light, like lightning
- meaning_id: mengecap dengan keras
  meaning_en: ''
- meaning_id: bunyi bibir yang dikatup-katupan
  meaning_en: the sound of the lips smacking together
- meaning_id: (lebih keras dari keucap atau cap)
  meaning_en: stronger than keucap or cap
examples:
- aceh: 'si klab sikléb = sikleb-si klab: meu klab'
  jawi: ''
  id: berkedip (mata)
  en: to blink
- aceh: peue meu klab nyan?
  jawi: ''
  id: Kilat apakah yg bercahaya itu?
  en: What lightning is that flashing?
- aceh: soe plueng nyan meu klab that?
  jawi: ''
  id: Siapakah yg berlari secapat itu?
  en: Who is running so fast?
- aceh: meu klab
  jawi: ''
  id: mengecap-ngecap dng lebih keras
  en: ''
- aceh: jipumajôh meu klab klab
  jawi: ''
  id: Ia makan dng berkecap-kecap
  en: He eats smacking his lips
etymology: ''
