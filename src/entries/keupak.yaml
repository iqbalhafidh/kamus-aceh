headword: keupak
jawi: ''
alt_spelling:
- digandakan
ipa: ''
part_of_speech: v
definitions:
- meaning_id: bajèe
  meaning_en: ''
- meaning_id: mengepak (umpamanya ayam jantan sebelum berkokok), mengepak-ngepak sayap
  meaning_en: to flap, as a cock before crowing, to flap the wings
examples:
- aceh: 'n sj kerungsang utk menutup leher baju Aceh berbentuk wajib atau memanjang, terdiri dr dua bagian
    yg satu dng yg lain dapat dikancing dng peniti emas, (juga dinamakan kiambang bajèe): keupak jaroe,
    sj kancing berbentuk spt keupak, bajèe'
  jawi: ''
  id: tetapi lebih kecil dan dipakai utk megancing lengan baju
  en: but smaller, used to fasten the sleeve
- aceh: 'droe (keupaksayeuep), mengepak-ngepakkan sayap: meu keupak = teu keupak'
  jawi: ''
  id: keupak, terkepak-kepak (spt ayam disembelih), kejang (spt orang hendak meninggal)
  en: flapping, as a fowl being slaughtered; convulsing, as a dying person
- aceh: teu keupak
  jawi: ''
  id: terkejut, terperanjat
  en: startled, alarmed
- aceh: ’oh teu keupak lôn sabab jitajô uleue di keue lôn
  jawi: ''
  id: Ular menuju ke arah saya sehingga saya terkejut
  en: The snake came towards me and startled me
- aceh: peu keupak
  jawi: ''
  id: = keupak
  en: ''
