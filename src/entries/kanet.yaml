headword: kanèt
jawi: ''
alt_spelling:
- kanot
ipa: ''
part_of_speech: n
definitions:
- meaning_id: periuk (terutama tempat memasak nasi yang terbuat dari tanah yang dibakar serta bertutup,
    kadangkala dari tembaga merah tanpa tutupnya)
  meaning_en: a cooking pot, especially a lidded earthenware pot for rice, sometimes of red copper, without
    a lid
examples:
- aceh: asoe sikai, periuk kecil tempat memasak nasi yang isinya tidak kurang dari 1 kai beras, (jenis
    yang paling kecil dinamakan kanet asoe sindie = yg berisi 1 ndie)
  jawi: ''
  id: kanèt
  en: a small pot
- aceh: asoe sicupak, periuk tempat semasak nasi dng isinya 1 cupak beras, kanèt dangdang, dandang, jenis
    periuk nasi yg besar, kanèt teumaga
  jawi: ''
  id: periuk tembaga
  en: cooking pot copper
- aceh: keumunyan
  jawi: ''
  id: periuk tempat membuat minyak kemenyan
  en: the pot for making benzoin oil
- aceh: taguen minyeuk ok
  jawi: ''
  id: periuk tempat memasak minyak rambut wanita
  en: the pot for cooking women's hair oil
- aceh: blangong
  jawi: ''
  id: periuk dan belanga, alat-alat masak
  en: pots and pans, cooking vessels
- aceh: ureueng saboh kanèt bu, orang-orang dr sebuah periuk nasi, yi orang-orang serumah, kanèt barô
  jawi: ''
  id: hrf periuk baru, (ejekan seseorang yg baru digunduli kepalanya)
  en: (literally) a new pot, a jibe at someone whose head has just been shaved
- aceh: aneuk lôn jiseuôn kanèt barô
  jawi: ''
  id: hrf anak saya baru menjunjung periuk baru, yi baru digunduli kepalanya
  en: (literally) my child carries a new pot, that is, his head has just been shaved
- aceh: bûe, hrf periuk monyet, sj bunga yg berbentuk periuk tempat memasak nasi, nasinya supaya wangi,
    kanèt geunteut
  jawi: ''
  id: hrf periuk hantu
  en: literally cooking pot ghost
