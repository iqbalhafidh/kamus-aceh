definitions:
- meaning_id: bersengkarut, berselimpat, bersangkut-paut (umpamanya contoh-contoh hiasan atau ranting-ranting
    dan cabang-cabang kayu dalam belukar sehingga sukar mencerikannya)
  meaning_en: entangled, interlaced, interlocked, as ornamental patterns or the twigs and branches of
    a thicket, so that they are hard to separate
