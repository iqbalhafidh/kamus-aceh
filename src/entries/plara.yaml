part_of_speech: v
definitions:
- meaning_id: memelihara, menjaga, mengawasi, merawat, mendidik, mengasuh, mengadakan
  meaning_en: to keep, to tend, to guard, to supervise, to tend, to educate, to nurse, there is
examples:
- aceh: padum boh ta plara manok?
  jawi: ''
  id: Berapa ekorkah Anda memelihara ayam?
  en: ''
- aceh: bak gēt ta plara aneukteu, bēk jipubuet nyang kon-kon
  jawi: ''
  id: Didiklah anak Anda baik-baik, jangan sampai ia berbuat yg bukan-bukan
  en: ''
- aceh: cut kon gata geu plara lē ureueng chik, na patōt tadarōhaka keu gob-nyan?
  jawi: ''
  id: Dr kecil Anda dipelihara oleh orang tua Anda, patutkah Anda mendurhakai mereka?
  en: ''
- aceh: ta plara droeteu pēteunah gob
  jawi: ''
  id: Peliharalah diri Anda dr fitnah orang
  en: ''
- aceh: manok gata gēt that ji plara aneuk
  jawi: ''
  id: Ayam Anda cermat sekali memelihara anaknya
  en: ''
- aceh: ulat, memelihara, memperkembangbiakkan ulat sutera, muplara, teuplara
  jawi: ''
  id: dipelihara
  en: ''
