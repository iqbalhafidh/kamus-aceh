    tempat, telah pindah, diubah, dipindahkan
  en: ''
- aceh: peue nyang jikheun hana muminah
  jawi: ''
  id: Apa yg dikatakannya tidak pernah berubah
  en: What he says never changes
- aceh: minah kdh be taduk di sinoi
  aceh_1889: minah kěděh bē tadoek di sinoi
  jawi: ''
  id: pindah ke sana dan jangan duduk di sini
  en: move over there and don't sit here
  nl: verplaats u daarheen en ga niet hier zitten
