definitions:
- meaning_id: pindah, berubah, berpindah tempat, pergi
  meaning_en: to move, to change, to move place, go
- meaning_id: move, changing places
  meaning_en: moving, changing places
  meaning_nl: verhuizen, van plaats veranderen
examples:
