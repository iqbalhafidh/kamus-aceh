headword: pēdoi
jawi: قَدُوِي
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: jumlah objek ditempatkan pada, dalam atau samping satu sama lain, hutan, bundel, perpindahan
    orang
  meaning_en: quantity of objects placed on, in or next to each other, forest, bundle, displacement of
    people
  meaning_nl: hoeveelheid van op, in of naast elkander geplaatste voorwerpen, bos, bundel, verdringen
    van menschen
examples:
- aceh: padum sipedoi ranub
  aceh_1889: padoem sipēdoi ranoeb
  jawi: ''
  id: berapa banyak biaya sirah? orēng di ramé ōh moepēdoi, ada begitu banyak orang di sawah yang mereka
    dorong elkaār
  en: how much does a bunch of sirih cost? orēng di blang ramé tēhat ōh moepēdoi, there are so many people
    on the rice field that they push elkaār
  nl: hoeveel kost een bos sirih? orēng di blang ramé tēhat ōh moepēdoi, er zijn zoo veel menschen op
    het rijstveld, dat zij elkaār verdringen
