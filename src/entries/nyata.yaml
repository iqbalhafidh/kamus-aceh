headword: nyata
jawi: پتا
alt_spelling:
- njata
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: nyata, tentu, pasti, lahir (dalam hikayat)
  meaning_en: evident, certain, born (in hikayat)
- meaning_id: znjërat, seekor ikan terjebak dalam perangkap ikan atau membungkuk sedemikian rupa sehingga
    tidak bisa lagi masuk atau pergi
  meaning_en: apparently, clearly known. § njërat, a fish caught in a fish trap or bow in such a way that
    it can no longer enter or leave
  meaning_nl: klaarblijkelijk, duidelijk, bekend. پو§ njërat, een visch in een fuik of strik zoodanig
    gevangen, dat hij er niet meer in of uit kan
examples:
- aceh: peunyata, buet nyan ka nyata bak lōn
  jawi: ''
  id: Hal itu sudah jelas bagi saya. (sudah saya ketahui)
  en: ''
- aceh: ka nyata sidroe aneuk nyang jroh that rupa
  jawi: ''
  id: sudah lahir seorang anak yg cantik rupanya
  en: ''
- aceh: jinoe ka rab nyata dajeue, buet ka chōk-cheuek lam donya
  jawi: ''
  id: Sekarang, Dajal sudah hampir lahir. Semua keadaan berjalan tidak keruan dl dunia
  en: ''
- aceh: peu nyata
  jawi: ''
  id: menyatakan, menerangkan, menjelaskan, memeriksa
  en: to state, to explain, to examine
- aceh: lōn peu nyata bak droenue saboh hai
  jawi: ''
  id: Saya nyatakan kpd Anda suatu hal
  en: ''
- aceh: peue ka tapeu nyata keudroe lé gata?
  jawi: ''
  id: Apakah sudah Anda periksa sendiri?
  en: ''
