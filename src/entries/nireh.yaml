definitions:
- meaning_id: nirih
  meaning_en: ''
- meaning_id: sejenis kayu yang banyak tumbuh di hut-n-hutan dekat pantai
  meaning_en: a wood common in forests near the coast
- meaning_id: kulitnya dipergunakan untuk mencelup jala
  meaning_en: its bark is used to dye nets
- meaning_id: tali dan bahan-bahan tenunan supaya tahan warna
  meaning_en: cord and weaving materials, to fix the colour
- meaning_id: sejenis moerasboom, yang kulit digunakan sampai spoiling cokelat jaring
  meaning_en: a kind of moerasboom, whose bark is used until the brown spoiling of nets
  meaning_nl: een soort van moerasboom, welks bast gebezigd wordt tot het bruin verwen van netten
