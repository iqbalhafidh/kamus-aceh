  id: Anda baru menjadi buih kencing orang, jangan banyak cakap! (istilahlah melecehkan seseorang). Anda
    masih muda sekali dan belum berpengalaman. Anda masih beringus atau hijau
  en: 'You are still froth on another''s water, do not talk so much: you are young and green'
