definitions:
- meaning_id: 'kemal-kemal (utk keadaan kulit atau rambut setelah dicuci dng air asin) perasaan kurang enak (krn sakit mata): peue h''an meu ~ ôk gata, tasrah ngon ie mantong! Betapa tidak berkemal-kemal keadaan rambut Anda, Anda hanya mencucinya dng air (asin) saja (tanpa air tawar) yg dicampur abu dapur (abèe dapu) atau abu merang (abèe jeumpung) dan asam'
  meaning_en: 'Gritty (for skin or hair after washing with salt water), feeling unwell (due to sore eyes): your hair is so gritty, you only wash it with salt water (without fresh water) mixed with kitchen ash or rice husk ash and lime'
