headword: jeulaih
jawi: ''
alt_spelling:
- jlaih
- glaih
ipa: ''
part_of_speech: a
definitions:
- meaning_id: tidak kusut (untuk tali), lunas (untuk utang atau perselisihan), terlepas (untuk sesuatu
    yang tersangkut), jelas, terang (untuk ucapan)
  meaning_en: untangled (of rope), settled (of a debt or a dispute), come free (of something that was
    caught), clear, bright (for utterance)
examples:
- aceh: dakwa meudakwa nyan goh lom jeulaih tôk an jeunoe
  jawi: ''
  id: Perselisihan itu belum lagi selesai sampai sekarang
  en: That dispute has still not been settled
- aceh: ulôn ka jeulaih
  jawi: ''
  id: Saya sudah lunas (membayar utang)
  en: I have paid off my debt
- aceh: that jimarit basa Acèh
  jawi: ''
  id: Terang sekali ia berbahasa Aceh
  en: He speaks Acehnese very clearly
- aceh: tamarit bak jeulaih
  jawi: ''
  id: Berkatalah terus terang
  en: Speak frankly
- aceh: beuneung nyoe gêt that jeulaih
  jawi: ''
  id: Benang ini tidak kusut sama sekali
  en: This thread is not tangled at all
- aceh: alèh peue meukeumat lam reukeung lôn! lôn geuh'euk-geuh'euk h'an jitém jeulaih
  jawi: ''
  id: Entah apa yg tersangkut dl kerongkongan saya!
  en: I do not know what is stuck in my throat!
- aceh: sazya mendahak-dahaknya
  jawi: ''
  id: tetapi tidak mau terlepas
  en: but it will not come free
