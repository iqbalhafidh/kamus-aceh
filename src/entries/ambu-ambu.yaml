part_of_speech: n
definitions:
- meaning_id: sejenis ikan laut yang bisa dimakan ėmboet-ēmboet, bagian lembut dari dahi pada anak-anak
    ėmboes, aliran udara yang disebabkan oleh gigih bertiup, bertiup pergi, bertiup
  meaning_en: a kind of edible sea fish. ėmboet-ēmboet, the soft part of the forehead in children. ėmboes,
    an airflow caused by persistent blowing, blowing away, blowing up
  meaning_nl: een soort van eetbaren zeevisch. امبوت ėmboet-ēmboet, het zachte deel van het voorhoofd
    bij kinderen. امبوس ėmboes, een luchtstroom, door aanhoudend geblaas te weeg gebracht, wegblazen,
    aanblazen
- meaning_id: amboe-amboe apoei, ledakkan apinya
  meaning_en: amboe-amboe apoei, blow up the fire
  meaning_nl: amboe-amboe apoei, het vuur aanblazen
- meaning_id: amboe-amboe abée, ledakkan abunya
  meaning_en: amboe-amboe abée, blow the ashes away
  meaning_nl: amboe-amboe abée, de asch wegblazen
