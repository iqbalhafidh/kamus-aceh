headword: tjémboel
jawi: چمبول
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: kotak logam bulat untuk menyimpan tembakau, gambir, yang melekat pada poentjah (titik luar)
    dari boengkoes
  meaning_en: a round metal box to store tobacco, gambir, which is attached to the poentjah (outer point)
    of the boengkoes
  meaning_nl: een ronde metalen doos tot opberging van tabak, gambir, die men aan de poentjah (uiterste
    punt) van de boengkoes heeft bevestigd
- meaning_id: jika semua kebutuhan sirihbe sudah terkandung dalam tjérépoe, maka tjémboel masih dipakai
    kosong sebagai perhiasan
  meaning_en: if all the sirihbe necessities are already contained in the tjérépoe, then the tjémboel
    is still worn empty as jewelry
  meaning_nl: zijn reeds al de sirihbe-noodigdheden in de tjérépoe geborgen, dan wordt de tjémboel toch
    leeg als sieraad gedragen
- meaning_id: tas di mana tikus kesturi memegang kesturi nya
  meaning_en: the bag in which the musk rat holds her musk
  meaning_nl: de zak waarin de muskusrat haar muskus bergt
