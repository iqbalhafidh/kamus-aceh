part_of_speech: adv
definitions:
- meaning_id: selama, berlalu lama
  meaning_en: during, old then
examples:
- aceh: pakon Lawét that jiwoe aneuk nyan
  jawi: ''
  id: '? Mengapa anak itu lama sekali baru pulang? Mengapakah anak itu pergi terlalu lama?'
  en: Why is that child so long in coming home? Why has he stayed away so long?
- aceh: ureueng nyan geuudép Lawét nèk lôn
  jawi: ''
  id: Orang itu hidup semasa nenek saya
  en: That man lived in my grandmother's time
- aceh: si Lawét
  jawi: ''
  id: selama
  en: during
- aceh: si Lawét atau Lawét nyoe
  jawi: ''
  id: selama ini, sekarang ini
  en: ''
- aceh: lawan, juga Lawét bak lawan
  jawi: ''
  id: lambat laun, lama kelamaan (dl hik pb)
  en: ''
- aceh: lawan, èk cirét jeuet keu meulisan
  jawi: ''
  id: lama kelamaan, tahi menceret pun akan menjadi manisan
  en: ''
- aceh: meu Lawét
  jawi: ''
  id: berlama-lama
  en: old old
- aceh: gata tajak bèk tameu Lawét, kamoe muprèh gata riwang, Janganlah Anda pergi berlama-lama, kami
    menunggu Anda kembali, peu Lawét
  jawi: ''
  id: membuat berlama-lama, memperlambatlambat waktu
  en: ''
- aceh: peu Lawét buet
  jawi: ''
