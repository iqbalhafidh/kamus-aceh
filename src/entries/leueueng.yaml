headword: leueueng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: berkurang, menurun, mereda, berhenti (untuk hujan, penyakit, pertempuran)
  meaning_en: less, descend, to subside, to stop, of rain, illness, a battle
examples:
- aceh: 'hana (hik) h''an, tan leueueng, tak henti-hentinya, terus-menerus: na leueueng bacut'
  jawi: ''
  id: (penyakit, demamnya) telah berkurang, sedikit menurun
  en: the illness or fever has eased, it has gone down a little
- aceh: ujeuen haleueueng na leueueng meung bacut
  jawi: ''
  id: Hujan tidak berkurang barang sedikit pun
  en: The rain has not eased in the least
- aceh: buet hana leueueng sagai, nyoe goh abèh, laèn teuka
  jawi: ''
  id: Pekerjaan tidak berkurang-kurang jugleueueng, yg ini belum selesai yg lain d-tang (pula)
  en: 'The work never lessens: this is not done before more arrives'
- aceh: Neupeuleueueng bacut ujeuen
  jawi: ''
  id: Ya Tuhanku, redakanlah hujan sedikit
  en: ''
