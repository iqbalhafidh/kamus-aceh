part_of_speech: v
definitions:
- meaning_id: berjalan ke mana-mana, tersebar, jaja
  meaning_en: to walk to whichs, scattered, spread abroad, to hawk
examples:
- aceh: aneuk meu jaja
  jawi: ''
  id: anak yg tidak berada dl pengawasan orang tuanya dan pergi kemana mana
  en: a child not under its parents' care who wanders everywhere
- aceh: rasia nyan ka meu jaja ban saboh gampong
  jawi: ''
  id: Rahasia itu sudah tersebar ke seluruh kampung. peu jaja, membawa ke mana-mana, menjaja
  en: That secret has spread through the whole village
- aceh: ka lôn peu jaja ban saboh gampong
  jawi: ''
  id: hana lagôt, Sudah saya jajakan ke seluruh kampung, (tetapi)
  en: I have hawked it through the whole village, but there were no buyers
