headword: leubèh
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: lebih, terkemuka, disayangi (Allah atau raja), (juga sebagai ejekan) congkak, sombong
  meaning_en: more, prominent, beloved of God or the king, also mockingly, conceited, arrogant
examples:
- aceh: ngon) kureueng
  jawi: ''
  id: lebih kurang
  en: more less
- aceh: jroh
  jawi: ''
  id: lebih bagus
  en: fine more
- aceh: nyang leubèh jroh
  jawi: ''
  id: yg lebih bagus
  en: ''
- aceh: na leubèh minyeuk malam nyoe bak droenue? neubri keu lon
  jawi: ''
  id: bacut, Adakah berlebih minyak pd Anda malam ini? Berilah kpd saya sedikit
  en: ''
- aceh: reunggèt lon ka leubèh bak gata
  jawi: ''
  id: Uang saya berlebih pd Anda. Saya telah membayar lebih pd Anda. Saya telah membayar lebih kpd Anda
  en: I have overpaid you
- aceh: buet gata
  jawi: ''
  id: Pekerjaan Anda dng pekerjaan saya lebih penting pekerjaan Anda
  en: Between your work and mine, yours is the more important
- aceh: bèk takheun baranggapeue, gobnyan ureueng leubèh
  jawi: ''
  id: Anda jangan berkata yg tidak-tidak kpdnya. Ia seorang yg dikasihi Allah. (seorang keramat)
  en: Do not speak idly of him; he is beloved of God, a saint
- aceh: meu leubèh
  jawi: ''
  id: berlebih-lebihan, berlomba-lomba
  en: more more, race race
- aceh: ji-meu leubèh kaya bak peugèt piasan
  jawi: ''
  id: Mereka berlomba-lomba kaya dl mengadakan peralatan
  en: They vie with one another in wealth when holding feasts
- aceh: peu leubèh
  jawi: ''
  id: melebihkan
  en: more
- aceh: peu leubèh droe
  jawi: ''
  id: bersikap melebihi orang lain, berlaku sombong
  en: ''
- aceh: beranggasoe peu leubèh
  jawi: ''
  id: prumoh, teuma nang eumbah jipeuhina
  en: ''
- aceh: meuhat keu jih laknat Allah
  jawi: ''
  id: malaikat bahrollah neuseurapa, Barangsiapa melebih-lebihkan istrinya dan menghina orang tuanya pasti
    ia akan dilaknati Allah d-n Allah serta seluruh malaikat akan mengukutiknya
  en: ''
- aceh: teu leubèh
  jawi: ''
  id: (dl hik)
  en: in hikayat
