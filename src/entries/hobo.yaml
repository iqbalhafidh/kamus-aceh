part_of_speech: n
definitions:
- meaning_id: rawa-rawa yang ditumbuhi sejenis rumput apung
  meaning_en: marshland overgrown with a kind of floating grass
examples:
- aceh: bèk tajak ateueh hobô nyan
  jawi: ''
  id: Janganlah Anda berjalan di atas rawa-rawa itu (Anda akan tenggelam ke dlnya)
  en: Do not walk across that marsh (you will sink into it)
- aceh: meu hobô
  jawi: ''
  id: bergoyang-goyang
  en: to sway to and fro
- aceh: watèe jikhém meu hobô rumôh-rumôh
  jawi: ''
  id: Jika ia tertawa, bergoyanglah seluruh rumah
  en: When he laughs, the whole house shakes
- aceh: bukét meuhayak, padang meu hobô
  jawi: ''
  id: bukit bergetar, padang bergoyang
  en: the hills tremble, the plain sways
