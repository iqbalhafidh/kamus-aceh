headword: kandét
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: lipatan dalam sebuah kantong kecil atau kain yang dipakai di perut atau di antara perut
    dan ikat pinggang, (umpamanya untuk menyimpan sirih, tembakau, atau uang
  meaning_en: a fold forming a small pocket in cloth worn at the belly or between the belly and the belt,
    for instance to keep betel in, tobacco, or money
- meaning_id: suatu cara yang dipergunakan oleh kaum wanita jika membawa barang-barang kecil)
  meaning_en: a method used by women for carrying small articles
- meaning_id: secara umum berarti membawa sesuatu dalam kantong atau di antara perut dengan ikat pinggang
    (tanpa kantong)
  meaning_en: generally, to carry something in a pocket or between the belly and the belt
examples:
- aceh: na ta kandét ranub? Tabri bacut!
  jawi: ''
  id: Apakah Anda membawa sirih? (jika ada) berilah saya sedikit!
  en: Have you brought betel? If so, give me a little!
- aceh: jeue
  jawi: ''
  id: kantong jala
  en: pouch casting net
- aceh: meu kandét, membawa secara kandet, peue nyan meu kandét tame?
  jawi: ''
  id: Apakah yg Anda bawa di perut itu?
  en: What are you carrying at your waist?
- aceh: Peu kandét
  jawi: ''
  id: = kandét
  en: ''
- aceh: peu kandét bak kong
  jawi: ''
  id: ikatlah kuat-kuat di perut Anda!
  en: tie it firmly at your waist!
- aceh: Keunandét, juga keulancét
  jawi: ''
  id: kantong atau lipatan dalam kain untuk membawa secara kadet, (juga) sesuatu yang berada di dalamnya
  en: a pocket or fold in cloth for carrying things, and what is carried in it
etymology: ''
