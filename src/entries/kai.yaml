headword: kai
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ukuran isi, terutama untuk menakar beras, atau barang-barang basah yang terdiri dari sebelah
    batok kelapa pada bagian yang bermata tiga
  meaning_en: measure fill, chiefly for measuring rice, or wet goods, consisting of a coconut half with
    the three eyes
examples:
- aceh: neupeungui breueh keu lôn meung si kai
  jawi: ''
  id: euntreuk lon bayeue teuma, pinjamilah beras barang sebatok kelapa kpd saya, nanti akan saya bayar
    kembali
  en: lend me a coconut shell of rice and I will repay you later
- aceh: masak bu si kai breueh
  jawi: ''
  id: waktu utk) memasak nasi sebatok. (Kira-kira setengah jam)
  en: the time needed to cook a shell of rice, about half an hour
- aceh: meu kai
  jawi: ''
  id: kai, berbatok-batok
  en: by coconut-shell measures
- aceh: sutra meu kai atau sutra leugat
  jawi: ''
  id: 'Sutra kasar yang diperdagangkan. (sebenarnya: sutera yg dijual dl ukuran kai)'
  en: coarse silk of commerce, properly silk sold by the kai measure
- aceh: peue nyang keu kai lam dônya nyoe?
  jawi: ''
  id: 'teka-teki dng permainan kata: keukai, kekal, abadi dan keu kai utk atau sbg kai). Apakah yg kekal
    (di sini'
  en: 'a riddle playing on keukai (eternal) and keu kai (as a kai measure): what is everlasting?'
