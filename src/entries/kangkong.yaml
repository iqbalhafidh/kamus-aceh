definitions:
- meaning_id: sejenis belenggu terdiri dari sebuah kayu berbentuk segi tiga yang dipasang di leher kambing
    untuk mencegah supaya ia tidak memasuki pagar kebun yang berisi tanam-tanaman
  meaning_en: a kind of yoke, a triangular piece of wood fixed to a goat's neck to stop it entering a
    planted garden
- meaning_id: kangkung (jarang dipergunakan), lebih lazim rumpuen
  meaning_en: water spinach (rarely used), rumpuen is more usual
