headword: kangkông
jawi: كغكوغ
alt_spelling:
- kangkong
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis belenggu terdiri dari sebuah kayu berbentuk segi tiga yang dipasang di leher kambing
    untuk mencegah supaya ia tidak memasuki pagar kebun yang berisi tanam-tanaman
  meaning_en: a kind of yoke, a triangular piece of wood fixed to a goat's neck to stop it entering a
    planted garden
- meaning_id: kangkung (jarang dipergunakan), lebih lazim rumpuen
  meaning_en: water spinach (rarely used), rumpuen is more usual
- meaning_id: sejenis kalung kayu, yang dikenakan pada kambing untuk mencegah dia dari makan padi matang
  meaning_en: a kind of wooden necklace, which is worn on the goats to prevent her from eating the ripe
    padi
  meaning_nl: een soort van houten halsketting, die men de geiten omdoet om haar te beletten de rijpende
    padi op te vreten
- meaning_id: nama dari sebuah tanaman yang dapat dimakan
  meaning_en: name of an edible plant
  meaning_nl: naam eener eetbare plant
