part_of_speech: n
definitions:
- meaning_id: jadam, pati hitam dalam gaharu, (pada masa dahulu dimasukkan oleh orang-orang Keling dari
    India dan dipergunakan sebagai obat pencahar dan pembersih darah, juga sebagai pengganti gambe untuk
    sirih)
  meaning_en: aloes, the dark resin within agarwood, formerly imported by Klings from India and used as
    a purgative and blood cleanser, also as a substitute for gambier with betel
- meaning_id: nama produk obat yang diperoleh dari kacang pinang
  meaning_en: name of a medicinal product obtained from the pinang nut
  meaning_nl: naam van een geneesmiddel, uit de pinangnoot verkregen
