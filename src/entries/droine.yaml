headword: droinē
jawi: دروین
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: kau, secara pribadi. kata ganti. 2 pribadi. dan... dalam bahasa yang beradab. Orang kedua
    juga diduduki oleh droitē dan Droikē Droinē melawan atasan dan orang tua droitē melawan orang dari
    peringkat yang sama dalam bahasa informal Droikē melawan orang-orang kecil dan muda Berbicara tentang
    kepala, mereka mengatakan tēkoe touan juga digunakan
  meaning_en: you, personally. Pronoun. 2nd personal. And... in the civilized speaking language. The 2nd
    person is also occupied by droitē and Droikē Droinē against superiors and elderly droitē against persons
    of the same rank in the informal language Droikē against small and young people Speaking of heads,
    they say tēkoe Touan is also used
  meaning_nl: gij, pers. voornw. 2e pers. enk. in de beschaafde spreektaal gebezigd. Voor den 2en persoon
    bezigt men ook droitē en droikē. Droinē tegen meerderen en ouderen. Droitē tegen personen van den
    zelfden rang in de gemeenzame spreektaal. Droikē tegen geringen en jongeren. Van hoofden sprekende
    zegt men tēkoe. Ook toean wordt gebezigd
