headword: ubah
jawi: اوبد
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengubah, menukar
  meaning_en: to alter, to exchange
examples:
- aceh: bèk ubah ban nyang takheun
  jawi: ''
  id: jangan Anda ubah yg telah Anda katakan itu
  en: ''
- aceh: tasalen kitab nyoe bèk ta ubah (atau bek na ubah) sapeue, ubè naseukah meunan
    tasurat
  jawi: ''
  id: Salinlah kitab ini dan jangan Anda mengubah apa-apa, sebagaimana naskahnya,
    begitulah Anda tulis
  en: ''
- aceh: ret u gampong nyan ka geu ubah
  jawi: ''
  id: Jalan ke kampung itu sudah diub ah atau dipindahkan
  en: ''
- aceh: ija nyan reujang that ubah
  jawi: ''
  id: Kain itu cepat sekali berubah (warnanya)
  en: ''
- aceh: Tuhan sidroe hana ubah
  jawi: ''
  id: Tuhan sendiri yg tidak berubah-ubah
  en: ''
- aceh: h'an ubah ban
  jawi: ''
  id: tidak berubah sedikit = sama benar keadaannya
  en: ''
- aceh: meu ubah
  jawi: ''
  id: berubah
  en: to change
- aceh: neu ubah, perubahan kitab nyan hana that lé neu ubah
  jawi: ''
  id: Kitab itu tidak banyak sekali perubahannya (ketika disalin)
  en: ''
