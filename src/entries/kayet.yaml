part_of_speech: a
definitions:
- meaning_id: berkait, (hanya dalam arti kata kiasan) dikaitkan, dilibatkan, dihubungkan
  meaning_en: hooked, only figuratively, hooked, involved, connected
- meaning_id: mengandung sindiran
  meaning_en: to contain innuendo
examples:
- aceh: narit gata meukayét ujòng
  jawi: ''
  id: hrf perkataan Anda berkait ujungnya. Perkataan Anda mengandung sindiran. Peukayét, mengaitkan, menghubungkan
  en: '(literally) your words are hooked at the end: your words carry an insinuation'
- aceh: lam buet nyoe bèk tapeukayét lòn
  jawi: ''
  id: h'an èk lòn jak u kantò, Anda jangan melibatkan saya dl perkara ini (ump sbg saksi). Saya tidak
    suka pergi ke kantor atau berurusan dng kantor
  en: Do not involve me in this case as a witness; I do not care to go to the office
