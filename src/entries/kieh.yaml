definitions:
- meaning_id: kias, persamaan, analogi, kesimpulan, sindiran, menyimpulkan, menyindir
  meaning_en: analogy, same, conclusion, innuendo, to knot, to allude mockingly
examples:
- aceh: 'bak ureueng malém le ho kieh, Orang yg berilmu mempunyai banyak jalan utk mengkiaskan sesuatu,
