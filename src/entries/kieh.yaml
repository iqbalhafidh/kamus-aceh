    kieh'
  jawi: ''
  id: membuat kesimpulan atau perumpamaan, mengambil suatu ibarat
  en: ''
- aceh: ji kieh ubak lôn
  jawi: ''
  id: Ia mengambil kiasan kpd saya. Ia menyindir saya
  en: He spoke in allusions at me; he was getting at me
- aceh: meu kieh
  jawi: ''
  id: berkias-kiasan, membuat berbagai-bagai kiasan, sindir menyindir
  en: to speak in allusions, to trade veiled digs
- aceh: bèk tameu kieh kieh ngon sèedara
  jawi: ''
  id: Anda jangan menyindir sesama saudara
  en: Do not make sly digs at your own kin
