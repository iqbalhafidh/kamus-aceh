definitions:
- meaning_id: langkah, gerak kaki jika berjalan, kedatangan, keberangkatan, (kiasan) melanggar, melangkahi
  meaning_en: step, the movement of the feet in walking, come, departure, to violate (figuratively), to
    step over
- meaning_id: lulus, langkah
  meaning_en: pass, step
  meaning_nl: pas, tred, stap, schrede
- meaning_id: mengundang seseorang untuk pergi ke suatu tempat, baik di rumahnya atau di tempat lain yang
    ditunjuk
  meaning_en: invite someone to go somewhere, either in his home or in another designated place
  meaning_nl: iemand uitnoodigen om ergens te komen, hetzij in zijn huis of op eene andere aangewezen
    plaats
examples:
- aceh: teku melangkah kenoi siat
