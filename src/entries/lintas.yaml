definitions:
- meaning_id: berjalan bolak-balik, mengubah sesuatu
  meaning_en: walk back and forth, turn around something
  meaning_nl: heen en weêr loopen, om iets heen draaien
- meaning_id: '{Y: i} sebuah kayu basah, yang satu tempat di suatu tempat'
  meaning_en: a wooden weld, which one places somewhere
  meaning_nl: een houten lasch, die men ergens inzet
- meaning_id: mengingat sesuatu, sesuatu yang datang ke pikiran
  meaning_en: remembering something, something that comes to mind
  meaning_nl: zich iets herinneren, iets wat in de gedachten komt
