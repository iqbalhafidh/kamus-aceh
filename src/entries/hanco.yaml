definitions:
- meaning_id: hancur, larut, lebur
  meaning_en: shattered, dissolved, melted
examples:
- aceh: saka nyoe trêb that hancô
  jawi: ''
  id: Gula ini lama sekali larutnya. bèk ta'uet ane-uk seutui, h'an hancô lam pruet, Jangan Anda menelan
    biji buah kecapai, (ia) tidak akan hancur di dl perut
  en: This sugar takes a long time to dissolve. Do not swallow the seed of the kecapi fruit, it will not
    break down in the stomach
- aceh: tapeu hancô atra nyan siat
  jawi: ''
  id: Hancurkanlah benda itu sebentar
  en: Crush that thing for a moment
