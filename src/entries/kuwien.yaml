ipa: ''
part_of_speech: v
definitions:
- meaning_id: membengkokkan, menarik ke atas (umpamanya kaki)
  meaning_en: to bend, to pull to upon (for example foot)
- meaning_id: tertarik dari anggota badan
  meaning_en: withdrawn from the limbs
  meaning_nl: ingetrokken van de ledematen
- meaning_id: kēnoewiën, posisi dari kaki ditarik
  meaning_en: kēnoewiën, the position of the withdrawn leg
  meaning_nl: kēnoewiën, de stand van het ingetrokken been
