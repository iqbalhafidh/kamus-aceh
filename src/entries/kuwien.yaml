part_of_speech: v
definitions:
- meaning_id: membengkokkan, menarik ke atas (umpamanya kaki)
  meaning_en: to bend, to pull to upon (for example foot)
examples:
- aceh: ta-kabat tapeuget kawe
  jawi: ''
  id: bengkokkan kawat dan perbuatlah mata pancing
  en: bend the wire and make a fishhook
- aceh: meu kuwien
  jawi: ''
  id: bengkok
  en: crooked
- aceh: jieh meu kuwien
  jawi: ''
  id: Ia tidur dng membengkokkan. dng kakinya yg ditarik ke perutnya
  en: He sleeps curled up with his knees drawn to his belly
- aceh: peu kuwien
  jawi: ''
  id: = kuwien, menyuruh kuwien
  en: to have something twisted
- aceh: tapeu kuwien gaki!
  jawi: ''
  id: bengkokkan kaki
  en: crooked foot
- aceh: teu kuwien
  jawi: ''
  id: dibengkokkan, ditarik ke atas
  en: crooked, pull to upon
- aceh: ka teu kuwien jeh pat
  jawi: ''
  id: Ia sudah terbaring
  en: He is already lying down
