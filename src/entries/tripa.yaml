headword: tripa
jawi: تربغا
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: tripah, sebuah kerajaan di Atjeh's pantai barat, dukungan dari Malaboeh ini terganggu dari
    tarik pēha, karena, dalam satu hari Malaboeh berjalan di sana, salah satu sangat lelah bahwa kaki
    (paha) mulai menarik
  meaning_en: tripah, an empire on Atjeh's west coast, support of Malaboeh This is distracted from tarik
    pēha, because, in one day of Malaboeh walking there, one is so tired that the legs (thighs) begin
    to pull
  meaning_nl: Tripah, een rijkje op Atjeh's westkust, onderhoorigheid van Malaboeh. Men leidt dit af van
    tarik pēha, omdat men, in één dag van Malaboeh daarheen loopende, zoo vermoeid is, dat de beenen (dijen)
    beginnen te trekken
