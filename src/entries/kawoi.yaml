part_of_speech: a
definitions:
- meaning_id: ribut, huru-hara, gaduh, gempar, geger
  meaning_en: noisy, riot, uproar, uproar, sensation, commotion
- meaning_id: kaul, fatwa, ucapan (ulama), pendapat (di kalangan orang-orang terpelajar di bidang agama
    Islam)
  meaning_en: vow, legal opinion, a pronouncement of the ulama, an opinion among those learned in Islamic
    religion
examples:
- aceh: Hai, peue kawôi that di rumoh, tatrôn reujang!
  jawi: ''
  id: Hai, siapa yg ribu-ribut di rumah, turunlah (=keluarlah) segera!
  en: Hey, who is making that racket in the house? Come down at once!
- aceh: Peukawôi, membuat ribu, mengganggu terus menerus seraya merengek-rengek, bèk tapeukawôi lôn, atè
    lôn teungoh susah
  jawi: ''
  id: Anda jangan mengganggu saya, hati saya sedang risau
  en: Do not disturb me, my heart is troubled
- aceh: mat kawôi la'èh
  jawi: ''
  id: mengikuti fatwa daif
  en: to follow a weak legal opinion
