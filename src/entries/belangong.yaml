  meaning_nl: aarden pot, waarin men goelai (sajor, groenten) kookt, bēlangong kantja, een groote ronde
    ijzeren pot
- meaning_id: bēlangong koewali, tipe yang lebih kecil dari pot besi bulat
  meaning_en: bēlangong koewali, a smaller type of round iron pot
  meaning_nl: bēlangong koewali, een kleiner soort van ronden ijzeren pot
