definitions:
- meaning_id: pasar, pasar tempat, tempat di mana orang hanya menjual barang mereka semalam, sebagai lawan
    kēdei, tempat pasar, dikelilingi oleh toko-toko di mana mereka tinggal
  meaning_en: market, market place, a place where people only sell their goods overnight, as opposed to
    kēdei, a market place, surrounded by shops where they stay
  meaning_nl: markt, marktplaats, eene plaats, waar men slechts over dag zijne waren ten verkoop aanbiedt,
    in tegenstelling van kēdei, eene marktplaats, omgeven door winkeltjes waarin men overnacht
