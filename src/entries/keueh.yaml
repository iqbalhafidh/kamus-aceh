part_of_speech: n
definitions:
- meaning_id: mata uang Aceh lama dari timah hitam atau putih dengan nilai yang tidak tetap, 1/1200 atau
    kurang dari seringgit Spanyol
  meaning_en: an old Acehnese coin of black or white tin, of variable value, one twelve-hundredth of a
    Spanish dollar or less
- meaning_id: kumpulan lemak, berwarna kekuning-kuningan, menyerupai bola-bola kecil yang kadang kala
    terdapat di daging hewan, pada orang
  meaning_en: a mass of fat, coloured yellowish, resembling the small nodules sometimes found in animal
    flesh, on a person
- meaning_id: kutil, kelenjar di ari-ari, kelenjar di lipatan paha atau di leher, juga dinamakan barah
    cicak
  meaning_en: wart, a gland in the groin, a gland in the fold of the thigh or in the neck, also called
    barah cicak
