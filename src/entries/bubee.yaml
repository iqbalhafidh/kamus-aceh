definitions:
- meaning_id: 'perangkap ikan dua jenis ikan dibedakan: boebée laoet dan kèroeng, tergantung pada apakah
    mereka ditempatkan di laut atau di sungai'
  meaning_en: 'fish trap Two types of fish are distinguished: boebée laoet and kèroeng, depending on whether
    they are placed in the sea or in the rivers'
  meaning_nl: 'fuik. Men onderscheidt twee soorten van fuiken: boebée laoet en kèroeng, al naar gelang
    zij in zee of in de rivieren worden gesteld'
