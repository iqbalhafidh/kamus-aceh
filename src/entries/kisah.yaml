headword: kisah
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kisah, cerita, bahagian cerita dalam sajak-sajak sadati dan ratèb pulèt, mengisahkan, menceritakan
    (dalam hikayat)
  meaning_en: tale, story, the narrative section in sadati and ratèb pulèt verse, to narrate, to relate
    (in hikayat)
examples:
- aceh: ujòng nasib
  jawi: ''
  id: kisah penutup pd nasib, yi kisah yg diucapkan sebagai pemberian salam dan pertanyaan serta jawaban
    (nasib) antara dua kelompok sadati yg sedang bertanding, yg diucapkan oleh salah seorang sadati serta
    diselingi oleh dalém-dalémnya, terdiri dr kisah bersambung atau sebuah dialog antara sadati dng dalém-dalémnya,
    (hal ini berlaku juga pd rateb pulèt, tetapi sbg pengganti sadati dan dalém-dalémnya disebut radat
    (=penyanyi pendahulu) dan rakan-rakan (=rekan-rekannya)
  en: ''
- aceh: meu kisah, keumisah, = teu kisah
  jawi: ''
  id: melakukan kisah, berkisah, bercerita, dikisahkan, diceritakan
  en: to perform tale, tale, story
etymology: ''
related_words: []
dialect_notes: 'Marked (dl hik) in the source: attested in hikayat, the classical Acehnese narrative verse
  register.'
