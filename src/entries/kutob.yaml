definitions:
- meaning_id: kutub, keramat tertinggi dalam tingkatan orang-orang (dalam ilmu tasawuf) seorang ulama
    yang dianggap sebagai seorang keramat
  meaning_en: pole, the highest rank of saint in Sufi teaching; a scholar regarded as a saint
examples:
