- aceh: si Pulan ka jeuet keu kutob
  jawi: ''
  id: raya, Polan telah menjadi seorang ulama besar
  en: ''
- aceh: kutuben rabani
  jawi: ''
  id: keramat ketuhanan, ejekan utk seorang laki-laki tua (dl hik)
