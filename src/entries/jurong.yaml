part_of_speech: n
definitions:
- meaning_id: lorong di sebuah kampung (jalan setapak di kampung antara pagar-pagar rumah)
  meaning_en: a lane in a village, a footpath between house fences
examples:
- aceh: meu jurông
  jawi: ''
  id: berlorong, diperbuat lorong, ruang antara banjar atau barisan
  en: having a lane, made into a lane; the space between rows
- aceh: ureueng keumalon teudong meu jurông
  jawi: ''
  id: Para penonton berdiri berbaris-baris
  en: The onlookers stood in rows
- aceh: peu jurông
  jawi: ''
  id: membuat sesuatu menyerupai lorong, berdiri di barisan
  en: to form something into a lane, to stand in rows
- aceh: jèh teuku ka teuka, tabeudoih tapeu jurông
  jawi: ''
  id: Lihatlah, teuku telah datang, berdirilah di barisan
  en: Look, the teuku has come, stand in line
