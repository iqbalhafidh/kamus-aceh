definitions:
- meaning_id: batu, batu bijih
  meaning_en: stone, rock ore
  meaning_nl: steen, rots erts
- meaning_id: batée ijër, batu bergulir di sungai
  meaning_en: batée ijër, rolling stones in the rivers
  meaning_nl: batée ijër, rolsteenen in de rivieren
- meaning_id: batée neman, batu-batu, ditempatkan di atas dan bawah kuburan
  meaning_en: batée nisan, the stones, placed at the top and bottom of a grave
  meaning_nl: batée nisan, de steenen, die men aan het hoofd- en beneden-einde van een graf plaatst
- meaning_id: batée pipis, batu, untuk menggosok sesuatu yang baik
  meaning_en: batée pipis, a stone, to rub something fine
  meaning_nl: batée pipis, een steen, om iets fijn te wrijven
- meaning_id: batée apoei atau bëdil, blint
  meaning_en: batée apoei or bëdil, flint
  meaning_nl: batée apoei of bëdil, vuursteen
- meaning_id: batée oedjoë, touchstone
  meaning_en: batée oedjoë, touchstone
  meaning_nl: batée oedjoë, toetssteen
- meaning_id: batée timah, potongan timah, melekat ke jaring, tenggelam mereka
  meaning_en: batée timah, pieces of lead, attached to the nets, to sink them
  meaning_nl: batée timah, stukjes lood, die men aan de netten bevestigt, om ze te doen zinken
