part_of_speech: v
definitions:
- meaning_id: memuji seseorang di hadapannya, mengangkat angkat nama seseorang, membujuk, merayu, mengajak
  meaning_en: to praise someone at face, to keep bringing up someone's name, to coax, to woo, to invite
- meaning_id: membumbun, menimbun, menumpuk (umpamanya buah kelapa, tanah)
  meaning_en: to earth up, to heap up, to pile up for example fruit coconut, earth
examples:
