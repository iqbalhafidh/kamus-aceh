headword: keujot
jawi: ''
alt_spelling:
- teukeujot
ipa: ''
part_of_speech: v
definitions:
- meaning_id: terkejut, terbangun dengan terkejut
  meaning_en: startled, to wake with a start
examples:
- aceh: jieh hana teu-sagai
  jawi: ''
  id: Ia tidur tanpa terbangun
  en: he sleep without wake
- aceh: saket teukeujot
  jawi: ''
  id: penyakit terkejut (dikatakan terutama utk ulat sutera jika mengalami pengaruh udara yg tidak baik
    dan menurut keterangan orang karena terkejut kpd petir)
  en: the startle sickness, said especially of silkworms affected by bad air or, people say, frightened
    by thunder
- aceh: peukeujot
  jawi: ''
  id: mengejutkan, membangunkan dng terkejut
  en: to startle, to wake with a start
- aceh: bak ureueng teumakot jeuet tapeukeujot, bak nyang h'an teumakot pakri daya
  jawi: ''
  id: Orang penakut dapat dikejutkan, tetapi bagaimanakah daya utk mengejutkan orang yg bukan penakut
  en: A timid man can be startled, but how does one startle a man who is not timid?
etymology: ''
related_words:
- ho
