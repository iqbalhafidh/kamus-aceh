  en: to violate custom, regulation
- aceh: adat meulangga
  jawi: ''
  id: pelanggaran adat, hak (dl kampung)
  en: ''
- aceh: 'peulangga = langga, atau menyuruh langga: ka jipeulangga (nibak) adat'
