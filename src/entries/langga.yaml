headword: langga
jawi: لُغَكَا
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melanggar, menubruk, melewati, (biasanya sebagai kiasan) melawan, berdosa, bersalah, melanggar
    (umpamanya adat), hak orang lain
  meaning_en: to violate, to collide with, to pass by, to oppose (usually as figuratively), sin, wrong,
    to violate (for example custom), right person other
- meaning_id: sebagai akibat terjadinya interaksi antara gas karbondioksida dan air yang diserap oleh
    tumbuh-tumbuhan dari dalam tanah, akan dihasilkan zat karbohidrat berkat bantuan sinar matahari. Dari
    situ kemudian terbentuk kayu yang pada dasarnya terdiri atas komponen kimiawi yang mengandung karbon,
    hidrogen dan oksigen
  meaning_en: the skinning of fruit or other useful trees for a man's house as a recompense, if one cannot
    perform the retribution for a subjugation
  meaning_nl: het vellen van vrucht- of ander nuttig geboomte voor iemands huis als vergelding, indien
    men de weêrwraak niet kan uitoefenen voor eene ondergane beleediging
examples:
