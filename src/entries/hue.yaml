part_of_speech: v
definitions:
- meaning_id: tarik, seret, pimpin, bimbing
  meaning_en: pull, to drag, to lead, to guide, to lead by the hand
examples:
- aceh: bèk ta hue ija, habèh teuboih ngon èk manok
  jawi: ''
  id: Janganlah Anda menyeret kain (di tanah), semuanya sudah kotor dng tahi ayam
  en: Do not drag your cloth on the ground, it is all fouled with chicken droppings
- aceh: leumo
  jawi: ''
  id: menarik tali sapi
  en: to pull rope cow
- aceh: ureueng seupôt mata
  jawi: ''
  id: membimbing orang buta
  en: to lead a blind person by the hand
- aceh: bèk meu hue ija bak rèt
  jawi: ''
  id: Jangan menyeret-nyeret kain di jalan
  en: Do not drag your cloth along the road
- aceh: meunankeu geutanyoe, meung ka tuha ka meu hue, hana soe peuduli lé
  jawi: ''
  id: Begitulah keadaan kita, jika sudah tua, kita tidak kuat lagi dan bergantung pd orang lain, tak ada
    seorangpun yg mempedulikan kita
  en: 'Such is our lot: when we are old we are no longer strong and depend on others, and no one cares
    for us'
