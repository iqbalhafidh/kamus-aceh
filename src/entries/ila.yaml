part_of_speech: v
definitions:
- meaning_id: ela, jarak dari tengah dada sampai ke ujung jari tengah jika direnggangkan ke samping, (kira-kira
    setengah deupa)
  meaning_en: ell, the distance from the middle of the chest to the tip of the middle finger when the
    arm is stretched sideways, (about half a fathom)
examples:
- aceh: ta ila ija nyoe padum panyang
  jawi: ''
  id: Ukurlah berapa panjang kain ini
  en: Measure how long this cloth is
- aceh: meu ila
  jawi: ''
  id: ila, berela-ela
  en: by the ell
- aceh: jibloe ija nyan meu ila ila
  jawi: ''
  id: Ia membeli kain itu berela-ela panjangnya
  en: He bought that cloth by the ell
