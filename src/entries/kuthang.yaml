definitions:
- meaning_id: sejenis pohon besar, berbunga putih yang baunya harum
  meaning_en: a kind of big tree, with fragrant white flowers
- meaning_id: kutang yang dipakai oleh wanita
  meaning_en: ''
examples:
- aceh: inong nyan ban jibloe kuth'ang lé lakoeji, jipeuleumah bak gob
  jawi: ''
  id: Wanita itu baru dibelikan kutang oleh suaminya. Ia memperhatikannya kpd orang lain
  en: Her husband has just bought her a bodice and she shows it off to others
- aceh: meu kuth'ang
  jawi: ''
  id: berkutang
  en: wearing a bodice
- aceh: inong nyan hana jingui kuth'ang, taeu tek ji meukapheuk-kapheuk
  jawi: ''
  id: Wanita itu tidak memakai kutang buah dadanya tampak tergontai-gontai ke sana ke mari
  en: That woman wears no bodice and her breasts swing to and fro
- aceh: peu kuth'ang
  jawi: ''
  id: membubuhi kutang
  en: ''
- aceh: dara nyan ka jeuet peu kuth'ang
  jawi: ''
  id: Anak dara itu sudah boleh mengenakan kutang
  en: That girl may now wear a bodice
