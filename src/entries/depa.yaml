part_of_speech: ''
definitions:
- meaning_id: vadem. salah satu membedakan depa umum, jarak ujung jari tangan pada lengan terentang dan
    dempa menara, di antara petani yang digunakan, jarak, ketika seseorang berdiri miring, dari ujung
    lengan membentang ke jari kaki panjang kaki lainnya
  meaning_en: vadem. One distinguishes the common depa, the distance of the fingertips at the outstretched
    arms and the depa menara, among farmers in use, the distance, when one stands oblique, from the fingertip
    of the stretched arm to the toe of the extended other leg
  meaning_nl: vadem. Men onderscheidt de gewone dêpa, den afstand der vingertoppen bij de uitgestrekte
    armen en de dêpa mênara, bij landbouwers in gebruik, den afstand, wanneer men schuins staat, van den
    vingertop des uitgestrekt arms tot aan de teen van het uitgestrekte andere been
