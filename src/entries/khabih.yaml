part_of_speech: a
definitions:
- meaning_id: rendah, keji, hina, (juga) bajingan (dalam hikayat)
  meaning_en: low, vile, lowly, despicable, also a scoundrel (in hikayat)
examples:
- aceh: buet nyang khabih bek tapubuet le!
  jawi: ''
  id: Anda jangan lagi melakukan pekerjaan pekerja an yg hina
  en: Do not do such base work any more
- aceh: watee ka tajeuet pubuet buet nyang khabih, peue lom buet nyang najih!
  jawi: ''
  id: Jika Anda sudah berani melakukan perbuatanperbuatan yg hina, apa lagi perbuatan yang najis!
  en: If you already dare do base things, how much more the filthy ones!
