definitions:
- meaning_id: mempertaruhkan dalam permainan, jika hilang
  meaning_en: re-stakes in the game, if lost
  meaning_nl: weder inzetten—bij het spel, indien men verliest
examples:
- aceh: leumo lun jid lue pupok ngon leumo gata
