  jawi: ''
  id: tëtapi djikalée taloer lëmo loen loen poh lëmo lain, lëmo, daging sapi saya akan melawan dengan
    Anda, tetapi jika daging sapi saya menderita kekalahan, saya akan bertaruh dengan daging sapi lagi
  en: tëtapi djikalée taloer lëmo loen loen poh baloei lëmo lëmo lain, djid, my beef I will fight with
    yours, but if my beef suffers defeat, I will wager with another beef again
  nl: tëtapi djikalée taloer lëmo loen loen poh baloei ngon lëmo lain, djid, mijn rund zal ik met het
    uwe doen vechten, doch indien mijn rund de nederlaag lijdt, zal ik weder inzetten met een ander rund
