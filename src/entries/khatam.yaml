headword: khatam
jawi: ختم
alt_spelling:
- khatem
- chatam
ipa: ''
part_of_speech: n
definitions:
- meaning_id: cap, cincin materai (hanya dipergunakan dalam dua buah istilah berikut)
  meaning_en: stamp, a signet ring, used only in the two following expressions
- meaning_id: doa yang muncul di banyak Quraisy pada akhir bab terakhir
  meaning_en: the prayer that appears in many Qurans at the end of the last chapter
  meaning_nl: het gebed dat in vele korans aan het einde van het laatste hoofdstuk voorkomt
- meaning_id: bēdj chatam, baca chatam
  meaning_en: bēdj chatam, read the chatam
  meaning_nl: bēdj chatam, de chatam lezen
examples:
- aceh: 'khatamon ambia, khatamon nabi, penutup segala nabi, yi nabi Muhammad SAW: khatam Sulaiman'
  jawi: ''
  id: cap nabi Sulaiman AS yi jimat dl bentuk segi enam, juga segi lima, biasanya dipakai sebagai cincin
    materai (dl hik)
  en: the seal of Solomon, a hexagonal or pentagonal amulet usually worn as a signet ring (in hikayat)
