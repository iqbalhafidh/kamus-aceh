  id: dihormati, dihargai, ternama
  en: respect, price, name
- aceh: meung bak kawom warêhji jih hana meu indah, bak gob laên siribêe ganda
  jawi: ''
  id: Sedang oleh kaum kerabatnya sendiri ia tidak dihormati, pd orang-orang lain tentulah seribu kali
    ia tidak dihormati
  en: If his own kin do not respect him, others will respect him a thousand times less
