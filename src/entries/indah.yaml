  en: He brought home very beautiful things
- aceh: haba nyang indah
  jawi: ''
  id: kabar yg indah-indah
  en: fine news
- aceh: haba nibak rupa
  jawi: ''
  id: Indah kabar dr rupa = Beritanya terlalu dilebih-lebihkan dp yg sesungguhnya terjadi
  en: The report is finer than the reality = the news is greatly exaggerated
- aceh: bak jih indah that atra nyan
  jawi: ''
  id: Barang itu sangat berharga baginya
  en: That thing is very precious to him
- aceh: meu indah
