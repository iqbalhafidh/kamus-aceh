headword: kō
jawi: ''
alt_spelling:
- ko
ipa: ''
part_of_speech: n
definitions:
- meaning_id: seruan pada sejenis permainan sembunyi-sembunyian anak-anak
  meaning_en: ''
- meaning_id: melakukan sesuatu dengan sengaja
  meaning_en: ''
- meaning_id: membuat sesuatu tanpa memperdulikan perlu tidaknya atau faedahnya
  meaning_en: ''
- meaning_id: begitu saja
  meaning_en: so only
- meaning_id: ketakutan
  meaning_en: afraid
- meaning_id: meromok karena takut
  meaning_en: ''
- meaning_id: kurus
  meaning_en: thin
- meaning_id: tidak mau tumbuh
  meaning_en: ''
examples:
- aceh: meu kō kō
  jawi: ''
  id: turut dl permainan tsb, biasanya dinamakan
  en: ''
- aceh: ka lôn tham, ji ko cit jijak!
  jawi: ''
  id: Sudah saya larang, tetapi ia sengaja pergi juga
  en: I forbade it, but he went deliberately all the same
- aceh: pakon ta ko bloe meungnyoe hana galak?
  jawi: ''
  id: Mengapakah Anda sengaja membeli jika Anda tidak menyukainya?
  en: Why did you deliberately buy it if you do not like it?
- aceh: bèk ta ko ko!
  jawi: ''
  id: Anda jangan sengaja!
  en: Do not do it on purpose!
- aceh: sia-sia ta ko agam!
  jawi: ''
  id: Anda percuma menjadi laki-laki!
  en: You are a man for nothing!
- aceh: peu ko ko
  jawi: ''
  id: = ko, membuat-buat dng sengaja
  en: to do deliberately, to feign
- aceh: haba bit-bit kon lôn peukeue, sikrak tabeue sikrak masén
  jawi: ''
  id: Ini adalah berita yg sesungguhnya dan bukan berita yg saya khayalkan, sebagian tawar dan sebagian
    (lagi) rasanya asin
  en: This is a true account and none of my invention, part of it bland and part of it salt
- aceh: teu ko
  jawi: ''
  id: disengaja
  en: deliberate
- aceh: jih teu ko ko that
  jawi: ''
  id: Ia sengaja melakukan hal-hal yg tidak senonoh
  en: He deliberately does improper things
etymology: ''
