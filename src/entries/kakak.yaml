definitions:
- meaning_id: kakak, (orang kedua dan keketiga), dipergunakan hanya dalam kalangan terhormat dan biasanya
    dalam gabungan dengan cut serta diimbuhkan menjadi cuakak, (dalam hikayat) abang
  meaning_en: elder sibling, second and third person, used only among the well-born, usually combined
    with cut to form cuakak, elder brother (in hikayat)
