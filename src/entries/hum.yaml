headword: h'um
jawi: هم
alt_spelling:
- hoem
ipa: ''
part_of_speech: n
definitions:
- meaning_id: bunyi nyala api yang besar, desing, atau gegar pukulan gada
  meaning_en: the sound of a large blazing fire, whizz, or the shock of a mace blow
- meaning_id: aku tidak tahu, aku tidak bisa mengatakannya. secara umum, untuk mengekspresikan ketidakpastian
    dalam pengetahuan sesuatu
  meaning_en: i don't know, I can't say. In general, to express uncertainty in the knowledge of something
  meaning_nl: ik weet niet, ik kan niet zeggen. In het algemeen, om onzekerheid in de kennis van iets
    uit te drukken
examples:
- aceh: meu h'um
