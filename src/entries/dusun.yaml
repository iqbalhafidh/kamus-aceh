definitions:
- meaning_id: sebuah dusun, tetapi di tepi hutan
  meaning_en: a hamlet, but on the edge of the forest
  meaning_nl: een gehucht, doch aan den rand van het bosch
- meaning_id: orëng doesoen, seseorang dengan perilaku yang tidak beradab, tetapi tidak beradab karena
    ketidaktahuan, yang karena itu tidak disalahkan karena kurangnya nya kebaikan
  meaning_en: orëng doesoen, someone of uncivilized manners, but uncivilized out of ignorance, who is
    therefore not blamed for his lack of goodness
  meaning_nl: orëng doesoen, iemand van onbeschaafde manieren, doch onbeschaafd uit onwetendheid, dien
    men zijn gebrek aan wellevendheid daarom niet kwalijk neemt
