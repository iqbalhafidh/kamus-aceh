headword: koerab
jawi: كُوْرَب
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: 'sejenis penyakit kulit tipe penyakit kulit adalah: koerab lëhoer, tipe yang paling berbahaya
    dari kurap'
  meaning_en: 'a kind of skin disease. Types of skin diseases are: koerab lëhoer, the most dangerous type
    of ringworm'
  meaning_nl: 'een soort van huidziekte. Soorten van huidziekten zijn: koerab lëhoer, de gevaarlijkste
    soort van ringworm'
- meaning_id: koerab manok, kurap
  meaning_en: koerab manok, ringworm
  meaning_nl: koerab manok, ringworm
- meaning_id: koerab ijër, satu ruam mendapat dengan berjalan di air asin
  meaning_en: koerab ijër, a rash one gets by walking in brackish water
  meaning_nl: koerab ijër, een huiduitslag, dien men krijgt door in brak water te loopen
- meaning_id: koerab bësoi besi karat ruam
  meaning_en: koerab bësoi iron rust rash
  meaning_nl: koerab bësoi, uitslag als ijzerroest
