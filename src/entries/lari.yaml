part_of_speech: n
definitions:
- meaning_id: kotak-kotak tempat meletakkan taruhan (pada sejenis permainan dadu)
  meaning_en: the squares on which stakes are placed in a dice game
- meaning_id: lampit permainan dadu dari anyaman rotan
  meaning_en: a plaited rattan dice mat
- meaning_id: mengambil taruhan atau memindahkan ke kotak lain
  meaning_en: ''
- meaning_id: lari, melarikan diri, pergi
  meaning_en: run, run self, go
examples:
- aceh: gata hana ta lari cit keu déh?
  jawi: ''
  id: Tidakkah Anda memindahkan taruhan ke tempat lain?
  en: Will you not move your stake elsewhere?
- aceh: si lari
  jawi: ''
  id: selari, tidak terputus (pd rumah)
  en: ''
- aceh: rumoh si lari
  jawi: ''
  id: rumah selari, rumah yg lantainya tidak terputus (tidak ada tinggi rendahnya)
  en: ''
- aceh: peulari
  jawi: ''
  id: suka melarikan diri (ump hamba sahaya), berjalan cepat (utk binatang tunggangan)
  en: ''
- aceh: aneuk nyoe peu-that
  jawi: ''
  id: Anak ini s-ngat suka melarikan diri dr rumahnya
  en: This child is always running away from home
- aceh: guda peulari
  jawi: ''
  id: kuda yg larinya kencang
  en: ''
