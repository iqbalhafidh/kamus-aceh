ipa: ''
part_of_speech: n
definitions:
- meaning_id: hasil, sebaiknya, sedia
  meaning_en: result, good, ready
examples:
- aceh: nyang hasé, gêt bêk tajak
  jawi: ''
  id: Sebaiknya Anda jangan pergi
  en: It would be better if you did not go
- aceh: naggroe
  jawi: ''
  id: penghasilan negeri
  en: the revenue of the country
- aceh: bak peunyeum lôn, buet nyan h'an êk hasé
  jawi: ''
  id: Menurut perasaan saya pekerjaan itu tidak akan berhasil atau selesai
  en: It seems to me that work will not succeed or be finished
- aceh: 'meukeusud, berhasil maksudnya: ka hasé bu gob?'
  jawi: ''
  id: Sudah tersedia makanan orang?
  en: Is the food ready?
- aceh: meu hasé
  jawi: ''
  id: membuat persiapan
  en: to make preparations
- aceh: teungoh jimeu hasé
  jawi: ''
  id: Ia sedang bersiap-siap atau tengah mengadakan persiapan
  en: He is getting ready, making preparations
- aceh: peu hasé
  jawi: ''
  id: menghasilkan
  en: result
- aceh: peu hasé meu hasé keusud
  jawi: ''
  id: memenuhi maksud
  en: full intention
- aceh: nyang h'an hasé tapeu hasé
  jawi: ''
  id: Mana yg tidak ada hendaklah Anda persiapkan
  en: Whatever is lacking you should make ready
