headword: landang
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: berangkat ke negeri asing (baik untuk berperang atau maksudmaksud damai), berada di perantau,
    menyerang
  meaning_en: to set out for a foreign land, whether for war or peaceful purposes, there is at coastal
    region, to attack
examples:
- aceh: kutalandang
  jawi: ''
  id: kubu pertahanan yg diperbuat oleh musuh di negeri asing, benteng perbatasan
  en: ''
- aceh: ureuenglandang
  jawi: ''
  id: orang asing
  en: person foreign
- aceh: bèk neupoh-poh kamoe! kamoe nyoe ureueng landang bak teumpat gata!
  jawi: ''
  id: Anda jangan membunuh kami! Kami orang asing di tempat Anda!
  en: Do not kill us! We are strangers in your country!
- aceh: bèk sagai sagai talandang waktèe hana du'a bak ureueng chikteu!
  jawi: ''
  id: Jangan sekali-kali anda bepergian jika tidak direstui orang tua Anda
  en: Never travel without your parents' blessing
- aceh: bèk tabri rab ji landang gata
  jawi: ''
  id: Anda jangan membiarkan ia mendekat
  en: Do not let him come near
etymology: ''
