part_of_speech: n
definitions:
- meaning_id: nama burung malam, di mana, menurut takhayul, semangat perempuan yang meninggal di warung
    telah berlayar
  meaning_en: name of a nightbird, in which, according to superstition, the spirit of women who died in
    the stall has sailed
  meaning_nl: naam van een nachtvogel, waarin volgens het bijgeloof de geest van in de kraam gestorven
    vrouwen is gevaren
- meaning_id: boeroeng kētoetoek, burung hantu
  meaning_en: boeroeng kētoetoek, owl
  meaning_nl: boeroeng kētoetoek, uil
- meaning_id: untuk menerima, untuk melakukan sesuatu secara keseluruhan dengan harga tetap
  meaning_en: to accept, to do something as a whole at a fixed price
  meaning_nl: aannemen, iets in zijn geheel tegen een vastgestelden prijs doen
