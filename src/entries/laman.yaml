  jawi: ''
  id: Sekiranya saya seorang kaya, saya tidak akan membiarkan para tunanetra pergi meminta-minta
  en: Were I a rich man I would not let the blind go begging
- aceh: geupula bungong di laman rumoh
  jawi: ''
  id: Ia menanam bunga di halaman rumahnya
  en: She plants flowers in her yard
- aceh: nyan laman ateueh gata
  jawi: ''
  id: Ia adalah tanggung jawab
  en: He is responsible
