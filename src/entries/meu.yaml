definitions:
- meaning_id: menyanjung
  meaning_en: to flatter
- meaning_id: memuji-muji
  meaning_en: ''
- meaning_id: bentuk tidak bertekanan dari kamoe, awalan dan sisipan serta penggunaan sendiri (tanpa tekanan),
    di depan huruf-huruf bibir menjadi mu dan mi atau meuh
  meaning_en: the unstressed form of kamoe, as prefix and infix, and used alone without stress, before
    labials it becomes mu, mi or meuh
- meaning_id: awalan, kep dari keumeung, dari bentuk tidak bertekanan meung
  meaning_en: beginning, short for keumeung, from the unstressed form meung
