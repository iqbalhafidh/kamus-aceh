headword: kapak
jawi: كائق
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kampak, (biasanya untuk membelah kayu)
  meaning_en: axe, usually for splitting wood
- meaning_id: lembing, pendahan (dengan tangkai kayu atau rotan yang se- makin membesar pada bahagian
    be- sinya)
  meaning_en: spear, a billhook with a wooden or rattan handle thickening towards the iron
- meaning_id: kapak pendek untuk retak kayu
  meaning_en: a short axe to crack wood
  meaning_nl: een korte bijl om hout te kloven
- meaning_id: lëmbing kapak, pie pitching
  meaning_en: lëmbing kapak, pitching pie
  meaning_nl: lëmbing kapak, werpspies
examples:
- aceh: meu kapak
