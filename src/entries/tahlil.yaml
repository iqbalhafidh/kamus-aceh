definitions:
- meaning_id: 'berbicara tentang kata-kata: la Godzilla llāh o. a. dalam kasus kematian, itu adalah umum.
    Ini adalah pērloe, ini Sonnat Sonnat yang spiritual, yang melakukan doa ini, menerima untuk setiap
    1000 kali, bahwa ia mengulanginya, satu keturunan nasional'
  meaning_en: 'speaking of words: la ilaha illa'' llāh o. a. In the case of deaths, it is common. This
    isn''t pērloe, it''s Sonnat The spiritual, who does this prayer, receives for every 1000 times, that
    he repeats it, one national descendant'
  meaning_nl: 'het uitspreken der woorden: la ilaha illa'' llāh. o. a. bij sterfgevallen gebruikelijk.
    Dit is niet pērloe, doch sonnat. De geestelijke, die dit gebed doet, ontvangt voor elke 1000 keeren,
    dat hij het herhaalt, één rijksdaalder'
