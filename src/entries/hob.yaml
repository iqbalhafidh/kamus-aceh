definitions:
- meaning_id: kancing kaitan untuk mengancing baju
  meaning_en: a hook-and-eye fastener for a garment
- meaning_id: marah, murka
  meaning_en: angry, wrath, fury
- meaning_id: kait dan mata, kait tembaga kecil dan cincin
  meaning_en: hooks and eyes, small copper hooks and rings
