headword: keureuleng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengerling, melirik, melihat sesuatu ke kiri atau ke kanan dengan sudut mata (sebagai tanda
    setuju, marah, atau bermusuhan)
  meaning_en: to glance sideways, to glance, to look left or right out of the corner of the eye, as a
    sign of assent, angry, or hostile
examples:
- aceh: 'ngon iku mata, serupa: ji keureuleng inong'
  jawi: ''
  id: Ia melirik kpd wanita
  en: He glances at the women
- aceh: pat na agam duek meutamon, ji keureuleng ngon iku mata
  jawi: ''
  id: Di mana laki-laki duduk berkumpul, wanita itu melirik kpd mereka
  en: Wherever the men gather, that woman glances at them
- aceh: meu keureuleng
  jawi: ''
  id: melakukan keureuleng, berkerling-kerlingan
  en: to cast glances at one another
- aceh: peu keureuleng droe
  jawi: ''
  id: (=mata) = keureuleng
  en: ''
- aceh: teu keureuleng
  jawi: ''
  id: melihat sesuatu secara kebetulan dng sudut mata
  en: to catch sight of something out of the corner of the eye
- aceh: bunoe roh teu keureuleng u wie, lon kalon uleue raya that
  jawi: ''
  id: Secara kebetulan, saya tadi melihat ke kiri dan tampaklah seekor ular yg sangat besar
  en: By chance I glanced to the left and saw a very large snake
etymology: ''
