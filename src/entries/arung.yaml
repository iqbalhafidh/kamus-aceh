headword: aroeng
jawi: اروغ
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: menepi ke sisi lain, menyeberang ke sisi lain sinonim dengan djëmërang
  meaning_en: pull over to the other side, cross over to the other side. Synonymize with djëmërang
  meaning_nl: overtrekken, naar de andere zijde trekken, oversteken, zich naar de andere zijde begeven.
    Synoniem met djëmërang
- meaning_id: aroeng goenoeng, meliputi gunung
  meaning_en: aroeng goenoeng, covering a mountain
  meaning_nl: aroeng goenoeng, een berg overtrekken
- meaning_id: aroeng rimba, hutan trekking
  meaning_en: aroeng rimba, a forest trekking
  meaning_nl: aroeng rimba, een bosch doortrekken
- meaning_id: aroeng paja, melintasi rawa
  meaning_en: aroeng paja, crossing a swamp
  meaning_nl: aroeng paja, een moeras oversteken
- meaning_id: aroeng kèrong, menyeberangi sungai
  meaning_en: aroeng kèrong, cross a river
  meaning_nl: aroeng kèrong, een rivier oversteken
- meaning_id: 'aroeng blang, lintas sawah juga digunakan kiasan: loen aroeng njawong loen djak tjok gata,
    saya menyeberangi dengan jiwa saya (dalam pikiran) untuk pergi mendapatkan Anda'
  meaning_en: 'aroeng blang, cross a rice field Also used figuratively: loen aroeng njawong loen djak
    tjok gata, I crossed with my soul (in mind) to go get You'
  meaning_nl: 'aroeng blang, een rijstveld oversteken. Ook figuurlijk gebezigd: loen aroeng njawong loen
    djak tjok gata, ik stak met mijn ziel (in gedachten) over, om U te gaan halen'
