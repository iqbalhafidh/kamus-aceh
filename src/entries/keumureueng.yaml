headword: keumureueng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: arang yang melekat, terutama pada loteng, (jika dicampur dengan air boh sréng dan minyak
    dapat dijadikan obat untuk menyebutkan hidung kerbau atau sapi yang dilubangi)
  meaning_en: clinging soot, especially in the loft, mixed with sréng juice and oil it makes a salve for
    the pierced nose of a buffalo or ox
examples:
- aceh: dapu
  jawi: ''
  id: arang dapur
  en: hearth soot
- aceh: kanèt
  jawi: ''
  id: arang periuk nasi, (biasanya disebut adang)
  en: soot from the rice pot
- aceh: dama
  jawi: ''
  id: arang damar, (jika dicampur dng air jeruk dan daun nila dapat dijadikan tinta)
  en: resin soot, which with lime juice and indigo leaf makes ink
- aceh: gigoe
  jawi: ''
  id: karang gi gi yg berwarna hitam
  en: black tartar on the teeth
etymology: ''
related_words:
