part_of_speech: n
definitions:
- meaning_id: kebas (akibat saraf gerak pada salah satu bahagian tubuh, umpamanya di kaki ketika tidur)
  meaning_en: numb, from the motor nerves in some part of the body, for instance at the feet when sleeping
examples:
- aceh: gaki lōn keuboih, kaki saya kebas, keuboih pung-gōng-junggōngteu taduek, meung ranub h'an jitupeue
    bri
  jawi: ''
  id: pantat kita terasa kebas krn (lama) duduk, sirih pun ia tidak tahu menyajikannya. (Dikatakan thd
    penerimaan yg tidak ramah)
  en: our backsides go numb from sitting so long, and he does not even know how to offer betel (said of
    an unwelcoming reception)
- aceh: nèk h'an èk geubeudoih lè, gaki gobnyan keuboih
  jawi: ''
  id: Nenek tidak dapat bangun lagi, kakinya kebas
  en: Grandmother can no longer get up, her legs are numb
