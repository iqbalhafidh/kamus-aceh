definitions:
- meaning_id: kaya, berharta, mahakuasa (sifat Tuhan), (selanjutnya kata-kata halus untuk) telah keluar
    penyakit cacar
  meaning_en: rich, property, all-powerful (attribute God), a polite expression for the appearance of
    smallpox
examples:
- aceh: mu'a
  jawi: ''
  id: kaya raya
  en: very rich
- aceh: ureueng keukaya, orang-orang ternama (dl hik), Tuhankaya, Tuhan Yang Amat Kaya, peukaya
  jawi: ''
  id: membuat seseorang menjadi kaya
  en: to make someone to become rich
- aceh: lôn geupeu kaya lè gobnyan
  jawi: ''
  id: Dialah yg menjadikan saya berharta
  en: It is he who made me prosperous
