  meaning_en: 'gold bracelet worn by women on the upper arm., ikan, fish, is only said of the following
    species: ikal boelan, ikal sisik, ikal dindin, ikal gëlajang, ikal sënoempit or sëloempit'
  meaning_nl: 'gouden armband, door de vrouwen aan den bovenarm gedragen. ایکن, ikan, visch, wordt alleen
    van de volgende soorten gezegd: ikal boelan, ikal sisik, ikal dindin, ikal gëlajang, ikal sënoempit
    of sëloempit'
