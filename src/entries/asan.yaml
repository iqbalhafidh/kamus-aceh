definitions:
- meaning_id: nama pohon dengan bunga kuning yang indah, begitu-disebut angsana
  meaning_en: name of a tree with beautiful yellow flowers, the so-called angsana
  meaning_nl: naam van een boom met fraaie gele bloemen, de zoogenaamde angsana
- meaning_id: nama pria
  meaning_en: male name
  meaning_nl: mannelijke persoonseigennaam
- meaning_id: pohon dengan anggun, Wangi, {\ fnCandara\ fs60\ b1\ 4cH000000\ 4aH80} Bunga kuning emas
  meaning_en: a tree with graceful, fragrant, gold yellow flowers
  meaning_nl: een boom met sierlijke, welriekende, goud gele bloemen. حاسود ḥasoed, nijdig, nijd, afgunst
examples:
