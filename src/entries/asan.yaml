  jawi: ''
  id: mengapa Anda memiliki kesenangan seperti itu? Apa kau terpesona oleh orang yang tak terlihat?
  en: why do you have such a pleasure? Are you envyed by an invisible person?
  nl: waarom hebt ge zoo'n genoegen? zijt ge afgunstig op een onzichtbaar persoon? حاضر ḥadlir, tegenwoordig.
    حايض ḥaidl, menstruatie. حبشي ḥabesjie, Abyssinië
- aceh: oreng asan
  aceh_1889: orēng ḥasan
  jawi: ''
  id: 'abyssiniër abib, judul yang mungkin dibaca oleh orang Arab: Séjjids atau keturunan mereka dibicarakan.
    avaidji, seseorang yang melakukan iarah, dialamatkan oleh gelar tēngkoe'
  en: 'abyssiniër. abib, title with which the Arabs [probably read: the Séjjids] or their descendants
    are spoken. "adji," someone who performed the pilgrimage, is addressed by the title of tēngkoe'
  nl: 'Abyssiniër. حبيب ḥabib, titel waarmede de Arabieren [waarschijnlijk te lezen: de Séjjids] of hunne
    afstammelingen worden aan gesproken. حمج ḥadji, iemand, die de bedevaart heeft verricht, hij wordt
    met den titel van tēngkoe aangesproken'
- aceh: ik aji ter bede vaart gaan  ujah
