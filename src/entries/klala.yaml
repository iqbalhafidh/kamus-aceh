headword: klala
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menjaga, mengawasi, memperhatikan, (biasanya dikatakan terhadap seorang anak yang amat nakal
    atau kawan hewan liar)
  meaning_en: to guard, to supervise, to pay attention to, usually said of a very naughty child or of
    a wild animal
examples:
- aceh: h'an êk lôn klala aneuk nyan
  jawi: ''
  id: cabak that! Saya tidak sanggup menjaga anak itu. Ia sangat nakal
  en: I cannot look after that child, he is very naughty
- aceh: keubeue saboh weue êk ta klala, sidor ureueng h'an êk ta klala
  jawi: ''
  id: Kerbau sekarang dapat dijaga, (tetapi) seorang manusia tidak dapat dijaga
  en: A buffalo can be watched over, but a human being cannot
- aceh: meu klala
  jawi: ''
  id: dijaga
  en: watch
