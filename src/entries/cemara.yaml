definitions:
- meaning_id: hutan rambut, yang perempuan bergabung dengan rambut mereka, untuk membuatnya tampak lebih
    makmur
  meaning_en: hair forest, which women join to their hair, to make it appear more prosperous
  meaning_nl: haarbos, die vrouwen bij hun haar voegen, om het weliger te doen schijnen
- meaning_id: sebuah sisir rambut emas yang luas, yang membawa Wanita pada rambutnya yang dibuat
  meaning_en: a broad golden haircomb, which carries the Atj. women on her made hair
  meaning_nl: een breede gouden haarkam, die de Atj. vrouwen op hare opgemaakte haren dragen
