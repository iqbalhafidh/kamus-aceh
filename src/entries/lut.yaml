headword: lut
jawi: لوة
alt_spelling:
- loet
ipa: ''
part_of_speech: v
definitions:
- meaning_id: makan, dapat dilukai'
  meaning_en: eat, can wound
- meaning_id: menarik keluar, menyerang, rentan, menyakiti
  meaning_en: pulling out, invading, vulnerable, hurting
  meaning_nl: uittrekken, indringen, kwetsbaar, kwetsen
examples:
- aceh: ék lut seukin nyoe tasie asoe?
  jawi: ''
  id: Dapat kah pisau ini disayat ke daging?
  en: Will this knife cut meat?
- aceh: ureueng nyoe h'an lut beusoe
  jawi: ''
  id: Orang ini tidak dapat dimakan besi
  en: Iron cannot harm this man
- aceh: beuthat tatak, beuthat tatob jih h'an jitem lut cit, jih keubai that
  jawi: ''
  id: Walaupun ditetakkan atau ditusuk, ia tidak dapat dilukai juga. Ia sangat kebal
  en: Though hacked or stabbed he cannot be wounded; he is quite invulnerable
- aceh: oreng nyoi han lut besoi
  aceh_1889: orèng njoi han loet bèsoi
  jawi: ''
  id: orang ini tidak bisa terluka (tidak mengganggu) oleh besi
  en: this man can't be hurt (not to intrude) by the iron
  nl: deze man is niet te kwetsen (niet in te dringen) door het ijzer
etymology: ''
