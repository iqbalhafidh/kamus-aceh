headword: kēdoedoek
jawi: کدوِدوف
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis semak, buah-buahan yang dimakan. Air yang panas mendidih diminumkan kepada mereka
    dan dituangkan ke kepala. Mereka berada di bawah naungan asap panas yang hitam, tidak sejuk sehingga
    dapat meringankan panasnya udara dan tidak menyenangkan bila mereka menghirupnya
  meaning_en: a kind of shrub, the fruits of which are eaten. The boiling of leaves and young fruits is
    an abdominal pain remedy
  meaning_nl: een soort van heester, waarvan de vruchten worden gegeten. Het afkooksel der bladeren en
    jonge vruchten is een middel tegen buikpijn
