headword: iem
jawi: ایم
alt_spelling:
- iëm
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: droe
  meaning_en: ''
- meaning_id: keheningan, pëiëm
  meaning_en: silence, pëiëm
  meaning_nl: stil zijn, zwijgen, zich stil houden, pëiëm, stil doen zijn
examples:
- aceh: 'v berdiam diri tanpa gerak atau suara, diam: iem, bèk meugrak'
  jawi: ''
  id: Diam, jangan bergerak!
  en: Be still, do not move!
- aceh: bèk riôh
  jawi: ''
  id: Diam jangan membuatnya keributan
  en: be silent do not to make commotion
- aceh: ka lôn peugah bak ji iem droe (ji)
  jawi: ''
  id: Sudah saya katakan supaya ia diam
  en: I have told him to be quiet
- aceh: meu iem
  jawi: ''
  id: berdiam diri, tidak bergerak, terhenti
  en: to keep still, motionless, halted
- aceh: peue ta iem iem mantong, pakon hana tapumubuet
  jawi: ''
  id: Mengapa Anda berdiam diri saja, mengapa Anda tidak bekerja?
  en: Why do you just sit idle, why do you not work?
- aceh: buet nyan trèh that kn meu iem, tôk an jeunoe goh lom geupubuet geuma
  jawi: ''
  id: Pekerjaan itu sudah lama terhenti, sampai sekarang belum juga dimulai kembali
  en: That work has long been at a standstill and has still not been resumed
- aceh: ta peuiem aneuk nyan bacut
  aceh_1889: ta pëiëm anëk njan batjoet
  jawi: ''
  id: biarkan anak itu menjadi sedikit tenang
  en: let that child be a little quiet
  nl: laat dat kind een weinig stil zijn
- aceh: iem gata beur le tamarit
  aceh_1889: iëm gata bër lé tamarit
  jawi: ''
  id: diam, berhenti bicara
  en: shut up, stop talking
  nl: zwijgt, spreekt niet meer
