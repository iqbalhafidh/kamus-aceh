headword: lanjut
jawi: لنجوة
alt_spelling:
- landjoet
ipa: ''
part_of_speech: a
definitions:
- meaning_id: lanjut, lama, bergema, menghilang, tertahan, panjang, jauh, tinggi
  meaning_en: advanced, old, to echo, lost, held back, long, far, high
- meaning_id: halus, melengking, tipis, tinggi bernada
  meaning_en: fine, squeaky, thin, high-pitched
  meaning_nl: fijn, pieperig, dun, hoog van de stem
- meaning_id: jangka panjang
  meaning_en: long term
  meaning_nl: langdurig
examples:
- aceh: bak lanjut umu
  jawi: ''
  id: Moga-moga lanjut umur (nya atau Anda)
  en: May you live long
- aceh: gobnyan lanjut that umu, ka sireutôh thôn, mantong teuga
  jawi: ''
  id: Umurnya sangat lanjut, sudah seratus tahun, tetapi masih kuat
  en: He is very old, a hundred years, yet still strong
- aceh: bêk lanjut that tabeuet, bak bagaih bacut
  jawi: ''
  id: Jika mengaji Qur-an, tarikan nafas Anda jangan panjang-panjang bacalah cepat sedikit
  en: When reciting the Qur'an do not draw out your breath; read a little faster
- aceh: pat jitaga nyan, lanjut that su
  jawi: ''
  id: Di manakah terdengar bunyi guruh? Panjang sekali gemanya
  en: Where is that thunder heard? Its echo is very long
- aceh: that jiulu glayang nyan
  jawi: ''
  id: Panjang sekali ia mengeluarkan benang layang-layang itu
  en: He let out a great length of kite string
- aceh: tanoh nyoe siretôih deupa, linteuengjih nam plôh
  jawi: ''
  id: Panjang tanah ini seratus depa, lebarnya enam puluh
  en: This land is a hundred fathoms long and sixty wide
- aceh: peu lanjut
  jawi: ''
  id: membuat shg panjang
  en: to make so that long
- aceh: tapeu lanjut bacut, bêk bagaih that tabeuet!
  jawi: ''
  id: Suara Anda sedikit panjangkan. Jangan membaca terlalu cepat
  en: Draw out your voice a little; do not read too fast
