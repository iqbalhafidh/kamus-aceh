headword: tamban
jawi: تَمِين
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis rusa. itu juga dikatakan tamban ramboet lëkang, karena daging memungkinkan longgar
    ketika memasak seperti rambotan, yang mudah melepaskan dari pit dan sangat juicy
  meaning_en: a kind of elft. It is also said tamban ramboet lëkang, because the meat lets loose when
    cooking like a rambotan, which easily lets go of its pit and is very juicy
  meaning_nl: een soort van elft. Men zegt ook tamban ramboet lëkang, omdat het vleesch bij het koken
    loslaat gelijk een ramboetan, die gemakkelijk van haar pit loslaat en zeer saprijk is
