definitions:
- meaning_id: rajam, merajam
  meaning_en: stoning
- meaning_id: stony. Di Aceh, kalau orang yang bersalah adalah seorang laki-laki, ia dimakamkan di pinggulnya,
    kalau ia seorang wanita, ke dadanya di tanah
  meaning_en: stony. In Aceh, when the guilty man is a man, he is buried up to his hips, if he is a woman,
    to her breasts in the ground
  meaning_nl: 'steeniging. In Atjeh als volgt ten uitvoer gelegd: wanneer de schuldige een man is, wordt
    hij vooraf tot aan zijne heupen, indien het eene vrouw is, tot aan hare borsten in den grond begraven'
