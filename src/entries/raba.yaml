headword: raba
jawi: رابا
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: raba
  meaning_en: to grope
- meaning_id: merasa, meraba-raba dalam gelap atau buta, juga tersesat
  meaning_en: feeling, groping in the dark or a blind, also getting lost
  meaning_nl: bevoelen, betasten in het duister of van een blinde, ook verdwalen
- meaning_id: sisat mēraba-raba, benar-benar hilang sinonim dengan gēr
  meaning_en: sisat mēraba-raba, completely lost. Synonym with gēr
  meaning_nl: sisat mēraba-raba, geheel en al verdwaald zijn. Synoniem met gēr
examples:
- aceh: Kruengraba
  jawi: ''
  id: nama lain utk Lhok Nga, sebuah kota kecil di pantai barat Aceh Besar, tidak jauh dari Banda Aceh
  en: ''
- aceh: meuraba, meraba, (juga dan biasanya dl bentuk) meuraba raba, (dl hik meureuraba)
  jawi: ''
  id: bertualang, berkelana dl arti tidak baik
  en: ''
- aceh: reuraba
  jawi: ''
  id: menyuruh meraba (ump orang buta), menolong raba, membiarkan berkelana
  en: ''
