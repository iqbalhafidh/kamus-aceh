part_of_speech: n
definitions:
- meaning_id: izin, keizinan
  meaning_en: permit
examples:
- aceh: meung na idin nibak droeneu, si ngoh beungoh lôn keumeung jak woe
  jawi: ''
  id: Jika Anda mengizinkannya, besok pagi saya bermaksud hendak pulang
  en: If you permit it, I intend to go home tomorrow morning
- aceh: lakèe idin
  jawi: ''
  id: meminta keizinan, meminta diri
  en: to ask for permit, to ask for self
- aceh: meu idin idin (idin meu idin)
  jawi: ''
  id: saling mengizinkan, sama-sama memaafkan
  en: to permit one another, to forgive one another
- aceh: leubèh kureueng bacut saho tameu idin idin
  jawi: ''
  id: Lebih atau kurang sedikit marilah sama-sama kita memaafkan
  en: Whether a little more or a little less, let us forgive one another
- aceh: peu idin
  jawi: ''
  id: mengizinkan, memaafkan
  en: permit, to forgive
- aceh: salah lôn bak na tapeu idin
  jawi: ''
  id: Maafkanlah jika ada kesalahan saya
  en: Forgive me if I have done wrong
- aceh: neupeu idin
  jawi: ''
  id: '! izinkanlah, terima kasih idin eumpieng'
  en: please permit it, thank you
