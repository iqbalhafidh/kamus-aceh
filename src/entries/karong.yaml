definitions:
- meaning_id: karung atau sumpit besar, terbuat dari daun ibôih, tempat penyimpanan padi
  meaning_en: a sack or large bag, made of ibôih leaves, a place for storing rice
- meaning_id: saudara dari pihak ibu
  meaning_en: a relative on the mother's side
- meaning_id: kantong besar yang terbuat dari iboesbladeren
  meaning_en: large coarse bags made of iboesbladeren
  meaning_nl: groote grove zakken van iboesbladeren gemaakt
- meaning_id: kerabat dari ibu Isthas sisi
  meaning_en: the relatives of the mother's side
  meaning_nl: de bloedverwanten van moederskant
examples:
- aceh: si Pulan ngon lôn karông
  jawi: ''
  id: si Polan dng saya adalah saudara dari pihak ibu
  en: so-and-so and I are kin on the mother's side
