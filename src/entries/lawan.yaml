  en: ''
- aceh: ji lawan ma,jilawan kuji, peue aneuk meunan!
  jawi: ''
  id: Ia melawan ibunya dan ayahya. Anak apa itu!
  en: He defies his mother and father. What sort of child is that!
- aceh: dum peue narit geutanyoe jilawan
  jawi: ''
  id: Ia membantah semua perkataan kita
  en: He contradicts everything we say
- aceh: bek tatak trieng ngon parang nyan, h'an jilawan
  jawi: ''
  id: Anda jangan memotong bambu dng parang itu. Ia tidak tahan
  en: Do not cut bamboo with that machete, it will not stand it
- aceh: praho nyoe hana jilawan tameulayeue u Meulaboh
  jawi: ''
  id: Perahu ini tidak tahan utk belajar ke Meulaboh
  en: This boat will not stand a voyage to Meulaboh
- aceh: angèn lawan
  jawi: ''
