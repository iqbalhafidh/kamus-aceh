examples:
- aceh: hana lawan tamita lawan, 'oh na lawan talakèe ampôn
  jawi: ''
  id: Anda mencari lawan kalau tidak ada lawan. Jika ada
  en: You look for a quarrel where there is none
- aceh: jroh hanalawan
  jawi: ''
  id: indah tak ada taranya
  en: ''
- aceh: jroh that, hana lawan
  jawi: ''
