  en: to perform opponent
- aceh: bèk tameulawan lè!
  jawi: ''
  id: Anda jangan melawan lagi!
  en: Do not resist any more!
- aceh: peulawan
  jawi: ''
  id: menjadikan lawan, berbuat sbg lawan, menyuruh lawan
  en: to become opponent, make as opponent, to order opponent
- aceh: tapeulawan manok gata ngon manok lôn
  jawi: ''
  id: Adulah ayam Anda dng ayam saya
  en: Set your cock against mine
- aceh: jipeu ruti ngon sie kameng
  jawi: ''
  id: Ia makan roti dng lauk-pauk daging kambing
  en: He eats bread with goat meat
- aceh: meuseuki tapèh tabôh keu nan, jan tamakan mangat h'an soe
  jawi: ''
  id: Manisan yg manis dan santan yg lemak dapat dimakan dng apa saja sebagai lawannya, kendatipun sabut
    dibubuhi ke dlnya akan
  en: Sweet syrup and rich coconut milk go with anything, even with husk put into them
