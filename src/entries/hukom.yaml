headword: hukôm
jawi: حكم
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: hukum, undang-undang, peraturan (terutama dalam agama Islam)
  meaning_en: law, laws, regulation (especially in Islam)
examples:
- aceh: ngon adat h'an jeuet crê, lagêe Dat ngon Sipheuet
  jawi: ''
  id: Hukum (Islam) dng adat (Aceh) tidak terpisahkan spt Zat dng Sifat Tuhan
  en: Islamic law and Acehnese custom are inseparable, like the Essence and the Attributes of God
- aceh: ngon adat lagêe mata itam ngon mata putêh
  jawi: ''
  id: Hukum (Islam) dng adat (Aceh) spt biji mata hitam dng biji mata putih, hukôm adat
  en: Islamic law and Acehnese custom are like the black of the eye and the white of the eye
- aceh: ka tôk hukôm
  jawi: ''
  id: ôleh, Sudah sampai hukum Allah = (ia) sudah meninggal
  en: The judgement of God has come = he has died
- aceh: cor'ak, hukôm kitab
  jawi: ''
  id: hukum syarak, hukum agama Islam
  en: sharia law, the law of Islam
- aceh: adat
  jawi: ''
  id: hukum adat
  en: law custom
- aceh: ruesam
  jawi: ''
  id: hukum kebias aan
  en: customary law
- aceh: putôihsan hukôm ôlah ubak siah ngon ulama, putôihsan hukôm adat bak ureueng nyang mumat ubak raja
  jawi: ''
  id: Keputusan hukum Allah berada di tangan orang-orang suci dan para ulama, sedangkan keputusan hukum
    adat ada pd orang-orang yg berpegang kpd keputusan-keputusan raja
  en: Judgement under God's law rests with the holy men and the ulama, while judgement under customary
    law rests with those who hold to the rulings of the king
- aceh: jakalèe neubri hukôm reusam, lôn bèk masam ngon sèedara
  jawi: ''
  id: Jika Anda memutuskan menurut hukum Allah, lakukanlah itu dng sebaik-baiknya spy hamba tidak terkena
    sumpah
  en: If you judge by the law of God, do it as well as you can so that your servant is not put under oath
- aceh: jika Anda memutuskan menurut hukum adat
  jawi: ''
  id: laksanakanlah itu dng sebaik-baiknya sehingga kami tidak terikat dng suatu jaminan
  en: carry it out as well as you can so that we are not bound by any pledge
- aceh: jika Anda memutuskan menurut hukum kebiasaan
  jawi: ''
  id: laksanakanlah itu sehingga tidak akan menimbulkan sengketa diantara saya dng saudara-saudara saya
  en: carry it out so that it gives rise to no dispute between me and my brothers
- aceh: ikat
  jawi: ''
  id: hukum yg mewajibkan penyerahan barang berharga sebagai jaminan bahwa perjanjian itu akan ditaati
  en: the rule requiring a valuable to be handed over as security that an agreement will be kept
- aceh: ikat patéh keu hakim, meusé sikin tacok tanda
  jawi: ''
  id: hukôm
  en: ''
- aceh: tacok tanda carat nyang kuat, nyankeu 'ikat' jimeunama
  jawi: ''
  id: Hukum 'ikat' ialah kepercayaan kpd hakim laksana pisau yg dijadikan jaminan
  en: The law of the pledge is trust in the judge, like a knife given as security
etymology: Arabic loanword; the Jawi form given here is the Arabic etymon.
