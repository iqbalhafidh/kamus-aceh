headword: lungkeueng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ruang tertutup yang berbentuk lingkaran (karena ruang tempat tidur ular dalam keadaan melengkung
    dengan kepala di ekornya)
  meaning_en: ''
- meaning_id: gelung (umpamanya ular)
  meaning_en: coil (for example snake)
examples:
- aceh: raya that lungkeueng uleue nyan
  jawi: ''
  id: Gelung ular itu sangat besar
  en: That snake's coil is very large
- aceh: meu lungkeueng
  jawi: ''
  id: berbentuk lingkaran (spt gelungan ular, gelang tangan, kaki langit), melingkar
  en: ''
- aceh: lôn kalon lhan meu lungkeueng bak rét
  jawi: ''
  id: Saya melihat ular sawah bergelung di jalan
  en: I saw a python coiled on the road
- aceh: peu lungkeueng
  jawi: ''
  id: melingkarkan, menggelungkan
  en: circle, coil
- aceh: pakon irôt tapeu-gleueng lôn?
  jawi: ''
  id: Mengapa Anda miring menggelungkan gelang tangan saya?
  en: Why have you bent my bracelet crooked?
