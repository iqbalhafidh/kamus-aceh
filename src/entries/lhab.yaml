definitions:
- meaning_id: mencelup (umpamanya benang, kain, jala) ke dalam air celupan supaya berwarna atau awet.
    mencelup, mewarnai, mengecat
  meaning_en: to dye, as thread, cloth, to dip a net into dye so that it takes colour or lasts, colour,
    to paint
- meaning_id: kumat
  meaning_en: ''
- meaning_id: menyerang
  meaning_en: to attack
- meaning_id: memegang
  meaning_en: to hold
- meaning_id: pencampuran, pencelupan
  meaning_en: immersion
  meaning_nl: indompelen, indoopen
- meaning_id: lhab idjar, celupkan kain ke dalam air
  meaning_en: lhab idjar, dip a cloth in the water
  meaning_nl: lhab idjar, een kleed in het water dompelen
examples:
