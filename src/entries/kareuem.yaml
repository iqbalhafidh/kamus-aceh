headword: kareuem
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melingkari sesuatu dengan duri supaya orang tidak dapat masuk ke dalamnya atau memanjatnya
    (umpamanya tangga rumah, pohon buah-buahan), duri-duri yang dipergunakan untuk itu
  meaning_en: to ring something with thorns so that no one can enter or climb it, for instance a house
    ladder, tree fruit fruit, the thorns used for that purpose
examples:
- aceh: bòh kareuem, membubuhi atau melingkari sesuatu dengan duri, takareuem bak u nyoe bèk jipèt lè
    pancuri!
  jawi: ''
  id: Bubuhilah pohon kelapa ini dng duri supaya tidak dapat dipanjat batangnya dan dipetik buahnya oleh
    pencuri
  en: Ring this coconut palm with thorns so that thieves cannot climb it and take the fruit
- aceh: reunyeun, bubuhi di sekeliling tangga rumah dengan duri (ump rumah seorang pemuda yg selalu menyendiri
    di rumah dan tidak pernah datang ke meunasah supaya ia mendapat malu), meukareuem teukareuem, dibubuhi
    duri, u meukareuem
  jawi: ''
  id: batang kelapa yg dibubuhi duri
  en: a coconut trunk ringed with thorns
- aceh: keunareuem
  jawi: ''
  id: duri-duri yang dipergunakan untuk itu
  en: the thorns used for that purpose
