headword: irang
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: miring, tidak menurut arah yang sebenarnya
  meaning_en: slanting, not following the true direction
- meaning_id: aib, hal yang memalukan
  meaning_en: disgrace, a shameful matter
examples:
- aceh: talirang òn pisang bèk irang
  jawi: ''
  id: Potonglah daun pisang, tetapi jangan miring. irang iròt, pencong-mencong, miring ke berbgai arah
  en: Cut the banana leaf, but not crooked
- aceh: tamèh rumoh nyan hana gèt jitpeudong
  jawi: ''
  id: bandum irang iròt, Tiang-tiang rumah itu didirikan tidak lurus, semuanya pencong-pencong. irang
    deungon iròt, keudang-keudòt, meung na
  en: The posts of that house were not set up straight, they are all askew
- aceh: nyan keu sagai ulòn publa
  jawi: ''
  id: nama gata dum bèk irang, Itulah sebabnya saya membela spy nama Anda semuanya tidak cacat
  en: That is why I defended you, so that your good name should bear no blemish
