definitions:
- meaning_id: sesuatu yang dapat diadakan antara ibu jari dan salah satu jari
  meaning_en: something that can be held between the thumb and one of the fingers
  meaning_nl: iets wat men tusschen den duim en een der vingers kan houden
- meaning_id: juga jumlah yang dapat disimpan antara sayuran
  meaning_en: also the quantity that can be kept between vegetables
  meaning_nl: ook de hoeveelheid, die men daar-tusschen kan houden van groenten
- meaning_id: untuk melanjutkan, tapi tidak begitu kematian mengikuti
  meaning_en: to continue, but not so death follows
  meaning_nl: voorts worgen, doch niet zoodat er de dood op volgt
