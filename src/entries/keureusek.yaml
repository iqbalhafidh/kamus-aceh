headword: keureusek
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kersik, kerikil, pasir kasar, butir pasir (dalam hikayat dan sebagai sebutan untuk sesuatu
    yang sangat banyak)
  meaning_en: coarse sand, gravel, a grain of sand (in hikayat, denoting something innumerable)
examples:
- aceh: jikalon ureueng mise keureusek, Ia melihat orang laksana kersik = sangat banyak, rupaji lagee
    keureusek di pante
  jawi: ''
  id: tampaknya spt kersik di pantai = sangat banyak
  en: they look like sand on the shore = very many
- aceh: gleueng keureusek, Gelang tangan yg berisi sesuatu sehingga mengeluarkan bunyi, pulo keureusek
  jawi: ''
  id: nama sebuah pulau sebelah barat Pulo Breueh, tempat dikuburnya seorang keramat bernama Teungku
  en: the name of an island west of Pulo Breueh where a saint called Teungku is buried
etymology: ''
