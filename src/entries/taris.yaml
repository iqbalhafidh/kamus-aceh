headword: taris
jawi: تاریس
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: angin sesuatu dengan tali sepenuhnya
  meaning_en: wind something with rope completely
  meaning_nl: iets met touw geheel omwinden
- meaning_id: taris pētoi, angin kotak
  meaning_en: taris pētoi, wind up a box
  meaning_nl: taris pētoi, een kist omwinden
- meaning_id: taris gotji, sebuah pot angin
  meaning_en: taris gotji, a pot of wind
  meaning_nl: taris gotji, een pot omwinden
- meaning_id: taris lidah, angin barel juga digunakan secara kiasan dari orang-orang yang telah mendapatkan
    begitu banyak hewings bahwa mereka terlihat seolah-olah mereka telah dibuat oleh tali
  meaning_en: taris tongue, wind a barrel Also figuratively used of people who have obtained so many hewings
    that they look as if they have been made by rope
  meaning_nl: taris tong, een vat omwinden. Ook figuurlijk van menschen gebezigd, die zoovele houwen hebben
    bekomen, dat zij er uitzien alsof zij door touw zijn omwonden geweest
