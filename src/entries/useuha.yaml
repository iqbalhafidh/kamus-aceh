headword: useuha
jawi: اوسها
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: usaha, daya upaya, kerja, jasa yang diberikan untuk sesuatu, pemeliharaan
  meaning_en: enterprise, southwest effort, work, a service rendered for something,
    upkeep
- meaning_id: mengusahakan dan sebagainya
  meaning_en: ''
examples:
- aceh: meung kon ngon useuha droeneu, h'an meusampe
  jawi: ''
  id: Jika bukan dng usaha Anda tidak akan berhasil atau tercapai maksudnya
  en: ''
- aceh: gêt useuha gêt neubalaih, nyang jheut meu-keubah lam nuraka
  jawi: ''
  id: Pekerjaan yg baik akan dibalas Nya dng kebaikan, pekerjaan yg jahat akan dimaksukkan
    Nya dng neraka
  en: ''
- aceh: soe nyang useuha buet nyan?
  jawi: ''
  id: Siapakah yg mengusahakan hal itu?
  en: ''
- aceh: aneuk nyan di phon cut kon lon nyang useuha
  jawi: ''
  id: Sejak kecil saya yg memelihara anak itu
  en: ''
- aceh: keubeue, lampoih
  jawi: ''
  id: memelihara kerbau, kebun
  en: ''
- aceh: teu useuha
  jawi: ''
  id: diusahakan
  en: enterprise
- aceh: perusahaan
  jawi: ''
  id: perusahaan, kerja, daya upaya, jasa
  en: ''
