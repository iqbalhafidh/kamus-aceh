ipa: ''
part_of_speech: v
definitions:
- meaning_id: menguak (umpamanya kedua belah tangan mengepal parang pada saat membelah kelapa atau buah
    durian)
  meaning_en: ''
- meaning_id: mencuka (umpamanya orang-orang yang berkerumun)
  meaning_en: ''
- meaning_id: mengerabik
  meaning_en: ''
- meaning_id: kuat, gaya, tenaga, kekuatan kuat dalam, menyukai, menggemari, banyak berbuat dalam hal,
    selalu, menjadikan kuat, membiasakan
  meaning_en: strong, manner, strength, strength in, like, to be fond of, to do much in the matter of,
    always, to become strong, to accustom
- meaning_id: pemimpin, panglima (dalam hikayat)
  meaning_en: leader, commander (in hikayat)
examples:
