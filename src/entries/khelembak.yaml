headword: chēlēmbak
jawi: خليق
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis Atj odeur terdiri dari halus digosok tjindana dan gahroe-hout dicampur dengan bunga,
    air mawar dan minyak olfaktur
  meaning_en: a kind of Atj. odeur composed of finely rubbed tjindana and gahroe-hout mixed with flowers,
    rosewater and olfactory oil
  meaning_nl: een soort van Atj. odeur, samengesteld uit fijngewreven tjindana en gahroe-hout vermengd
    met bloemen, rozenwater en reukolie
examples:
- aceh: jiput angen megisar pucak bee khelembak gahru cindana
  aceh_1889: djipoet angēn mēgisar poetjak bēe chēlēmbak gahroe tjindana
  jawi: ''
  id: angin bergerak dalam rotasi menuju atas, aroma chēlēmbak mengeluarkan gahroe
  en: the wind moved in rotation towards the top, a scent of chēlēmbak gahroe issuing
  nl: de wind bewoog in draaiende richting den top, een geur van chēlēmbak gahroe afgevende
