part_of_speech: n
definitions:
- meaning_id: kawanan, kelompok, kawan, teman, rekan, sahabat
  meaning_en: friend, group, companion
examples:
- aceh: 'soe nyan: kawan atawa lawan'
  jawi: ''
  id: '? Siapakah itu, kawan atau lawan?'
  en: Who is that, friend or foe?
- aceh: geutanyoe
  jawi: ''
  id: kawan atau orang-orang kita?
  en: friends, or our own people?
- aceh: keubeue
  jawi: ''
  id: kawanan kerbau
  en: friend buffalo
- aceh: eungkôt, kawanan ikan, meukawan, (dl hik) meukeukawan
  jawi: ''
  id: berkawan-kawan, sangat banyak
  en: friend friend, very many
- aceh: soe jak nyan meukawan
  jawi: ''
  id: '? Siapakah yang berjalan beramai-ramajitu?'
  en: Who are those people walking in a crowd?
- aceh: Peukawan
  jawi: ''
  id: membuat sehingga menjadi kelompok atau kawanan, menyertai dengan kelompok atau kawanan
  en: to form into a group or herd, to join with a group
- aceh: peukawan droe
  jawi: ''
  id: bergabung dng kelompok atau kawanan
  en: to join a group or herd
- aceh: tapeukawan droeteu ngon lôn
  jawi: ''
  id: mari, Anda bergabung dengan saya
  en: come, join me
