headword: naléh
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: nama sejenis ukuran isi yang tidak dikenal bentuknya, dipergunakan untuk menakar banyaknya
    padi, beras, atau barang-barang seperti lada, mesiu
  meaning_en: a measure of capacity of unknown form, used to measure quantities of rice, rice husked,
    or goods such as pepper, gunpowder
examples:
- aceh: 1 naléh = 16 are 8 gantang = 1/10 gunca
  jawi: ''
  id: dipergunakan sbg ukuran luas, sbg kata hitung, yi 16 (terutama utk anak dan kadang-kadang sbg kes-tuan
    timbangan utk menyatakan berat 1 naléh beras (breueh)
  en: ''
- aceh: ka tòk si naléh jimeuuaneuk
  jawi: ''
  id: Ia sudah beranak enam belas orang
  en: ''
- aceh: mè naléh
  jawi: ''
  id: membawa seberas, yi hadiah-hadiah yg dibawa oleh mertua perempuan kpd menantu perempuan ketika hamil
    jika mereka itu termasuk orangor ang yg kurang berada
  en: ''
