headword: luroh
jawi: لوروه
alt_spelling:
- luroih
- ruroh
- loeroh
ipa: ''
part_of_speech: v
definitions:
- meaning_id: gugur, jatuh, rontok, hilang (untuk dosa), (hikayat) turun, menghilir
  meaning_en: to fall, to fall off, lost (for sin), descend (hikayat), to go downstream
- meaning_id: limbah daun, bunga atau buah
  meaning_en: waste of leaves, flowers or fruit
  meaning_nl: afvallen van bladeren, bloemen of vruchten
examples:
- aceh: ok ji ka luroh
  jawi: ''
  id: Rambutnya sudah gugur (krn penyaktinya)
  en: His hair has fallen out from his illness
- aceh: bulee leuek ka luroh
  jawi: ''
  id: Bulu balam sudah rontok
  en: The dove's feathers have fallen out
- aceh: soe seumayang limong waktée luroh déesa
  jawi: ''
  id: Barang siapa sembahyang lima waktu, akan hilang dosanya
  en: Whoever performs the five daily prayers will have his sins removed
