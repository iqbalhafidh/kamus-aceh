definitions:
- meaning_id: hidup ikan baagar, melayani dalam pot besar garam dan memasak dengan daun (goelai) dengan
    beras. (Penduduk Daja adalah pecinta besar)
  meaning_en: live ikan badar, serve in large pots of salt and cook with leaves (goelai) with rice. (The
    inhabitants of Daja are great lovers)
  meaning_nl: levende ikan badar, dien men in groote potten inzout en als toespijs gekookt met bladeren
    (goelai) bij rijst eet. (De bewoners van Daja zijn hiervan groote liefhebbers)
