headword: jab
jawi: جب
alt_spelling:
- djab
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: rapat, (kiasan) seperasaan
  meaning_en: tight, feeling (figuratively)
- meaning_id: kerongkongan bubu, terdiri dari corong bambu yang dianyam melintang dan terbuka ke mulut
    bubu serta tertutup rapat pada ujungnya
  meaning_en: the throat of a fish trap, consisting of a bamboo funnel woven crosswise, open at the mouth
    of the trap and closed tight at the end
- meaning_id: untuk elkaār, bersatu, dari satu perasaan
  meaning_en: to elkaār, unite together, of one feeling
  meaning_nl: bij elkaār brengen, tot één geheel vereenigd, van één gevoelen
- meaning_id: mēdjab, cobalah untuk membuat satu perasaan
  meaning_en: mēdjab, try to make one feeling
  meaning_nl: mēdjab, tot één gevoelen trachten te brengen
examples:
- aceh: bêk jab that taduek bak bintêh, teuboih bajèeteu
  jawi: ''
  id: Jangan Anda duduk rapat sekali dengan dinding, (nanti) kotor baju Anda
  en: Do not sit so close to the wall, your shirt will get dirty
- aceh: bubèe dua jab
  jawi: ''
