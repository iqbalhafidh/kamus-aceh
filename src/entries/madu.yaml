headword: madu
jawi: مادو
alt_spelling:
- madzu
- madoe
ipa: ''
part_of_speech: n
definitions:
- meaning_id: madu
  meaning_en: honey
- meaning_id: isteri yang dikawini setelah ada isteri pertama
  meaning_en: a wife taken after a first wife
- meaning_id: medeëchtgenoote dari orang yang sama, sesama kekasih atau kekasih
  meaning_en: medeëchtgenoote of the same man, fellow lover or lover
  meaning_nl: medeëchtgenoote van denzelfden man, mede-minnaar of minnares
- meaning_id: kekasih dari istri seseorang, kekasih dari seseorang suami
  meaning_en: lover of someone's wife, lover of someone's husband
  meaning_nl: minnaar van iemands vrouw, minnares van iemands man
- meaning_id: musuh
  meaning_en: enemy
  meaning_nl: vijand
examples:
- aceh: ie madu
  jawi: ''
  id: (air) madu lebah
  en: bee honey
- aceh: jipeuduek madu lagèe seunungkèe
  jawi: ''
  id: Ia menempatkan madunya spt menempatkan batu tungku. (ki) Ia dapat mendamaikan madu-madunya
  en: 'He sets his co-wives like the stones of a hearth: he can keep peace among them'
- aceh: mu madu
  jawi: ''
  id: bermadu, mempunyai isteri lebih dr satu orang
  en: ''
- aceh: pu madu
  jawi: ''
  id: memadukan, mengawini lebih dr seorang isteri
  en: ''
- aceh: bèk tapu madu lòn bòh!
  jawi: ''
  id: Anda jangan memadukan saya, ya!
  en: Do not take a second wife over me!
etymology: ''
