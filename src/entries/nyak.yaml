ipa: ''
part_of_speech: n
definitions:
- meaning_id: panggilan kepada anak-anak, dipergunakan untuk anak-anak (orang kedua atau ketiga) di depan
    nama sendiri
  meaning_en: a call to children, used of children, in the second or third person, before the given name
- meaning_id: panggilan kepada ibu
  meaning_en: a form of address to one's mother
- meaning_id: indikator nama untuk nama-diri pria
  meaning_en: name indicator for male self-names
  meaning_nl: naamaanwijzer voor mannelijke eigennamen
- meaning_id: nilai menunjuk nama untuk perempuan
  meaning_en: grade pointing name for women
  meaning_nl: rang-aanwijzende naam voor vrouwen
- meaning_id: njak Gam, Njak Mohamad Perempuan dari hoeléebalang's, bukan bangsawan, ditujukan kepada
    Njak
  meaning_en: njak Gam, Njak Mohamad. Women of hoeléebalang's, not of nobility, are addressed to Njak
  meaning_nl: Njak Gam, Njak Mohamad. Vrouwen, van hoeléebalang's, niet van adel zijnde, spreekt men met
    Njak aan
- meaning_id: dari bangsawan dengan Tjoet1
  meaning_en: of nobility with Tjoet Njak
  meaning_nl: van adel zijnde, met Tjoet Njak
- meaning_id: gadis-gadis bangsawan juga ditangani dengan cara ini
  meaning_en: girls of nobility are also addressed in this way
  meaning_nl: ook meisjes van adel worden op die wijze aangesproken
