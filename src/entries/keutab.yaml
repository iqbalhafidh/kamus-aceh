headword: keutab
jawi: ''
alt_spelling:
- geutab
- v
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis gelang tangan, berbentuk lebar dan berukiran indah, terdiri dari dua bahagian yang
    dihubungkan dengan sendi-sendi, pucôk reubông
  meaning_en: a kind of bracelet hand, broad and finely carved, consisting of two parts joined by hinges,
    bamboo shoot tip
- meaning_id: mengeringkan (air di badan dengan kain)
  meaning_en: to dry up (water at body with cloth)
- meaning_id: bunyi umpamanya letusan peluru dari kejautah, bunyi kayu yang patah
  meaning_en: the sound of gunfire in the distance, the sound of wood breaking
examples:
- aceh: ta keutab badan bak tho
  jawi: ''
  id: Keringkanlah badan Anda sampai kering
  en: Dry your body thoroughly
- aceh: ji keutab ie bak badan
  jawi: ''
  id: Ia mengeringkan air di badannya
  en: He dries the water off his body
- aceh: meu keutab
  jawi: ''
  id: dikeringkan, tegang, ketat (terutama keadaan pakaian di badan)
  en: dried; taut, tight, especially of clothing on the body
- aceh: bajèe lòn meu keutab that
  jawi: ''
  id: Baju saya sangat ketat
  en: My shirt is very tight
- aceh: jisawak ija meu keutab that
  jawi: ''
  id: Ia mengenakan selendangnya sangat ketat
  en: She wears her shawl very tight
- aceh: jisanggoi ok 'oh meu keutab
  jawi: ''
  id: Ia menyanggul rambutnya sangat tegang
  en: She ties her hair up very tightly
- aceh: pat salèh su seunapang meu keutab bunoe
  jawi: ''
  id: '? Di manakah terjadinya bunyi letusan peluru senapan tadi?'
  en: Where did that gunshot just now come from?
etymology: ''
related_words:
- keutieb
- teutap
- keutab-keutub
