  jawi: ''
  id: mendung yg hilang kembali tanpa turun hujan
  en: ''
- aceh: tak reudok
  jawi: ''
  id: (hrf) menetak mendung, maksudnya membual tanpa berbuat apa-apa
  en: ''
- aceh: meung bruek teugom h.an èk tabuka, tajak tak reudok keu deh!
