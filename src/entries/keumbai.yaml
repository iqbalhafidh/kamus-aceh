headword: keumbai
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: tampak menyenangkan (umpamanya anak kecil)
  meaning_en: visible happy (for example child small)
examples:
- aceh: that aneuk nyan, ek galakteu
  jawi: ''
  id: Anak kecil itu tampak sangat menyenangkan
  en: That little child looks very sweet
- aceh: bundi
  jawi: ''
  id: benda-benda yg diperbuat dari guntingan kertas dengan berbagai-bagai warna yg digantungkan di atas
    ayunan anak kecil supaya ia tenang
  en: objects cut from coloured paper hung above a child's cradle to keep it quiet
- aceh: eungkot keumbai
  jawi: ''
  id: ikan-ikanan berisi kapok yang digantungkan sebagai hiasan di pintu rumah (utk itu biasanya dipergunakan
    eungkot lubiem)
  en: kapok-stuffed fish shapes hung as ornaments at the house door
etymology: ''
