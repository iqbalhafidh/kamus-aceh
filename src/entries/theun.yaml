  id: menahan hati, bersabar
  en: to hold back heart, patient
- aceh: napsu, menahan nafsu, meu theun, bertahan, tertahan, ditahan, melakukan theun
  jawi: ''
  id: sedang menahan
  en: in the midst of to hold back
- aceh: meu theun aneuk
  jawi: ''
  id: tertahan anak ketika melahirkan
  en: held back child when born
