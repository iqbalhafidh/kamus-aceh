part_of_speech: v
definitions:
- meaning_id: membungkuk jika memungut sesuatu dari tanah, bersembunyi di belakang sesuatu atau mengintai
    seseorang, mengintai dalam sikap membungkuk
  meaning_en: to stoop when picking something off the ground, to hide behind something or spy on someone,
    to spy while crouching
examples:
- aceh: ji nueb musôh
  jawi: ''
  id: Ia mengintai musuh
  en: he to spy on enemy
- aceh: meu nueb, melakukan nueb
  jawi: ''
  id: dl sikap membungkuk
  en: ''
- aceh: ji-jak pilêh meu nueb nueb
  jawi: ''
  id: Ia berjalan terbungkuk-bungkuk dan lambat-lambat sambil memilih sesuatu
  en: ''
- aceh: peu nueb
  jawi: ''
  id: menyuruh bungkuk
  en: to order stooped
