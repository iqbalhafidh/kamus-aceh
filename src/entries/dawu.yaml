definitions:
- meaning_id: menarik tali atau kemudi keluar dari air, jika kedua terdiri dari dayung panjang, untuk
    menggantung mereka di tempat-tempat diproduksi untuk tujuan itu
  meaning_en: pulling the straps or the rudder out of the water, if the latter consists of a long oar,
    to hang them in the places manufactured for that purpose
  meaning_nl: het uit het water trekken van de riemen of het roer, indien het laatste uit een lange roeispaan
    bestaat, om ze in de daarvoor vervaardigde plaatsen op te hangen
