- meaning_id: tjéré béré, menyebar dimana-mana béré sendiri adalah kata tanpa makna
  meaning_en: tjéré béré, spread everywhere. béré is in itself a word without meaning
  meaning_nl: tjéré béré, overal verspreid. Béré is op zich zelf een woord zonder beteekenis
