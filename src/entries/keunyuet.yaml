headword: keunyuet
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: mengisut, mengerut sehingga mengecil (umpamanya buah-buahan atau daun-daunan, jari-jari
    yang terlalu lama berada dalam air dingin), mengecut (umpamanya lintah), meromok (karena takut)
  meaning_en: to shift along, to shrivel and shrink, as fruit or leaves, fingers left too long in cold
    water, to contract, as a leech, to crouch down in fear
examples:
- aceh: gata 'oh trôih u keue teungku, keunyuet lagèe lintah geunong ie bakong
  jawi: ''
  id: Jika sampai di hadapan teungku, Anda mengecut spt lintah yg dibubuhi air tembakau
  en: Before the teungku you shrink like a leech sprinkled with tobacco water
- aceh: peu keunyuet
  jawi: ''
  id: menyuruh atau membiarkan meromok, dsb
  en: to make or let someone crouch
- aceh: bèk tapeu keunyuet on geulundong lam uroe, h'an lèt jipajôh lè kamèng
  jawi: ''
  id: Anda jangan membiarkan daun kuda-kuda mengisut di panas matahari, kambing-kambing tidak mau memakannya
  en: Do not let the fodder leaves shrivel in the sun, the goats will not eat them
etymology: ''
