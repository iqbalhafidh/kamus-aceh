  meaning_en: the hairy fibrous substance of the arén-palm of which one produces in Pedir copias, called
    copia djoengka djoek Synonymous with riman
  meaning_nl: de haarachtige vezelachtige zelfstandigheid van de arén-palm waarvan men in Pedir kopia's
    vervaardigt, die kopia djoengka djoek heeten. Synoniem met riman
