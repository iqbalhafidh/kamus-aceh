definitions:
- meaning_id: "tidak mau berkata-kata dng orang lain krn tidak menyukainya, tidak mempardulikan, menganggap enteng seseorang, tidak mau menjawab pertanyaan seseorang, marah secara diam-diam, merajuk: ka padum uroe ji\n\n\n\n — lôn, h'an jimarit ngon lôn, Sudah beberapa hari ia tidak memperdulikan saya dan tidak bercakap-cakap dng saya"
  meaning_en: 'not wanting to talk to someone because of dislike, ignoring, treating someone lightly, refusing to answer someone''s question, silently angry, sulking: ka padum uroe ji — lôn, h''an jimarit ngon lôn, He hasn''t spoken to me for several days'
