part_of_speech: v
definitions:
- meaning_id: mencari, berusaha mencari atau memperoleh sesuatu, melacak
  meaning_en: to seek, to strive to find or obtain something, to trace
examples:
- aceh: h'an tom mon mita tima
  jawi: ''
  id: tidak pernah (terjadi bahwa) sumur mencari timba (pb) Tak pernah pihak wanita meminang laki-laki
    krn menurut adat kebiasaan laki-laki lah yg meminang wanita
  en: ''
- aceh: cabeueng ji mita bak, aneuk rakyat ji mita raja
  jawi: ''
  id: cabang mencari (=menopang) batang, rakyat mencari (=membantu) raja (pb)
  en: ''
- aceh: awé
  jawi: ''
  id: mencari atau mengumpulkan rotan dl hutn
  en: ''
- aceh: pèng
  jawi: ''
  id: mencari nafkah, mencari uang, meminjam uang pd seseorang
  en: ''
- aceh: raseuki
  jawi: ''
  id: mencari rezeki atau nafkah
  en: ''
- aceh: pancuri nyang ék u rumoh inong balè beuklam teungoh ji mita lé plisi
  jawi: ''
  id: Polisi sedang melacak pencuri yg menaiki rumah janda tadi malam
  en: ''
- aceh: mumita, melakukan mta
  jawi: ''
  id: sedang mencuri sesuatu
  en: in the midst of to steal something
- aceh: lôn jak mumita jeueb-jeueb gampông
  jawi: ''
  id: Saya mencari nafkah ke tiap-tiap kampung
  en: ''
