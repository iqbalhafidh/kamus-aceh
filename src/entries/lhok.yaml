headword: lhôk
jawi: ''
alt_spelling:
- lôk
- lhok
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menyengkarutkan, menaruh tangan ke leher atau tali ke leher hewan
  meaning_en: to tangle, to put a hand or a rope round an animal's neck
- meaning_id: menganyam (umpamanya pembuatan keranjang), melipat (umpamanya tangan)
  meaning_en: to plait (for example make basket), to fold (for example hand)
- meaning_id: dedak padi
  meaning_en: rice bran
examples:
- aceh: jaroe bak takue lôn
  jawi: ''
  id: sengkarutlah tangan Anda ke leher saya
  en: ''
- aceh: ta lhôk taloe bak takue leumo
  jawi: ''
  id: sengkarutlah tali ke leher sapi
  en: ''
- aceh: lagée ija lhôk
  jawi: ''
  id: irama menyengkarutkan kain
  en: rhythm to tangle cloth
- aceh: datok Bantan cit ka teuturi, mate bak jeungki bak jak mita lhok
  jawi: ''
  id: Datuk Bantan memang sudah terkenal. Ia mati pd jeungki krn mencari dedak padi
  en: 'Datuk Bantan is famous indeed: he died at the rice pounder looking for bran'
- aceh: meu lhok
  jawi: ''
  id: berdedak, bercampur dedak
  en: ''
- aceh: peu lhok
  jawi: ''
  id: dibubuhi dedak
  en: ''
