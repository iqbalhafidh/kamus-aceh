headword: '''eui'
jawi: ائوي
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: 'merangkak, menjalar, menular: aneuk lôn jeunoe ka jeuet ji —, Sekarang anak saya sudah dapat merangkak'
  meaning_en: 'crawling, spreading, contagious: my child can now —, My child can now crawl'
  examples:
  - aceh: bak timon nyeo ka ji
    jawi: ''
    id: keunoe ateueng, Tanaman mentimun ini sudah menjalar ke atas pematang
    en: keunoe ateueng, The cucumber plant has already climbed onto the embankment
  - aceh: "buya ji — u darat, Buaya merangkak ke darat. gata bèk toe toe ngon lôn, peunyakét gata ji — bak lôn, Anda jangan dekat-dekat kapd saya, penyakit Anda akan menular kpd saya → jangkét, ék\n meu"
    jawi: ''
    id: sedang melakukan pekerjaan merangkak
    en: ''
  - aceh: ka thèe meu
    jawi: ''
    id: Ia sudah dapat merangkak
    en: He can already crawl
  - aceh: pèu
    jawi: ''
    id: membiarkan merangkak
    en: ''
  - aceh: "kapeu — adékkeu, Biarkanlah adikmu merangkak. → lata\n 'cuk'euk suara tiruan orang gagap: meu"
    jawi: ''
    id: menggagap
    en: to stutter
  - aceh: bèk kamarit meu
    jawi: ''
    id: Janganlah engkau berbicara spt orang gagap
    en: ''
  - aceh: peu
    jawi: ''
    id: 'dng sengaja menggagap → gagap eum sisipan kata kerja: ceumangkôi, sedang mencangkul (dr kata dasar cangkôi)'
    en: ''
- meaning_id: keumawé, sedang mengail (dr kata dasar kawé)
  meaning_en: morning, fishing (from the root word kawé)
  examples: []
