definitions:
- meaning_id: pengalas, penopang, (umpamanya sebuah balok yang diletakkan di bawah sesuatu untuk memudahkan
    pemindahan atau untuk melepaskan dari tempat seperti di bawah perahu)
  meaning_en: an underlay, prop, as a beam placed under something to ease moving it or to free it, as
    under a boat
examples:
