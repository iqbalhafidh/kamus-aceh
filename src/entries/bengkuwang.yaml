part_of_speech: n
definitions:
- meaning_id: nama dari dua jenis tanaman. daun dari satu spesies digunakan untuk memproduksi toedoengs
    (penutup kepala), sementara spesies lain memproduksi tabung (obi) yang dapat dimakan
  meaning_en: name of two types of crops. The leaves of one species are used for the manufacture of toedoengs
    (head lids), while the other species produces edible tubers (obi)
  meaning_nl: naam van twee soorten van gewassen. De bladeren van de eene soort worden tot het vervaardigen
    van toedoengs (hoofddeksels) gebezigd, terwijl de andere soort eetbare knollen (obi) oplevert
