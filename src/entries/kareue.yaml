definitions:
- meaning_id: menarik, menggulung (umpamanya tali layangan, tali sauh)
  meaning_en: to pull, to roll up for example rope kite, rope anchor
examples:
- aceh: taloe glayang
  jawi: ''
  id: menggulung tali layangan
  en: to roll up rope kite
- aceh: tarèk layeue kareue saòh, ulèe tabòh barat daya
  jawi: ''
  id: angkatlah layar dan gulunglah tali sauh, kemudian arahkanlah haluan ke barat daya
  en: hoist the sail and coil the anchor rope, then set the bow to the south-west
- aceh: Meukareue, teukareue
  jawi: ''
  id: digulung
  en: rolled up
- aceh: peukareue
  jawi: ''
  id: menyuruh gulung
  en: to have something rolled up
