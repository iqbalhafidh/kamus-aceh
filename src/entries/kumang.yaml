ipa: ''
part_of_speech: a
definitions:
- meaning_id: (arti dasarnya)
  meaning_en: its basic sense
examples:
- aceh: meu keukumang (dl hik) = meu kumang kumang
  jawi: ''
  id: 'meliputi seluruh ruang tertentu, menutupi seluruhnya, (biasanya: keadaan orang ramai yg sedang
    bergerak atau berdiri), menggermut, mengeriap, menyemut (ump debu, asap), menyebar ke mana-mana (ump
    cahaya, bunyi), berhenti (ump genangan yg tidak bergerak airnya), berputar-putar ke sekelilingnya
    (ump orang orang yg sedang bertemput), berputar putar, melayang-layang, berayun-ayun'
  en: ''
- aceh: rakyat meu kumang kumang di teungoh blang
  jawi: ''
  id: rakyat menggermut di tengah padang
  en: ''
- aceh: boh beudé meukumang
  jawi: ''
  id: peluru senapan bertaburan ke mana-mana
  en: ''
- aceh: jibeudoih dhôi meu kumang
  jawi: ''
  id: debu-debu berterbangan
  en: dusts to fly
- aceh: asap meu kumang peunoh kuta
  jawi: ''
  id: asap mengepul-ngepul memenuhi kubu pertahanan
  en: smoke billowed and filled the stockade
- aceh: cahya meu kumang lam atana
  jawi: ''
  id: cahaya bersinar-sinar dl istana
  en: light shone throughout the palace
- aceh: darah meu kumang ban ie raya
  jawi: ''
  id: daerah bergelimpang laksana air bah
  en: the district lay strewn as by a flood
