part_of_speech: n
definitions:
- meaning_id: kalam, perkataan Tuhan (dalam sajak disebut kaleuem)
  meaning_en: pen, the word of God, called kaleuem in verse
- meaning_id: kalam, pena tulis (terbuat dari lidi enau), (dalam kitab-kitab agama) kemaluan laki-laki
  meaning_en: pen, a writing pen made of palm rib, ashamed mans (in books religion)
examples:
