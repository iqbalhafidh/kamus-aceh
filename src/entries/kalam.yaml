part_of_speech: n
definitions:
- meaning_id: kalam, perkataan Tuhan (dalam sajak disebut kaleuem)
  meaning_en: pen, the word of God, called kaleuem in verse
- meaning_id: kalam, pena tulis (terbuat dari lidi enau), (dalam kitab-kitab agama) kemaluan laki-laki
  meaning_en: pen, a writing pen made of palm rib, ashamed mans (in books religion)
- meaning_id: 'sebenarnya:'
  meaning_en: '[actually] pen'
  meaning_nl: '[eigenl. قلم] pen'
- meaning_id: kalam poerih, sebuah pena dari biji-bijian dari telapak tangan
  meaning_en: kalam poerih, a pen of the grain of an aren palm
  meaning_nl: kalam poerih, een pen van de nerf van een arên-palm
- meaning_id: kalam bēsoi, pena baja
  meaning_en: kalam bēsoi, a steel pen
  meaning_nl: kalam bēsoi, een stalen pen
- meaning_id: kalam boelée, kandang angsa
  meaning_en: kalam boelée, goose pen
  meaning_nl: kalam boelée, een ganzenpen
examples:
- aceh: meu kalam
  jawi: ''
  id: berkata-kata
  en: word word
- aceh: bèk neumeu kalam lè malam ka jula
