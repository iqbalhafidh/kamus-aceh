  en: a pen of palm rib
- aceh: bak) reusam
  jawi: ''
  id: kalam terbuat dari pohon reusam
  en: a pen made from the reusam fern
- aceh: eu kalam
  jawi: ''
  id: mempunyai kalam, dengan kalam
  en: to have a pen, with a pen
