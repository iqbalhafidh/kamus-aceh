  jawi: ''
  id: berkata-kata
  en: word word
- aceh: bèk neumeu kalam lè malam ka jula
  jawi: ''
  id: Anda jangan berpanjang kalam lagi, malam sudah larut
  en: Do not prolong your talk, the night is far gone
- aceh: beusoe
  jawi: ''
