part_of_speech: n
definitions:
- meaning_id: tudung
  meaning_en: cover
- meaning_id: sejenis penutup kepala yang berbentuk kerucut terbuat dari daun bengkuang
  meaning_en: ''
- meaning_id: nipah atau upih pinang untuk melindungi diri dari panas matahari dan hujan
  meaning_en: ''
- meaning_id: setumpuk lumpur yang berbentuk kerucut
  meaning_en: ''
examples:
- aceh: seutuek
  jawi: ''
  id: sj tudung besar terbuat dr upih pinang atau nibung
  en: ''
- aceh: taloe tudong
  jawi: ''
  id: tali pengikat bahagian bawah tudung ke dagu
  en: ''
- aceh: pucak tudong
  jawi: ''
  id: puncak tudung, (juga secara kelakar) pu-ting susu wanita
  en: ''
- aceh: bruek tudong
  jawi: ''
  id: sj binatang udang-udangan yg berkulit menyerupai tudung
  en: ''
- aceh: padok uroe
  jawi: ''
  id: Orang lain bernasib spt seekor tiung yg dikurung dl (dan diurus makanannya), saya bernasib spt sebuah
    payung yg dipergunakan utk melindungi diri thd panas matahari
  en: ''
- aceh: 'meu tudong, bertudung, menyerupai tudung, menudungi kepala: di phon lōn meu-tungkat bruek trōih
    an lōn meu-seutuek'
  jawi: ''
  id: sejak saya bertongkat tempurung (=berlutut atau merangkak) sampai saya bertudung upih, (pb) sejak
    saya masih kecil sampai saya tua
  en: ''
- aceh: peu tudong
  jawi: ''
  id: menudung i, melindungi, memayungi
  en: cover, to protect, umbrella
- aceh: ta-peu tudong lon siat
  jawi: ''
  id: Tudungi atau payungilah saya sebentar!
  en: ''
- aceh: teu tudong
  jawi: ''
  id: ditudungi
  en: cover
