definitions:
- meaning_id: kemudi (perahu, kapal)
  meaning_en: rudder boat, ship
examples:
- aceh: beude, popor senapan, keumudoe dong
  jawi: ''
  id: kemudi lepas pd perahu pukat yg menyerupai dayung pan jang di samping buritannya, dipasang dng sebuah
    jerat atau diletakkan pd sebuah balok kemudi, dan dikendalikan sambil berdiri
  en: the loose rudder of a fishing boat, like a long oar beside the stern, fixed with a loop or on a
    rudder block and worked standing
- aceh: duek
  jawi: ''
  id: kemudi pendek yg dikendalikan sambil duduk
  en: a short rudder worked sitting down
- aceh: bak, go keumudoe
