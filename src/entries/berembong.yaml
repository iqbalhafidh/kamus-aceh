headword: berembong
jawi: برمبوغ
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: sebuah tabung tiang, terbuka di satu sisi, untuk menyetrika tiang
  meaning_en: a mast tube, open on one side, to iron the mast
  meaning_nl: een mastkoker, aan ééne zijde open, om den mast te kunnen strijken
- meaning_id: tabung dari basong goverelder pohon di mana pisau dari ayam pertempuran disimpan, untuk
    melindungi mereka dari karat, dan kemudian disebut
  meaning_en: a tube of basong [elder tree] in which the blades of the fighting cocks are stored, to protect
    them from rust, and then called berembong tadjoi
  meaning_nl: een koker van basong [vlierboom] waarin de mesjes der vechthanen worden geborgen, om ze
    tegen roest te beveiligen, en dan genoemd berembong tadjoi
