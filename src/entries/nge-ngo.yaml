headword: ngè-ngo
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melihat ke kiri dan ke kana n atau ke belakang secara liar
  meaning_en: to look wildly left and right or behind
examples:
- aceh: lagee mata pancuri
  jawi: ''
  id: melihat ke kiri dan ke kanan spt mata pencuri yg ketakutan
  en: ''
- aceh: 'beu ngè-ngo mata bacut, kadang-kadang na uleue bak teumpat nyan, Lihatlah ke sana ke mari sedikit,
    kadang-kadang di tempat itu ada ular. ngèng-ngèng a berdengung, (utk suara nyamuk), merengek-rengek:
    bèk ka ngè-ngo keu noe!'
  jawi: ''
  id: Jangan engkau merengek-rengek ke mari
  en: ''
- aceh: meu ngè-ngo
  jawi: ''
  id: berdengung-dengung, merengek rengek
  en: ''
- aceh: su jamok meu ngè-ngo that bak glunyuengteu
  jawi: ''
  id: Suara nyamuk sangat berdengung-dengung di telinga kita
  en: ''
- aceh: bèk tapeu ngè-ngo aneuk miet, tajok saboh!
  jawi: ''
  id: Jangan Anda membiarkan anak-anak merengek-rengek, berilah mereka sebuah!
  en: ''
