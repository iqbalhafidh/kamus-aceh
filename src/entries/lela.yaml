definitions:
- meaning_id: roll atau blok, ditempatkan di bawah sesuatu untuk tetap bebas dari tanah
  meaning_en: roll or block, placed under something to keep it free from the ground
  meaning_nl: rol of blok, die men onder iets plaatst, om het van den grond vrij te houden
- meaning_id: lèla rèdj, kayu atau bambu, yang satu berbaring di jalan kacau, untuk lulus
  meaning_en: lèla rèdj, wood or bamboo, which one lays on a muddled road, to pass
  meaning_nl: lèla rèdj, hout of bamboe, dat men op een bemodderden weg legt, om te kunnen passeeren
