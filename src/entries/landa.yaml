headword: landa
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melanda, melanggar, menyerang, menyerbu (hikayat), bersedia, mencegah, menentang, menahan
  meaning_en: to sweep over, to violate, to attack, to charge (hikayat), ready, to prevent, about, to
    hold back
examples:
- aceh: bèk 'an nan! u laôt apui pi lôn landa
  jawi: ''
  id: Jangankan sejauh itu, ke laut api pun saya bersedia
  en: 'Not only that far: I would go even to a sea of fire'
- aceh: peue nyang ka lôn peugah bèk ta landa
  jawi: ''
  id: '! Anda jangan melanggar apa yg sudah saya katakan!'
  en: Do not go against what I have said!
- aceh: 'Malém Putéh seuôt meunoe: ''umu lhèe uroe bek ta landa ! MP menjawab begini, "Janganlah Anda
    menyerbu selama tiga hari" nyang nyoe surôh beutaseuôh, nyang neutham bèk ta landa'
  jawi: ''
  id: Yg diperintahkan Allah hendaklah Anda junjung tinggi, yg dilarangnya jangan Anda langgar
  en: ''
- aceh: meung tan raja soe taikôt? aga ma karôt hana soelanda
  jawi: ''
  id: Siapakah yg
  en: Who is it that
etymology: ''
