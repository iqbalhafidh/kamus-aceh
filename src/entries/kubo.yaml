definitions:
- meaning_id: berkerumun, berkumpul-kumpul (umpamanya orang banyak), bersesak-sesak, berjejal-jejal
  meaning_en: to swarm, to crowd around, gathering together, as a crowd, crowded together, packed tight
examples:
- aceh: aneuk miet jiék u rumoh 'oh meu kubô saré
  jawi: ''
  id: Anak-anak naik ke rumah sampai berjejal-jelal
  en: The children crowded into the house
- aceh: peu kubô
  jawi: ''
  id: membentuk atau menyuruh bentuk kelompok yg padat, maju berjejal-jejal
  en: ''
- aceh: bèk taék u rumoh tapeu kubô
  jawi: ''
  id: '! Anda jangan naik ke rumah berjejal-jejal'
  en: Do not crowd into the house all at once
