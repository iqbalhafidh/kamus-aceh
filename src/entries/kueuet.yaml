- aceh: pakri êk tamarit siuroe seupôt, hana kueuet babah?
  jawi: ''
  id: Bagaimana Anda dapat berkata-kata sehari suntuk? Tidak pegalkah mulut Anda?
  en: How can you talk all day long? Does your mouth not ache?
- aceh: meukueuet
  jawi: ''
  id: memperoleh perasaan pegal
  en: by feeling stiff
- aceh: bêk bagaih-bagaih tajak, peue takeumeueng meukueuet?
  jawi: ''
  id: Anda jangan berjalan cepat-cepat. Maukah Anda pegal?
  en: Do not walk so fast. Do you want to be stiff?
