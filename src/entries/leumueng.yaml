definitions:
- meaning_id: haribaan
  meaning_en: lap
- meaning_id: pangkaun
  meaning_en: ''
- meaning_id: meletakkan di pangkaun
  meaning_en: to place in the lap
examples:
- aceh: aneuk nyan jiéh bak leumueng maji
  jawi: ''
  id: Anak itu tidur di pangkuan ibunya
  en: The child sleeps in his mother's lap
- aceh: si-ngon, dileumueng
  jawi: ''
  id: lahir sesudahnya (ump dua orang saudara laki-laki atau perempuan kandung yg lahir berturut-turut
    sesudah itu)
  en: ''
- aceh: séedara sileumueng
  jawi: ''
  id: Saudara kandung yg lahir berturut-turut sesudahnya
  en: the full siblings born next after him
- aceh: lon si leumueng ngon jih
  jawi: ''
  id: Saya bersaudara kandung dng dia yg lahir sesudah dia
  en: I am the full sibling born next after him
- aceh: meuleumueng
  jawi: ''
  id: berpangku, dng sesuatu atau seseorang memangku di pangkuan
  en: ''
- aceh: ék tameu leumueng di gata simalam suntôk
  jawi: ''
  id: Dapatkah Anda duduk se malam suntuk dng memangku (ump anak)?
  en: Can you sit all night with a child on your lap?
- aceh: peuleumueng
  jawi: ''
  id: memangku sesuatu dipangkuan sendiri atau
  en: ''
