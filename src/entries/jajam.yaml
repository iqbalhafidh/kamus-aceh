definitions:
- meaning_id: keputusan
  meaning_en: decision
examples:
- aceh: tajak u Meureudu? jajam jajam
  jawi: ''
  id: '! Sudah pastikan Anda ke Meureudu? jajam Pasti!'
  en: Are you certain you are going to Meureudu? Certainly!
- aceh: ka jajam bak até lôn
  jawi: ''
  id: Sudah tetap di hati saya
  en: It is settled in my heart
- aceh: peu jajam
  jawi: ''
  id: menetapkan, memastikan
  en: to fix, to make certain
- aceh: peu jajam até
  jawi: ''
  id: menetapkan
  en: fixed
- aceh: thôn nyoe tapeu jajam bak bit-bit, bèk lè piké wie uneun
  jawi: ''
  id: Tuhan ini hendaklah Anda tetapkan secara bersungguh-sungguh
  en: This you must settle in earnest
