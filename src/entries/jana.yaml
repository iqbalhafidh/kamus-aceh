definitions:
- meaning_id: bencana, gangguan (terutama untuk tanaman padi dan lain-lain)
  meaning_en: calamity, a pest (especially of rice and other crops)
- meaning_id: dikatakan tentang orang yang ditimpa musibah
  meaning_en: said of a person whom misfortune befalls
  meaning_nl: wordt van iemand gezegd, wien een onheil overkomt
- meaning_id: mëdjana Padi, juga mengatakan tentang Padi, ketika tanaman terpengaruh oleh beberapa bencana
    atau penyakit
  meaning_en: mëdjana padi, also said of padi, when the crop is affected by some disaster or disease
  meaning_nl: mëdjana padi, ook gezegd van padi, wanneer het gewas door een of andere ramp of ziekte geteisterd
    wordt
