headword: idan-idan
jawi: ایدن
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: pikun
  meaning_en: senile
- meaning_id: seperti keadaan anak kecil kembali
  meaning_en: like a small child again
- meaning_id: pikun (tentang orang tua)
  meaning_en: senile, in second childhood
  meaning_nl: kindsch (van oude lieden)
examples:
- aceh: ureueng nyang ka tuha idan-idan
  jawi: ''
  id: h'an jeuet tamat narit lé, Orang yg sudah tua pikun, orang itu tidak dapat dipercayai katakatanya
    lagi
  en: A senile old person, whose words can no longer be trusted
- aceh: oreng ka tuha idan-idan han jid tamat narit
  aceh_1889: orêng ka toeha idan-idan han djid tamat narit
  jawi: ''
  id: orang ini sudah tua dan muda, seseorang tidak bisa bergantung pada kata-katanya lagi
  en: this man is old and young, one cannot rely on his words anymore
  nl: die man is reeds oud en kindsch, men kan op zijne woorden niet meer vertrouwen
