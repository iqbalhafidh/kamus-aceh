definitions:
- meaning_id: melihat Tuhan secara rohaniah, melihat secara rohaniah atau dalam pikiran, dengan perhatian
    yang sungguh-sungguh
  meaning_en: to see God spiritually, to see spiritually or in the mind, with earnest attention
examples:
- aceh: putroe marit meucahadah deungon ayahneu
  jawi: ''
  id: Tuan puteri berkata secara sunggu h-sungguh dng ayahandanya
  en: ''
- aceh: ge-unab uroe lôn meucahadah, sang-sang leu-mah lôn kalon droeneu
  jawi: ''
  id: Setiap hari saya merenungkan, seolah-olah saya melihat Anda
  en: every day I to ponder, as if I to see you
