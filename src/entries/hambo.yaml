headword: hambô
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: hambur, semerbak, terurai
  meaning_en: scatter, fragrant, unravelled
examples:
- aceh: pakon ta hambô ôk baranggapat, bunoe lôn teumèe lam-lam bu
  jawi: ''
  id: Mengapa Anda menghamburkan rambut di mana-mana, tadi saya menjumpainya di dl nasi
  en: Why do you scatter hair everywhere? I found some in the rice just now
- aceh: rukônji peuet, taleungo lôn atô, bah lôn hambô meung si-banja
  jawi: ''
  id: Rukunnya empat dengarlah! Saya akan menyebutnya berturut-turut
  en: Its pillars are four, listen! I shall name them in order
- aceh: meu hambô
  jawi: ''
  id: berhamburan
  en: scatter
- aceh: '''oh jiploh ôk meu hambô bèe hana mupeue lé'
  jawi: ''
  id: Ketika ia membuka (sanggul) rambutnya, semerbaklah baunya tak terkira
  en: When she let down her hair, its fragrance spread beyond measure
- aceh: gunong meuhayak kareueng meu hambô, Musa pitahe reubah teuhanta
  jawi: ''
  id: Gunung bergerak-gerak, karang-karang berhamburan, nabi Musa pun terheran-heran dan jatuh ke bumi
    tidak sadarkan diri
  en: The mountain shook, the rocks scattered, and the prophet Moses was astounded and fell senseless
    to the ground
