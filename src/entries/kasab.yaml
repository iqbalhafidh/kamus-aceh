headword: kasab
jawi: كاسب
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: benang logam yang disepuh perak, emas, tembaga, juga dari perak atau emas untuk sesuatu
    yang akan ditenun atau disulam, juga benang emas atau perak
  meaning_en: silver-plated metal thread, gold, copper, also of silver or gold, for something to be woven
    or embroidered, also gold or silver thread
- meaning_id: sebenarnya emas perak atau kawat emas
  meaning_en: '[actually] silver or gold wire'
  meaning_nl: '[eigenl. قصب] zilver- of gouddraad'
