headword: halôih
jawi: ''
alt_spelling:
- halôh
- aloih
ipa: ''
part_of_speech: a
definitions:
- meaning_id: halus, lembut, sopan-santun, pandai sekali, licik
  meaning_en: fine, gentle, courtesy, skilled very, sly
examples:
- aceh: ureueng halôih
  jawi: ''
  id: Orang yg sopan, hantu, roh
  en: A well-mannered person; a ghost, a spirit
- aceh: gobnyan halôih that akai, nyang h'an ek tapiké lé geutanyoe, êk geupiké lé gobnyan
  jawi: ''
  id: Ia seorang yg pandai sekali
  en: He is a very clever man
- aceh: sulêt halôih
  jawi: ''
  id: penipu halus, penipu ulung
  en: a subtle cheat, a consummate swindler
- aceh: barang peue jikheun bèk ta halôih
  jawi: ''
  id: Apa yg dikatakannya janganlah Anda mempedulikannya
  en: Do not pay attention to what he says
- aceh: bèk ta halôih peue nyang salah
  jawi: ''
  id: Janganlah Anda mempedulikan apa yg salah
  en: Do not concern yourself with what is wrong
- aceh: meu halôih
  jawi: ''
  id: menghalus (halôihhalus)kan
  en: to refine, to make fine
- aceh: dalam buet nyan leubèh gèt tameu halôih ngon teungku dilèe, peue nyang geukheun taseutèt
  jawi: ''
  id: Dl urusan itu lebih baik Anda merundingkan dng teungku dahulu, apa yg dikatakannya Anda ikuti
  en: In that affair you had better consult the teungku first and follow what he says
- aceh: sabè keu-droe-droe bèk tamue halôih
  jawi: ''
  id: Janganlah Anda ambil pusing thd sesama kita
  en: Do not trouble yourself over our own people
- aceh: peu halôih
  jawi: ''
  id: menghaluskan
  en: fine
