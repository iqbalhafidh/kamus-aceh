part_of_speech: ''
definitions:
- meaning_id: menginjak-injak kaki, seperti pedang Aceh c dong, ruang penyimpanan pada umumnya, gudang
    atau gudang c gedoek, bergulir suara apapun, seperti gelombang sinonim dengan tagor c gedoembak, sejenis
    tamborin kecil
  meaning_en: stomping with the feet. >C gedoebang, a kind of Aceh's sword. C dong, storage space in general,
    a warehouse or warehouse. C gedoek, rolling of any sound, like waves Synonym with tagor. C gedoembak,
    a kind of small tambourine
  meaning_nl: stampen met de voeten. گُيُيُ>C gêdoebang, een soort van Atjehsch zwaard. گُيُيُC gêdong,
    bergplaats in 't algemeen, een pakhuis of magazijn. گُيُيُC gêdoek, rollen van eenig geluid, zoo als
    van golven. Synoniem met tagor. گُيُيُC gêdoembak, een soort van kleine tamboerijn
