definitions:
- meaning_id: menyembelih hewan dan lain-lain dan makan bersama-sama di alam terbuka
  meaning_en: ''
- meaning_id: pergi pada parade atau pergi ke suatu tempat dengan banyak untuk mengambil bagian dalam
    pesta
  meaning_en: go on a parade or go somewhere with many to take part in a feast
  meaning_nl: zich in optocht of met zijn velen ergens heen begeven om aan een feestmaal deel te nemen
