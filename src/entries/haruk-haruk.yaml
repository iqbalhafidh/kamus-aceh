definitions:
- meaning_id: bambu diperkuat, tombak bambu atau tombak. secara kiasan juga digunakan untuk menusuk, yang
    dirasakan di perut dalam kasus nyeri perut
  meaning_en: a reinforced bamboo, a bamboo spear or lance. Figuratively also used of stabbing, which
    is felt in the abdomen in case of abdominal pain
  meaning_nl: een aangescherpte bamboe, een bamboezen speer of lans. Figuurlijk ook gebezigd van steken,
    die men in den buik gevoelt bij buikpijn
