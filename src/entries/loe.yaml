examples:
- aceh: sikin nyoe loe that, h'an jitém pumajoh
  jawi: ''
  id: Pisau ini sangat majal. Ia tidak mau makan. (= Ia tidak dapat dipergunakan utk memotong sesuatu)
  en: This knife is very blunt; it will not bite, it cannot cut anything
- aceh: biek akai loe
  jawi: ''
  id: Orang yg tumpul pikirannya
  en: a person of dull wit
- aceh: bek tapeuloe sikin tatak baranggapeue
  jawi: ''
  id: Anda jangan memajalkan pisau dng menetakkan apa saja
  en: Do not blunt the knife by hacking at everything
- aceh: meu-loeloe(loe) a
  jawi: ''
  id: bengap-bengap, bersuara tidak jelas, bersuara gagap
  en: ''
- aceh: suji meuloe loe that, hana meung tatupeue peue nyang jipeugah
  jawi: ''
  id: Suaranya tidak jelas sama sekali, kita tidak tahu apa yg diucapkannya
  en: His voice is quite indistinct; we cannot tell what he says
