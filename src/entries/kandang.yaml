headword: kandang
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: lingkungan (umpamanya di sekeliling matahari atau bulan), kuburan, pusara (raja-raja atau
    orang keramat)
  meaning_en: surroundings (for example at surrounding sun or month), grave, grave (kings or person holy)
examples:
- aceh: buleuen, kandang mata uroe
  jawi: ''
  id: lingkungan cahaya di sekeliling bulan, matahari, (pertanda akan tibanya musim kering)
  en: a halo round the moon or sun, a sign that the dry season is coming
- aceh: dua blaih
  jawi: ''
  id: '''pusara dua belas'' = kuburan raja-raja Aceh yg pertama di Banda Aceh (sekarang) dl lingkungan
    sultan Aceh dahulu'
  en: '''the twelve tombs'' = the graves of the earliest Acehnese kings at Banda Aceh, within the former
    sultan''s precinct'
- aceh: meuih
  jawi: ''
  id: pusara emas Putroe Phang, (puteri Pahang) permaisuri raja Meukuta Alam yg memerintah di Aceh dr
    tahun 1607 kandang 1636 M, letaknya sekarang tidak diketahui lagi
  en: the golden tomb of Putroe Phang, the Pahang princess, consort of Iskandar Muda who ruled Aceh from
    1607 to 1636; its site is now unknown
- aceh: poteu
  jawi: ''
  id: pusara raja-raja
  en: grave kings
- aceh: poteu nyang ka u kandang
  jawi: ''
  id: hrf raja kita yg telah pergi ke kandang, maksudnya almarhum raja kita
  en: (literally) our king who has gone to the enclosure, meaning our late king
- aceh: Teungku Anjông, pusara teungku Anjông
  jawi: ''
  id: kandang
  en: pen
- aceh: meu kandang
  jawi: ''
  id: dng kandang, dikeliling
  en: with a pen, enclosed
- aceh: mau kandang mata
  jawi: ''
  id: bertanda biru di sekeliling mata, (ump diakibatkan oleh penyakit mencret)
  en: with blue rings round the eyes, as from dysentery
