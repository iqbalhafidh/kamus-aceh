headword: hiram
jawi: هیرم
alt_spelling:
- iram
ipa: ''
part_of_speech: a
definitions:
- meaning_id: muram, suram, marah
  meaning_en: gloomy, downcast, dim, dull, angry
- meaning_id: terlihat marah, terlihat gelap, terlihat terlibat
  meaning_en: look angry, look dark, look involved
  meaning_nl: er boos uitzien, er donker uitzien, er betrokken uitzien
examples:
- aceh: pakon gata hiram that muka uroe nyoe, peue sabab nyang jeuet keu beungêh?
  jawi: ''
  id: Mengapa muka Anda sangat muram hari ini? Apakah sebabnya sehingga Anda marah?
  en: Why is your face so gloomy today? What has made you angry?
- aceh: kasam
  jawi: ''
  id: sangat marah
  en: very angry
- aceh: meu hiram (hiramkasam)
  jawi: ''
  id: saling bermarahan
  en: to be angry with one another
- aceh: lôn na meu hiram kasam bacut ngon si Pulan
  jawi: ''
  id: Saya sedikit bermarahan dng si Polan
  en: I am a little at odds with so-and-so
- aceh: bêk meu hiram kasam ngon sêedara
  jawi: ''
  id: Janganlah Anda bermarahan sesama saudara
  en: Do not quarrel with your own kin
- aceh: peu hiram (hiramkasam)
  jawi: ''
  id: membuat marah
  en: to make angry
- aceh: gata nyang peu hiram gob, tamarit baranggapeue
  jawi: ''
  id: Andalah yg membuat orang marah krn kata-kata Anda yg tidak layak
  en: It is you who anger people with your unseemly words
- aceh: pakon gata hiram tehat muka oroi nyoi
  aceh_1889: pakon gata hiram tèhat moeka oroi njoi
  jawi: ''
  id: kenapa kau terlihat begitu terlibat hari ini?
  en: why do you look so involved today?
  nl: waarom ziet ge er heden zoo betrokken uit?
