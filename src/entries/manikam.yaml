definitions:
- meaning_id: manikam, permata merah, batu delima, mani bibit manusia yang sesungguhnya mengandung lembaga
    penghidupan serta mpnentukan watak manusia
  meaning_en: gem, eye red, ruby, semen, the human seed said to carry the germ of life and to determine
    character
- meaning_id: ruby
  meaning_en: ruby
  meaning_nl: robijn
- meaning_id: lihat manikam
  meaning_en: see manikam
  meaning_nl: zie مانكم manikam
examples:
- aceh: manikam ji hana get
  jawi: ''
  id: Manikamnya tidak baik. wadi, madi, mani, manikam, keempat jenis bibit manusia
  en: His seed is not good; the four kinds of human seed
