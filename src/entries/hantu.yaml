  en: water ghost
- aceh: bèk kapeuek ie teungoh sinja, jiék hantu ie
  jawi: ''
  id: Jangan engkau membawa air ke rumah ketika hari senja, (nanti) masuk hantu air
  en: Do not carry water into the house at dusk, or the water spirit will enter
