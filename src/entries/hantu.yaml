ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis hantu jahat yang menimbulkan penyakit
  meaning_en: a kind of malevolent spirit that causes illness
- meaning_id: roh jahat, hantu, roh hantu
  meaning_en: evil spirit, ghost, ghostly spirit
  meaning_nl: booze geest, spook, spokende geest
examples:
- aceh: buru
  jawi: ''
  id: sj hantu yg menimbulkan penyakét droe
  en: a kind of spirit that causes the penyakét droe illness
- aceh: jih teukeunong bak hantu buru
  jawi: ''
  id: Ia dihinggapi penyakit hantu buru
  en: He was struck by the hantu buru sickness
- aceh: ie
  jawi: ''
  id: hantu air
  en: water ghost
- aceh: bèk kapeuek ie teungoh sinja, jiék hantu ie
  jawi: ''
  id: Jangan engkau membawa air ke rumah ketika hari senja, (nanti) masuk hantu air
  en: Do not carry water into the house at dusk, or the water spirit will enter
- aceh: burong hantu
  jawi: ''
  id: (dl hik), burung hantu
  en: in hikayat, bird ghost
