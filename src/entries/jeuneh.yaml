headword: jeunèh
jawi: ''
alt_spelling:
- jinèh
ipa: ''
part_of_speech: n
definitions:
- meaning_id: jenis, keturunan, hubungan
  meaning_en: kind, descend, connection
examples:
- aceh: peue jeunèh kèe ngon jih nyan!
  jawi: ''
  id: Apa hubunganku dng dia! Apa urusanku dng dia!
  en: What have I to do with him! What business is he of mine!
- aceh: kah panè jeunèh kah, alèh jeunèh nibak Kleng
  jawi: ''
  id: Engkau keturunan siapa! barangkali keturunan Keling
  en: Whose descendant are you! Of Kling descent, perhaps
- aceh: si jeunèh
  jawi: ''
  id: berbagai-bagai jenis
  en: all kinds of kind
- aceh: si jeunèh rupa, si jeunèh ban, si jeunèh peue
  jawi: ''
  id: (dl hik) berbagai-bagai jenis
  en: all kinds of kind (in hikayat)
- aceh: si jeunèh èleumèe na bak gobnyan
  jawi: ''
  id: Ia memiliki berbagai-bagai ilmu pengetahuan
  en: He possesses all kinds of learning
- aceh: meu jeunèh (meu jeunèh), berjenis-jenis, bermacam-macam, bukon meu jeunèh
  jawi: ''
  id: (dl hik), tidak biasa luar biasa
  en: (in hikayat), unusual, extraordinary
- aceh: ureueng kaya jameun bukan meu jeunèh, keunaleueng tamèh batèe Meuraksa
  jawi: ''
  id: Orang-orang kaya pd masa dahulu keadaannya luar biasa, penggalang tiang-tiang rumah mereka terbuat
    dr batu-batu ukiran buatan Meuraksa
  en: The rich of former times lived extraordinarily; the bases of their house posts were of carved stone
    made at Meuraksa
