headword: tumpang
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: menopang, menyokong, topang, sokong
  meaning_en: to prop up, to support, to prop, prop
- meaning_id: tabung bambu tempat mengisi mesiu cukup untuk sebuah peluru
  meaning_en: ''
examples:
- aceh: ta tumpang bak pisang, rab reubah
  jawi: ''
  id: Topanglah pohon pisang itu, ia hampir tumbang
  en: ''
- aceh: gusi
  jawi: ''
  id: (hrf) menopang gusi, memasukkan tembakau di antara bibir bawah dan gigi, mengulum tembakau
  en: ''
- aceh: gusi mantong sikai bakong, utk menopang gusinya saja ia memelukan se kai
  jawi: ''
  id: tembakau
  en: tobacco
- aceh: keueng
  jawi: ''
  id: menopang dagu (dng tangan)
  en: to prop up the chin (with hand)
- aceh: keueng
  jawi: ''
  id: tolak atau kecak pinggang, memegang sisi lambung (krn kesakitan)
  en: ''
- aceh: jijak ji tumpang atau meu-keueng
  jawi: ''
  id: Ia berjalan dng menolak pinggang
  en: ''
- aceh: ulee
  jawi: ''
  id: menopang kepala (krn kesedihan atau kesusahan)
  en: to prop up head (because sad or difficult)
- aceh: walêe langet srot u bumoe, ngon ulêe ulon tumpang
  jawi: ''
  id: Walaupun langit jatuh ke bumi saya akan menopangnya dng kepala saya
  en: ''
- aceh: beunteueng
  jawi: ''
  id: nama sj hulu pedang yg bercabang, (hrf) penopang yg melintang, padang yg berhulu tumpang
  en: ''
- aceh: layeue tumpang
  jawi: ''
  id: layar topang
  en: a topsail
- aceh: meu tumpang
  jawi: ''
  id: ditopang, disokong
  en: to prop, prop
- aceh: kayêe nyan meu tumpang, meung hana takoh bakjih hana rot u baroh
  jawi: ''
  id: Cabang kayu itu bertopang (dng sesuatu) jika tidak Anda potong batangnya ia tidak akan jatuh ke
    bawah
  en: ''
- aceh: teu-mumpang, melakukan tumpang, teunumpang
  jawi: ''
  id: yg ditompang, penopang, sokongan, penyangga, (ump simpai rotan di bawah kain anak laki-laki yg baru
    disunatrasukkan sbg penyangga lukanya yg belum sembuh)
  en: ''
