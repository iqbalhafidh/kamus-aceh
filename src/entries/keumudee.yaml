- aceh: Nieh keumudee, uroe bee bui, malam bee asee, biek hana malee
  jawi: ''
  id: Orang Nias pemakan mengkudu, siang hari berbau babi, malam hari berbau anjin (=tidak tahu malu),
    penghinaan
  en: the noni-eating Nias man, smelling of pig by day and of dog by night (= shameless), an insult
- aceh: haji keumudee, gob jak u haji, gobnyan sok bajee, = top ulee (jika dimaksudkan utk wanita), haji
    mengkudu keumudee
