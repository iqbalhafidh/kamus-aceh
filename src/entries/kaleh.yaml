headword: kalèh
jawi: كاليه
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menjawab, menangkis, membelas, beralih arah (untuk angin)
  meaning_en: to answer, to parry, to requite, to shift direction, of the wind
- meaning_id: balas dendam, balas dendam, berbalik dari angin ke sisi yang berlawanan
  meaning_en: revenge, revenge, turn from the wind to the opposite side
  meaning_nl: wedervergelden, weêrwraak nemen, omslaan van den wind naar den tegenovergestelden kant
examples:
- aceh: ka jipoh gata, ta kalèh poh ji sigo
  jawi: ''
  id: Ia telah memukul Anda. Balaslah ia sekali
  en: He struck you. Strike him back once
- aceh: Angen barat jinoe ka ji kalèh
  jawi: ''
  id: kini angin barat telah beralih ke timur
  en: the west wind has now shifted to the east
- aceh: meu kalèh
  jawi: ''
  id: berbalas
  en: to be requited
- aceh: meu kalèh
  jawi: ''
  id: berbalas-balas
  en: to requite one another
- aceh: peu kalèh
  jawi: ''
  id: = kalèh, memindahkan ke tempat yang bertentangan
  en: to move to the opposite place
- aceh: tapeu kalèh bak baho siblah treuk!
  jawi: ''
  id: Pindahkan ke sebelah bahu lagi!
  en: Shift it to the other shoulder!
- aceh: Peu kalèh kè, (pemilik perjudian) setiap hari memungut 1/10 bagian dari kemenangan yang diperoleh
    seorang pemenang, peu kalèh
  jawi: ''
  id: selalu memindah-mindahkan hutang kpd seseorang, yi membayar hutang kpd si A dng meminjam dari si
    B
  en: constantly shifting a debt, paying A by borrowing from B
- aceh: Teu kalèh
  jawi: ''
  id: dijawab, dibalas, dipindahkan, digantikan
  en: answered, requited, moved, replaced
- aceh: ka ji poh gata takaleh poh jeh sigo
  aceh_1889: ka dji-poh gata takalèh poh djèh sigo
  jawi: ''
  id: dia mengalahkanmu, sekarang kau harus membayarnya dengan memukulnya sekali
  en: he beat you, now you have to repay it by hitting him once
  nl: hij heeft u geslagen, nu moet ge het vergelden door hem eenmaal te slaan
