headword: kacōk
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: gacuk
  meaning_en: ''
- meaning_id: yi kelereng
  meaning_en: that is, a marble
- meaning_id: batu
  meaning_en: stone
- meaning_id: biji
  meaning_en: seed
- meaning_id: biasanya berbentuk lebih besar yang dipergunakan sebagai pemukul dalam berbagai-bagai permainan
    kelereng batu
  meaning_en: usually larger, used as the shooter in various games of marbles
- meaning_id: atau biji yang dimiliki oleh masing-masing pihak pemain
  meaning_en: or the counters held by each player
examples:
- aceh: meu kacōk
  jawi: ''
  id: bergacuk atau memiliki kacok kaco, kacho v mengacaukan, mengaduk, mencampurkan (ump berbagai-bagai
    hal atau lauk-pauk yang tidak berhubungan satu dengan yang lain), mengalutkan (ump sesuatu hal dengan
    memfitnah seseorang sehingga tidak tercapai maksudnya), mencampuri urusan orang lain (supaya gagal
    maksudnya)
  en: to stir, mix or jumble together unrelated things; to muddle an affair by slandering someone; to
    meddle in another's business so that it fails
- aceh: jih galak that ji kacōk buet gob
  jawi: ''
  id: Ia suka benar mengacaukan pekerjaan orang lain (supaya gagal). Meu kacōk, dikacaukan, dicampuri,
    peu kacōk = mengacaukan, bēk tapeu kacōk buet lōn, Anda jangan mengacaukan pekerjaan saya
  en: He loves to meddle in others' work so that it fails. Do not meddle with my work
etymology: ''
