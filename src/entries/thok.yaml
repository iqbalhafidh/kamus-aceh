examples:
- aceh: ki
  jawi: ''
  id: menjamah, mengenai, mengganggu
  en: ''
- aceh: bèk ta thok yub lôn eh
  jawi: ''
  id: Janganlah Anda menjolok-jolok (lantai) di bawah saya tidur
  en: ''
- aceh: bèk ta thok boh kayèe, taikat ceunukeh
  jawi: ''
  id: Janganlah Anda menjolok buah-buahan (dng galah), ikatannya pengaitnya (pd galah)
  en: ''
- aceh: bèk ta thok lôn, teungoh lôn mubuet, Jangan Anda mengganggu saya, saya sedang bekerja, bèk ta
    thok geumeuto tanoh, simalam beungoh h'an gadoh bisa
  jawi: ''
  id: Janganlah Anda mengganggu (sarang) tabuhan (jika ia mengantuk) semalam suntuk takkan hilang biasanya
    (pb)
  en: ''
- aceh: peue nyan meu thok di likot rumoh?
  jawi: ''
  id: Apakah (yg terdengar) mengetuk-ngetuk di belakang rumah?
  en: ''
- aceh: ta thok bacut teuk!
  jawi: ''
  id: pukullah lebih dl sedikit (ump paku)
  en: ''
- aceh: 'beusoe thok, besi penokok: meu thok, teu thok'
  jawi: ''
  id: dikeplok atau dipukul lembut-lembut
  en: ''
- aceh: pisang teu thok
  jawi: ''
  id: pisang masak (biasanya pisang abin) yg dikeplok lembut-lembut ke dl santan yg dibubuhi garam sedikit
    dan gula dng mempergunakan pelepah pisang lalu dimakan (kadang-kadang) dng emping, sj makanan yg sangat
    disenangi oleh orang-orang tua
  en: ''
