ipa: ''
part_of_speech: ''
definitions:
- meaning_id: meulanteuen terhalang
  meaning_en: ''
- meaning_id: tertahan (juga dikatakan untuk api yang tidak marak dan rata nyalanya)
  meaning_en: ''
examples:
- aceh: meungnyo meu lanteuen apui, hana saré masak
  jawi: ''
  id: Jika nyala apinya tidak rata, masaknyapun tidak akan sama
  en: If the flame is uneven the cooking will be uneven too
- aceh: meungnyo hana gobnyan di rumoh, bèk meu lanteuen gata, tariwanglé
  jawi: ''
  id: Jika ia tidak berada dirumah, Anda jangan tertahan di sana. Kembalilah segera!
  en: If he is not at home, do not linger there; come back at once
- aceh: uroe meu lanteuen that
  jawi: ''
  id: Hari tidak cerah
  en: The day is not bright
- aceh: peu lanteuen
  jawi: ''
  id: menghalangi, menahan
  en: to obstruct, to hold back
- aceh: bèk trèb lé tapeu lanteuen gobnyan
  jawi: ''
  id: '! Jangan lama-lama Anda menahannya!'
  en: Do not hold it back so long!
