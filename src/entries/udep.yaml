headword: udep
jawi: ''
alt_spelling:
- hudep
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kurang lazim, hidup, dalam keadaan hidup
  meaning_en: less customary, live, while alive
examples:
- aceh: ka maté go-nyan? udep h'an, mantong udep
  jawi: ''
  id: '! Sudah meninggalkan oang itu? udep Tidak, ia masih hidup'
  en: ''
- aceh: neubri keu lôn udep maté
  jawi: ''
  id: Berikanlah kpd saya, hidup atau mati
  en: ''
- aceh: neubri keu lôn udep, 'oh maté pulang keu droeneu
  jawi: ''
  id: Berilah ia dl keadaan hidup kpd saya jika meninggal akan saya kembalikan mayatnya kpd Anda
  en: ''
- aceh: binatang udep dua nanggroe
  jawi: ''
  id: binatang yg hidup pd dua tempat (hrf negeri), amfibi
  en: ''
- aceh: jroh that tanoh lampoih nyan, gêt that udep peunula
  jawi: ''
  id: bagus (= subur) sekali tanah itu, tumbuh-tumbuhan sangat baik hidup (= tumbuh)nya
  en: ''
- aceh: apui h'an jitem udep
  jawi: ''
  id: api tidak mau menyala
  en: ''
- aceh: blah mata uroe udep
  jawi: ''
  id: sebelah matahari terbit atau sebelah timur
  en: ''
- aceh: nyang keukai
  jawi: ''
  id: hidup yg
  en: ''
