ipa: ''
part_of_speech: v
definitions:
- meaning_id: keadaan yang terhampar dari jauh atau dari segenap penjuru, terhampar
  meaning_en: a state of being spread out into the distance or on every side, outspread
- meaning_id: mēhalak, sesuatu yang terlihat dari jauh
  meaning_en: mēhalak, something visible from afar
  meaning_nl: mēhalak, iets, dat van verre zichtbaar is
examples:
- aceh: watèe taèk ateueh meuseujid meu halak ban saboh nang-groe
  jawi: ''
  id: Jika kita naik ke atas mesjid terhamparlah seluruh negeri
  en: If we climb up on the mosque, the whole country lies spread out below
