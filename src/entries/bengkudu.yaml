headword: bêngkoedoe
jawi: بغكونو
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis pohon, jus buah yang digunakan untuk mencuci kepala, sementara jus diperas daun
    mabuk, setelah disaring, melawan formasi limpa. pohon ini juga disebut kemoedée
  meaning_en: a kind of tree, the fruit juice of which is used for washing the head, while the squeezed
    juice of the leaves is drunk, after being sieved, against spleen formation. This tree is also called
    kemoedée
  meaning_nl: een soort van boom, waarvan het vruchtensap voor het wasschen van het hoofd wordt gebezigd,
    terwijl het uitgeperste sap der bladeren, na gezeefd te zijn, tegen opzetting der milt wordt gedronken.
    Deze boom wordt ook kemoedée genoemd
