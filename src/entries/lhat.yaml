  meaning_nl: orëng lhat, worden de zoogenaamde orang laet, genoemd
- meaning_id: lhat juga digunakan dalam arti bajak laut
  meaning_en: lhat is also used in the meaning of pirates
  meaning_nl: lhat wordt ook in de beteekenis van zeeroovers gebezigd
