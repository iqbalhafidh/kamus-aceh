headword: lale
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: lalai, lengah, alpa, kurang hati hati
  meaning_en: heedless, inattentive, negligent, less heart heart
examples:
- aceh: bêk lale, tapeulaku lanja
  jawi: ''
  id: Jangan lalai! Berbuatlah cepat!
  en: Do not be slack! Be quick about it!
- aceh: hana lale
  jawi: ''
  id: tidak lalai, tidak henti-hentinya
  en: ''
- aceh: jikab bibi hana lale, jiputa misé hana reuda
  jawi: ''
  id: Krm marah tak henti-hentinya, ia menggigit bibirnya dan tidak reda-redanya memutar kumisnya
  en: In unceasing anger he bit his lip and never stopped twirling his moustache
- aceh: bak buet nyan jih h'an tom lale
  jawi: ''
  id: Dl hal itu dia tidak pernah absen
  en: In that he is never absent
- aceh: mata
  jawi: ''
  id: terus menerus memperhatikan sesuatu
  en: ''
- aceh: mata bak jikalon piasan nyan
  jawi: ''
  id: Matanya terus menerus memperhatikan pertunjukan itu
  en: His eyes never left the performance
- aceh: meu lale
  jawi: ''
  id: bersikap lalai
  en: to behave heedless
- aceh: bek tameu lale lê!
  jawi: ''
  id: Anda jangan bersikap lalai!
  en: Do not be negligent!
- aceh: bak reujang, bêk tameu lale
  jawi: ''
  id: '! Cepatlah, Anda jangan berlama-lama'
  en: Be quick, do not dawdle
- aceh: peu lale
  jawi: ''
  id: melalaikan, mengalapkan, membujuk, lalai melakukan suatu kewajiban, memperlaku kan seseorang secara
    tidak pantas, menyerahkan kpd nasibnya sendiri
  en: ''
- aceh: kapeu lale adékkeu bèk jimoe!
  jawi: ''
  id: Bujuklah adimu supaya ia tidak menangis
  en: Coax your little brother so that he stops crying
- aceh: ureueng binoe nyang kreueh até, geupeu lale lam nuraka
  jawi: ''
  id: Wanita yg keras hatinya akan dibiarkan kpd nasibnya dl neraka
  en: ''
- aceh: raya meukeudroe, adoe h'an jipeu lale, tuha meukeudroe, lakoe h'an jeuet jibôh lagèe
  jawi: ''
  id: (Anak itu) hanya badannya saja yg besar, tetapi tidak dapat membujuk adiknya yg sedang menangis.
    (Wanita itu) hanya umurnya saja yg tua, tetapi tidak dapat mengurus suaminya
  en: The child is big in body only, yet cannot quiet his crying brother; the woman is old in years only,
    yet cannot look after her husband
etymology: ''
