headword: rungkob
jawi: رُوْعَا
alt_spelling:
- rungkueb
ipa: ''
part_of_speech: a
definitions:
- meaning_id: bengkok ke atas dan bertemu sesamanya (tentang tanduk sapi)
  meaning_en: ''
- meaning_id: bertanduk demikian
  meaning_en: horn thus
- meaning_id: melengkung (karena rusak)
  meaning_en: curved (because damaged)
- meaning_id: membengkok
  meaning_en: ''
- meaning_id: rusak
  meaning_en: damaged
examples:
- aceh: lungke rungkob
  jawi: ''
  id: tanduk yg bengkok ke atas dan bertemu sesamanya rungkob rungkom, bd rungkob
  en: ''
- aceh: 'rungkob (tt benda-benda waja, pinggiran benda-benda emas), ki melarat atau
    papa: lom ka rungkob, ka abeh are-uta, hana sapeue na le'
  jawi: ''
  id: Saya sudah melarat, semua harta sudah habis dan tidak ada apa-apa lagi
  en: ''
- aceh: meurungkob
  jawi: ''
  id: membengkokkan, dibengkokkan, menjadi papa
  en: to bend, crooked, to become destitute
