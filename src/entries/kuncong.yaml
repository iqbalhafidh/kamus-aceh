headword: kuncong
jawi: ''
alt_spelling:
- puncong
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kantong yang dijahit dari dua helai kain dan sebagai kain selimut dimasukkan kaki ke dalamnya,
    kantong yang dibentuk dengan mengikatkan ujung-ujung pakaian, bahagian pukat yang berbentuk kantong
  meaning_en: a bag sewn from two cloths, used as a coverlet with the feet inside, a pouch formed by knotting
    the ends of one's clothing, the bag-shaped part of a net
examples:
- aceh: tapeugèt kuncong na mangat tameulimbôt
  jawi: ''
  id: buatlah kantong (spt yg dijelaskan itu) supaya Anda enak berselimut
  en: make the pouch as described so you can wrap yourself comfortably
- aceh: ija gata lhok that meu kuncong
  jawi: ''
  id: Kain Anda dalam sekali kantongnya
  en: Your cloth has a very deep pocket
- aceh: peu kuncong
  jawi: ''
  id: membentuk kantong dl bentuk kuncong
  en: ''
- aceh: tapeu kuncong ija, taboh breueh, Buatlah kantong secara kuncong
  jawi: ''
  id: dan isikan beras ke dalamnya
  en: and put rice inside it
