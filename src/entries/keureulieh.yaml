definitions:
- meaning_id: menyapu minyeuk brok ke mulut anak yang baru lahir (menurut kepercayaan supaya suaranya
    bagus dan tidak mendapat penyakit tenggorokan)
  meaning_en: to smear rancid oil on a newborn's mouth, believed to give a fine voice and ward off throat
    illness
examples:
- aceh: hana geu keureulieh lom
  jawi: ''
  id: (anak itu) belum disapu lagi minyeuk brok ke mulutnya
  en: the child has not yet had rancid oil smeared on its mouth
