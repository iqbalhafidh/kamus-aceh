ipa: ''
part_of_speech: v
definitions:
- meaning_id: meludah
  meaning_en: spittle
examples:
- aceh: ieludah
  jawi: ''
  id: air ludah
  en: water spittle
- aceh: bèk taludah ie babah mirah
  jawi: ''
  id: beran ggapat, Anda jangan membuang ludah merah di mana-mana
  en: ''
- aceh: reunyeun
  jawi: ''
  id: meludah di tangga, yi tekad meninggalkan rumah atau seseorang utk selama-lamanya membeli mati
  en: ''
- aceh: lôn trôn di rumah, aneuk, lôn ludah reunyem, h'an tom dua seun lôn pandang donya
  jawi: ''
  id: Saya turun dr rumah, anakku, dng meludahi tangganya. Saya tidak memandang dunia dua kali
  en: I came down from the house, my child, spitting on its ladder; I do not look upon the world twice
- aceh: h'an tom dua seun lôn teubiet bak ma, h'an tom dua seun mupadang dônya
  jawi: ''
  id: Tidak pernah terjadi bahwa saya dua kali dilahirkan ibu atau dua kali memandang dunia
  en: It has never happened that I was twice born of a mother or twice looked on the world
- aceh: peu-an, ludahan
  jawi: ''
  id: tempat meludah
  en: place spittle
