definitions:
- meaning_id: sekin kawit atau sadip, pisau cukur dengan duri, biasanya melekat pada tongkat untuk menghapus
    daun dari pohon
  meaning_en: sekin kawit or sadip kawit, a razor with a barb, usually attached to a stick to remove leaves
    from trees
  meaning_nl: sêkin kawit of sadip kawit, een mesje met een weêrhaak, gewoonlijk aan een stok bevestigd
    om bladeren van boomen af te halen
- meaning_id: kawit badjée, perhiasan emas dalam bentuk bulan sabit, dikenakan oleh wanita Aceh untuk
    leher
  meaning_en: kawit badjée, a golden ornament in the shape of a crescent moon, worn by the women of Aceh
    for the neck
  meaning_nl: kawit badjée, een gouden versiersel in den vorm van een halve maan, door de Atjehsche vrouwen
    voor aan den hals gedragen
