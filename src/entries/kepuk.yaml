headword: képoek
jawi: كفوق
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: silinder kulit kayu atau bambu untuk penyimpanan beras atau produk lainnya, biasanya ditempatkan
    di bawah rumah Aceh
  meaning_en: hollow cylinder of bark or bamboo for storage of rice or other products, usually placed
    under the Aceh houses
  meaning_nl: holle cylinder van boomschors of bamboe tot opberging van rijst of andere producten, gewoonlijk
    onder de Atjehsche huizen geplaatst
- meaning_id: mengenai sebuah objek dengan tangan datar sinonim dengan tépoek
  meaning_en: hit an object with the flat hand. Synonymize with tépoek
  meaning_nl: met de platte hand op een voorwerp slaan. Synoniem met tépoek
