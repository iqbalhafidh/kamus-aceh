part_of_speech: n
definitions:
- meaning_id: kedidi, sebangsa burung rawa atau ayam-ayaman yang selalu menjungkit-jungkit ekornya dan
    menekan-nekankan kakinya ke tanah
  meaning_en: sandpiper, a kind of marsh bird or rail that constantly bobs its tail and presses its feet
    against the ground
examples:
- aceh: lagèe keudidi hana peucaya atau harap keu bumo
  jawi: ''
  id: spt burung ke didi yg tidak percaya kpd bumi tempat ia berdiri, (dikatakan thd seseorang yg bersikap
    hati-hati secara berlebih-lebihan atau yg selalu mencurigai sesuatu)
  en: like the sandpiper that does not trust the ground it stands on, said of one excessively cautious
    or always suspicious
