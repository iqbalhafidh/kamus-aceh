headword: judi
jawi: جودی
alt_spelling:
- djoedi
ipa: ''
part_of_speech: n
definitions:
- meaning_id: judi, setiap permainan yang meyebabkan orang bertaruh
  meaning_en: gambling, any game that leads people to wager
- meaning_id: disebut semua permainan, taruhan, seorang pemain profesi
  meaning_en: are called all games, bet, a player of profession
  meaning_nl: worden alle spelen genoemd, waarbij ingezet wordt, een speler van beroep
examples:
- aceh: meu judi
  jawi: ''
  id: berjudi, bermain judi
  en: gambling, to play gambling
- aceh: si meu judi
  jawi: ''
  id: pemain judi
  en: a gambler
- aceh: hai, aneuk, bèk tameu judi
  jawi: ''
  id: '! Wahai anak, janganlah engkau berjudi!'
  en: O my son, do not gamble!
- aceh: bangsat biek mejudi
  aceh_1889: bangsat biék médjoedi
  jawi: ''
  id: yang berbuat sewenang-wenang dalam negeri
  en: a sinner of the family of the players
  nl: een nietsdoener van het geslacht der spelers
- aceh: hai anek bek tamejudi
  aceh_1889: hai anék bek tamédjoedi
  jawi: ''
  id: menunggu Anda untuk bermain, anak saya
  en: wait for you to play, my child
  nl: wacht u voor het spelen, mijn kind
