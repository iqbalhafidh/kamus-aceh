headword: hala
jawi: هلا
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: arah
  meaning_en: direction
- meaning_id: tujuan ke arah, memberikan arah untuk sesuatu, wajah atau menghadapi sesuatu
  meaning_en: aim towards, give a direction to something, face or face something
  meaning_nl: zich richten naar, eene richting aan iets geven, zich tegenover of in het gezicht van iets
    bevinden
- meaning_id: mē-hala disa, menuju desa
  meaning_en: mē-hala disa, heading towards a village
  meaning_nl: mē-hala disa, zich naar een dorp richten
examples:
- aceh: nyang hala pinta lōn cit meung bak droeneu
  jawi: ''
  id: Andalah satu-satunya tempat perlindungan saya
  en: You are my only refuge
- aceh: lon ka sisat, hana meung lōn tuho hala lē
  jawi: ''
  id: Saya sudah tersesat dan tidak mengetahui arahnya lagi
  en: I have lost my way and no longer know the direction
- aceh: meu hala, mengarahkan, menuju ke (dl hik)
  jawi: ''
  id: melagukan hala-hala
  en: to chant hala-hala
etymology: ''
related_words:
- got hala-hala
- hélé-hélé
- hahala
dialect_notes: 'Marked (dl hik) in the source: attested in hikayat, the classical Acehnese narrative verse
  register.'
