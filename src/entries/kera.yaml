definitions:
- meaning_id: 'nama umum untuk monyet spesies monyet: ēngkong, monyet, yang dilatih untuk memilih clappers'
  meaning_en: 'common name for monkey. Species of monkeys are: ēngkong, the monkey, which is trained to
    pick clappers'
  meaning_nl: 'algemeene naam voor aap. Soorten van apen zijn: ēngkong, de aap, dien men africht om klappers
    te plukken'
- meaning_id: boēe, monyet ekor panjang
  meaning_en: boēe, the long-tailed monkey
  meaning_nl: boēe, de langstaartige aap
- meaning_id: siamang, aeēk raffa
  meaning_en: siamang, aeēk raffa
  meaning_nl: siamang, aeēk rangka
- meaning_id: hanya dalam conjunction dengan si digunakan sebagai countword komposit dan kemudian berarti
    sepotong wads baris
  meaning_en: only in conjunction with si used as a composite countword and then means a piece of line
    wads
  meaning_nl: alleen in verbinding met si voorkomende als samengesteld telwoord en beteekent dan een stuk
    van lijnwaden
- meaning_id: kerak gantang, bagian dari bambu
  meaning_en: kerak gantang, section of a bamboo
  meaning_nl: kêrak gantang, geleding van een bamboe
