definitions:
- meaning_id: nilam, sejenis tanaman yang daunnya mengandung minyak wangi
  meaning_en: patchouli, a plant whose leaves yield a fragrant oil
- meaning_id: batu nilam (dalam hikayat)
  meaning_en: stone patchouli (in hikayat)
- meaning_id: kata depan, tersusun dari ni dan lam
  meaning_en: word front, composed of ni and lam
- meaning_id: mint, ramuan harum
  meaning_en: mint, fragrant herb
  meaning_nl: munt, welriekend kruid
- meaning_id: ruby
  meaning_en: ruby
  meaning_nl: robijn
- meaning_id: nilam poelam, segala macam batu berharga
  meaning_en: nilam poelam, all kinds of precious stones
  meaning_nl: nilam poelam, allerlei kostbare steenen
