- meaning_id: (ki) meu -, kikir, pelit
  meaning_en: ''
  examples: []
- meaning_id: 'ureueng nyan meu That, biek pajôh boh manok ngon purêh, Orang itu kikir sekali, bangsa pemakan telur ayam dng lidi (dikatakan thd seseorang yg pelit sekali): berbicara dng tambahan tekanan suara sehingga bunyi a akhir menjadi e'
  meaning_en: 'That person is very tight-fisted, the kind of person who would eat chicken eggs with toothpicks (said of someone extremely stingy): speaking with added vocal pressure so that the final ''a'' sound becomes ''e'''
  examples: []
- meaning_id: "awak Meuraksa geumarit meu - that, Orang-orang kampung Mpuraksa berbicara dng\n geurayong\n tambahan tekanan suara"
  meaning_en: Meuraksa people speaking with additional vocal pressure
  examples: []
- meaning_id: peu- = -geumeunyie, melakukan pengeliman, mengelim
  meaning_en: peu- = -geumeunyie, performing the elimination process, to eliminate
