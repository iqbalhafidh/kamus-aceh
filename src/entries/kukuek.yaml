definitions:
- meaning_id: berkokok
  meaning_en: to crow
- meaning_id: ayam berkokok
  meaning_en: the rooster crow
  meaning_nl: het hanengekraai
examples:
- aceh: manok siseun
  jawi: ''
  id: waktu ayam berkokok pertama kali
  en: ''
- aceh: manok duaseun
  jawi: ''
  id: waktu ayam berkokok kedua kali
  en: ''
- aceh: manok lhee seun, kuk'uek manok rame
  jawi: ''
  id: waktu ayam berkokok ketiga kali atau seringkali
  en: ''
- aceh: manok leuhô uroe
  jawi: ''
  id: Ayam berkokok di tengah hari. Ayam berkokok yg menandakan air pasang
  en: The cock crows at midday, the crow that marks the rising tide
- aceh: meu kuk'uek (kuk'uek)
  jawi: ''
  id: berkokok-kokok, suara kokok ayam lebih dari seekor
  en: crowing repeatedly, the crowing of more than one cock
- aceh: peu kuk'uek
  jawi: ''
  id: menyuruh atau membiarkan berkokok
  en: ''
- aceh: keumu kuk'uek, melakukan kuk'uek
  jawi: ''
  id: berkokok, sed-ng berkokok
  en: to crow, crowing
- aceh: manok nyan kuat that jikeumuk'uek, jeuet keu manok sabong
  jawi: ''
  id: Ayam itu selalu berkokok. Ia dapat dijadikan ayam sabungan
  en: That cock crows constantly; he would make a fighting bird
