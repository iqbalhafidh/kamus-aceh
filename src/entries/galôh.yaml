definitions:
- meaning_id: 'sj kupu-kupu malam berbentuk kecil yg suka menyerbu cahaya lampu atau mengelilingi lampu, prumpuen: ban ~ lhom droe bak panyot, bacut tan meuiseuk, Spt kupu-kupu galôh yg menjatuhkan diri ke lampu, sedikit pun ia tidak mau menyimpang dr tujuannya'
  meaning_en: 'moth, small night moth that likes to swarm around or circle lights, syn: ban ~ lhom droe bak panyot, bacut tan meuiseuk, like a galôh moth that throws itself toward the light, not even a little does it deviate from its purpose'
  examples: []
- meaning_id: "Bd sigalôh\n   galông v membujuk, merayu → bujok, payu, sibu\n   galông boh galông n pelampung pukat yg diikat pd bagian tengah di atas mulut kantong (euntung) dan pd tali-temali (ali dan puncong) euntung"
  meaning_en: to cry out, wailing
