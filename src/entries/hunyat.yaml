definitions:
- meaning_id: menggerakkan ke atas dan ke bawah menggoyang-goyangkan ke sana kemari (dalam kead-an vertikal)
  meaning_en: to move up and down, to swing back and forth (in a vertical position)
- meaning_id: kocok dalam arah vertikal
  meaning_en: shake in vertical direction
  meaning_nl: schudden in vertikale richting
examples:
- aceh: ta hunyat cabeueng nyang
