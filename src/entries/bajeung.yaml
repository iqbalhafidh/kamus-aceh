definitions:
- meaning_id: biasanya berhubungan dengan anëk, anëk badjëng, anak seorang pelacur
  meaning_en: usually associated with anëk, anëk badjëng, child of a prostitute
  meaning_nl: gewoonlijk verbonden met anëk, anëk badjëng, hoerekind
- meaning_id: atj kata sumpah
  meaning_en: plain Atj. swear word
  meaning_nl: gewoon Atj. scheldwoord
- meaning_id: bajëng-bajëng, bayangan, hantu
