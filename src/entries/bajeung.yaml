  meaning_nl: bajëng-bajëng, schaduw, schim
- meaning_id: moebajëng, shadow a
  meaning_en: moebajëng, cast a shadow
  meaning_nl: moebajëng, een schaduw werpen
- meaning_id: juga digunakan kiasan barang hilang, jika seseorang menemukan jejak apapun itu
  meaning_en: also used figuratively of lost goods, if one discovers any trace of it
  meaning_nl: ook figuurlijk van verdwenen goederen gebezigd, als men eenig spoor er van ontdekt
