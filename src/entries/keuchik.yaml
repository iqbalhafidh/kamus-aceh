headword: keuchik
jawi: ''
alt_spelling:
- geuchik
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kepala kampung, orang yang dikuasakan atau mewakili (waki), tangan kanan kepala kampung
    (waki yang dikuasakan oleh ulèebalang)
  meaning_en: village head, one authorised to act as deputy, the right hand of the village head, a deputy
    empowered by the ulèebalang
examples:
- aceh: keuchik eumbah
  jawi: ''
  id: teungku ma, keuchik adalah ayah, teungku ibu, (pb) utk menjelaskan kedudukan kedua otorita itu di
    dalam kampung, yi keuchik adalah pelaksana dan utusan adat, sedangkan teungku adalah utusan hukum
    (hukum agama Islam)
  en: '(proverb) the keuchik is the father and the teungku the mother, explaining their standing in the
    village: the keuchik executes custom, the teungku represents religious law'
- aceh: keuchik asai
  jawi: ''
  id: kepala kampung yg berasal dari keturunan-keturunan keuchik
  en: a village head descended from a line of village heads
- aceh: keuchik barô
  jawi: ''
  id: kepala kampung yg bukan berasal dari keturunan-keturunan keuchik (ejekan), (oleh sementara orang
    tua diartikan bahwa keuchik berasal dari katakata ku (ayah) dan chik (tua) atau kedudukan keuchik
    jauh lebih tinggi daripada ayah di kampung dan dengan sendirinya ia harus mendapat penghormatan yang
    wajar) keuchik teuku, teungku, bd chik
  en: a village head not of such descent (a jibe); some elders derive keuchik from ku (father) and chik
    (elder), the village head ranking above a father and so due proper respect
etymology: ''
related_words:
- chik
dialect_notes: ''
