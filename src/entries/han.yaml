examples:
- aceh: h'an lôn jak
  jawi: ''
  id: Saya tidak pergi. h'an êk lôn, Saya tidak mau. h'an jan, tidak punya waktu, memang tidak ada waktu
  en: I am not going. I do not want to. There is no time, there really is no time
- aceh: h'an soe têm jak
  jawi: ''
  id: Tidak seorang pun mau pergi
  en: No one is willing to go
- aceh: h'an meuteu-mee
  jawi: ''
  id: tidak dapat diperoleh
  en: cannot be obtained
- aceh: nyan h'an mée tapubuet
  jawi: ''
  id: Itu tidak layak Anda lakukan. takeumeung bakông bacut? h'an! Maukah Anda tembakau sedikit? h'an
    tidak! ka tatawok si Gam? h'an ka lôn tawôk, tapi h'an jitém woe, Sudahkah Anda memanggil si Gam?
    h'an sudah saya panggil
  en: That is not fitting for you to do. Would you like a little tobacco? No! Have you called si Gam?
    Yes, I have called him, but he will not come back
- aceh: h'an jeuet h'an tajak
  jawi: ''
  id: Tidak boleh tidak, Anda harus pergi
  en: There is no help for it, you must go
