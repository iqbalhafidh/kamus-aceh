headword: bêngkong
jawi: بغكوغ
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: membungkus kain di sekitar bagian atas tubuhnya, yang satu tidak, jika seseorang ingin pergi
    tjintjangen
  meaning_en: wrap a cloth around the upper part of his body, which one does, if one wants to go tjintjangen
  meaning_nl: een doek om het bovendeel van zijn lichaam wikkelen, hetgeen men doet, indien men wil gaan
    tjintjangen
- meaning_id: ''
  meaning_en: more specifically, this happens in tournaments of overplayers with the insulted husbands
    Someone who was caught in the hottest act of adultery by the insulted husband and was not immediately
    killed by him, but left behind a piece of conviction in his flight While the adulterous woman, while
    she was caught, was killed by her husband, must appear on a tournament, which has place on an open
    field, where a square is formed Of which three sides are taken by the heirs of the slain wife and
    her insulted husband and one side by the heirs of the guilty Named Sigëpoh In that square a border
    pole is placed in the middle, to which the judge the guilty heenvoert, who has to chop into that pole,
    after which the heirs of the wife and her husband have the right to lay him down If the guilty man
    flees to the side of his heirs during the attack, he is free and the blame is deemed to have been
    erased
  meaning_nl: meer speciaal geschiedt dit bij tournooien van overspelers met de beleedigde echtgenooten.
    Iemand, die op heeter daad van overspel is betrapt door den beleedigden echtgenoot en niet onmiddellijk
    door hem gedood is, doch in zijne vlucht een stuk van overtuiging heeft achtergelaten, terwijl de
    overspelige vrouw, tijdens zij betrapt werd, door haren echtgenoot is gedood, moet op een tournooi
    verschijnen, dat plaats heeft op een open veld, waar een vierkant wordt gevormd, waarvan drie zijden
    door de erfgenamen van de gedoode vrouw en haren beleedigden echtgenoot worden ingenomen en eene zijde
    door de erfgenamen van den ontvluchten schuldige, Sigëpoh genaamd. In dat vierkant wordt in het midden
    een grenspaal geplaatst, waarheen de rechter den schuldige heenvoert, die in dien paal moet hakken,
    waarna de erfgenamen van de vrouw en haren man recht hebben hem neder te vellen. Kan de schuldige
    gedurende den aanval naar de zijde zijner erfgenamen ontvluchten, dan is hij vrij en wordt de schuld
    beschouwd uitgewischt te zijn
