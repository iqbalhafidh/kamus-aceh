headword: kamè
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: adonan tepung, mengadon tepung untuk dijadikan kue, (juga) mencampuri obat-obatan
  meaning_en: flour dough, to knead flour into dough for cakes, also to mix medicines
- meaning_id: sempurna, kamil (dalam hikayat)
  meaning_en: perfect, perfect (in hikayat)
examples:
- aceh: mukaji dak lagèe apam hana jièk kamè
  jawi: ''
  id: mukanya bantat laksana kue apam yang adonannya tidak sempurna. (dikatakan thd seseorang yg tidak
    mempan diajar)
  en: his face is stodgy as a badly mixed apam cake, said of one who cannot be taught
- aceh: ubat
  jawi: ''
  id: mencampuri obat
  en: to mix medicine
- aceh: meu kamè
  jawi: ''
  id: diadon
  en: kneaded
- aceh: ka meu kamè teupông ruti
  jawi: ''
  id: '? Sudah sempurnakan adonan tepung roti itu? Peu kamè = kamè'
  en: Is the bread dough properly kneaded?
- aceh: tapeu kamè dilèe teupong waktèe takeumeung peugèt keu ruti
  jawi: ''
  id: adonlah tepung dahulu jika Anda hendak membuat roti
  en: knead the flour first if you want to make bread
- aceh: keumamè
  jawi: ''
  id: melakukan kamè
  en: to do kamè
- aceh: soe nyang daki akai kamè, saboh tam-sè pi mumada
  jawi: ''
  id: barang siapa cerdik dan sempurna akalnya, sebuah perumpamaan sudah memadai baginya
  en: for a man of shrewd and perfect understanding, one parable suffices
etymology: ''
