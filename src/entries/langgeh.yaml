headword: langgeh
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: dengan kekerasan
  meaning_en: by force
- meaning_id: menguasai sesuatu secara tidak sah
  meaning_en: ''
- meaning_id: menambah pada sesuatu yang telah ada
  meaning_en: to add to what is already there
- meaning_id: menggagahi
  meaning_en: to force
- meaning_id: menyita
  meaning_en: to confiscate
- meaning_id: perselisihan
  meaning_en: dispute
- meaning_id: perkara
  meaning_en: affair
- meaning_id: hal
  meaning_en: matter
examples:
- aceh: ké geulanggeh umong lôn lé Teuku
  jawi: ''
  id: Teuku (=uleebalang) sudah menyita sawah saya
  en: The teuku has confiscated my rice field
- aceh: ka jilanggeh inong gob
  jawi: ''
  id: Ia telah menggagahi istri orang
  en: He has violated another man's wife
- aceh: meulanggeh
  jawi: ''
  id: dikuasai secara tidak sah, berperkara
  en: ''
- aceh: lôn ngon si Pulan ka meulanggeh peukara umong
  jawi: ''
  id: Saya telah bersengketa dng si Polan dl hal sawah
  en: I have quarrelled with so-and-so over a rice field
- aceh: pakon meunan geucôk peng!nyan buet meulanggeh!
  jawi: ''
  id: Mengapa ia mengambil uang secara demikian? itu melawan hak orang!
  en: Why does he take money so? That is against another's right
- aceh: bek meulingkeue ureh, bek meulanggeh banja
  jawi: ''
  id: Jangan melampaui garis dan jangan pula melanggar peraturan yg telah ditetapkan
  en: Do not cross the line nor break the rules that have been laid down
- aceh: peulanggeh = langgeh, menyuruh bek tapeulanggeh areuta gob
  jawi: ''
  id: Anda jangan menguasai harta orang secara tidak sah
  en: Do not take possession of another's property unlawfully
