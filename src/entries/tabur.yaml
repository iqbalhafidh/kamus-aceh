headword: taboer
jawi: تابور
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: dan (malaikat-malaikat) yang menyebarkan (rahmat Tuhannya) dengan seluas-luasnya
  meaning_en: scattered, sow, scatter
  meaning_nl: verspreid, verstrooid zijn, zaaien, strooien
- meaning_id: mëtaboer-taboer, didistribusikan kiri dan kanan
  meaning_en: mëtaboer-taboer, distributed left and right
  meaning_nl: mëtaboer-taboer, links en rechts verspreid
examples:
- aceh: pakon meutabur tabur bur nyan
  aceh_1889: pakon mëtaboer-taboer boer njan
  jawi: ''
  id: mengapa beras yang tersebar kiri dan kanan? itu juga dikatakan dari kains berbunga, jika bunga-bunga
    tersebar, mëtaboer-taboer
  en: why is that rice scattered left and right? It is also said of flowered kains, if the flowers are
    scattered, mëtaboer-taboer
  nl: waarom is die rijst links en rechts verspreid? Men zegt ook van gebloemde kains, indien de bloemen
    verspreid zijn, mëtaboer-taboer
- aceh: teutabur bije
  aceh_1889: tëtaboer bidjé
  jawi: ''
  id: menabur sinonim dengan sëpëk
  en: sow. Synonym with sëpëk
  nl: zaaien. Synoniem met sëpëk
