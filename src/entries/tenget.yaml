definitions:
- meaning_id: 'bodoh, mengantuk, juga: tidur, ketika menjadi beradab, sementara ēs lebih digunakan dalam
    bahasa informal Tēngēt dikatakan kepala'
  meaning_en: 'stupid, sleepy, also: sleeping, when being civilized, while ēs is more used in the informal
    speaking language Tēngēt is said to be heads'
  meaning_nl: 'dommelig, slaperig, ook: slapen, als men zich beschaafd uitdrukt, terwijl ēs meer in de
    gemeenzame spreektaal wordt gebruikt. Tēngēt zegt men van hoofden'
- meaning_id: tēngēt Indra, tidur cepat, tidur nyenyak Indra tidak muncul secara terpisah
  meaning_en: tēngēt indra, fast sleep, steady slumber. Indra does not appear separately
  meaning_nl: tēngēt indra, vast slapen, vast sluimeren. Indra komt niet afzonderlijk voor,
