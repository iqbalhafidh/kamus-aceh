headword: juara
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ahli penyabung hewan, pengha sut orang yang sedang berkelahi, seseorang yang pandai bicara
    (dalam hikayat)
  meaning_en: an expert in animal fighting, one who eggs on people who are fighting, an eloquent person
    (in hikayat)
examples:
- aceh: meu juara
  jawi: ''
  id: bertugas sbg seorang juara, berlagak sombong
  en: to act as a champion, to behave arrogantly
- aceh: peu juara juara droe
  jawi: ''
  id: bersikap seolah-olah seorang juara, berlagak spt seorang juara juat, bak
  en: to act as though a champion, to swagger like a champion
