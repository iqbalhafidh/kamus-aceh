ipa: ''
part_of_speech: n
definitions:
- meaning_id: tali pada pinggir tenda atau pukat (sebagai penguat), tali sambungan antara jerat-jerat,
    kata hitung pembantu untuk jerat
  meaning_en: the cord along the edge of an awning or net, as a strengthener, rope continuation between
    snares, a numeral classifier for snares
- meaning_id: tali di ujung layar atau jaring
  meaning_en: the rope at the end of a sail or net
  meaning_nl: het touw aan het uiteinde van een zeil of net
- meaning_id: kaya
  meaning_en: rich, wealthy
  meaning_nl: rijk, vermogend
examples:
