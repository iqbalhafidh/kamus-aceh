part_of_speech: n
definitions:
- meaning_id: jangka (alat pengukur), nama berbagai-bagai jenis alat yang dipergunakan dalam perindustrian
    tali dan sutera, alat untuk mereng-gangkan tali atau sutera pada suatu jarak tertentu, ruang atau
    jarak yang telah diukur
  meaning_en: a pair of compasses, the name of various implements used in the rope and silk industries,
    a device for stretching cord or silk to a set distance, a space or distance that has been measured
examples:
- aceh: umuji ban peuet droe sang lagèe geutimang saboh jangka
