definitions:
- meaning_id: sejenis drawbar besar, yang dapat diubah dalam handle dan karenanya digunakan dalam panjang
    dan lebar
  meaning_en: a kind of large drawbar, which can be turned in the handle and therefore used in length
    and width
  meaning_nl: een soort van grooten dissel, dien men in den steel kan omdraaien en daardoor in de lengte
    en breedte kan gebruiken
