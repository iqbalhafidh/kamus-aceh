headword: keunyêt
jawi: ''
alt_spelling:
- keunyot
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengernyit, mengedip mata (sebagai isyarat atau tanda sama-sama setuju, juga karena gerakan
    saraf tidak tertentu, umpamanya karena geli, gugup, terkejut), menggerak-gerakan mulut, mengerut alis,
    mengangkat bahu
  meaning_en: to wince, to wink, as a sign of mutual agreement, also from an involuntary movement of the
    nerves, for instance from ticklishness, flustered, startled, movement movement mouth, to knit the
    brows, to lift shoulder
examples:
- aceh: ji keunyêt (keu) inong nyan
  jawi: ''
  id: Ia mengedip mata kpd wanita itu
  en: He winked at that woman
- aceh: meu keunyêt
  jawi: ''
  id: juga
  en: also
- aceh: teu keunyêt
  jawi: ''
  id: berkedip, mengerutkan muka
  en: to blink, to screw up the face
- aceh: meu keunyêt
  jawi: ''
  id: keunyêt, (juga) berkedip kedip mata tsb
  en: to blink the eyes
- aceh: peu keunyêt
  jawi: ''
  id: menyuruh kernyitkan, dsb
  en: to have someone wince
- aceh: peu keunyêt droe
  jawi: ''
  id: dng sengaja mengerenyit-ngerenyit, berbuat seolah-olah sarafnya terganggu sehingga berkerenyit-kerenyit
  en: to twitch deliberately, as though the nerves were disordered
