headword: tëlangké
jawi: تَلَاَغْكي
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: seorang pria meminta seorang gadis untuk menikah dengan seseorang
  meaning_en: a male person asking a girl to marry someone
  meaning_nl: een mannelijk persoon, die een meisje voor iemand ten huwelijk vraagt
- meaning_id: djak tëlangké, dalam perjalanan untuk melaksanakan operasi itu
  meaning_en: djak tëlangké, on his way to carry out that operation
  meaning_nl: djak tëlangké, zich op weg begeven, om die handeling te verrichten
- meaning_id: chop tëlangké, adalah persentase biasa jika mas kawin hanya 1 tahil mas besar, maka dia
    akan menerima satu mas dia tidak pernah menerima kurang dari satu mas. sinonim dengan sëlangké
  meaning_en: chop tëlangké, is the usual percentage, which is due to such a matchmaker (in the good sense)
    of the wedding gift and per boengkal mas dowry is mas or f 2.50 If the dowry is only 1 tahil mas large,
    then he will receive one mas. He never receives less than one mas. Synonymous with sëlangké
  meaning_nl: hak tëlangké, is de gebruikelijke percentage, die een dergelijken koppelaar (in de goede
    beteekenis) van de huwelijksgift toekomt en per boengkal mâs bruidschat 4 mâs of f 2.50 bedraagt.
    Is de bruidschat slechts 1 tahil mâs groot, dan komt hem daarvan 1 mâs toe. Minder dan 1 mâs ontvangt
    hij nimmer. Synoniem met sëlangké
