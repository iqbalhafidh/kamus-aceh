headword: daroewët
jawi: دارؤ
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: belalang, nama umum
  meaning_en: grasshopper, common name
  meaning_nl: sprinkhaan, algemeene naam
- meaning_id: 'spesies belalang: daroewët ek asée, belalang dari warna kotoran anjing'
  meaning_en: 'species of locusts: daroewët ek asée, grasshopper of the color of dog dung'
  meaning_nl: 'soorten van sprinkhanen: daroewët ek asée, sprinkhaan van de kleur van hondendrek'
- meaning_id: daroewët rimong, daroewët barom, daroewët inong, daroewët agam, daroewët sekeh Atjehers
    makan belalang panggang sebagai makanan lezat, mengatakan mereka merasa seperti udang dan karena itu
    mereka disebut oedëng darat, udang tanah
  meaning_en: daroewët rimong, daroewët barom, daroewët inong, daroewët agam, daroewët sekeh The Atjehers
    eat the locusts baked as delicacies, say they taste like shrimp and therefore call them oedëng darat,
    land shrimps
  meaning_nl: daroewët rimong, daroewët barom, daroewët inong, daroewët agam, daroewët sekeh. De Atjehers
    eten de sprinkhanen gebakken als lekkernij, zeggen dat zij als garnalen smaken en noemen ze daarom
    oedëng darat, landgarnalen
- meaning_id: daroewët blade, jangkrik hitam, menurut menurut warna kulit Klingen
  meaning_en: daroewët blade, the black cricket, supposedly according to the skin colour of the Klingen
  meaning_nl: daroewët kling, de zwarte krekel, zoogenaamd naar de huidskleur der Klingen
