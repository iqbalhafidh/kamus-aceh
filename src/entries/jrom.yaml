definitions:
- meaning_id: berkerumun (umpamanya burung, insekta)
  meaning_en: to swarm for example bird, insect
examples:
- aceh: tulô ka ji jrom bak padé gata
  jawi: ''
  id: Burung-burung pipit sudah berkerumun pd tanaman padi Anda
  en: The sparrows have already flocked onto your rice crop
- aceh: meu jrom
  jawi: ''
  id: berkerumun
  en: to swarm, to crowd around
- aceh: le that sidom 'oh meu jrom
  jawi: ''
  id: Banyak sekali semut seolah-olah menyerupai suatu kerumunan
  en: There are so many ants that they look like a swarm
- aceh: hana trèb siat ka meu jrom ureueng bak teumpat nyan
  jawi: ''
  id: Tidak lama antanya sudah berkerumun orang di tempat itu
  en: Before long a crowd had gathered at that place
