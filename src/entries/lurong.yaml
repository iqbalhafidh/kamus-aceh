headword: lurong
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: membenarkan, meluluskan semua permintaan, memanjakan, memperoleh apa yang diinginkan, dimanjakan
  meaning_en: to permit, to pass all to ask, spoilt, to obtain what one wants, pampered
examples:
- aceh: ka neu lurong jih lé Tuhan
  jawi: ''
  id: Tuhan sudah meluluskannya
  en: God has granted it
- aceh: si Pulan nyan le that jiteumeung hareukat, lurong that jih dalam buleuen nyoe
  jawi: ''
  id: Si Polan banyak sekali memperoleh keuntungan. Ia sangat beruntung dl bulan ini
  en: So-and-so has made a great profit; he has been very fortunate this month
- aceh: jih teungoh lurong, tamse tiong lob lam cintra
  jawi: ''
  id: Ia sedang beruntung laksana tiung yg masuk ke dl sangkarnya
  en: He is in luck, like a mynah walking into its own cage
- aceh: peu lurong, = lurong, bek tapeu lurong, akhe teuboih
  jawi: ''
  id: Anda jangan memanjakannya, akhirnya rusak
  en: Do not indulge him, he will be ruined in the end
