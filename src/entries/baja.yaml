  en: rub a sick foot with henna, or make a call to a watery foot or if one no longer has teeth, smear
    it with black (badja) This proverb is usually quoted, if one wishes to do or has done something which
    is not appropriate
  nl: een zieken voet met henna in te wrijven, evenmin een belletje aan een waterzuchtigen voet te doen
