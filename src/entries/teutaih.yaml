    kembali: ta teutaih neucob'
  jawi: ''
  id: tetaskan atau bukakan jahitan
  en: ''
- aceh: ta teutaih lom bajée nyoe, hana get neucob
  jawi: ''
  id: Bukakan jahitan baju ini, jahitannya tidak baik
  en: ''
- aceh: ta teutaih eumpang siat!
  jawi: ''
  id: Tetaskan sempit itu sebentar!
  en: ''
- aceh: binteh
  jawi: ''
  id: membuka atau melepaskan dinding
  en: ''
- aceh: adak ka salah neuduek beuleubaih, mangat ta teutaih untong goh tuho!
  jawi: ''
  id: Sekiranya tempat pemasangan belesbas adalah ditempatkan, mudah utk membukanya kembali sebelum tua
  en: ''
- aceh: keu peue ta teutaih buet gob?
  jawi: ''
  id: Utk apakah Anda memperbaiki pekerjaan orang lain?
  en: ''
