headword: judô
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: jodoh, pasangan, suami atau istri, nasib seseorang untuk menjadi suami atau istri seseorang
  meaning_en: match, spouse, pair, husband or wife, one's destiny to become someone's husband or wife
examples:
- aceh: si judô
  jawi: ''
  id: sepasang
  en: a pair
- aceh: hana judô
  jawi: ''
  id: tidak ada jodo h
  en: there is no match for it
- aceh: hana judô lé
  jawi: ''
  id: tidak ditakdirkan Tuhan utk tetap menjadi suami-istri, (dikatakan jika terjadi perceraian)
  en: not destined by God to remain husband and wife, said when a divorce occurs
- aceh: meu judô
  jawi: ''
  id: berjodoh, berpasangan
  en: to be matched, to be paired
- aceh: bandum peneujeuet meu judô
  jawi: ''
  id: Semua ciptaan Tuhan dijadikan berpasang-pasangan
  en: All God's creatures were made in pairs
- aceh: gata jinoe ka na tameu judô
  jawi: ''
  id: '? Sudahkah Anda berkeluarga sekarang?'
  en: Are you married now?
- aceh: peu judô (ngon)
  jawi: ''
  id: menjodohkan (dng), mengawinkan
  en: to match with, to marry off
- aceh: hana patôt tapeu judô aneukteu ngon ureueng nyan! jih hana sikuphu ngon geutanyoe
  jawi: ''
  id: Tidak sepatutnya Anda mengawinkan anak Anda dng orang itu! ia tidak sederajat dng kita!
  en: It is not fitting for you to marry your child to that man! He is not our equal!
etymology: ''
