  jawi: ''
  id: keuleude, Orang ini spt keledai (dikatakan thd seseorang yg suka kentut). lagee keuleude me kitab,
    Spt keledai pembawa kitab (dikatakan thd seseorang yg pura pura alim, seraya berjalan ke sana kemari
    dng membawa kitab-kitab, tetapi tidak memperoleh manfaat dr kekayaan atau ilmunya sesuai dng maksud
    Qur-an surat LXII ayat 5). lagee keuleude me sira, Spt keledai pembawa garam (dikatakan thd seseorang
    yg di luar usahanya sendiri akhirnya memperoleh keuntungan)
