definitions:
- meaning_id: sejenis ikan sugai keccil
  meaning_en: a kind of small river fish
- meaning_id: bunyi mencicit pada waktu membuka atau menutup pintu, suara gesekan dahan-dahan kayu
  meaning_en: the squeaking sound made when opening or closing a door, the sound of branches rubbing together
examples:
- aceh: meu ’iet
  jawi: ''
  id: mengeluarkan suara mencicit
  en: to bring out voice to squeak
- aceh: bubông tan teuhah, pintu tan meu ’iet
  jawi: ''
  id: Atap tidak terbuka dan pintu tidak mengeluarkan bunyi mencicit
  en: The roof does not open and the door does not squeak
- aceh: peu ’iet
  jawi: ''
  id: mengeluarkan bunyi mencicit
  en: to bring out sound to squeak
- aceh: bèk tapeu ’iet ’iet pintô
  jawi: ''
  id: Jangan Anda mencicit-cicitkan pintu
  en: Do not make the door squeak
