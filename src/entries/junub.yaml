definitions:
- meaning_id: dalam keadaan tidak suci untuk melakukan salat setelah berhubungan kelamin
  meaning_en: in a state of impurity for prayer after sexual intercourse
examples:
- aceh: badan lôn lam junub
  jawi: ''
  id: Keadaan saya tidak suci
  en: I am in a state of ritual impurity
- aceh: lôn mantong junub bak badan, hana lôn manoe lom
  jawi: ''
  id: Saya masih belum suci, saya belum lagi mandi (jenabat)
  en: I am not yet purified, I have not yet performed the ablution
- aceh: manoe junub
  jawi: ''
  id: mandi jenabat
  en: the ablution after intercourse
- aceh: peu junub
  jawi: ''
  id: membuat dl keadaan tidak suci
  en: to render ritually impure
