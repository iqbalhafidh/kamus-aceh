headword: kawôm
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kaum, (mencakup semua keturunan dari satu moyang laki-laki, pada masa dahulu kaum memegang
    peranan penting dalam menuntut bela (
  meaning_en: group, comprising all descendants of one male ancestor, in former times the clan played
    an important part in exacting blood vengeance
examples:
- aceh: 'teung bila), sanak saudara dr pihak laki-laki, (dl hik) kelompok, pasukan: Gobnyan kawôm geutanyoe'
  jawi: ''
  id: Ia seketurunan atau sekaum dng kita
  en: He is of our lineage, of our clan
- aceh: Lôn ngon gobnyan sikawôm
  jawi: ''
  id: saya dan dia seketurunan atau sekaum
  en: he and I are of one lineage
- aceh: Panglimakawôm, Panglima kaum diangkat oleh dan dengan persetujuan anggota-anggota kaumnya serta
    dikuatkan oleh kepala daerah, yi ulèebalang
  jawi: ''
  id: dan tidak boleh turut serta dl urusan pemerintahan daerah
  en: and may not take part in the government of the district
- aceh: ureueng peuet kawôm
  jawi: ''
  id: orang-orang keturunan empat kaum
  en: persons descend four group
- aceh: sukèe yg berasal dr tiga bangsa, yi Arab, Turki, dan Parsi
  jawi: ''
  id: nibak Arab, nibak Turuki, nibak Parisi asai bangsa, wahai saudara-saudara orang Aceh, dahulu kala
    moyang Anda berasal dr empat kawom dan tujuh
  en: 'from Arab, Turkish and Persian stock: O Acehnese brothers, your forefathers came of four clans
    and seven'
- aceh: Meukawôm
  jawi: ''
  id: berkaum, tergolong dl kaum yg banyak dan terkemuka
  en: to belong to a large and prominent clan
- aceh: meu kawôm
  jawi: ''
  id: berkaum-kaum, berkelompok-kelompok
  en: group group
- aceh: ureueng meukawôm
  jawi: ''
  id: orang
  en: person
