headword: soeboh
jawi: صبيح
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: fajar
  meaning_en: the dawn
  meaning_nl: de dageraad
- meaning_id: wachistée soeboh, waktu dari morgengodsdienstoefening. şabar, pengunduran diri, sabar teman,
    teman. bekerja, teman, menjadi teman. bekerja, ya, benar, benar, nyata şedēkah, sedekah, pengorbanan,
    hadiah cinta dalam kata-kata yang jelas untuk menunjukkan bahwa questie telah selesai. mulai, baris
    benar-benar hancur nama bulan ke-2 dari tahun Islam
  meaning_en: wachistée soeboh, the time of the morgengodsdienstoefening. şabar, resignation, patience.
    şah, right, true, really, valid of a witness. şahib, boss, lord, master, mate companion, friend. şahabat,
    friend, befriend. şaaventeh, yes, right, true, real. şedēkah, alms, sacrifice, gift of love. şadik,
    sincere, unfeigned, heartfelt. şaraf, kitab şaraf speech art. şareh, pure, clear, in clear words to
    indicate that a quaestie is finished. şef, row, member. şafa, bright, shiny. şafan-şafa Completely
    destroyed. Oh, my God, şafar, name of the 2nd month of the Islamic year
  meaning_nl: waḳtée soeboh, de tijd van de morgengodsdienstoefening. صبر şabar, berusting, geduld. صم
    şah, juist, waar, echt, geldig van een getuige. صاحب şahib, baas, heer, meester, makker, metgezel,
    vriend. صحيحة şahabat, vriend, bevriend zijn. صحيح şaḥeh, ja, juist, waar, echt. صدقة şedēkah, aalmoes,
    offerande, liefdegift. صديق şadik, oprecht, ongeveinsd, welgemeend. صرف şaraf, kitab şaraf, spraakkunst.
    صريح şareh, zuiver, duidelijk, in duidelijke bewoordingen te kennen geven dat eene quaestie afgedaan
    is. صف şef, rij, gelid. صفا şafa, helder, glanzend. صفا şafan-şafa, geheel en al vernietigd. صفر şafar,
    naam der 2e maand van het Mohamedaansche jaar. صالح şaleh, vroom, rechtschapen, braaf, een braaf man
