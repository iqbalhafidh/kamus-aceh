headword: djêhoeng
jawi: جهوغ
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: cahaya kepala karbuw atau ternak dengan cara tali dimasukkan melalui hidung untuk mencegah
    mereka binatang dari menabrak atau menendang. Juga untuk mengisi mereka dengan makanan
  meaning_en: light the head of carbouws or cattle by means of the rope put through the nose to prevent
    those animals from bumping or kicking. Also to fill them with food
  meaning_nl: het hoofd van karbouwen of runderen oplichten door middel van het door den neus gebrachte
    touw, om die beesten het stooten of trappen te beletten. Ook om hen met eten vol te proppen
