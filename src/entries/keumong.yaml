headword: keumong
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: kembung, gembung, bengkak (akibat kena pukul atau penyakit, umpamanya sakit gigi dan sebagainya),
    kembang (umpamanya tinta), juga dikatakan untuk kertas yang menggembung jika ditulis dengan tinta
  meaning_en: bloated, swollen, swollen from a blow or from illness, for instance toothache and the like,
    to unfold (for example ink), also said of paper that puckers when written on with ink
examples:
- aceh: mieng lon keumong
  jawi: ''
  id: Pipi saya bengkok
  en: My cheek is swollen
- aceh: keureutaih keumong
  jawi: ''
  id: kertas yg jika ditulisi tintanya mengembang
  en: paper on which ink spreads when written
- aceh: keus' ieb
  jawi: ''
  id: kembang kempis, di sini mengembang di sana mengempis, timbul tenggelam (ump betis atau paha seorang
    penderita penyakit beri-beri)
  en: swelling here and sinking there, rising and falling, as the calf or thigh of a beriberi sufferer
- aceh: meu keumong
  jawi: ''
  id: membengkak, mengembang, menggembung
  en: to swell, to expand, to bulge
- aceh: takeumeung meu keumong gata? pakon taduek treb-treb that lam ie?
  jawi: ''
  id: Maukah Anda menggembungkan perut? Mengapakah Anda berada dalam air terlalu lama?
  en: Do you mean to swell your belly? Why do you stay in the water so long?
etymology: ''
