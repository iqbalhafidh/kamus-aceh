headword: kating
jawi: كاتيغ
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sejenis keranjang persegi memanjang dari kulit semak belukar yang disebut bili, dikepang.
    dalam keranjang ini, yang memiliki tertentu isi atau nalé, padi dari bidang tersebut dibawa pulang,
    sehingga orang dapat segera menghitung seberapa besar panen telah
  meaning_en: a kind of elongated square basket of the bark of a shrub called bili, braided. In these
    baskets, which have a certain content of or 11⁄2 nalé, the padi of the field is carried home, so that
    one can immediately calculate how big the harvest has been
  meaning_nl: een soort van langwerpig vierkante mand van de schors van een heester, bili genaamd, gevlochten.
    In deze manden, die een bepaalden inhoud van 1 of 1½ nalé hebben, wordt de padi van het veld huiswaarts
    gedragen, zoodat men onmiddellijk berekenen kan hoe groot de oogst is geweest
