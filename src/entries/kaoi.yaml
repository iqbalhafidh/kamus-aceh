headword: kaōi
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kaul, nazae (dilaksanakan karena telah memperoleh sesuatu maksud, umpamanya telah sembuh
    dari sesuatu penyakit berat dan lain-lain.)
  meaning_en: vow, a vow fulfilled because a purpose has been attained, for instance having recovered
    from a serious illness
examples:
- aceh: ikat kaōi
  jawi: ''
  id: bernazae pd sesuatu (dil hik)
  en: to make a vow over something (in hikayat)
- aceh: peulheueh kaōi
  jawi: ''
  id: melepaskan atau memenuhi nazae
  en: to discharge or fulfil a vow
- aceh: geundrang kaōi
  jawi: ''
  id: genderang yang ditabuh ketika orang melepaskan nazar dng menyembelih kerbau
  en: the drum beaten when a vow is fulfilled by slaughtering a buffalo
- aceh: bak peutrōn aneuk
  jawi: ''
  id: melepaskan nazar ketika
  en: to release vow when
