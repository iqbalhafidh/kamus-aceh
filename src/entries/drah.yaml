definitions:
- meaning_id: 'sesuatu yg terkecil (dl hik): (hana) (b)ubé —, (tidak) sebesar bagian yg terkecil, (tidak) sedikit jua'
  meaning_en: 'the smallest thing (in parables): (hana) (b)ubé —, not as big as the smallest part, not a little either'
  examples:
  - aceh: "hana raya, cut bubé —, tidak besar, hanya sekecil bagian yg terkecil → alah, dôseuta\n 1 draih a deras, cepat (utk gerakan), jelas"
    jawi: ''
    id: that jijak, Ia berjalan cepat sekali
    en: that jijak, He walks very fast
  - aceh: '''oh hana lé bibi, jima-ritpi hana'
    jawi: ''
    id: lé, sewaktu ia tidak berbibir lagi, berkata-kata pun ia tidak jelas lagi
    en: lé, sewaktu ia tidak berbibir lagi, berkata-kata pun ia tidak jelas lagi
  - aceh: su jih
    jawi: ''
    id: that, suara-suaranya melengking sekali
    en: ''
  - aceh: peu
    jawi: ''
    id: mempercepat
    en: to accelerate
  - aceh: "pakon ta-peu — that? mengapa Anda berjalan cepat sekali?\n 2 draih n deras, pelajaran: ji"
    jawi: ''
    id: Kuru-an bak juih Taba, ia mendaras, Alquran juz Tabarakalladzi
    en: ''
  - aceh: meu
    jawi: ''
    id: mendaras, bercerita, berbual-bual
    en: ''
  - aceh: '''oh saré trôih u meunasah, jimeu'
    jawi: ''
    id: "ngon Malém Diwa, sesampai di meunasah lalu berceritalah ia dng Malém Diwa\n dr'am-dr'am, dr'um-dr'um, bunyi gemuruh tembakan meriam, senapang, aum harimau, api yg sedang menyala besar: meu ~ bergemuruh, menyebar ke mana-mana"
    en: on Malém Diwa, upon arriving at the meunasah, he then told Malém Diwa stories
