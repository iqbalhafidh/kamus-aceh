headword: kèe
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kata ganti orang pertama tunggal
  meaning_en: the first person singular pronoun
examples:
- aceh: h'an kujak
  jawi: ''
  id: Aku tidak pergi
  en: I am not going
- aceh: Nyoe atraku, (dng tekanan) nyoe atra kèe
  jawi: ''
  id: ini kepunyaanku
  en: this is mine
- aceh: H'an èkku
  jawi: ''
  id: aku tidak mau
  en: I do not want to
- aceh: Meu kèe, berkata dng menggunakan kee
  jawi: ''
  id: beraku-aku-an
  en: I I
- aceh: bèk kamarit meu kèe, timoh iku jeuet keu asèe, jangan engkau berkata dng menggunakan kèe
  jawi: ''
  id: (utk dirimu), nanti tumbuh ekor menjadi ajiing, (sajak utk memperingatkan seorang anak supaya ia
    tidak menggunakan kata ganti tsb)
  en: a tail will grow on you and you will become a dog (a rhyme warning a child not to use that pronoun)
- aceh: peu kèe droe
  jawi: ''
  id: bersikap secara tidak pantas dng menggunakan kata ganti kèe
  en: to behave improperly by using the pronoun kèe
