  id: yg dianggap tidak menguntungkan pemiliknya, tanda-tanda yg tidak baik
  en: regarded as unlucky for its owner, an ill omen
- aceh: bak sisèk tiwaih bak bintang, sangkôt bak ruman sumpah seurapa
  jawi: ''
