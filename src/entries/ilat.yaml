definitions:
- meaning_id: curang (umpamanya dalam suatu permainan)
  meaning_en: deceitful (for example in a certain game)
examples:
- aceh: ureueng ilat
  jawi: ''
  id: penipu
  en: a cheat
- aceh: céng ilat
  jawi: ''
  id: dacing yg tidak benar
  en: a false steelyard
- aceh: buet gata ilat that
  jawi: ''
