headword: kandoe
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: membawa sesuatu di lipatan kain yang dibentuk seperti kantong atau bungkusan, (pada laki-laki,
    kantong itu dibentuk pada kain yang dikeluarkan di pinggang atau di ujungnya (punca ija) yang terjurai
    di bahu, sedangkan pada wanita di kain selendangnya (ija sawak), kantong itu biasanya juga dinamakan
  meaning_en: to carry something in a fold of cloth formed as a pocket or bundle, in men, the pocket is
    formed in the cloth at the waist or in its end hanging over the shoulder, while women carry it in
    the shawl, that pocket is usually also called
examples:
- aceh: 'keunandoe: ta kandoe nyoe siat'
  jawi: ''
  id: masukkanlah (benda) ini sebentar ke dalam kandoe Anda
  en: put this in your pouch for a moment
- aceh: keunandoe, keulandoe
  jawi: ''
  id: kantong atau bungkusan yg dibentuk dr lipatan kain, (juga) kantong peminta-minta
  en: a pocket or bundle formed from a fold of cloth; also a beggar's pouch
etymology: ''
