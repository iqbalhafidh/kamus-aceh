definitions:
- meaning_id: tidak disukai atau tidak dipedulikan oleh suami, ditinggalkan suami, mandul, tidak dapat
    melahirkan anak lagi, mahal, tumpul
  meaning_en: disliked or neglected by her husband, abandoned by her husband, barren, no longer able to
    bear children, expensive, blunt
- meaning_id: hai dara, bak — keu! Wahai dara, semoga engkau tidak mempunyai suami, semoga engkau di kemudian
    hari ditinggalkan suamimu
  meaning_en: hey! maiden, O maiden!, may you never have a husband, may your husband leave you hereafter
