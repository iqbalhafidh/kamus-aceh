part_of_speech: v
definitions:
- meaning_id: memanggil supaya datang (dengan tangan, kain atau dengan seluruh tangan), menarik atau mengambil
  meaning_en: to beckon someone to come, with cloth or with the whole hand, to pull or to take
examples:
- aceh: Soe nyang ta kawôt lè gata?
  jawi: ''
  id: Siapakah yg Anda panggil itu?
  en: Whom are you calling?
- aceh: Meukawôt, dipanggil, ditarik ke hadapannya, keumawot
  jawi: ''
  id: melakukan kawot, memberikan isyarat supaya datang
  en: to beckon someone to come
- aceh: soe nyang keumawot jeh?
  jawi: ''
  id: Siapakah yg sedang memanggil itu?
  en: Who is that calling?
etymology: ''
