definitions:
- meaning_id: mencari seseorang kemalangan dengan segala cara dan tidak berhenti sebelum tujuan tercapai,
    menganiaya seseorang terus-menerus
  meaning_en: looking for someone's misfortune by all means and not stopping before the goal is achieved,
    persecute someone constantly
  meaning_nl: iemands ongeluk zoeken door allerlei mogelijke middelen en daarmede niet ophouden, alvorens
    het doel bereikt is, iemand voortdurend vervolgen
