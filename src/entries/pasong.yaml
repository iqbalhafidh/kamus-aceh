- meaning_id: dipakai di dada dan punggung yang diselempangkan ke bahu melalui lengan lalu disilangkan
    ke dada dan ke belakang
  meaning_en: ''
- meaning_id: menutup seseorang dalam blok, bahkan blok itu sendiri
  meaning_en: close someone in a block, even the block itself
