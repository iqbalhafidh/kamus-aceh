definitions:
- meaning_id: menghunus (dalam hikayat)
  meaning_en: to unsheathe (in hikayat)
examples:
- aceh: teu hunoh
  jawi: ''
  id: terhunus, terpancar, tercabut
  en: unsheathed, spurting out, pulled out
- aceh: beureukat du'a nabi Noh, beuteu hunoh beu teupanca
  jawi: ''
  id: Semoga (anak-anak yg akan lahir itu) terpancar ke luar berkat doa nabi Nuh, spy seorang wanita hamil
    segera melahirkan anaknya
  en: May the child come forth by the blessing of the prophet Noah's prayer, so that a pregnant woman
    may quickly give birth
