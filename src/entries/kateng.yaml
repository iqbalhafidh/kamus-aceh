part_of_speech: n
definitions:
- meaning_id: sejenis keranjang yang dianyam dari kulit bili, kadang-kadang juga dari rotan, berbentuk
    bulat torak, tetapi selalu dengan dasar yang berbentuk empat persegi dan kadang kala berbentuk kaki
    kayu yang pendek, dipergunakan sebagai ukuran isi untuk menakar hasil padi buat jakeuet
  meaning_en: a kind of basket plaited from bili bark, sometimes also of rattan, cylindrical in shape,
    but always with a square base, sometimes on short wooden feet, used as a measure of capacity for the
    rice tithe
