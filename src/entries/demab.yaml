definitions:
- meaning_id: dengan payudara dan perut yang berbaring di tanah, memandang musuhnya dan merampoknya. flat
    tangan membawa ke posisi yang ke payudara, untuk dapat meningkat segera
  meaning_en: with breasts and belly, lying on the ground, looking at his enemy and robbing him. The flat
    of the hands brings to that position to the breasts, to be able to rise soon
  meaning_nl: met borst en buik lang uit op den grond liggen, om op zijn vijand te loeren en hem te overvallen.
    Het plat der handen brengt men bij die positie aan de borsten, om spoedig te kunnen opstaan
