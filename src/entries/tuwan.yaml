definitions:
- meaning_id: pak, Tuan
  meaning_en: sir, Master
  meaning_nl: heer, meester, mijnheer
- meaning_id: seseorang in- hukum juga disebut toewan
  meaning_en: someone's in-laws are also called toewan
  meaning_nl: de schoonouders van iemand worden eveneens met toewan betiteld
- meaning_id: dalam hubungannya dengan oeloen, ketika oeloen toewan, i, dalam bahasa berbicara dan bahasa
    menulis yang tepat, muncul
  meaning_en: in conjunction with oeloen, when oeloen toewan, I, in the proper speaking and writing language,
    appear
  meaning_nl: komt in verbinding met oeloen, als oeloen toewan, ik, in de deftige spreek- en schrijftaal,
    voor. تونتوö toentoet, eischen, vorderen, opvorderen
- meaning_id: toewan BILA, Tuntutan balas dendam
  meaning_en: toewan bila, revenge demands
  meaning_nl: toewan bila, weerwraak eischen
- meaning_id: toewan mënale, menuntut balas dendam atas aib yang diderita
  meaning_en: toewan mënale, claim revenge for disgrace suffered
  meaning_nl: toewan mënale, weerwraak voor aangedane schande vorderen
- meaning_id: toewan pësaka, mengklaim sebuah warisan
  meaning_en: toewan pësaka, claim an inheritance
  meaning_nl: toewan pësaka, een erfenis opvorderen
