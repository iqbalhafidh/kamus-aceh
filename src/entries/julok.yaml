ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengukur (kedlman air), (kiasan) menduga, mengira-ngira, meneliti naleueng —, sejenis rumput
    yang tumbuh dalam air
  meaning_en: to measure the depth of water, (figuratively) to guess, to estimate, to examine closely,
    a kind of grass growing in water
- meaning_id: — disa
  meaning_en: ''
- meaning_id: (dalam hikayat)
  meaning_en: in hikayat
- meaning_id: menyelidiki kebenaran suatu berita atau desas-desus
  meaning_en: to investigate the truth of a report or rumour
- meaning_id: (dalam hikayat) memeriksa keadaan suatu desa atau daerah
  meaning_en: (in hikayat) to inspect the state of a village or district
- meaning_id: meu —
  meaning_en: ''
- meaning_id: diperiksa
  meaning_en: examined
- meaning_id: diukur
  meaning_en: measured
- meaning_id: melakukan pengukuran
  meaning_en: to perform measure
- meaning_id: nama sebuah kerajaan di pantai timur Aceh, disebut Djoelok raja dan Djoelok Tjoet
  meaning_en: name of an empire on the east coast of Aceh, called Djoelok raja and Djoelok Tjoet
  meaning_nl: naam van een rijkje ter Oostkust van Atjeh, genaamd Djoelok raja en Djoelok Tjoet
