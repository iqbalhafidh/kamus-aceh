definitions:
- meaning_id: menumpang
  meaning_en: to lodge
- meaning_id: turut berdiam pada orang lain
  meaning_en: ''
- meaning_id: turut bersama-dengan orang lain dalam kendaraan atau kapal
  meaning_en: ''
examples:
- aceh: neubri lôn lumpang bak soe ta lumpang jinee?
  jawi: ''
  id: Pd siapakah Anda menumpang sekarang?
  en: With whom are you lodging now?
- aceh: neupeu lumpang lon bak malam nyoe simalam mantong
  jawi: ''
  id: Malam ini, saya tumpangkan saya semalam saja
  en: Tonight let me lodge with you for just one night
- aceh: peu-an
  jawi: ''
  id: (jarang dipergunakan) penginapan, rumah tempat orang yg dapat menumpang atau menginap, kendaraan
    atau kapal yg boleh ditumpangi
  en: 'rarely used: lodging, a house where one may stay, or a vehicle or ship one may travel on'
