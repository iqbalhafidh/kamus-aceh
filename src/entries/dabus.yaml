headword: daboes
jawi: دابوس
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: sebuah dermaga besi panjang kaki dengan kenop besi besar, dengan empat rantai, untuk menghasilkan
    denting. dengan objek ini hantu dan penyihir menusuk diri mereka sendiri tanpa menyakiti diri sendiri
  meaning_en: an iron pier of a foot length with a large iron knob, with four chains, to produce tinkling.
    With this object ghosts and magicians stab themselves without hurting themselves
  meaning_nl: een ijzeren priem van een voet lengte met een grooten ijzeren knop, waaraan vier kettinkjes,
    om gerinkink voort te brengen. Met dit voorwerp steken zich geestdrijvers en goochelaars zonder zich
    te kwetsen
- meaning_id: jalankan mëdaboes dengan demikian
  meaning_en: run mëdaboes therewith
  meaning_nl: mëdaboes, daarmede toeren uitvoeren
