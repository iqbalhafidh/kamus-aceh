  en: the rattan ring joining the plough handle to its body
- aceh: piu
  jawi: ''
  id: cincin rotan besar tempat mengisi daging kelapa yg sudah diperam (=piu) utk diperas di antara alat
    pemeras (=peuneurah)
  en: a large rattan ring holding cured coconut flesh to be pressed in the press
- aceh: takue
  jawi: ''
  id: leher baju emas
  en: neck shirt gold
- aceh: meu klah
