examples:
- aceh: go parang nyoe hana geubôh klah
  jawi: ''
  id: Hulu parang ini tidak dibubuhi sengkang
  en: This machete's hilt has no ferrule fitted
- aceh: bêk di ateueh klah tatamah teubeung, bêk di ateueh lueng tatamah mata
  jawi: ''
  id: Anda jangan menambahkan cincin di atas simpap dan Anda jangan menambahkan mata di atas alurnya.
    (pb) dikatakan thd seseorang yg menambahkan hutang baru pd hutang-hutang lama
  en: '(proverb) Do not add a ring above the band nor an edge above the groove: said of one who piles
