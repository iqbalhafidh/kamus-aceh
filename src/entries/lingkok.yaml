headword: lingkök
jawi: ليغكوق
alt_spelling:
- lingkok
- lingkoh
ipa: ''
part_of_speech: n
definitions:
- meaning_id: lengkung, belokan, kelok (umpamanya sungai, jalan, keris) bengkok, membungkukkan
  meaning_en: curve, bend, a bend, as of a river, walk, crooked kris, to stoop
- meaning_id: melengkung, memutar
  meaning_en: curved, twist
  meaning_nl: krom, gebogen, kromte, draai
examples:
- aceh: rèt, krueng
  jawi: ''
  id: belokan jala, sungai
  en: bend casting net, river
- aceh: that akai ji
  jawi: ''
  id: Pikirannya berkelok kelok. Ia seorang yg tidak jujur
  en: His mind is crooked; he is not an honest man
- aceh: yôh di reubông èk lônlingkök, 'oh di tarôk ka kreueh gata
  jawi: ''
  id: Sewaktu Anda menjadi rebung (=anak-anak) dapat kubengkokkan (=kuatur sebagaimana mestinya), setelah
    menjadi taruk (=cabang), Andalah yg keras (=tidak dapat diatur lagi)
  en: While you were a shoot I could bend you; now you are a branch you are too stiff to shape
- aceh: meulingkök lingkök
  jawi: ''
  id: berkelok-kelok
  en: ''
- aceh: peulingkök
  jawi: ''
  id: = lingkök
  en: ''
- aceh: lingkoh reuj
  aceh_1889: lingkoh rëdj
  jawi: ''
  id: melengkung di jalan
  en: curved in the way
  nl: kromte in den weg
- aceh: lingkoh kerung
  aceh_1889: lingkoh keroeng
  jawi: ''
  id: meringkuk di sungai
  en: curved in a river
  nl: kromte in eene rivier
