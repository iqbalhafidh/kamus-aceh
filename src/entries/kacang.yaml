headword: kacang
jawi: كاچغ
alt_spelling:
- katjang
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kacang (hanya dikatakan untuk jenis-jenis berikut ini)
  meaning_en: bean (only word for kinds to follow this)
- meaning_id: 'di Acehers hanya diketahui dalam senyawa: katjang kelisa, buah kacang segitiga dan katjang
    parang, bunga-bunga yang dikonsumsi sebagai sajor, tetapi buah tidak dapat dimakan'
  meaning_en: 'at Acehers only known in the compounds: katjang kelisa, the triangular pea fruit and katjang
    parang, the flowers of which are consumed as sajor, but the fruit is inedible'
  meaning_nl: 'bij Atjehers alleen bekend in de verbindingen: katjang kelisa, de driehoekige peulvrucht
    en katjang parang, waarvan de bloemen als sajor worden genuttigd, doch de vrucht oneetbaar is'
