definitions:
- meaning_id: belanga tanah tua yang telau retak dan pecah yang dikhususkan sebagai tempat menggongseng
    kelapa yang telah dikukur, rempah-rempah
  meaning_en: an old cracked earthen pot kept for roasting grated coconut, spices
examples:
- aceh: beukah neuleuek tabayeue blang ông
  jawi: ''
  id: Jika belanga tua pecah, harus diganti dng belanga baru, yi keharusan mengganti sesuatu yg dipinjam
    walaupun yg dipinjam itu sudah lama atau tua
  en: ''
- aceh: ka jeuet keu neuleuek
  jawi: ''
  id: Sudah menjadi belanga tua (dikatakan ump thd pakaian yg sudah tua)
