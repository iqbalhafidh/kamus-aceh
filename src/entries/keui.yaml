headword: keui
jawi: ''
alt_spelling:
- keuih
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menguis, menyiah, menyalak, menyepak (dengan tangan atau kaki)
  meaning_en: to scrape aside, to move aside, to bark, to strike out with hand or foot
examples:
- aceh: ji keui kupiah lôn
  jawi: ''
  id: Ia menguis kopiah saya
  en: He knocked my cap aside
- aceh: lôn keui h'an ji-tem srot
  jawi: ''
  id: Saya menguisnya, tetapi tidak mau jatuh
  en: I poked at it, but it would not fall
- aceh: meu keui atau teu keui
  jawi: ''
  id: tersirah, dsb
  en: pushed aside, and so forth
- aceh: rob meu keui, hana lôn saja
  jawi: ''
  id: sudah tersiah, Saya tidak sengaja melakukannya
  en: it is already pushed aside; I did not do it on purpose
- aceh: peu keui
  jawi: ''
  id: = keui
  en: ''
- aceh: bek tapeu keui plok daweuet
  jawi: ''
  id: Anda jangan menguis tempat tinta itu
  en: Do not knock that inkstand aside
- aceh: Keumeui
  jawi: ''
  id: melakukan keui
  en: to do keui
