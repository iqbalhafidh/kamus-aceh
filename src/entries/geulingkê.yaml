- meaning_id: "geulincê, meugeucê, teugeulincê v\n tergelincir, salah berbicara: awai\n waktêe leuhô watêe — mata\n uroe si u mugrêb nibak siteungoh\n langêt, Permulaan waktu lohor\n ialah jika tergelincir matahari ke\n sebelah magrib dr setengah langit"
