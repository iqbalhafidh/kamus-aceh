definitions:
- meaning_id: liang
  meaning_en: hole
- meaning_id: lubang yang diperbuat dalam tanah atau pada dinding kuburan (dalam hal terakhir disebut
    juga leuhad atau – leuhad)
  meaning_en: a hole dug in the ground or in the wall of a grave, the latter also called leuhad
- meaning_id: tempat meletakkan jenazah (yang tidak dimasukkan ke dalam kerenda) dan hanya ditutupi papan
  meaning_en: ''
- meaning_id: lubang kematian, di mana orang meletakkan tubuh unboxed
  meaning_en: death pit, in which one lays the unboxed body
  meaning_nl: doodskuil, waarin men het ongekiste lijk legt
- meaning_id: bagian bawah kuburan, yang digali
  meaning_en: the lower part of the grave, which is excavated
  meaning_nl: het onderste gedeelte van het graf, dat uitgegraven wordt
