  id: Jangan engkau mengunjurkan kakimu jika makan, nanti panjang susumu (dikatakan kpd seorang dara kecil
    spy berlaku sopan jika makan)
  en: ''
- aceh: meu nyue
  jawi: ''
  id: duduk dengan mengunjurkan kaki
  en: ''
- aceh: teu nyue
  jawi: ''
  id: nyue, terbujur, terkujur
  en: ''
- aceh: bek taduek teu nyue nyue
  jawi: ''
  id: Jangan duduk dng mengunjurkan kaki
  en: ''
- aceh: le that ureueng matê teu nyue nyue
  jawi: ''
  id: Sangat banyak orang mati yg tergeletak di mana-mana
  en: ''
- aceh: eung-kôt abêh teu nyue nyue, ie ke thô
  jawi: ''
  id: Ikan tergeletak di mana-mana, air sudah kering
  en: ''
- aceh: neu nyue
