  en: he to work very slow
- aceh: bèk ta-peu lèk-lèk lèk-lèk droeteu, tajak bak bagaih
  jawi: ''
  id: Anda jangan berlambat-lambat, cepatlah berjalan
  en: Do not dawdle, walk quickly
