part_of_speech: adv
definitions:
- meaning_id: dapat, mampu, sanggup, mungkin, menjadi, boleh, jadi
  meaning_en: can, able, capable, possible, to become, may
examples:
- aceh: h'an jeuet lōn jak
  jawi: ''
  id: Saya tidak dapat pergi
  en: I cannot go
- aceh: h'an lōn jeuet jak
  jawi: ''
  id: Saya tidak berani pergi
  en: I dare not go
- aceh: lōn jak? jeuet
  jawi: ''
  id: Bolehkah saya pergi? boleh!
  en: May I go? You may!
- aceh: gata jeuet taseumurat?
  jawi: ''
  id: Dapatkah Anda menulis (surat)?
  en: Can you write a letter?
- aceh: meungnyoe jeuet, siplōh reunggèt lōn tueng, Jika boleh sasa-ya akan membelinya seharga sepuluh
    ringgit, h'an jeuet
  jawi: ''
  id: tidak boleh, tidak mungkin
  en: not permitted, not possible
- aceh: keu kaya, jeuet keu ulee-balang
  jawi: ''
  id: jeuet
  en: ''
- aceh: nyang jeuet (keu) meu-nan, sabab meunoe
  jawi: ''
  id: sudah menjadi begitu krn begini
  en: it became so because of this
- aceh: buet nyan hana jeuet meunan
  jawi: ''
  id: Pekerjaan itu tidak boleh atau dapat (dilaksanakan) secara begitu
  en: That work cannot be done in such a way
- aceh: thōn nyoe padé lè nyang hana jeuet
  jawi: ''
  id: Tahun ini banyak tanaman padi yg tidak menjadi
  en: This year much of the rice crop has failed
- aceh: bak èk jeuet
  jawi: ''
  id: sampai jadi
  en: until to become
- aceh: meu jeuet
  jawi: ''
  id: melakukan sesuatu sampai jadi walaupun dialami kesulitan, berdaya-upaya, sedapat-dapatnya
  en: to carry something through despite difficulty, to do one's utmost
- aceh: tameu jeuet
  jawi: ''
  id: Sedapat-daatnya Anda lakukan
  en: Do it as best you can
- aceh: meu jeuet
  jawi: ''
  id: kejadian
  en: to become
- aceh: sineu jeuet neu jeuet
  jawi: ''
