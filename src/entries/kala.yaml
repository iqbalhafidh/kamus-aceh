headword: kala
jawi: كلا
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kala, kala jengking
  meaning_en: time, scorpion
- meaning_id: kala, waktu
  meaning_en: time
- meaning_id: sejenis tumbuh-tumbuhan, bunganya berwarna putih dan rasanya asam (bungong –), rebungnya
    (reubông –) dimakan sebagai sayur atau sambal
  meaning_en: a kind of grow plant, its flower is white and its taste sour, its shoots are eaten as a
    vegetable or in sambal
- meaning_id: ketetapan, takdir, nasib (yang telah ditentukan oleh Allah) penggantian
  meaning_en: fixed, destiny, fate substitute (which have determined by God)
- meaning_id: scorpio
  meaning_en: scorpio
  meaning_nl: schorpioen
- meaning_id: waktu
  meaning_en: time
  meaning_nl: tijd
- meaning_id: sēdia kala, di masa lalu
  meaning_en: sēdia kala, in former times
  meaning_nl: sēdia kala, in vroegere tijden
- meaning_id: boengong kala, bunga merah dengan buah-buahan asam, dimakan sebagai sayuran atau sambal
  meaning_en: boengong kala, a red flower with sour fruits, eaten as vegetables or sambal
  meaning_nl: boengong kala, een roode bloem met zure vruchten, die als groente of in sambal wordt gegeten
- meaning_id: kala biloe, tanaman yang sama dengan daun harum
  meaning_en: kala biloe, same plant with fragrant leaves
  meaning_nl: kala biloe, een zelfde plant met welriekende bladeren
examples:
- aceh: seudia kala
  jawi: ''
  id: sedia kala, selalu, senantiasa, (juga) dahulu kala, pd masa lalu (dl hik)
  en: always, at all times; also formerly, in times past (in hikayat)
- aceh: sinja kala
  jawi: ''
  id: senja kala
  en: dusk
- aceh: meu kala
  jawi: ''
  id: sewaktu-waktu, dari waktu ke waktu (dl hik)
  en: from time to time (in hikayat)
- aceh: bilu
  jawi: ''
  id: sejenis tumbuh-tumbuhan kala yang tidak dapat dimakan, daunnya wangi untuk dicampurkan ke dalam
    air mandi
  en: an inedible kind of kala plant whose fragrant leaves are put in bathwater
- aceh: kada
  jawi: ''
  id: keputusan Tuhan
  en: decision God
- aceh: soe nyang h'an rila kala Tuhan, ureueng nyan hana meuiman
  jawi: ''
  id: barangsiapa tidak rela pada ketetapan Tuhan, orang itu tidak beriman (kepada Allah)
  en: whoever is not content with God's decree does not believe in God
- aceh: Seumayang kala
  jawi: ''
  id: sembahyang yang digantikan
  en: a prayer performed in substitution
etymology: ''
