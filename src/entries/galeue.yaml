headword: galeue
jawi: ݢاليو
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: 'mengempaskan diri merebahkan diri: pakon ji — atau ji —? Mengapa (anak itu) mengempaskan dirinya di tanah? bèk ta — baranggapat, teuboih ija-ija, Janganlah Anda merebahkan diri di mana-mana, akan kotor Anda'
  meaning_en: 'to throw oneself down, to prostrate oneself: pakon ji — atau ji —? Mengapa (anak itu) mengempaskan dirinya di tanah? bèk ta — baranggapat, teuboih ija-ija, Janganlah Anda merebahkan diri di mana-mana, akan kotor Anda'
  examples:
  - aceh: meu
    jawi: ''
    id: = geumeleue = teugaleue
    en: = geumeleue = teugaleue
  - aceh: peu
    jawi: ''
    id: mengempaskan, membaring kan, merebahkan diri
    en: ''
  - aceh: bèk tapeu — aneuk baranggapap! Janganlah Anda membaringkan anak dimana mana! teu
    jawi: ''
    id: terbaring
    en: 'pilgrimage, visiting the grave of a holy person: jak — bak kubu Teungku di Anjông, visiting Teuku''s grave in Anjông'
  - aceh: neungieng lé kuya plandók ka teu
    jawi: ''
    id: bak pageue, Orang tua itu melihat pelanduk telah berbaring di pagar
    en: ''
- meaning_id: geumaleue, membaringkan diri, sedang berbaring
  meaning_en: geumaleue, to lie down, lying down
  examples:
  - aceh: èk ji
    jawi: ''
    id: sabé, h'an jipioh sagai, Anak itu selalu mengempas-empaskan dirinya (di tanah), ia tidak mau berhenti, geumaleue, pembaringan
    en: sabé, h'an jipioh sagai, The child keeps rolling on the ground, he won't stop, geumaleue, lying down
