headword: '''umu'
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: umur, masa hidup, akhir hayat, masa, waktu ketika, selama, setelah
  meaning_en: age, time live, the end of life, time, time when, during, have
examples:
- aceh: geutanyoe siuroe simalam
  jawi: ''
  id: masa hidup kita sehari semalam
  en: ''
- aceh: meung na 'umu Poteu Allah bri, thon nyoe lôn meung jak u haji
  jawi: ''
  id: jika Tuhan memberikan umur, tahun ini saya akan pergi ke haji
  en: ''
- aceh: padum na 'umu aneuk nyan?
  jawi: ''
  id: berapakah umur anak itu?
  en: ''
- aceh: ka tok 'umu, sudah sampai umur (= sudah dewasa), na 'umu lhée uroe lôn di sinan teuma lôn woe
  jawi: ''
  id: Setelah tiga hari saya berada di sana, kemudian saya pulang
  en: ''
- aceh: cot uroe lôn tok u rumoh
  jawi: ''
  id: Waktu siang hari saya tiba di rumah
  en: ''
- aceh: sithôn lôn gisa teuma
  jawi: ''
  id: Setelah setahun saya kembali lagi
  en: ''
- aceh: si 'umu
  jawi: ''
  id: seumur, satu umur, sama umur, atau selama, selagi
  en: ''
- aceh: lôn ngon jih si 'umu
  jawi: ''
  id: Saya dan dia seumur
  en: ''
