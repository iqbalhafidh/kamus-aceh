definitions:
- meaning_id: mengelilingi rapat-rapat, berkerumun, mengepung
  meaning_en: to surround closely, to swarm, to crowd around, to besiege, to encircle
examples:
- aceh: ka ji hudôm jih
  jawi: ''
  id: Mereka sudah mengepungnya
  en: They have already surrounded him
- aceh: meu hudôm
  jawi: ''
  id: berkerumun
  en: to swarm, to crowd around
- aceh: ureueng meu hudôm kalon piasan
  jawi: ''
  id: Orang berkerumun-melihat pertunjukan
  en: People crowd round to watch the show
- aceh: pakon ureueng meu hudôm di sinan?
  jawi: ''
  id: Mengapa orang berkerumun di situ?
  en: Why are people crowding round there?
