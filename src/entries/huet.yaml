definitions:
- meaning_id: suara gerakan yang cepat sekali di udara (umpamanya pedang atau tongkat yang diayun cepat-cepat)
  meaning_en: the sound of very rapid movement through the air (for example a sword or stick swung quickly)
examples:
- aceh: meu h'uet, membuat suara h'uet
  jawi: ''
  id: berdesing
  en: whizz
- aceh: jiêk tajam pantaih meu h'uet
  jawi: ''
  id: Ia naik cepat ke udara dng memperdengarkan suara berdesing
  en: It rose swiftly into the air with a whizzing sound
- aceh: peu h'uet
  jawi: ''
  id: membuat suara berdesing
  en: to make a whizzing sound
- aceh: peu h'uet tungkat
  jawi: ''
  id: mengayunkan tongkat dng suara berdesing
