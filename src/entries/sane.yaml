- meaning_id: datang dari satu sisi. juga dikatakan doea né, berasal dari dua sisi, dan lebih jauh lèhée3,
    berasal dari tiga sisi, pèt né, berasal dari empat sisi, lihat lebih lanjut né
  meaning_en: coming from one side. It is also said to be doea né, coming from two sides, and further
    lèhée né, coming from three sides, pèt né, coming from four sides, see further né
  meaning_nl: van één kant komen. Men zegt ook doea né, van twee kanten te gelijk komen, en verder lèhée
    né, van drie kanten komen, pèt né, van vier kanten komen, zie verder né
