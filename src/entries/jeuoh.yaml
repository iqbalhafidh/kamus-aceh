  id: di kejauhan, pd jarak yg jauh
  en: in the distance, at a great distance
- aceh: wali jeuôh
  jawi: ''
  id: seorang anggota keluarga jauh
  en: a distant relative
- aceh: that bide peuneugêt nyan ngon peuneugêt nyoe
  jawi: ''
  id: Buatan itu jauh sekali perbedaannya dng buatan ini
  en: That workmanship differs greatly from this
