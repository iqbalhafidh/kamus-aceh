  jawi: ''
  id: kue lapis
  en: cake layer
- aceh: rumoh lhèe
  jawi: ''
  id: rumah tingkat tiga
  en: house level three
- aceh: meu lapèh, (dl hik meuleu lapèh)
  jawi: ''
  id: berlapislapèh(lapis)
  en: ''
- aceh: gleueng meu lapèh
  jawi: ''
  id: Gelang tembaga yg dilapisi (lebih lazim dipergunakan mubalot, dibalut) selapis suasa
  en: a copper bracelet plated with a layer of gold alloy
