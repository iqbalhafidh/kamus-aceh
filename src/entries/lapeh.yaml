definitions:
- meaning_id: lapis, salut, lapisan, lapik (untuk kain), tingkat (untuk kain), tingkat (untuk rumah)
  meaning_en: layer, coating, mat (for cloth), level (for cloth), level (for house)
examples:
- aceh: jingui bajèe dua lhee lapèh
  jawi: ''
  id: Ia memakai baju dan tiga lapis
  en: He wears three layers of clothing
