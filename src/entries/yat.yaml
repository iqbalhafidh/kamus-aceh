definitions:
- meaning_id: salah satu dari empat syarat (jika digabungkan semua) untuk membuktikan suatu pelanggaran
    kejahatan (umpamanya pencurian) menurut hukum adat Aceh
  meaning_en: ''
- meaning_id: tingkah laku terdakwa
  meaning_en: ''
- meaning_id: (umpamanya ia dilihat berada dekat tempat terjadinya kejahatan atau jejak yang ditinggalkannya
    atau tanda-tanda lain 3pt pakaiannya)
  meaning_en: for instance being seen near the scene of the crime, or by the tracks or other marks left
    on his clothing
- meaning_id: kinayat = keterangan terdakwa atau tingkah lakunya
  meaning_en: 'circumstantial evidence: the accused''s statement or his behaviour'
- meaning_id: peunyabet = pembenaran
  meaning_en: ''
- meaning_id: bahwa terdakwa dijumpai memegan atau memiliki barang curian atau pembuktian saksi
  meaning_en: that the accused was found holding or possessing stolen goods, or the testimony of witnesses
- meaning_id: haleue meue = benda yang dipergunakan untuk melakukan kejahatan seperti senjata atau benda
    curian yang terdapat pada terdakwa
  meaning_en: the instrument of a crime, such as a weapon, or stolen goods found on the accused
- meaning_id: —
  meaning_en: ''
- meaning_id: kinayat
