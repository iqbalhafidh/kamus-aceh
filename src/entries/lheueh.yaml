- aceh: jimeulho jimeu lheueh
  jawi: ''
  id: Mereka berkelahi utk mengetahui siapa yg lebih kuat dr mereka. peu lheueh, melepaskan, menembakkan
    (ump senapan), menyeberangi (sungai), membawa ke seberang sungai, menyampaikan sesuatu hajat
  en: They fight to see which of them is the stronger
- aceh: jalô pumeu lheueh
