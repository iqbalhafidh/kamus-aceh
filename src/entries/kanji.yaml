headword: kanji
jawi: کَنَجِی
alt_spelling:
- kandji
ipa: ''
part_of_speech: n
definitions:
- meaning_id: bubur tepung (biasanya dibubuhi bermacam-macam bumbu ke dalamnya)
  meaning_en: a flour porridge, usually with various spices added
- meaning_id: pati, sejenis bubur
  meaning_en: starch, a kind of porridge
  meaning_nl: stijfsel, een soort van pap
examples:
- aceh: kanji leumak
  jawi: ''
  id: bubur santan dengan garam, kanji manèh, mameh, bubur santan dng gula
  en: coconut-milk porridge with salt; with sugar, a sweet porridge
- aceh: kanji nira
  jawi: ''
  id: bubur santan, gula dng nira enau, kanji ie bu peudaih, bubur dng rempah-rempah dan daun-daunan,
    kanji rumbi, rumi, bubur dng minyeuk sapi, bubur ayam dng rempah-rempah
  en: coconut porridge with sugar and palm sap; a spiced porridge with herbs; a porridge with ghee, or
    a spiced chicken porridge
