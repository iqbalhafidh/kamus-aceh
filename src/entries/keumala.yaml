headword: keumala
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: salah satu benda (biasanya batu, permata) yang dianggap sakti, salah satu tanda pada tubuh
    seseorang yang memiliki keajaiban (umpamanya bahagian lidah yang hitam, rambut keras yang menegang
    di kepala), cahaya cemerlang, nama kenegerian dalam daerah kebupatin Pidie, Pidie, nama wanita
  meaning_en: one of the objects, usually a stone, a gem held to be magically potent, a mark on the body
    held to confer magical power, such as a black patch on the tongue, stiff hair standing up on the head,
    light brilliant, the name of a district in the regency of Pidie, Pidie, name women
examples:
- aceh: 'hekeumat, permata ajaib, permata sakti: meukeumala'
  jawi: ''
  id: memiliki keumala, memiliki tanda ajaib, bercahaya-cahaya
  en: to possess a keumala, to bear a magic sign, to glow
