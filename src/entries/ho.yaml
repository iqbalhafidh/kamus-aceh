- aceh: dadang-dadang geumeuhaba, uroe pi teuma lé ho sinja
  jawi: ''
  id: Sedang mereka bercerita-cerita, lama kelamaan hari pun senja
  en: While they were talking, evening gradually fell
- aceh: siuroe bak siuroe
  jawi: ''
  id: dr sehari ke hari = setiap hari
  en: from day to day = every day
- aceh: trêb ho raya lé
  jawi: ''
  id: semakin lama semakin besar
  en: growing larger and larger
- aceh: ka
  jawi: ''
  id: berada di mana
  en: there is at which
- aceh: ka si Gam
  jawi: ''
  id: Di mana (berada) si Gam?
  en: Where is si Gam?
- aceh: balé ho ka teuku bandum
  jawi: ''
  id: Nah, di mana Anda sekalian, para Teuku
  en: Well then, where are you all, Teuku?
- aceh: ka atra lôn nyang lôn peuduek sinoe?
