headword: jinamèe
jawi: جنامو
alt_spelling:
- jeunamèe
- djinamée
ipa: ''
part_of_speech: n
definitions:
- meaning_id: mas kawin, mahar pengantin laki-laki kepada pengantin perempuan
  meaning_en: bride price, the dower given by the bridegroom to the bride
- meaning_id: mahar, hadiah pernikahan yang diberikan kepada sebelum menikah, yang, setelah selesai, jika
    tampaknya tidak ada kucing yang dibeli dalam tas, diserahkan kepada orang tua gadis itu
  meaning_en: dowry, wedding gift that is given to the tëlangké before marriage, which, after completion,
    if it appears that no cat has been bought in the bag, is handed over to the parents of the girl
  meaning_nl: bruidschat, huwelijksgift welke men vóór het huwelijk aan de tëlangké ter hand stelt, die
    ze na de voltrekking, indien blijkt, dat men geen kat in den zak heeft gekocht, aan de ouders van
    het meisje ter hand stelt
examples:
- aceh: janjijinamèe
  jawi: ''
  id: masa sepasang pengantin baru ditanggung biaya penghidupannya oleh orang tua pengantin perempuan
  en: the period in which a newly married couple is supported by the bride's parents
- aceh: jinamèe Acèh
  jawi: ''
  id: mahar Aceh, yi hadiah yg harus diberikan oleh seorang raja Aceh kpd masing-masing kepala sagi ketika
    ia dinobatkan
  en: the Acehnese dower, the gift a sultan of Aceh must give each sagi chief at his enthronement
