ipa: ''
part_of_speech: n
definitions:
- meaning_id: keranda, peti mati
  meaning_en: coffin
examples:
- aceh: lapek keureunda
  jawi: ''
  id: pembalut keranda, yi tikar atau permadani yg diikat dng kain putih diluar keranda yg setelah penguburan
    biasanya dihadiahkan kepada maunasah
  en: the bier wrapping, a mat or carpet bound with white cloth outside the bier, usually given to the
    prayer house after burial
- aceh: cicem keureunda
  jawi: ''
  id: burung keranda, sj burung hutan dng paruh menyerupai keranda
  en: the coffin bird, a forest bird whose beak resembles a bier
- aceh: meu keureunda
  jawi: ''
  id: berkeranda atau menyerupai keranda
  en: having a bier, or resembling one
- aceh: geukheun cicem keureunda sabab bak uleeji meu keureunda
  jawi: ''
  id: disebut burung keranda, krn kepalanya menyerupai keranda
  en: called the coffin bird because its head resembles a bier
