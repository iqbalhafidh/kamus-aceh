definitions:
- meaning_id: 'ukuran untuk beban besar: koejan koejan = goentja = pikols, koejan goentja = nalé = piklas,
    koejan nalé =, koejan aré = kal = atau tiang berat'
  meaning_en: 'size for loads in large loads: koejan koejan = goentja = pikols, koejan goentja = nalé
    = pikols, koejan nalé = aré, koejan aré = kal = or or pillar mats heavy'
  meaning_nl: 'maat voor ladingen in groote vrachten: 1 koejan = 10 goentja = 40 pikols, 1 goentja = 10
    nalé = 4 pikols, 1 nalé = 16 aré, 1 aré = 4 kal = 63 of 56 of 48 pilaarmatten zwaar'
