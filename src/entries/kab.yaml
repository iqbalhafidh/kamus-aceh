headword: kab
jawi: كب
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menggigit, melekat pada
  meaning_en: bite, to adhere to
- meaning_id: menggigit manusia dan hewan
  meaning_en: biting of humans and animals
  meaning_nl: bijten van menschen en dieren
- meaning_id: mekab, menggigit satu sama lain
  meaning_en: mekab, bite each other
  meaning_nl: mêkab, elkaâr bijten
- meaning_id: kamekab, gigit
  meaning_en: kamekab, bite
  meaning_nl: kêmêkab, bijten
examples:
- aceh: jih ji kab lé asèe
  jawi: ''
  id: Ia digigit (oleh) anjing
  en: he bite dog (by)
- aceh: bibi
  jawi: ''
  id: menggigit bibir
  en: bite lip
- aceh: gigoe, menggigit gigi, ki
  jawi: ''
  id: memaksakan
  en: to compel
- aceh: h'an ji kab lé
  jawi: ''
  id: ie, tidak dapat lagi melekatkan air, tidak dapat lagi menyerap air (ump larutan bahan pewa rna)
  en: no longer able to hold or absorb water, as a dye solution
- aceh: aneuk nyan ka ji kab pinggang
  jawi: ''
  id: Anak itu sudah dapat dipapaiakan kain sarung. (= sudah akil baligh
  en: That child can now wear a sarong (= has reached puberty)
- aceh: meu kab
  jawi: ''
  id: berkelahi, menggigit (unt binatang bergigi), digigit melekat (ump luka yang sudah merapat dagingnya),
    menyala (ump api yang dihidupkan)
  en: to fight, to bite (of toothed animals), to be bitten and cling (as a wound whose flesh has closed),
    to catch (of a fire)
- aceh: guda meu kab
  jawi: ''
  id: kuda yang sedang menggigit
  en: a horse that is biting
- aceh: 'luka lôn ka meu kab, Luka saya telah merapat dagingnya. (kab sudah mendekati sembuh): ija sawak
    inong nyan ''oh meu kab bak dadaji'
  jawi: ''
  id: Kain selendang wanita itu melekat di dadanya
  en: That woman's shawl clings to her breast
- aceh: apui ka meu kab
  jawi: ''
  id: Api (yang dihidupkan) sudah menyala
  en: The fire has caught
- aceh: peu kab
  jawi: ''
  id: membiarkan digigit sesamanya, melekatkan, menyalakan
  en: to allow bite same, to stick, flame
- aceh: peu kab daruet klêng
  jawi: ''
  id: melagakan cengkerik
  en: to set crickets fighting
- aceh: peu kab
  jawi: ''
  id: mei, bernazar memperkelahikan atau mengadu kucing (biasanya dilakukan pada waktu diadakan upacara
    perkawinan dengan mengadu dua ekor kucing di hadapan kedua pengantin)
  en: to vow a cat fight, usually held at a wedding by setting two cats against each other before the
    couple
- aceh: peu kab glunyueng
  jawi: ''
  id: melekatkan telinga yang sobek
  en: to mend a torn earlobe
- aceh: peu kab apui
  jawi: ''
  id: menyalakan api
  en: fire flame
- aceh: teu kab
  jawi: ''
  id: tergigit
  en: bite
- aceh: teu kab jaroe bak keubeue
  jawi: ''
  id: tergigit jari oleh kerbau
  en: to have a finger bitten by a buffalo
- aceh: keumeu kab
  jawi: ''
  id: melakukan kab, sedang menggigit, menjadi rusak (ump kain, kayu)
  en: to bite; to be damaged, as cloth or wood
- aceh: rimeung teungoh ji keumeu kab, Harimau sedang menggigit (ump kambing) guda keumeu kab
  jawi: ''
  id: kuda yang suka menggigit
  en: a horse given to biting
