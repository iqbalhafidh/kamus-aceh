headword: leubè
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: lebai, alim (seseorang yang sekedar mengetahui peraturan-peraturan agama Islam dan selalu
    mentaatinya tanpa sengaja mempelajarinya, digelarkan teungku), lebai setengah alim
  meaning_en: mosque official, pious, of one who knows and obeys the rules of Islam without formal study,
    title teungku (religious title), a half-learned mosque official
examples:
- aceh: Lam Arè, siah Lam Glumpang, 'oh silap mata leubè, geutòh èk saboh eumpang
  jawi: ''
  id: Seorang lebat di kampung Lam Ara. Seorang syeikh di kampung Lam Glumpang. Ketika silap mata sang
    lebat, berakhlak ia satu sumpit
  en: A mosque official in Lam Ara, a sheikh in Lam Glumpang; when the official's eye strayed, he made
    off with a sackful
- aceh: meujanggòt-janggòt kasè, mumisè-misè udeueng, lòn sangka leubè, hana lon thèe pancuri ureueng
  jawi: ''
  id: berjanggut spt ikan kasè, berkumis spt udang, Saya menyangka ia seorang lebat, tahu-tahu seorang
    pencuri
  en: ''
- aceh: peu leubè droe
  jawi: ''
  id: bersikap spt lebat
  en: to behave like dense
