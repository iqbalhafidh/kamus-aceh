headword: hōm
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: menyatakan tidak tahu secara pasti
  meaning_en: to state that one does not know for certain
examples:
- aceh: peue sabab hana jiteuka keunoe? hōm
  jawi: ''
  id: hana lōn tupeue, Apa sebabnya ia tidak datang kemari? Entahlah, saya tidak tahu. na takalon si Gam
    jak rét nyan? hōm, bunoe na ureueng jak, salah jih, saléh kon, hana lōn peudeueh, Adakah Anda melilhat
    si Gam berjalan di jalan itu? Entahlah, tadi ada orang berjalan (di situ), apakah dia atau bukan,
    saya tidak mempedulikan-nya. peu hōm, mengatakan tidak tahu atas suatu pertanyaan
  en: 'Why has he not come here? Who knows, I do not know. Did you see si Gam walking along that road?
    Who knows, someone was walking there just now, whether it was him or not I did not pay attention.
    peu hōm: to say one does not know in answer to a question'
