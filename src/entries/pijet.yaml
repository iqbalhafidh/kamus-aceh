  id: (pertama) nyamuk, (kedua) kutu, dan ketiga kepinding (adalah binatang yg mengganggu orang dan tidak
    berdosa jika dibunuh)
  en: ''
- aceh: bèk lagèe ureueng ba pijét
  jawi: ''
