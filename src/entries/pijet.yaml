- aceh: geusuen lagèe pijét
  jawi: ''
  id: penakut spt kepinding
  en: ''
- aceh: taharap keu kleumbu, kleumbu mu pijét, taharap keu teungku, teungku pi sulèt, kita percaya kpd
    kelambu, kelambu berkepinding, kita percaya kpd teungku, teungku
