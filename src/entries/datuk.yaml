  meaning_en: title of the Mal. heads in the Asjehs descendants populated by Malaysians. Attractive to
    the tiger, is also said jestfully to old people
  meaning_nl: titel der Mal. hoofden in de door Maleiers bevolkte Atjehsche Onderhoorigheden. Aanspreeknaam
    voor den tijger, wordt ook wel schertsenderwijze tot oude menschen gezegd
