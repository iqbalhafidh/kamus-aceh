    atau seseorang dalam kedudukan demikian yang akan dilalui oleh iring-iringan pembawa jenazah
  meaning_en: ''
- meaning_id: dimulai dari tangga rumah si mati sampai jauh di luar kampung dan sewaktu iring-iringan
    bergerak disobek oleh penduduk kampung yang sedang berjalan
  meaning_en: ''
- meaning_id: masing-masing sepanjang 4 hasta yang kemudian diba gi-bagikannya lagi dalam sobekan-sobekan
    kecil kepada sesama mereka
  meaning_en: ''
