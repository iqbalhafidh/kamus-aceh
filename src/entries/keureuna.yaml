headword: keureuna
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: karena, sebab, alasan, membicarakan sesuatu dengan bukti, menuduh, mengira-ngira
  meaning_en: because, reason, to argue something with evidence, to accuse, to estimate
examples:
- aceh: lon jak keu noe keureuna droeneu tawok
  jawi: ''
  id: Saya datang ke mari krn Anda yg memanggil
  en: I came here because you called me
- aceh: tahukom gob keureuna Allah, bek ube darah keureuna donya
  jawi: ''
  id: Hukumlah krn Allah semata-mata dan jangan krn kemauan dunia, walaupun mengenai urusan yg sebesar
    zarrah
  en: Judge for God's sake alone and not for worldly desire, even in a matter as small as an atom
- aceh: jih mupaloe lon
  jawi: ''
  id: krn dia, saya menderita
  en: because of him I suffer
- aceh: bek ta keureuna keureuna keu gob!
  jawi: ''
  id: Anda jangan menuduh orang!
  en: Do not accuse people!
