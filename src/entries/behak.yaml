headword: bèhak
jawi: بهق
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: lelah, tenang (laut)
  meaning_en: weary, lying (of the wind), calm (the sea)
  meaning_nl: vermoeid, afgemat, liggen (van den wind), bedaren (van de zee)
examples:
- aceh: di lun ka behak han ik lun pelung le
  aceh_1889: di loen ka bèhak han ik loen pèloeng lé
  jawi: ''
  id: sejauh yang aku ketahui, aku sangat lelah, aku tak bisa lari lagi
  en: as far as I'm concerned, I'm so tired, I can't run away anymore
  nl: wat mij betreft, ik ben zoo afgemat, dat ik niet meer kan wegloopen
- aceh: angen ka behak han jijak le prahu
  aceh_1889: angen ka bèhak han djidjak lé prahoe
  jawi: ''
  id: angin telah turun, merak tidak bergerak maju sinonim dengan pèhak
  en: the wind has gone down, the peacock is not moving forward. Synonymous with pèhak
  nl: de wind is gaan liggen, de prauw gaat niet meer vooruit. Synoniem met pèhak
