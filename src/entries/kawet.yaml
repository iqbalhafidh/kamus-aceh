headword: kawet
jawi: ''
alt_spelling:
- kawét
ipa: ''
part_of_speech: n
definitions:
- meaning_id: sangkutan, kaitan (umpamanya pada rantai dan sebagainya), duri
  meaning_en: a hook, a peg, hook (for example on chain and as), thorn
examples:
- aceh: bajèe
  jawi: ''
  id: kaitan baju, sj perhiasan dada dr emas yg berbentuk setengah lingkaran pd rantai emas atau sejenisnya
    utk digantungkan di leher
  en: a garment clasp, a half-moon gold breast ornament on a gold chain worn at the neck
- aceh: bajèe meuantèng-antèng
  jawi: ''
  id: kaitan baju dng gantungannya
  en: a garment hook with its loop
- aceh: côt eumpeuen kamèng, sj pisau berbentuk kaitan sebagai pemotong (hrf menjolok) daun-daun utk makanan
    kambing, ikan kawét
  jawi: ''
  id: sj ikan air asin dng semacam kaitan di ekornya
  en: a kind of saltwater fish with a hook-like appendage on its tail
- aceh: si kawét, nama anjing yg ujung ekornya bengkok, bak si kawét
  jawi: ''
  id: si tumbuhan, durinya menyerupai kaitan, berbunga ungu indah dan daunnya dapat dipergunakan sbg obat
    bisul
  en: the plant whose thorns are like hooks, with fine purple flowers and leaves used to treat boils
- aceh: meukawét, berkait, menyerupai kaitan
  jawi: ''
  id: melakukan kawét
  en: to do kawét
- aceh: jak keumaw'eueh
  jawi: ''
  id: mengantarkan nasi dengan hadiah-hadiah kepada perempuan hamil
  en: to bring rice with gifts to a pregnant woman
