headword: lhôh
jawi: ''
alt_spelling:
- lôh
- lhoh
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menerangi sesuatu, peneropong, memperhatikan, memeriksa, (dengan perantaraan tenung), menyuruh
    terangi, meminta penjelasan, keterangan (tentang masalah-masalah agama atau sesuatu yang ditenung)
  meaning_en: to light something up, a spyglass, to pay attention to, to examine, by means of divination,
    to have something lit up, to ask for an explanation, an explanation of religious questions or of something
    divined
- meaning_id: mencabut (umpamanya gigi)
  meaning_en: to pull out (for example tooth)
- meaning_id: membongkar
  meaning_en: to dismantle
- meaning_id: merombak (umpamanya rumah
  meaning_en: ''
- meaning_id: senapan
  meaning_en: rifle
- meaning_id: jam)
  meaning_en: hour
examples:
- aceh: jak lhôh eungkôt lam krueng
  jawi: ''
  id: mencari ikan di sungai dng menggunakan penerangan obor
  en: ''
- aceh: neu lhôh keu noe siat!
  jawi: ''
  id: terangi ke mari sebentar!
  en: ''
- aceh: ji lhôh droe lam ceureumèn, Ia melihat dirinya di kaca, ceureumèn lhôh droe
  jawi: ''
  id: kaca utk melihat diri
  en: ''
- aceh: meu lhôh
  jawi: ''
  id: diterangi dng sesuatu, diperiksa, melihat dikaca
  en: ''
- aceh: seumeulôn, melakukan lhoh
  jawi: ''
  id: bercahaya-cahaya, gilang-gemilang
  en: gleaming, resplendent
- aceh: ureueng jak seumeulôh
  jawi: ''
  id: pencari ikan yg menggunakan lampu atau obor
  en: ''
- aceh: seuneulôh
  jawi: ''
  id: penerangan, lampu sorot, kilau
  en: ''
- aceh: rumoh
  jawi: ''
  id: membongkar rumah
  en: to dismantle house
- aceh: gigoe lôn ka meugok-gok, lôn keumeung yue lhoh
  jawi: ''
  id: Gigi saya sudah bergoyang. Saya hendak mencabutnya
  en: My tooth is loose; I want to have it pulled
- aceh: teu lhoh
