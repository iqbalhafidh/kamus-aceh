  id: Seluruh badannya berpuru, berkudis, dan berbau apak, Kulitnya kotor berwarna hitam pekat
  en: His whole body is covered with yaws and scabies and smells musty; his skin is filthy and jet black
- aceh: Tuhan gaseh keu ureueng lutök nyang ngui peukayan brok
  jawi: ''
  id: Tuhan sayang kpd orang miskin yg berpakaian buruk (dr pd orang kaya yg berpakaian bagus, tetapi
    diperolehnya dr perbuatan yg tidak baik)
  en: God loves the poor man in shabby clothes more than the rich man finely dressed by ill-gotten means
- aceh: meu lutök, dikotori, peu lutök
