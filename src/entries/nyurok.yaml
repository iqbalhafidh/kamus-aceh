  id: Berapa orangkah berpihak kpdnya?
  en: ''
- aceh: padum na kaphê nyang ka tak-lôk, nyang ka nyurôk ubak gata?
  jawi: ''
  id: Berapa banyakkah orang-orang kafir yg telah takluk dan berpihak kpd Anda?
