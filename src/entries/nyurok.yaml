part_of_speech: v
definitions:
- meaning_id: menyuruk, masuk atau bersembunyi ke bawah sesuatu dengan membungkuk badan, cenderung ke
    suatu arah, memilih arah, berdiri di suatu pihak
  meaning_en: to creep under, to go or hide under something by stooping, inclined to a certain direction,
    to choose a direction, to take a side
examples:
- aceh: padum droe ureueng nyang nyurôk bak jih?
