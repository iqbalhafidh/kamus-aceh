ipa: ''
part_of_speech: ''
definitions:
- meaning_id: bunyi logam yang bergesekan dengan benda lain, bunyi gesekan sabut kelapa dengan benda lain,
    seperti periuk, bunyi sesuatu yang diseret di tanah
  meaning_en: the sound of metal rubbing against another object, the sound of coconut husk rubbing against
    another object, like cooking pot, the sound of something being dragged along the ground
examples:
- aceh: peue ka harut-harut, ie ka hana lé
  jawi: ''
  id: Apa yg engkau buat terus, air sudah tidak ada lagi
  en: What are you doing all this time? The water is finished
- aceh: meu harut-harut
  jawi: ''
  id: bunyi gesekan
  en: sound friction
- aceh: peu harut-harut
  jawi: ''
  id: memperdengarkan bunyi harut-harut
  en: to make a harut-harut sound
- aceh: dumpeue jipeu harut-harut
  jawi: ''
  id: semua diseretnya di tanah
  en: all dragged at earth
