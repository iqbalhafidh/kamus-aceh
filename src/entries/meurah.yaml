part_of_speech: n
definitions:
- meaning_id: gelar kepala-kepala teritorial pada masa sebelum Aceh menjadi kesultanan, gelar wanita atau
    laki-laki keturunan kepala-kapala, gelar tokoh-tokoh ternama pada masa dahulu atau orang-orang keramat
    dan penamaan untuk gajah
  meaning_en: the title of territorial chiefs before Aceh became a sultanate, a title for men or women
    descended from chiefs, the title of eminent figures of former times, of saints, and a name for the
    elephant
