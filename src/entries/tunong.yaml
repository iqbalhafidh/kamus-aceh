part_of_speech: v
definitions:
- meaning_id: bertunang
  meaning_en: to be betrothed
- meaning_id: perjanjian untuk mengadu hewan setelah berlalu suatu jangka waktu dan
    taruhan tertentu
  meaning_en: ''
- meaning_id: udik
  meaning_en: upriver
- meaning_id: daerah pedalaman
  meaning_en: district in
- meaning_id: pedalaman
  meaning_en: in
- meaning_id: di hulu (sungai)
  meaning_en: at upper reaches (river)
- meaning_id: selatan
  meaning_en: south
- meaning_id: —
  meaning_en: ''
