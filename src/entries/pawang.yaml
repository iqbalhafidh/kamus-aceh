part_of_speech: n
definitions:
- meaning_id: pawang, juru tangkap binatang liar, pemburu, pandu, jurumudi, pemimpin, kepala, memawangi
    sesuatu, memimpin, mengurus
  meaning_en: shaman, specialist catch animal wild, to hunt, pilot, helmsman, leader, head, shaman something,
    to lead, to manage
- meaning_id: seseorang yang berpengalaman di perusahaan dan bisa bertindak sebagai bos atau kepala di
    dalamnya
  meaning_en: a person who is experienced in a company and who can act as a boss or head in it
  meaning_nl: iemand, die in een bedrijf ervaren is en als baas of hoofd daarin kan optreden
- meaning_id: pawang poekat, kepala Fishschers
  meaning_en: pawang poekat, Head of Fishschers
  meaning_nl: pawang poekat, hoofd der visschers
- meaning_id: pawang sampan, pencipta
  meaning_en: pawang sampan, creator
  meaning_nl: pawang sampan, schepper
- meaning_id: pawang batée, gudang
  meaning_en: pawang batée, warehouse
  meaning_nl: pawang batée, loods
- meaning_id: pawang oenoi, seseorang yang ahli dalam melacak lebah-lebah misknests
  meaning_en: pawang oenoi, someone skilled in tracking bees' nests
  meaning_nl: pawang oenoi, iemand, bedreven in 't opsporen van bijennesten
- meaning_id: pawang roesa, hertenjager
