part_of_speech: n
definitions:
- meaning_id: kain kapan, kain putih pembungkus mayat
  meaning_en: cloth when, the white cloth in which a corpse is wrapped
examples:
- aceh: balôt ngon kaphan
  jawi: ''
  id: membalut (mayat) dng kain kapan
  en: to wrap a corpse in a shroud
- aceh: 'taloe kaphan, tali-tali pd kain kapan utk pengikat: udép bak saré maté bak sajan, sikrak kaphan
    saboh k(eu)reunda'
  jawi: ''
  id: (mari kita) hidup dan mati bersama dibalut dengan sehelai kain kapan serta dikuburkan dl sebuah
    keranda (pb pantun pengharapan para kekaphan kasih)
  en: (let us) live and die together, wrapped in one shroud and buried in one bier
- aceh: tajak u glé tajak koh pakaphan pan, tamè lôn sajan tajak pilèh lha
  jawi: ''
  id: pergi ke gunung memotong papan, sertailah saya untuk mekaphan ngumpulkan bilahnya
  en: going to the hills to cut planks, come with me to gather the strips
