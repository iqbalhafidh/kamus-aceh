headword: kubôk
jawi: ''
alt_spelling:
- meukubôk
ipa: ''
part_of_speech: a
definitions:
- meaning_id: berkerumun, berkumpul-kumpul, berkepul-kepul umpamanya orang banyak, asap atau bau
  meaning_en: to swarm, to crowd around, to gather together, thronging, as of a crowd, smoke or smell
examples:
- aceh: ureueng meu kubôk kubôk that di peukan
  jawi: ''
  id: Banyak orang berkerumun di pasar
  en: Many people crowd in the market
- aceh: le that asap bak dapu, meu kubôk kubôk
  jawi: ''
  id: Di dapur banyak sekali asap berkepul-kepul
  en: Great clouds of smoke billow in the kitchen
- aceh: meu kubôk that bèe bangké hinoe
  jawi: ''
  id: Ada bau bangkai di sini!
  en: There is a smell of carrion here!
- aceh: peu kubôk
  jawi: ''
  id: membuat berkerumun, berkumpul, berkepul-kepul
  en: to make to swarm, to gather, puff of smoke puff of smoke
- aceh: bèk tapeu kubôk asap!
  jawi: ''
  id: Anda jangan membiarkan kepul-kepul asap!
  en: Do not let the smoke billow!
etymology: ''
related_words:
- keubôk
- kubô
