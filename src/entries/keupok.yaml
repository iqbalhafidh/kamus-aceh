part_of_speech: n
definitions:
- meaning_id: kepuk atau kapuk, lumbung padi terbuat dari kulit kayu atau bambu yang dianyam, berbentuk
    torak besar dengan tutup dan alas kayu, bambu yang dianyam atau alang-alang yang ditempatkan di bawah
    rumah, biasanya bertiang, (kiasan) tubuh yang besar dan gemuk
  meaning_en: kapok, a rice granary made of bark or plaited bamboo, a large cylinder with a wooden lid
    and base, plaited bamboo or cogon grass placed beneath the house, usually post, (figuratively) a large
    stout body
examples:
- aceh: meu keupok
  jawi: ''
  id: keupok, berkepuk-kepuk, berkeupok
  en: to thud repeatedly
