definitions:
- meaning_id: '~ AL-MUDDATSTSIR (ORANG YANG BERSELIMUT) Pendahuluan: Makkiyyah, ayat ~ Surat mulia ini
    mengajak Rasulullah saw. untuk memperingatkan kaumnya, mengagungkan Allah dan meninggalkan segala
    hal yang tidak pantas dilakukan. Dalam surat ini dibicarakan juga perihal tiupan sangkakala dan azab
    yang pedih bagi orang-orang kafir'
