headword: iseueng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ingsang, bagian-bagian di kiri kanan leher di bawah rahang. tempuling dan lain-lain yang
    menyamai ingsang, bagian tertentu pada pukat
  meaning_en: gill, the parts on either side of the neck below the jaw; a harpoon and the like resembling
    a gill, a particular part of a seine net
examples:
- aceh: lôn sakét lam iseueng
  jawi: ''
  id: Di bawah rahang saya terasa sakit. keumang iseueng, insangnya berkembang, sesuatu yg menjijikkan
    atau memuakkan
  en: It hurts below my jaw
- aceh: keumang iseueng lôn watèe lôn kalom gulè nyan
  jawi: ''
  id: Muak saya melihat sayur itu. iseueng (mata) kawe, insang pancing
  en: I am sickened at the sight of that vegetable
- aceh: bak si nyan meungnyo ka meu iseueng
  jawi: ''
  id: bandum pi eungkôt, Bagi orang itu, semua yg berinsang adalah
  en: To that man, everything with gills is a fish
etymology: ''
related_words:
