headword: linceuet
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: percik
  meaning_en: splash
examples:
- aceh: bêk tapeuek ie, linceuet ateueh gob!
  jawi: ''
  id: Anda jangan membuang air, terpercik ke atas orang
  en: you do not to throw away water, splash to upon person
- aceh: peue sikin nyoe, êk tatak linceuet
  jawi: ''
  id: '! Pisau apa ini? Tahi dipotong pun melompat (demikian majalnya)'
  en: What sort of knife is this? It bounces even off dung, so blunt is it
- aceh: meu linceuet, teu linceuet
  jawi: ''
  id: (yg pertama lebih banyak merupakan tindakan, sedang yg kedua sbg keadaan atau ketidaksengajaan)
  en: the first is rather an action, the second a state or something unintended
- aceh: pakon meunan taplê ie, habêh meu linceuet ateueh gob!
  jawi: ''
  id: Mengapa begitu Anda menuang air shg terpercik ke atas orang!
  en: Why do you pour the water so that it splashes people!
- aceh: darah teu linceuet ateueh jih
  jawi: ''
  id: DArah terpercik ke atasnya
  en: blood splash to upon
- aceh: peu linceuet
  jawi: ''
  id: membiarkan terpercik
  en: to allow splash
