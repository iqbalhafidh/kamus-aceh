  id: pada 2 lainnya tiang tikar berat. boengkal juga digunakan sebagai representasi dari koin dalam perdagangan
    dan dalam permainan dan kemudian mewakili tiang tikar ini disebut boengkal ringgit, yang juga digunakan
    ketika memaksakan denda dalam hadiah pernikahan (djinamé) satu berbicara tentang boengkal mas tiang
    tikar
  en: on other 2 pillar mats heavy. The boengkal is also used as a representation of coin in the trade
    and in the game and then represents pillar mats This is the so-called boengkal ringgit, which is also
    used when imposing fines In wedding gifts (djinamé) one speaks of the boengkal mas of pillar mats
  nl: op andere 2 pilaarmatten zwaar. De boengkal wordt in den handel en bij het spel ook als voorstelling
    van munt gebezigd en stelt dan 20 pilaarmatten voor. Dit is de zoogenaamde boengkal ringgit, die ook
    bij het opleggen van boeten wordt gebezigd. Bij huwelijksgiften (djinamé) spreekt men van de boengkal
    mas van 25 pilaarmatten
