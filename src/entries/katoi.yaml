definitions:
- meaning_id: nama dari berat dari seperseratus ayam. dalam Aceh 22 kati, 23 dan 24 tiang tikar berat
  meaning_en: name of a weight of the hundredth of a cock. In Aceh the kati 22, 23 and 24 pillar mats
    are heavy
  meaning_nl: naam van een gewicht van het honderdste van een pikol. In Atjeh is de kati 22, 23 en 24
    pilaarmatten zwaar
- meaning_id: kati untuk menimbang kawat emas adalah 36 tikar pilar berat
  meaning_en: the kati to weigh gold wire is 36 pillar mats heavy
  meaning_nl: de kati om gouddraad te wegen is 36 pilaarmatten zwaar
