definitions:
- meaning_id: 'kris, sejenis belati tipe dari crisps adalah: pandjang, sebuah criss panjang'
  meaning_en: 'kris, a kind of dagger. Types of crisps are: pandjang, a long criss'
  meaning_nl: 'kris, een soort van dolk. Soorten van krissen zijn: pandjang, een lange kris'
- meaning_id: matt madjapahit, sebuah krisis dengan gelombang di pisau
  meaning_en: mata madjapahit, a criss with wave in the blade
  meaning_nl: mata madjapahit, een kris met 3 golvingen in 't lemmet
- meaning_id: sēmpēna, sebuah krisis dengan gelombang di pisau
  meaning_en: sēmpēna, a criss with wave in the blade
  meaning_nl: sēmpēna, een kris met 7 golvingen in 't lemmet
- meaning_id: sipoekor, seorang Kris tanpa waverings
  meaning_en: sipoekor, a straight kris without waverings
  meaning_nl: sipoekor, een rechte kris zonder golvingen
