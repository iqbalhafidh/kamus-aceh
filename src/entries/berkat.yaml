- meaning_id: ''
  meaning_en: 'blessings, blessings Speaking of words: Bismillah arrahman arrahim, considers the Atj as
    a salutation He expresses this as follows: berkat tehat soi jang kata, many blessings for him who
    pronounces it'
  meaning_nl: 'zegen, heilzegening. Het uitspreken der woorden: Bismillah arrahman arrahim, beschouwt
    de Atj. als heilaanbrengend. Hij drukt dit als volgt uit: berkat tehat soi jang kata, vele zegeningen
    voor hem, die het uitspreekt'
