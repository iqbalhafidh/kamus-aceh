headword: muka
jawi: موكا
alt_spelling:
- moeka
ipa: ''
part_of_speech: n
definitions:
- meaning_id: muka, wajah, bahagian sebelah depan atau atas, halaman, (pada senjata tajam) bagian lekuk
    yang diasah atau pada sisinya yang pipih, (pada tanaman sirih, lada, atau tanaman tanaman panjat lainnya)
    puting tangkai, teruk, kata bantu hitung untuk keude
  meaning_en: face, the front or upper part, yard, on an edged weapon, the ground hollow or the flat of
    the blade, on the betel vine, pepper, or other climbing plants; the stalk end, severe, a classifier
    for shops
- meaning_id: wajah, penampilan
  meaning_en: face, appearance
  meaning_nl: aangezicht, gelaat, uiterlijk
- meaning_id: moeka rēdj, titik keluar dari jalan
  meaning_en: moeka rēdj, point of exit of a road
  meaning_nl: moeka rēdj, punt van uitgang van een weg
