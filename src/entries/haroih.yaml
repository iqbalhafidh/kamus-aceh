headword: harôih
jawi: ''
alt_spelling:
- harôh
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: harus, wajar, dibenarkan (terutama oleh hukum agama Islam dan adat Aceh), mungkin untuk
    menanyakan jenis kelamin anak yang baru lahir
  meaning_en: must, natural, right (chiefly by law religion Islam and custom Aceh), possibly used to ask
    the sex of a newborn child
examples:
- aceh: buet nyan harôih tamu-pakat ngon seedara dilèe
  jawi: ''
  id: Tentang hal itu seharusnya Anda bermupakat dng sesama saudara Anda terlebih dahulu
  en: In that matter you ought first to consult your own kin
- aceh: hana harôih tapoh aneuk lôn
  jawi: ''
  id: Tidak wajar Anda memukul anak saya
  en: It is not right for you to strike my child
- aceh: narit nyan hana harôih tabuka bak gob, Perkataan itu tidak wajar Anda katakan kpd orang lain,
    bieng geuteuem hana harôih tapajôh
  jawi: ''
  id: Tidak dibenarkan orang memakan kepiting geuteuem
  en: People are not permitted to eat the geuteuem crab
- aceh: hana harôih
  jawi: ''
  id: tidak dibenarkan menurut adat
  en: not permitted by custom
- aceh: utang meutanggoh harôih, banyue wajèb
  jawi: ''
  id: boleh meminta tunda pembayaran utang, tetapi membayarnya adalah wajib (pb)
  en: (proverb) One may ask to postpone a debt, but paying it is obligatory
- aceh: taudên, wajèb tamaté
  jawi: ''
  id: Hidup adalah suatu kemungkinan, mati suatu kemestian (pb)
  en: (proverb) Life is a possibility, death a certainty
- aceh: agam
  jawi: ''
  id: Tadi malam putri kami telah melahirkan
  en: Last night our daughter gave birth
- aceh: peu harôih
  jawi: ''
  id: menjadikan wajar, mengharuskan
  en: to make proper, to require
etymology: ''
related_words:
- mèe
