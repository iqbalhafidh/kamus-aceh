definitions:
- meaning_id: suara orang berteriak pada jarak yang jauh (umpamanya mengusir burung-burung pemakan padi),
    memanggil (terhadap seseorang yang tidak hadir)
  meaning_en: the sound of someone shouting at a distance (for example to drive off rice-eating birds),
    call (towards someone which not present)
examples:
- aceh: sujih meu hek-hek that
