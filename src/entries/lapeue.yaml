headword: lapeue
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: berselera (umpamanya orng sakit yang baru sembuh), bernafsu (di bidang syahwat), berkeinginan
  meaning_en: having appetite, as a person just recovered from illness, lustful, desire
examples:
- aceh: lôn lawèt nyoe lapeue that
  jawi: ''
  id: Selama ini saya sangat berselera
  en: All this time my appetite has been keen
- aceh: pakon lapeue galapeue ta? ban lheueh sakèt?
  jawi: ''
  id: Mengapa Anda sangat berselera? Baru sembbuhkah Anda?
  en: Why is your appetite so keen? Have you just recovered?
- aceh: mata, pruetji troe
  jawi: ''
  id: Matanya bernafsu, tetapi perutnya kenyang
  en: His eyes are greedy, but his belly is full
- aceh: bulo
  jawi: ''
  id: rakus, gelojoh
  en: greedy, gluttonous
