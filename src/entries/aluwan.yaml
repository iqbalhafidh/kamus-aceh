headword: ḥaloewan
jawi: حلوان
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: hadiah
  meaning_en: gift
  meaning_nl: gift, geschenk
- meaning_id: 'besi primer tipis, melayani seperti dervishs melalui hidungnya, earlobes, dll. Sengatan
    di Ratip Rapai Rapii Abui. terkejut, kagum.. isab, penambahan, nomor...aidlir navour nama salah satu
    nabi, chidhr.... ikajat, cerita, sejarah... iwinn, binatang, binatang. #'
  meaning_en: 'a thin iron primer, serve just like the dervishs through his nose, earlobes, etc. Stings
    at the ratip rapai [Rapi''i]. Surprised, amazed...isab, addition, number...aidlir [?] the name of
    one of the prophets, Chidhr....ikajat, story, history...iwēn, animal, beast. #'
  meaning_nl: 'een dunne ijzeren priem, dien men even als de derwisjen door zijn neus, oorlellen enz.
    steekt bij het ratip rapai [Rapi''i?]. حمار ḥimar, ezel. حبيل ḥamil, zwanger. حوا ḥawa, in iets zin
    hebben, begeerig zijn naar iets [eigenl. هوا]. حيران ḥērēn, verbaasd, verwonderd. حيسب ḥisab, optelling,
    getal. حيضر ḥaidlir [?] de naam van een der profeten, Chidhr. حيكايّة ḥikajat, verhaal, geschiedenis.
    حيوان ḥiwēn, dier, beest. # خ'
