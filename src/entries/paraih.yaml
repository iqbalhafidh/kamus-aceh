part_of_speech: v
definitions:
- meaning_id: meratakan (umpamanya pisau yang sumbing), kalah
  meaning_en: level (for example knife which cleft), defeated
- meaning_id: kuda (dalam hikayat)
  meaning_en: horse (in hikayat)
examples:
- aceh: sikin lon lon nue paraih mata bacut, sabab na cumeh
  jawi: ''
  id: Saya menyuruh ratakan sedikit mata pisau saya sebab ada bagiannya yg sumbing
  en: ''
- aceh: hana sahoparaih
  jawi: ''
  id: sebelah manakah atau siapakah yg kalah? Tak sebelah manapun yg kalah
  en: ''
- aceh: manok kuk'uek peue jipeugah, hihihihparaih peue khuen guda?
  jawi: ''
  id: Apakah yg dikatakan ayam berkokoh dan apa pulakah yg dikatakan kuda meringkik?
  en: ''
