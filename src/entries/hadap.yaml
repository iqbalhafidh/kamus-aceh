headword: hadap
jawi: حضور
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menghadap
  meaning_en: to face
- meaning_id: membuat front untuk sesuatu, dengan depan berubah menjadi sesuatu, membuat penampilannya
    untuk
  meaning_en: make a front to something, with the front turned to something, make his appearance to
  meaning_nl: front maken naar iets, met de voorzijde toegekeerd zijn naar iets, zijne opwachting maken
    aan
examples:
- aceh: ka geu hadap akhirat, Ia sudah menghadapi akhirat. = Ia sudah meninggal, lheueh nyan geu hadap
    ateueh kamoe
  jawi: ''
  id: Setelah itu ia menghadap kami
  en: After that he came before us
- aceh: ka lheueh lōn hadap raja
  jawi: ''
  id: Saya sudah menghadap raja
  en: I have already presented myself before the king
- aceh: lōn ka saho hadap
  jawi: ''
  id: (hrf) Saya menghadapi satu arah (= Saya hanya mempunyai satu tujuan)
  en: (literally) I face one direction (= I have only one aim)
- aceh: ji noe lōn ka saho hadap, aneuk lōn bandum ka lheueh lōn peukawēn, lōn keumeung jak u haji
  jawi: ''
  id: Sekarang saya mempunyai satu tujuan, semua anak saya telah saya kawinkan, saya hendak menunaikan
    ibadah haji
  en: 'Now I have one aim: I have married off all my children and wish to perform the hajj'
- aceh: lōn na dua ho hadap
  jawi: ''
  id: Saya menghadapi dua arah (= saya mempunyai dua maksud)
  en: I face two directions (= I have two purposes)
- aceh: meu hadap
  jawi: ''
  id: menghadapi sesuatu
  en: face something
- aceh: meu hadap kiblat
  jawi: ''
  id: menghadap kiblat
  en: to face the qibla
- aceh: lōn ka meu hadap ngon gobnyan
  jawi: ''
  id: Saya sudah berhadapan dng dia
  en: I have already faced him
- aceh: peu hadap
  jawi: ''
  id: menghadapkan
  en: face
- aceh: neupeu hadap ureueng nyang bak raja
  jawi: ''
  id: Hadapkan orang itu kpd raja. hadapan, hadapan
  en: Bring that man before the king
- aceh: mehadap kiblat
  aceh_1889: mēhadap kiblat
  jawi: ''
  id: ubah wajah ke killat
  en: turn the face to the kiblat
  nl: het gelaat naar de kiblat keeren
- aceh: mehadap prang
  aceh_1889: mēhadap prang
  jawi: ''
  id: membuat depan ke samping, di mana pertempuran dilakukan
  en: make the front to the side, where fighting is done
  nl: front maken naar de zijde, waar gestreden wordt
