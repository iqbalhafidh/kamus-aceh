headword: lansông
jawi: ''
alt_spelling:
- langsông
- lamsông
ipa: ''
part_of_speech: adv
definitions:
- meaning_id: tidak disengaja
  meaning_en: ''
- meaning_id: terlanjur
  meaning_en: having gone too far
- meaning_id: tersesat
  meaning_en: lost
- meaning_id: (hikayat) langsung
  meaning_en: (in hikayat) directly
- meaning_id: terus
  meaning_en: onward
- meaning_id: lalu
  meaning_en: then
examples:
- aceh: ka lansông buet nyoe
  jawi: ''
  id: Pekerjaan ini sudah terlanjur (apa hendak dikata!)
  en: This work has gone too far to undo; what is to be said!
- aceh: lôn ka lansông bunoe lôn bloe ija
  jawi: ''
  id: Tadc, saya terlanjur membeli kain
  en: I went and bought the cloth just now
- aceh: ka lansông lôn meurumpok ngon gobnyan
  jawi: ''
  id: Saya langsung menjumpainya
  en: I went straight to meet him
- aceh: meu lansông, teu lansông
  jawi: ''
  id: = lansông
  en: ''
- aceh: lôn ka meu lansông keu noe
  jawi: ''
  id: Saya tersesat kemari
  en: I lost here
- aceh: peu lansông
  jawi: ''
  id: membiarkan terlanjur
  en: to allow having gone too far
- aceh: bêk tapeu lansông droe
  jawi: ''
  id: Anda jangan berbuat terlanjur
  en: you do not make having gone too far
