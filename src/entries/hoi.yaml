definitions:
- meaning_id: mengasapi, memanggang (di atas kemenyan)
  meaning_en: to smoke, to fumigate, to roast (over benzoin incense)
- meaning_id: panggilan
  meaning_en: call
  meaning_nl: roepen, aanroepen
- meaning_id: smoodthing
  meaning_en: smoothing
  meaning_nl: bewierooken
