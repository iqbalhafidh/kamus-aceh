definitions:
- meaning_id: gelang anak-anak yang dibubuhi bola-bola emas kecil (boh—), dalamnya kosong, dan diisi batu-batu
    supaya berbunyi
  meaning_en: a child's bracelet set with small gold beads, inside it empty, and filled with stones so
    that it rattles
- meaning_id: boh—
  meaning_en: ''
- meaning_id: (secara umum berarti) juga) genta kecil yang digantungkan
  meaning_en: generally, also a small hanging bell
- meaning_id: umpamanya pada pakaian kuda
  meaning_en: for instance on horse trappings
- meaning_id: buah pelir
  meaning_en: testicle
- meaning_id: peue tapeugah
  meaning_en: ''
- meaning_id: boh — ayah teu! Apa yang Anda katakan itu semata-mata adalah omong kosong
  meaning_en: What you say is nothing but nonsense
- meaning_id: kopok
  meaning_en: ''
- meaning_id: sejenis alat bunyi-bunyian lama yang menyerupai canang atau geudumbak (dalam hikayat)
  meaning_en: a kind of old musical instrument resembling a canang or geudumbak (in hikayat)
- meaning_id: dandi
  meaning_en: ''
- meaning_id: muri
  meaning_en: mori cloth
- meaning_id: seureudam
  meaning_en: ''
- meaning_id: —
  meaning_en: ''
- meaning_id: nyang that meuhayak bunyoe nugara
  meaning_en: ''
