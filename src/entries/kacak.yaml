headword: kacak
jawi: كاچق
alt_spelling:
- katjak
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengacu, mengancam, mengamang (tindakan pertama dengan tangan, kemudian dengan senjata dan
    sebagainya jika hendak memegang memukul dan sebagainya seseorang). membuat acara, (juga dengan kata-kata),
    bercakap angin
  meaning_en: to aim at, to threaten, to threaten, first with the hand, then with a weapon and so forth,
    when about to seize or strike someone, also with words, to talk idly
- meaning_id: test, cobalah
  meaning_en: test, try
  meaning_nl: beproeven, trachten
examples:
- aceh: peue ta kacak, tatakteu!
  jawi: ''
  id: Apa yg Anda ancam, (jika berani) peranglah!
  en: What are you threatening? If you dare, then fight!
- aceh: lém atau paig kacak
  jawi: ''
  id: tukang cakap angin (hanya berani mengancam), tetapi tidak sampai bertindak
  en: a windbag who only threatens and never acts
- aceh: kacak keumunaih soh
  jawi: ''
  id: mengancam dengan senapan kosong, yi membuat
  en: to threaten with an unloaded gun
- aceh: bek meung kacak
  jawi: ''
  id: mantong, bak na buet! Jangan bercakap angin saja, perlihatkanlah perbuatan Anda
  en: do not merely talk, show what you can do
- aceh: Meu kacak
  jawi: ''
  id: kacak, melakukan kacak, mengancam
  en: to make a threatening gesture
etymology: ''
related_words:
- agak
- gamak
