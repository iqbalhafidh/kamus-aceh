part_of_speech: n
definitions:
- meaning_id: sejenis geladak kecil di antara sayap-sayap perahu cadik, terbuat dari belahan-belahan bambu,
    batang pineung atau nibong tempat orang duduk atau menyimpan barang-barang, bangku tempat duduk di
    muka warung-warung kecil
  meaning_en: a kind of small deck between the outriggers of a boat, made of split bamboo, an areca or
    nibung trunk used as a seat or for storing things, a bench for sitting in front of small stalls
