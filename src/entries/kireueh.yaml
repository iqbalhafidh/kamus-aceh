ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengais (umpamanya ayam
  meaning_en: ''
- meaning_id: kucing
  meaning_en: cat
- meaning_id: atau anjing) ke dalam tanah
  meaning_en: or a dog, into the ground
- meaning_id: hewan yang hendak berlagu
  meaning_en: an animal about to fight
examples:
- aceh: manok kireueh abèe
  jawi: ''
  id: Ayam mengais debu
  en: The chicken scratches in the dust
- aceh: padé habèh ji kireueh lé manok
  jawi: ''
  id: Padi sudah habis dikais ayam
  en: The chickens have scratched up all the paddy
- aceh: meu kireueh teu kireueh
  jawi: ''
  id: dikais
  en: scratched up
- aceh: pakon meu kireueh tanoh nyan?
  jawi: ''
  id: Mengapa terkais tanah itu?
  en: Why has that ground been scratched up?
- aceh: peu kireueh
  jawi: ''
  id: menyuruh kais
  en: ''
- aceh: bèk tapeu kireueh padé bak manok!
  jawi: ''
  id: Anda jangan membiarkan padi dikais ayam
  en: Do not let the chickens scratch at the paddy
- aceh: pakon meucureueh-cureueh that taseumurat lagèe manòk keumireueh
  jawi: ''
  id: Mengapa tulisan Anda corat-coret spt ayam mengais
  en: Why is your writing scrawled like a chicken's scratching?
