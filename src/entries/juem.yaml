headword: juem
jawi: جوم
alt_spelling:
- djoeëm
ipa: ''
part_of_speech: a
definitions:
- meaning_id: lembab, agak basah, kendi yang mengeluarkan air, kain yang tidak kering di jemur atau sangat
    lama disimpan, (kiasan) lemah, tidak bersemangat, tidak gemuruh
  meaning_en: damp, somewhat wet, a water jug with a spout, cloth that has not dried in the sun or has
    been stored too long, weak (figuratively), dispirited, not thunderous
- meaning_id: basah
  meaning_en: wet
  meaning_nl: nat, vochtig
- meaning_id: tebée djoeëm, nama untuk panjang memotong tebu
  meaning_en: tebée djoeëm, name for long cut sugar cane
  meaning_nl: tebée djoeëm, naam voor reeds lang gesneden suikerriet
examples:
- aceh: Allah, juem that, hana gunjak sagai, Allah
  jawi: ''
  id: lemah sekali, tidak bersemangat
  en: weak very, dispirited
- aceh: beudé juem
  jawi: ''
  id: (hrf) senapan yg lembab mesinnya sehingga tidak dapat ditembakkan = Seseorang yg tidak berhasil
    melakukan tugasnya sbg. ump penengah
  en: (literally) a gun whose lock is damp so it cannot be fired = someone who fails at the task given
    him, for instance as a mediator
- aceh: ija pi juem meungnyo tréb lam bulôh
  jawi: ''
  id: Kain pun menjadi lembab jika lama disimpan dl buluh
  en: Cloth grows damp if kept too long in a bamboo container
- aceh: peu juem
  jawi: ''
  id: melembabkan
  en: to dampen
- aceh: 'tajak peu juem bakong lam mbon, Lembabkan tembakau dl embun = Embunkan tembakau supaya lembab
    juga v menduga, mengukur kedalam air, menduga, mengira-ngira: ie la-ôt lhôk êk tajulôk, até maknusia
    h''an ek ta juem'
  jawi: ''
  id: (pb) Air laut yg dl dapat diukur, hati manusia tidak dapat diduga
  en: (proverb) The depth of the sea can be measured, but the human heart cannot be fathomed
