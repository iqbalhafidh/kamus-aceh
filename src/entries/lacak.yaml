headword: lacak
jawi: لاچق
alt_spelling:
- latjak
ipa: ''
part_of_speech: n
definitions:
- meaning_id: kesan yang diberikan atau diperlihatkan oleh seseorang atau sesuatu di kejauhan, rupa, kelakuan
    yang dapat diamati di kejauhan
  meaning_en: the impression given by a person or thing seen at a distance, appearance, conduct visible
    from a distance
- meaning_id: memiliki penampilan, penampilan, pandangan
  meaning_en: having appearance, appearance, view
  meaning_nl: het voorkomen hebben, uiterlijk, uitzicht
examples:
- aceh: ureueng nyan lacak takalon di jeueoh lagee inong, jijak-jak lagee inong
  jawi: ''
  id: Orang itu dr kejauhan tampak spt seorang wanita. Jalannya pun spt wanita
  en: From afar that man looks like a woman, and he walks like one too
