definitions:
- meaning_id: dengan stroke tangan datar
  meaning_en: with the flat hand stroke
  meaning_nl: met de vlakke hand slaan
- meaning_id: tēpoek djaroi, tepukkan tanganmu
  meaning_en: tēpoek djaroi, clap your hands
  meaning_nl: tēpoek djaroi, in de handen klappen
- meaning_id: tēpoek dada, pemukulan di dada kesedihan
  meaning_en: tēpoek dada, beating on the chest of sadness
  meaning_nl: tēpoek dada, zich op de borst slaan van droefheid
- meaning_id: tēpoek pintoe, menabrak pintu, tēpoek pēha, memukul paha
  meaning_en: tēpoek pintoe, hit the door, tēpoek pēha, hit the thighs
  meaning_nl: tēpoek pintoe, tegen de deur slaan, tēpoek pēha, tegen de dijen slaan
- meaning_id: yang terakhir ini tidak Aceher, jika ia dapat mencapai tujuannya atau melupakan sesuatu.
    sinonim dengan kēpoek
  meaning_en: this last one does an Aceher, if he can't reach his goal or forget something. Synonymous
    with kēpoek
  meaning_nl: dit laatste doet een Atjeher, als hij zijn doel niet bereiken kan of iets vergeten heeft.
    Synoniem met kēpoek
