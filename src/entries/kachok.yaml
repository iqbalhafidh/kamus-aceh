headword: kachôk
jawi: ''
alt_spelling:
- keuchôk
- kachuk
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengeplok atau mengocok (umpamanya telur), menepuk (umpamanya air), menabuh (umpamanya tabuh,
    beduk), melakukan sesuatu dengan seru (umpamanya pertarungan)
  meaning_en: to beat or whisk, as eggs, to slap (for example water), to beat, as a drum, mosque drum,
    to do something fiercely, as in a fight
examples:
- aceh: boh manok
  jawi: ''
  id: mengeplok telur ayam
  en: to beat hen's eggs
- aceh: meu kachôk
  jawi: ''
  id: dikeplok, dikocok, sangat seru
  en: beaten, whisked; very vigorous
- aceh: prang get that meu kachôk
  jawi: ''
  id: peperangan sangat seru
  en: the fighting was very fierce
- aceh: peu kachôk
  jawi: ''
  id: = kachôk atau menyuruh kachôk
  en: ''
