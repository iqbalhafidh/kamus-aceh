examples:
- aceh: taikat bak kong
  jawi: ''
  id: Ikatlah kuat-kuat
  en: Tie it firmly
- aceh: ka kong silueue
  jawi: ''
  id: hfr sudah kuat mengikat celanannya, Ia sudah pandai bercelana. (untuk menyatakan usia seorang gadis,
    kira-kira 8 tahun)
  en: '(literally) she can tie her trousers firmly: said of a girl of about eight'
- aceh: ka kong ija pinggang
  jawi: ''
  id: hrf sudah kuat mengikat kain sarungnya, (untuk menyatakan usia seorang anak laki-laki, kiki-ra-kira
    10 tahun)
  en: '(literally) he can tie his sarong firmly: said of a boy of about ten'
- aceh: ka kong narit
  jawi: ''
  id: hrf sudah diperkuat pembicaraan, Pinangannya sudah disetujui sehingga perkawinan dapat dilangsungkan
  en: '(literally) the talk has been made firm: the proposal is accepted and the marriage may go ahead'
- aceh: tanda kong narit
  jawi: ''
  id: tanda sudah dicapainya kata sepakat utk melangsungkan perkawinan, yi hadiah pengantin laki-laki
    kpd calon pengantin wanita
  en: ''
- aceh: peu kong
  jawi: ''
  id: memperkuat dsb
  en: strong and so forth
- aceh: peu kong narit
  jawi: ''
  id: memperkuat atau mempertegas persetujuan tt akan dilangsungkannya perkawinan
  en: ''
- aceh: lôn kong ureueng sakét
  jawi: ''
  id: Saya mendukung orang sakit
  en: I to carry person sick
- aceh: meu kong, teu kong
  jawi: ''
  id: didukung
  en: carried
- aceh: peu kong
  jawi: ''
  id: menyuruh dukung, bergantung di punggung seseorang
  en: ''
