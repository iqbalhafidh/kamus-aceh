- meaning_id: kông sejenis kepiting darat yang tidak dapat dimakan
  meaning_en: ''
- meaning_id: kuat, kokoh
  meaning_en: strong, sturdy
- meaning_id: mendukung
  meaning_en: to carry
- meaning_id: memikul di punggung
