ipa: ''
part_of_speech: ''
definitions:
- meaning_id: sebuah comphora terdiri dari tiga batu, kayu atau besi batang, ditempatkan di tanah dan
    digunakan sebagai ketel uap
  meaning_en: a comphora consisting of three stones, wooden or iron bars, placed on the ground and used
    as a boiler
  meaning_nl: een komfoor, bestaande uit drie steenen, houten of ijzeren staven, op den grond geplaatst
    en als stookplaats gebezigd
- meaning_id: tenoengkée batée, diperoleh dari batu panggang
  meaning_en: tenoengkée batée, obtained from baked stone
  meaning_nl: tênoengkée batée, komfoor van gebakken steen
- meaning_id: tenoengkée besoi, comphora besi sinonim dengan seloengkée
  meaning_en: tenoengkée besoi, comphora of iron. Synonym with seloengkée
  meaning_nl: tênoengkée bêsoi, komfoor van ijzer. Synoniem met sêloengkée
