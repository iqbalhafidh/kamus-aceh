headword: keumiek
jawi: ''
alt_spelling:
- amiek
ipa: ''
part_of_speech: v
definitions:
- meaning_id: menggendong sesuatu (umpamanya anak, tempayan air) di pinggang serta melakukannya dengan
    tangan
  meaning_en: to carry something on the hip, as a child, a water jar at the hip, held with the hand
examples:
- aceh: tayeuen
  jawi: ''
  id: menggendong tempayan
  en: to carry a water jar on the hip
- aceh: meu keumiek
  jawi: ''
  id: cara menggendong
  en: way to carry on the hip
- aceh: pakon h'an tapeuduek aneuk nyan! ek takeumumiek sabe?
  jawi: ''
  id: Mengapa Anda tidak membiarkan anak itu duduk! Sanggupkah Anda menggendongnya selalu?
  en: Why do you not let the child sit down! Can you carry him for ever?
- aceh: Keuneumiek
  jawi: ''
  id: cara menggendong, sesuatu yg digendong secara tertentu
  en: the manner of carrying on the hip, something so carried
- aceh: h'an jeu-et lon jak cok, aneuk lam keuneumiek
  jawi: ''
  id: Saya tidak dapat mengambilnya
  en: I cannot take it
etymology: ''
related_words:
- kilek
- tingkue
dialect_notes: ''
