    jawi: ''
    id: ''
    en: ''
  - aceh: droe
    jawi: ''
    id: dng sengaja menjerit
    en: intentionally screaming
  - aceh: bêk tapeu
    jawi: ''
    id: ''
    en: ''
  - aceh: droe sabê, h'an jeuet gob êh
    jawi: ''
    id: "Janganlah Anda menjerit-jerit selalu, (akibatnya)\n\n\n\n orang tidak dapat tidur. → ayôh geumeuto, keumeuto, n tawon: — ta-noh, sj tawon yg berdiam di dl tanah"
    en: 'Don''t always scream, (as a result) people cannot sleep. → ayôh geumeuto, keumeuto, n tawon: — ta-noh, sj tawon yg berdiam di dl tanah'
  - aceh: ''
    jawi: ''
    id: tanoh, simalam beunguh h'an gadoh bisa, (Jika disengat oleh) tawon tanah, semalam suntuk tidak akan hilang bisanya, (dikatakan thd seorang anak yg cengeng sekali) dan tidak mau segera dibujuk berhenti menangis
    en: If stung by a ground wasp, the sluggishness won't go away, (said of a very timid child) who doesn't want to be persuaded to stop crying
