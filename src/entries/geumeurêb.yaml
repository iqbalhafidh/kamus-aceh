definitions:
- meaning_id: 'menjerit, ketakutan, mengeluarkan suara halus jika ia (menurut kepercayaan) mendengarkan orang menjerit dl kubur: —'
  meaning_en: 'screaming, fear, making a soft sound if he (according to belief) hears people screaming in graves: —'
  examples:
  - aceh: pakon ta
    jawi: ''
    id: '?'
    en: to sound like a bell
  - aceh: peue tatakôt
    jawi: ''
    id: '? Mengapa Anda menjerit? apa yg Anda takuti?'
    en: '? Why are you screaming? What are you afraid of?'
  - aceh: na taleungo manok ji
    jawi: ''
    id: '?'
    en: to sound like a bell
  - aceh: so alêh hamba Allah nyang teungoh geusêksa
    jawi: ''
    id: '? Adakah Anda mendengar ayam menjerit? entah siapa hamba Allah yg sedang disiksa?'
    en: ''
