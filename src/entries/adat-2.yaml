examples:
  - aceh: "adat poteu meureuhòm"
    jawi: ""
    id: "adat almarjum yg teramat mulia"
    en: "the custom of the late revered one"
  - aceh: "adat meukuta Alam"
    id: "adat Meukuta Alam"
    en: "the custom of Meukuta Alam"
  - aceh: "Hukòm ngon adat h'an jeuet crè lagèe dat ngon sipheuet"
    id: "hukum dan adat tidak dapat diceraikan spt Zat (Tuhan) dng sifat Nya"
    en: "law and custom cannot be separated like the Creator and His attributes"
  - aceh: "adat, hukôm, reusam, kanum"
    id: "adat berasal dr raja-raja; hukum adalah ketentuan agama, reusam dan kanun adalah peraturan raja yg sedang memerintah"
    en: "custom originates from kings; law is religious decree, reusam and kanun are regulations of the ruling king"
  - aceh: "bak adat ka jikab, bak hukôm ka jikulôm"
    id: "telah dimakan oleh adat dan dikunyah oleh hukum (pb) = suatu perkara yang tidak dpt diselesaikan lagi"
    en: "consumed by custom and chewed by law (proverb) = a matter that can no longer be resolved"
  - aceh: "meu adat"
    id: "beradat, menjadikan sesuatu sebagai adat kebiasaan atau kelaziman"
    en: "to have customs, to make something a habit"
  - aceh: "teu adat"
    id: "beradat, terbiasa"
    en: "to be customary, accustomed"
  - aceh: "peu adat"
