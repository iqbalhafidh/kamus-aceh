definitions:
- meaning_id: roede untuk merak, di mana salah satu memasuki melalui parit atau masuk dekat
  meaning_en: a roede for peacocks, in which one enters through a trench or close entry
  meaning_nl: een reede voor prauwen, waarin men door een geul of nauwe invaart binnenkomt
- meaning_id: sejenis kolam, yang satu menggali di sungai, di mana satu ranting dll. ditempatkan dan ditutup
    hilir dengan tumpukan untuk menangkap ikan
  meaning_en: a kind of pond, which one digs in a river, in which one twigs etc. placed and closed downstream
    with a stack to catch fish
  meaning_nl: een soort van vijver, dien men in eene rivier graaft, waarin men takjes enz. plaatst en
    dien men stroomafwaarts met een staketsel sluit om visch te vangen
