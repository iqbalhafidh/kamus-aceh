definitions:
- meaning_id: juga disebut bandérsah, bedehuis, dimana seseorang melakukan godsdiensttoefeningen sehari-hari,
    juga bangunan sekolah, balai kota, penginapan dan tempat pertemuan lingkungan di Atj Kempongs juga
    dinamai dengan nama itu
  meaning_en: also called bandérsah, bedehuis, where one does the daily godsdiensttoefeningen, also school
    building, town hall, lodging and meeting place The neighborhoods in Atj kampongs are also named by
    that name
  meaning_nl: ook wel bandérsah, bedehuis, waar men de dagelijksche godsdiensttoefeningen doet, tevens
    ook schoolgebouw, raadhuis, logement en vereenigingsplaats. De wijken in Atj. kampongs worden eveneens
    met dien naam aangeduid
