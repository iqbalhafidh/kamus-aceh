definitions:
- meaning_id: lemak, berlemak (rasanya seperti santan)
  meaning_en: fat, fat (its taste like coconut milk)
examples:
- aceh: buleumak
  jawi: ''
  id: nasi lemak (beras yg dimasak dng santan)
  en: cooked rice fat (husked rice which cook with coconut milk)
- aceh: gulêleumak
  jawi: ''
  id: sayur lemak
  en: vegetable fat
- aceh: manêh
  jawi: ''
  id: lemah manis, (ki) ramah-tamah, (ki) enak, sedap
  en: weak sweet, cordial (figuratively), pleasant (figuratively), pleasant
- aceh: u bêk beukah, kuah beuleumak
  jawi: ''
  id: Kelapa jangan dibelah (utk mengambil santannya), tetapi kuahnya harus lemak, (ki) tanpa usaha tetapi
    memperoleh keuntungan yg sebanyak-banyaknya
  en: 'The coconut is not to be split, yet the broth must be rich: to want the greatest gain without effort'
- aceh: peuleumak
  jawi: ''
  id: membuat sehinggaleumak, memasak lemak, (ki) membuat ot orang lain enak
  en: ''
