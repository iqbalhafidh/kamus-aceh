headword: keuot
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: a
definitions:
- meaning_id: kokot (umpamanya kulit yang mengering pada anggota-anggota tubuh, seperti tangan atau lengan,
    disebabkan oleh sesuatu penyakit), meromok (karena ketakutan)
  meaning_en: shrivelled, as skin drying on the limbs, like a hand or arm, caused by some illness, to
    crouch down in fear
examples:
- aceh: bak keuot lôn, bit nyoe meunan, moga-moga tangan saya kokot, memang benar demikian, (kata-kata
    sumpah), ka keuot atau kot
  jawi: ''
  id: urat bumoe, Urat bumi sudah mengerut atau pendek (istilah utk menyatakan bahwa karena lalu lintas
    sudah ramai, jarak dr satu tempat ke tempat yg lain terasa sangat dekat)
  en: the sinews of the earth have shrunk, said because with busy traffic distances now feel short
- aceh: jaroeji ka keuot keunong peunyaket
  jawi: ''
  id: tangannya sudah kokot krn menderita penyakit
  en: his hands have grown crooked from illness
- aceh: meu keuot
  jawi: ''
  id: mengecut, dsb
  en: to shrink, and so forth
- aceh: peu keuot
  jawi: ''
  id: mengecutkan atau
  en: to make shrink, or
