headword: jan
jawi: جَن
alt_spelling:
- djan
ipa: ''
part_of_speech: n
definitions:
- meaning_id: keselamatan, waktu, jikalau
  meaning_en: safety, time, if
- meaning_id: muncul sebagai bentuk singkat dari padjan, ketika
  meaning_en: appears as abridged form of padjan, when
  meaning_nl: komt als verkorte vorm voor van padjan, wanneer
- meaning_id: djan setelah, ketika itu, jika itu djandjan, sekarang lagi, sekali lagi
  meaning_en: djan after, when it is, if it is. djandjan, now again, then again
  meaning_nl: djan na, wanneer het zoo is, als het zoo is. جَن² djandjan, nu weer, dan weer
examples:
- aceh: hana jan lôn jak!
  jawi: ''
  id: Saya tidak mau pergi
  en: I do not want to go
- aceh: hana jan lôn singgah bak gata, lê buet laen
  jawi: ''
  id: Saya tidak mempunyai waktu utk singgah pd Anda, saya mempunyai banyak pekerjaan lain
  en: I have no time to call on you, I have much other work
- aceh: h'an jan
  jawi: ''
  id: tidak mempunyai waktu utk..., begitu... sudaa
  en: to have no time for, no sooner than
- aceh: h'an jan lôn êh, ka teungeut
  jawi: ''
  id: begitu saya terbaring, sudah tertidur
  en: no sooner had I lain down than I was asleep
- aceh: padum jan, jijak kapai u Pulo We?
  jawi: ''
  id: pabila ada kapal yg berlayar ke Pulau We?
  en: when is there a ship sailing to Pulau Weh?
- aceh: 'bek jan, jangan sampai (berlalu waktunya): tajok peue yang jilakèe bèk jan jipubuet-buet nyang
    kon-kon'
  jawi: ''
  id: Berilah apa yang dimintanya sebelum ia berbuat hal yg tidak-tidak
  en: Give him what he asks before he does something foolish
- aceh: na lôn bayeue
  jawi: ''
  id: Jika telah ada (uang), akan saya bayar
  en: When I have the money, I will pay
- aceh: na waktèe jeuet lôn jak
  jawi: ''
  id: Jika
  en: if
- aceh: janjan sakit
  aceh_1889: djandjan sakit
  jawi: ''
  id: djandjan manhole, djandjan nikmat, djandjan soeka, sekarang sakit, kemudian sehat lagi (bagus),
    sekarang sedih lagi, kemudian rapi lagi
  en: djandjan manhole, djandjan nikmat, djandjan soeka, now sick, then healthy again (nice), now sad
    again, then tidy again
  nl: djandjan mangat, djandjan nikmat, djandjan soeka, nu weer ziek, dan weer gezond (lekker), nu weer
    droevig, dan weer opgeruimd
