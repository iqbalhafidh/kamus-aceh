part_of_speech: n
definitions:
- meaning_id: keselamatan, waktu, jikalau
  meaning_en: safety, time, if
examples:
- aceh: hana jan lôn jak!
  jawi: ''
  id: Saya tidak mau pergi
  en: I do not want to go
- aceh: hana jan lôn singgah bak gata, lê buet laen
  jawi: ''
  id: Saya tidak mempunyai waktu utk singgah pd Anda, saya mempunyai banyak pekerjaan lain
  en: I have no time to call on you, I have much other work
- aceh: h'an jan
  jawi: ''
  id: tidak mempunyai waktu utk ..., begitu ... sudaa
  en: to have no time for, no sooner than
- aceh: h'an jan lôn êh, ka teungeut
  jawi: ''
  id: begitu saya terbaring, sudah tertidur
  en: no sooner had I lain down than I was asleep
- aceh: padum jan, jijak kapai u Pulo We?
  jawi: ''
  id: pabila ada kapal yg berlayar ke Pulau We?
  en: when is there a ship sailing to Pulau Weh?
- aceh: 'bek jan, jangan sampai (berlalu waktunya): tajok peue yang jilakèe bèk jan jipubuet-buet nyang
    kon-kon'
  jawi: ''
  id: Berilah apa yang dimintanya sebelum ia berbuat hal yg tidak-tidak
  en: Give him what he asks before he does something foolish
- aceh: na lôn bayeue
  jawi: ''
  id: Jika telah ada (uang), akan saya bayar
  en: When I have the money, I will pay
- aceh: na waktèe jeuet lôn jak
  jawi: ''
  id: Jika
  en: if
