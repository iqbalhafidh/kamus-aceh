  jawi: ''
  id: tidak beribu dan tidak berayah
  en: ''
- aceh: maté ku aneuk deuek, maté ma aneuk meuseupeuek
  jawi: ''
  id: Jika ayah meninggal, anak-anak lapar, tetapi jika ibu mati, anak-anak akan berceceran (pb)
  en: (proverb) If the father dies the children go hungry, but if the mother dies they are scattered
