headword: ku
jawi: كو
alt_spelling:
- kée
- koe
ipa: ''
part_of_speech: n
definitions:
- meaning_id: ayah, (orang kedua dan ketiga)
  meaning_en: father, second and third person
- meaning_id: mengukur
  meaning_en: to measure
- meaning_id: memperpendek Mal. akoe, aku, secara pribadi kata ganti. dari orang pertama, muncul lebih
    dalam tulisan daripada dalam bahasa berbicara
  meaning_en: shortening of the Mal. akoe, me, personally Pronoun. of the 1st person, appears more in
    the writing than in the speaking language
  meaning_nl: verkorting van 't Mal. akoe, ik, pers. voornw. van den 1en persoon, komt meer in de schrijf-
    dan in de spreektaal voor
examples:
