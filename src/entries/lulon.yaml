definitions:
- meaning_id: kepompong (ulat sutera) yang sudah digulung benangnya tetapi belum diputar menjadi sutera
    (diumpamakan untuk sesuatu benda yang lemah, rapuh, atau yang berwarna putih bersih). meukeum-beue,
    kepompong krmbar
  meaning_en: a silk cocoon already reeled but not yet spun, used as an image of something weak, brittle,
    or pure white, a twin cocoon
