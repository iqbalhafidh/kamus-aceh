headword: iréng
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: iring, giring, berjalan di samping seseorang
  meaning_en: to escort, to herd, to walk at side someone
examples:
- aceh: bèk tajak di likôt
  jawi: ''
  id: keunoe ta iréng tajak sajan lôn, Janganlah Anda berjalan di belakang, berjalankah kemari di samping
    saya. jak iréng dara barô, mengiring pengantin wanita
  en: Do not walk behind, come and walk here beside me
- aceh: bèk ka-peu iréng droekeu toe-toe
  jawi: ''
  id: hugôb, Jangan engkau duduk dekat-dekat sekali, panas!
  en: Do not sit so close, it is hot!
etymology: ''
