headword: h’ong
jawi: هوغ
alt_spelling:
- meuh’ong
- hong
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melemparkan, membanting, membung
  meaning_en: to throw, to slam, to hurl down
- meaning_id: bau maung, bau yang tidak menyenangkan, menghina
  meaning_en: smell rank-smelling, an unpleasant smell, to insult
- meaning_id: suku kata ilmu sihir pada awal, penghabisan atau bagian suatu doa
  meaning_en: a magical syllable at the beginning, the ending or a portion of a prayer
- meaning_id: berdengung, menderu
  meaning_en: to drone, to roar, to rumble
- meaning_id: melempar, melempar sinonim dengan sërom
  meaning_en: throwing, throwing. Synonym with sërom
  meaning_nl: werpen, gooien, smijten. Synoniem met sërom
examples:
- aceh: ranub nyoe h’ong that
  jawi: ''
  id: sirih ini berbau maung sekali
  en: this betel smells very rank
- aceh: naritji h’ong that
  jawi: ''
  id: perkataannya sangat menghina. peu h’ong, (biasanya) pumeu h’ong, memaungkan
  en: 'his words are very insulting. peu h’ong (usually pumeu h’ong): to make rank'
- aceh: pakon tapumeu h’ong gulè
  jawi: ''
  id: h’an ék meung tapajöh, mengapakah Anda memaungkan sayur (ump dng membubuhi banyak kunyitnya) sehingga
    tidak dpt dimakan
  en: Why have you made the vegetables rank (for instance by putting in too much turmeric) so that they
    cannot be eaten?
etymology: ''
related_words:
