headword: iblih
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: iblis, setan
  meaning_en: devil
examples:
- aceh: 'bêe iblih, bau iblis: pruetji meukudê iblih, bak meukeulih h''an mée tabaji'
  jawi: ''
  id: Perutnya menyerupai keranjang setan (=gendut sekali), ia tidak dapat dibawa ke dalam majelis
  en: His belly is like a devil's basket (= very fat); he cannot be brought into an assembly
- aceh: akai iblih
  jawi: ''
  id: akal iblis, akal busuk
  en: devilish cunning, a wicked scheme
- aceh: meu iblih
  jawi: ''
  id: beriblis, spt iblis, jahat
  en: devil, like devil, evil
- aceh: bêk sagai tamarit meu iblih
  jawi: ''
  id: Jangan sekali-kali Anda berbicara tidak menentu spt iblis
  en: Never speak wildly like a devil
- aceh: peu iblih droe
  jawi: ''
  id: berlaku jahat spt iblis
  en: to apply evil like devil
