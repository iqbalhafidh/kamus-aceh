- meaning_id: 'berat: h''an êk lôn me padé nyoe, — that, Saya tidak dapat membawa (karung) padi ini krn berat sekali. sigo —, siseum —, seberat yg dapat dibawa oleh seorang laki-laki, beban utk sekali bawa'
  meaning_en: 'weight: h''an êk lôn me padé nyoe, — that, I cannot carry this rice sack because it''s very heavy. sigo —, siseum —, as much as a man can carry, a load for one trip'
  examples:
  - aceh: breueh siseum
