    id: tapak, berat langkah
    en: footprint, heavy step
  - aceh: 'ureueng nyan jijak h''an teujak sabab — that tapakji, Orang itu berjalan, tetapi tidak dapat berjalan krn terasa sangat berat langkahnya (krn ada sesuatu yg diingatnya) → hila: peu'
    jawi: ''
    id: memberatkan, menjadikan, beban
    en: istinjak, to purify after defecation, urination, or before wudhu (in Islamic religious books)
