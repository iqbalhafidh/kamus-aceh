headword: juntè
jawi: جونتى
alt_spelling:
- djoenté
ipa: ''
part_of_speech: v
definitions:
- meaning_id: berjuntai, duduk pada suatu ketinggian dengan kaki tergantung lemah ke bawah
  meaning_en: dangling, to sit up high with the legs dangling loosely
- meaning_id: longgar, tergantung ke bawah, seperti kaki duduk di depan penanda untuk sangat tidak sopan
  meaning_en: loose, hanging down, like the legs sitting in front of significants for very disrespectful
  meaning_nl: los, neêrhangend, zooals de beenen bij het zitten, dat in bijzijn van aanzienlijken voor
    zeer oneerbiedig wordt gehouden
- meaning_id: lain juga digunakan bunga di batang mereka, ropework, sayap dll
  meaning_en: other also used flowers on their stems, ropework, wings etc
  meaning_nl: verder ook gebezigd van bloemen aan hun stengels, van touwwerk, vleugels enz
- meaning_id: anjing mé-djoenté, dengan kaki menggantung longgar
  meaning_en: dog mé-djoenté, with the legs hanging loose
  meaning_nl: doeg mé-djoenté, met de beenen los neêrhangend zitten
