headword: himat
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: hemat, pikiran, pertimbangan , tidak boros, hati-hati
  meaning_en: thrift, frugality, think, consideration, judgement, not wasteful, thrifty, careful
examples:
- aceh: carat udép, ingat, carat himat kaya
  jawi: ''
  id: Saya orang hidup harus memikirkan setiap gerak langkahnya, syarat utk kaya haruslah berhemat dl
    perbelanjaannya (pb)
  en: (proverb) A living person must weigh every step; the condition for wealth is thrift in spending
- aceh: bak himat that tasurat surat nyan
  jawi: ''
  id: Hati-hatilah Anda menulis surat itu
  en: Be careful how you write that letter
- aceh: bak himat bacu watèe tamarit ngon ureueng jroh-jroh
  jawi: ''
  id: Berhati-hatilah sedikit jika Anda berkata-kata dng orang-orang ternama
  en: Be somewhat careful when you speak with people of standing
- aceh: that bak jimubloe
  jawi: ''
  id: Ia sangat hemat dl berbelanja, berpakaian
  en: He is very thrifty in spending and in dress
- aceh: keusa yôh na, keudua yôh lèt, 'oh ka tan, ta himat bak gèt
  jawi: ''
  id: (pb) Pertama, (pergunakanlah sesuatu) selagi ada, kedua, (makanlah) selagi Anda berselera dan berhematlah
    jika Anda tak memiliki apa-apa lagi
  en: (proverb) First, use a thing while you have it; second, eat while you have an appetite, and be sparing
    when you have nothing left
- aceh: meu himat
  jawi: ''
  id: berhemat, berhati-hati
  en: to be thrifty, to be careful
- aceh: nyoe breueh ka kureueng, tameu himat bacu
  jawi: ''
  id: Beras ini sudah berkurang, berhematlah sedikit!
  en: This rice is running low, be a little sparing with it!
