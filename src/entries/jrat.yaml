headword: jrat
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: jerat, sejenis jala sebagai alat peperangan
  meaning_en: snare, a kind of net used as a weapon of war
examples:
- aceh: rusa nyan ka keunong jrat
  jawi: ''
  id: Rusa itu terkana jerat
  en: That deer was caught in a snare
- aceh: ka lon jrat rusa
  jawi: ''
  id: Saya menjerat rusa
  en: I snare deer
- aceh: meu jrat
  jawi: ''
  id: terjerat, menyerupai jerat, kusut, banyak sekali
  en: snare, to resemble snare, tangled, many very
- aceh: buôk 'oh meu jrat
  jawi: ''
  id: Rambut (Anda) kusut
  en: hair tangled (you)
- aceh: ka meu jrat bandum taloe
  jawi: ''
  id: Semua tali sudah kusut
  en: All the ropes are tangled
- aceh: duroe 'oh meu jrat, spt duri yg berserakan di mana-mana, aneuk bajeueng tuleueng meu jrat, maji
    na ku h'an mupat
  jawi: ''
  id: anak haram yg bertulang di mana-mana, ia beribu, ayahnya tidak diketahui
  en: a bastard with kin everywhere; he has a mother, but his father is unknown
- aceh: parôt 'oh meu
  jawi: ''
  id: Badannya penuh parut
  en: His body is covered with scars
- aceh: peu jrat
  jawi: ''
  id: membiarkan terjerat, mengusutkan, mengacaukan
  en: to let something be snared, to tangle, to confuse
