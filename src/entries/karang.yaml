headword: karang
jawi: كارغ
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: mengarang, menyusun, merangkai (umpamanya bunga, permata, unsur-unsur hiasan sehingga menjadi
    suatu kesatuan yang indah, merangkai tulisan sehingga menjadi sebuah karangan), menyatukan dua buah
    barang atau hal
  meaning_en: charcoal, to arrange in order, to string together, as flowers, eye, ornamental elements
    combined into a pleasing whole, to string words together into a composition, to join two things or
    matters
- meaning_id: alignmen, peringkat, komposisi, menyusun dari tulisan
  meaning_en: alignment, ranking, composition, drawing up of writings
  meaning_nl: samenschikken, rangschikken, samenstellen, opstellen van een geschrift
- meaning_id: karangan, buku komposisi seseorang adalah
  meaning_en: karangan, book of someone's composition
  meaning_nl: karangan, boek van iemands compositie
examples:
- aceh: karang karōt atau karang marōt
  jawi: ''
  id: tidak beraturan (ump sebuah karangan)
  en: disordered, as a composition
- aceh: keunarang lōn karang marōt that
  jawi: ''
  id: karangan saya sangat tidak beraturan
  en: my composition is very disordered
- aceh: ureueng keumarang, pengarang, penulis, keunarang
  jawi: ''
  id: cara atau hasil dr karang, karangan, susunan dsb
  en: the manner or result of composing, a composition, an arrangement
- aceh: bungong keunarang, bungong karang
  jawi: ''
  id: bunga yg telah dikarang, karangan karya kesusastraan
  en: flowers strung together; a literary composition
- aceh: kitab nyoe karangan gobnyan
  jawi: ''
  id: kitab ini adalah karangannya, dikarang olehnya
  en: this book is his composition, written by him
