definitions:
- meaning_id: kepiat, ampas kelapa, daging kelapa yang dikukur kemudian diramas santannya, juga dari sagu,
    dan sebagainya
  meaning_en: coconut dregs, coconut residue, grated coconut flesh from which the milk has been pressed,
    also of sago, and so forth
- meaning_id: dipergunakan sebagai maka nan ayam dan anjing, juga untuk membuat halua u
  meaning_en: used as food for fowls and dogs, also for making halua u
