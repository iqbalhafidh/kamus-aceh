definitions:
- meaning_id: 'gempa, gempar, gaduh: beuklam kreueh that —, Tadi malam kuat sekali (terasa) gempa'
  meaning_en: 'earthquake, to be shaken, commotion: beuklam kreueh that —, Last night it was very strong (I) felt an earthquake'
  examples:
  - aceh: rakyat ban saboh nanggroe — 'oh jideungo keumeung teuka bala nyan, Di seluruh negeri rakyat menjadi gempar ketika mendengar akan datang bencana. meu —, mengeu
    jawi: ''
    id: berderak-derak, menggeletar
    en: ''
  - aceh: '''oh jipeulheueh boh meu-reuyam, meu'
    jawi: ''
    id: rumoh-rumoh, Ketika peluru meriam ditembakkan, rumah berderak-derak
    en: ''
  - aceh: wak-têe geugrak gaki, meuhayak nang-groe, waktee geubeuet jaroe mau
    jawi: ''
    id: dônya, Jika ia menggerakkan kakinya, gemuruhlah negeri dan jika ia mengangkat tangannya, menggegarlah dunia
    en: If he moves his feet, the country will rumble, and if he raises his hands, the world will shake
  - aceh: peu
    jawi: ''
    id: membuat gempar
    en: ''
- meaning_id: ilmu utk membuat takut seseorang
  meaning_en: knowledge to scare someone
  examples:
