definitions:
- meaning_id: lalat
  meaning_en: fly
- meaning_id: terbang
  meaning_en: fly
  meaning_nl: vlieg
- meaning_id: ēk lalat
  meaning_en: ēk lalat
  meaning_nl: ēk lalat, sproeten
- meaning_id: 'lalat mirahroeng, sejenis lalat, yang membuka luka, secara kiasan juga: berbicara tentang
    kejahatan di belakang seseorang'
  meaning_en: 'lalat mirahroeng, a kind of fly, that opens the wounds, figuratively as well: speak evil
    behind someone''s back'
  meaning_nl: 'lalat mirahroeng, een soort vlieg, die de wonden openrijt, figuurlijk ook: achter iemands
    rug kwaad spreken'
examples:
- aceh: bu, lalat rumah yg biasa hinggap pd
  jawi: ''
  id: nasi
  en: rice cooked
- aceh: mirah (lalat mirah rueng), sj
  jawi: ''
  id: lalat besar yg sayapnya merah, (ki) seseorang yg suka bersitnah
  en: ''
- aceh: hana jeuet tapatêh habajih, lalat mirah rueng
  jawi: ''
  id: Kita tak dapat mempercayai keterangannya. Ia seorang pemfitnah
  en: We cannot trust his account; he is a slanderer
- aceh: 'êk lalat, tahi lalat, tanda hitam di muka atau pd anggota-anggota badan lainnya: rimueng lalat,
    sj'
  jawi: ''
  id: labah-labah melompat dan pemakan lalat
  en: ''
- aceh: 'meu lalat, berlalat, dihinggapi lalat, (ki) sepele, tidak dianggap berarti: bangké kamêng ka
    meu lalat'
  jawi: ''
  id: Bangkai kambing sudah dihinggapi lalat
  en: Flies have settled on the goat's carcass
- aceh: êk meu lalat jih, hana soe jak
  jawi: ''
  id: Ia dapat dikerumuni lalat (= ia dianggap sepele) sehingga tak seorangpun mendatanginya
  en: 'Flies may swarm on him: he is thought so worthless that no one comes near'
- aceh: êk meu lalat teu, meung ranub h'an jibri
  jawi: ''
  id: Kita dapat dikerumuni lalat shg sirihpun tidak diberinya
  en: Flies might swarm on us, and still he offers no betel
