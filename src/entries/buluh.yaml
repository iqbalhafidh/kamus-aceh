headword: boeloeh
jawi: بولوة
alt_spelling: []
ipa: ''
part_of_speech: ''
definitions:
- meaning_id: bambu, dengan nama ini hanya bamboe-soorten tipis, n.l bambu tatang dan bambu igē bamboesoorten
    yang lain diindikasikan dengan Jing
  meaning_en: bamboo, with this name only thin bamboe-soorten, n.l the bamboo talang and the bamboo igē
    The other bamboesoorten are indicated with jing
  meaning_nl: bamboe, met dezen naam worden slechts 2 dunne bamboe-soorten aangeduid, n.l. de bamboe talang
    en de bamboe igē. De overige bamboesoorten worden met tring aangeduid
- meaning_id: boeloeh lēmang, yang tipis bambu tatang, sehingga-disebut, karena memiliki sejenis kue beras,
    lēmang, panggang di dalamnya
  meaning_en: boeloeh lēmang, the thin bamboo talang, so-called, because it has a kind of rice cake, lēmang,
    toasted in it
  meaning_nl: boeloeh lēmang, de dunne bamboe talang, zoogenaamd, omdat men er een soort rijstgebak, lēmang,
    in roostert
- meaning_id: boeloeh soempit, juga dikenal sebagai boeloeh igē, karena ini terbuat dari stirring kandung
    kemih
  meaning_en: boeloeh soempit, also known as boeloeh igē, because it is made of bladder stirrings
  meaning_nl: boeloeh soempit, ook boeloeh igē zoogenaamd, omdat er blaasroeren van worden vervaardigd
