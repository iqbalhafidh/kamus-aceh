headword: karat
jawi: كارت
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: berikhtiar dengan sekuat tenaga, melakukan sesuatu dengan sekuat tenaga (umpamanya karena
    keadaan waktu yang mendesak atau karena perlu dipertahankan dan sebagainya), menyegerakan, mendesak,
    mendorong
  meaning_en: to strive with all one's strength, to do something with all one's strength, under pressure
    of time or because it must be defended, to hasten, to press, to push
- meaning_id: cepat
  meaning_en: hurry, hurry. Synonymous with reeds
  meaning_nl: haast, spoedig, haastig. Synoniem met geriet
- meaning_id: cepat, sinonim dengan gēriēt
  meaning_en: hurry, synonymize with gēriēt
  meaning_nl: haast, spoedig, haastig. Synoniem met gēriēt
examples:
- aceh: ta karat laju, mangat reujang tôk, mangat reujang lheueh, segerakanlah supaya lekas sampai atau
    lekas siap, ji karat prang
  jawi: ''
  id: Ia berusaha dng sekuat tenaga utk memeranginya
  en: He strove with all his might to fight him
- aceh: Meu karat
  jawi: ''
  id: melakukan karat, disegerakan, menghadapi penyegeraan, terdesak, dl kesukaran atau bahaya
  en: to be hurried, pressed for time, in difficulty or danger
- aceh: bêk neulakêe meu karat karat
  jawi: ''
  id: '! Anda jangan minta secara mendesak!'
  en: Do not ask so insistently!
- aceh: Buet nyan meu karat that, pekerjaan itu sangat mendesak (perlu segera dikerjakan!) Peu karat
  jawi: ''
  id: menyegerakan, mendesak
  en: to hasten, to press
