part_of_speech: v
definitions:
- meaning_id: menghembuskan, meniup, berembus tembus, berlubang
  meaning_en: to blow out, to blow, to blow through, perforated
examples:
- aceh: ta mbôih apui bêk lôn
  jawi: ''
  id: Hembuskanlah api spy tidak padam
  en: Blow the fire so it does not go out
- aceh: abêe, mbôih abêe
  jawi: ''
  id: menghe mbuskan abu
  en: ''
- aceh: bu
  jawi: ''
  id: menghembuskan nasi yg panas spy dingin
  en: ''
- aceh: adat h'an jeuet tameudu'a, ta mbôih mantong
  jawi: ''
  id: Jika Anda tidak dapat berdoa (utk kebaikan seseorang), tiup-tiuplah saja
  en: If you cannot pray for him, at least breathe a blessing
- aceh: angèn tajam that ji mbôih
  jawi: ''
  id: Angin berhembus angat kencang
  en: The wind blows very hard
- aceh: apui ji mbôih meualôn-alôn
  jawi: ''
  id: Beralun-alun ia menghembuskan nafasnya yang menyerupai api
  en: In waves he breathed out what seemed like fire
- aceh: ate-ueng neuh'eun lôn lé that mbôih bak ie raya thôn nyang ka lheueh
  jawi: ''
  id: Pematang-pematang tambak ikan saya banyak sekali yg tembus pd banjir tahun lalu
  en: ''
- aceh: mu mbôih mbôih, melakukan mboih
  jawi: ''
  id: berhembus-hembus
  en: ''
