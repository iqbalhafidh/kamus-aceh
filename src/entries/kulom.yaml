headword: kulôm
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: makan dengan mulut tertutup
  meaning_en: ''
- meaning_id: mengulum
  meaning_en: to hold in the mouth
- meaning_id: menahan dalam mulut
  meaning_en: ''
examples:
- aceh: ta—ranub, bèk sijuek!
  jawi: ''
  id: Kulumlah sirih supaya Anda tidak kedinginan
  en: Hold betel in your mouth so you do not feel the cold
- aceh: peue takulôm lam babahteu?
  jawi: ''
  id: Apakah yg Anda kulum di dl mulut?
  en: What are you holding in your mouth?
- aceh: teusinyomkulôm
  jawi: ''
  id: tersenyum mengulum, tersenyum dng mulut tertutup, tersenyum simpul
  en: ''
- aceh: meukulôm
  jawi: ''
  id: terkulum dng mulut tertutup
  en: ''
- aceh: pakon meukulôm babah?
  jawi: ''
  id: Mengapa Anda terkulum-kulum?
  en: Why do you keep it in your mouth?
- aceh: peue kapeu kulôm lam babah adèk keu?
  jawi: ''
  id: Apakah yg engkau biarkan terkulum dalam mulut adikmu?
  en: What have you left in your little brother's mouth?
- aceh: Keumulom
  jawi: ''
  id: melakukan kulom
  en: ''
- aceh: pakri èk takeumulôm sabé lam babah?
  jawi: ''
  id: Bagaimanakah Anda selalu dapat mengulum sesuatu di dl mulut?
  en: How can you always be holding something in your mouth?
- aceh: Keunulôm
  jawi: ''
  id: cara atau hasil kulom
  en: the manner or result of kulom
- aceh: kulôman
  jawi: ''
  id: (dl hik) sesuatu yg dikulum, terutama sirih
  en: (in hikayat) something held in the mouth, especially betel
