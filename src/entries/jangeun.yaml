headword: jangeun
jawi: جاغن
alt_spelling:
- djangën
ipa: ''
part_of_speech: v
definitions:
- meaning_id: bersenandung, melagukan sesuatu dengan suara setengah keras, meratap dengan suara lembut,
    setengah menangis
  meaning_en: to hum, to chant something in a half-loud voice, to lament in a soft voice, half cry
- meaning_id: neuriën, di dalam mulut atau setengah keras bernyanyi
  meaning_en: neuriën, inside mouth or half loud singing
  meaning_nl: neuriën, binnensmonds of half luid zingen
examples:
- aceh: dara nyan teungoh jimeu jangeun
  jawi: ''
  id: Anak dara itu sedang bersenandung
  en: That girl is humming to herself
etymology: ''
