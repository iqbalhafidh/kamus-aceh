headword: juruet
jawi: ''
alt_spelling:
- jeuruet
ipa: ''
part_of_speech: v
definitions:
- meaning_id: melurut, memaras (umpamanya daun pada cabangnya, usus hewan yang telah disembelih supaya
    keluar kotoran dari dlnya)
  meaning_en: to strip off, to strip (leaves from a branch), the intestines of a slaughtered animal, pressed
    to void their contents
examples:
- aceh: ta juruet ôn seulimèng
  jawi: ''
  id: Lurutkan daun belimbing
  en: Strip off the belimbing leaves
- aceh: pruet kamèng nyan bak gèt ta juruet, bèk tinggai èkji
  jawi: ''
  id: Paraslah usus (hrf perut) kambing itu baik-baik supaya tidak tertinggal tahi (di dalamnya)
  en: Strip that goat's intestines well so that no dung is left inside
- aceh: meu juruet
  jawi: ''
  id: diparas
  en: stripped, trimmed
- aceh: jeumuruet
  jawi: ''
  id: sedang memeras
  en: in the midst of to squeeze
- aceh: peu juruet
  jawi: ''
  id: memeras, menyuruh paras atau membiarkan diparas
  en: to squeeze; to have something stripped or let it be stripped
- aceh: bèk tapeu juruet bak ranub
  jawi: ''
  id: Jangan Anda memeras daun sirih
  en: Do not squeeze the betel leaves
- aceh: Jeumuruet
  jawi: ''
  id: cara atau hasil memeras
  en: the manner or result of squeezing
