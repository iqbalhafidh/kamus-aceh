definitions:
- meaning_id: ayah, tapi hanya orang, dan jika anak-anak sendiri berbicara tentang ayah mereka
  meaning_en: father, but only of persons, and if the children themselves speak of their father
  meaning_nl: vader, doch alleen van personen gebezigd, en indien de kinderen zelven over hun vader spreken
- meaning_id: ajah -wa, saudara orang tua ayah atau ibu
  meaning_en: ajah-wa, a parent brother of father or mother
  meaning_nl: ajah-wa, een ouder broeder van vader of moeder
- meaning_id: ajah tjoet, ajah soe, ajah ha atau ajah tjik, adik dari ayah atau ibu
  meaning_en: ajah tjoet, ajah soe, ajah ha or ajah tjik, younger brother of father or mother
  meaning_nl: ajah tjoet, ajah soe, ajah ngah of ajah tjik, jonger broeder van vader of moeder
