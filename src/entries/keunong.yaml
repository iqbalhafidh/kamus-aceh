headword: keunong
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: v
definitions:
- meaning_id: kena, terkena, mengena, berirama, lancar (umpamanya sajak, prosa), pertemuan bintang kala
    (bintang kala) dengan bulan dilangit, ma sa antara dua pertemuan itu, dasar kalender untuk mengetahui
    sesuatu musim
  meaning_en: struck, to hit the mark, rhythmic, fluent, as of verse, prose, the conjunction of the constellation
    Scorpio with the moon, the interval between those two meetings, the basis of the calendar for determining
    the seasons
examples:
- aceh: dua ploh lhee
  jawi: ''
  id: musim 23, kira-kira bulan Januari (pada musim ini bertiup angin tenggara yg kering dan memecahkan
    butir-butir padi yg belum masak seluruhnya, keadaan di laut berbahaya kecuali selama 5—7 hari)
  en: the twenty-third season, about January, when a dry south-easterly blows and shatters the unripe
    grain; the sea is dangerous except for five to seven days
- aceh: dua ploh sa, musim 21, kira-kira bulan Pebruari (musim menuai padi dan permulaan musim menyemai
    atau menanam palawija, permulaan musem luaih blang
  jawi: ''
  id: atau musim tidak bertanaman padi di sawah)
  en: or the season when no rice is planted
- aceh: sikureueng blaih, musim 19, kira-kira bulan Maret (hujan yg kadang-kadang turun dinamakan ujeuen
    brok jeundrang
  jawi: ''
  id: hujan yg membusukkan jerami padi)
  en: the rain that rots the rice straw
- aceh: tujoh blaih
  jawi: ''
  id: musim 17, kira-kira bulan April (permulaan musim barat, banyak penyakit, spt pilek, demam, dan radang
    mata
  en: the seventeenth season, about April, the start of the west monsoon, with much illness such as colds,
    fever and eye inflammation
- aceh: keunong dan kedua keunong berikutnya turunlah ikan luloh
  jawi: ''
  id: dr hulu sungai sampai ke laut dan disana ikan ikan itu ditangkap
  en: from the river's head down to the sea, where the fish are caught
- aceh: keunong
  jawi: ''
  id: mata hari berada di rembangnya)
  en: the sun stands at its zenith
- aceh: limong blaih
  jawi: ''
  id: musim 15, kira-kira bulan Mei) (musim ribut di laut permulaan orang membajak sawah)
  en: the fifteenth season, about May, stormy at sea, when ploughing begins
- aceh: lhee blaih, musim 13, kira kira bulan Juni (musim membajak secara umum, berakhirnya musém luaih
    blang, dan dimulainya musém picék atau kot blang
  jawi: ''
  id: musim 'sempit', yi larangan melepaskan hewan di sawah sawang krn orang mengerjakan sawah
  en: the 'narrow' season, when livestock may not be loosed in the fields because the land is being worked
- aceh: sibalih
  jawi: ''
  id: musim 11, kira-kira bulan Juli (permulaan orang menyemai padi)
  en: the eleventh season, about July, when rice sowing begins
- aceh: siblaih tabu jereueng keunong sikureueng tabu rata
  jawi: ''
  id: Pd musim 11, orang jarang menabur padi. Pd musim 9, di mana-mana orang menabur padi. Musim berembusnya
    angin barat, kecuali 5—7 hari)
  en: In the eleventh season people seldom sow rice; in the ninth they sow everywhere. It is the season
    of the west wind, save for five to seven days
- aceh: sikureueng
  jawi: ''
  id: musim 9, kira kira bulan Agustus, musim menyemai pada secara umum, Pd musim ini, bieng kông, sj
    kepiting darat, bertualang kemana-mana seolah olah mereka tidak dapat menemukan 'rumah-rumah' mereka
    lagi, musim kemarau, (utk kedua kalinya, matahari berada di rembangnya di siang hari
  en: the ninth season, about August, the general sowing season, when land crabs wander everywhere as
    though they can no longer find their burrows; the dry season, when for the second time the sun stands
    overhead at midday
- aceh: asée meu seutêt
  jawi: ''
  id: padi yg berumur panjang menjadi dara. Orang menyemai padai yg berumur pendek. Anjing anjing mulai
    kawin)
  en: the long-season rice comes into ear; short-season rice is sown; the dogs begin to mate
