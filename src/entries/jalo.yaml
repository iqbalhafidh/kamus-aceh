headword: jalô
jawi: ''
alt_spelling: []
ipa: ''
part_of_speech: n
definitions:
- meaning_id: perahu jenis terkecil di Aceh, terbuat dari sebatang kayu dan kadang-kadang mempergunakan
    layar
  meaning_en: the smallest kind of boat in Aceh, made from a single log and sometimes fitted with a sail
examples:
- aceh: daya
  jawi: ''
  id: berasal dr Daya, panjangnya sedang dan agak lebar sedikit
  en: originating from Daya, of medium length and rather broad
- aceh: klêwè (jalô bidôk)
  jawi: ''
  id: dng cadik
  en: with an outrigger
- aceh: klibeuet (jalô kusangka), jalô peusangka
  jawi: ''
  id: berbentuk kecil sekali, tajam ujung dan belakangnya (dipergunakan utk memancing)
  en: very small in form, sharp at point and back, used for fishing
- aceh: kulek
  jawi: ''
  id: sampan kolek, perahu laut jenis besar utk menangkap ikan dng pukat-pukat kecil
  en: a kolek sampan, a large sea boat for fishing with small nets
- aceh: Meulabôh
  jawi: ''
  id: berasal dr Meulabôh
  en: originating from Meulaboh
- aceh: seureumpéh
  jawi: ''
  id: dng linggi muka dan belakang yg berbentuk lunas
  en: with fore and aft stem-posts shaped like a keel
- aceh: bruek jalô
  jawi: ''
  id: badan perahu
  en: body boat
- aceh: ulée jalô
  jawi: ''
  id: ujung linggi muka perahu
  en: tip stem-post face boat
- aceh: iku jalô
  jawi: ''
  id: ujung linggi belakang perahu
  en: tip stem-post back boat
- aceh: dagu ulée jalô (dagu iku jalô)
  jawi: ''
  id: ruang segi tiga pd linggi muka dan belakang pera hu
  en: the triangular space at the fore and aft stem-posts of a boat
- aceh: simpi jalô, bagian-bagian yg ditinggikan pd kiri kanan perahu yg terbuat dr papan, rubéng jalô
  jawi: ''
  id: bagian perahu kiri kanan yg diperbuat dr daun-daun nipah
  en: the parts on either side of a boat made of nipa leaves
- aceh: peunganyoh jalô
  jawi: ''
  id: pengayuh atau dayung perahu
  en: a paddle or oar
- aceh: meu jalô
  jawi: ''
  id: memiliki jalô, berperahu, menyerupai jalô, berbentuk jalô
  en: to own a canoe, to go by canoe, to resemble a canoe
