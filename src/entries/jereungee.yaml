definitions:
- meaning_id: tanaman yang akarnya dikunyah oleh perempuan voodoo dan air liur yang ludah selama 7 hari
    pertama setelah melahirkan di sekitar wanita itu melahirkan untuk melindunginya dan anak baru lahir
    nya dari roh-roh jahat Karena mereka tidak berani mendekati dengan bau yang tidak menyenangkan
  meaning_en: a plant whose root is chewed with sirih by voodoo women and whose saliva spit during the
    first 7 days after delivery around the woman gave birth to protect her and her newly born child from
    evil spirits because they do not dare to approach it by its unpleasant smell
  meaning_nl: een plant, waarvan de wortel door vroed vrouwen met sirih gekauwd wordt en waarvan zij het
    speeksel gedurende de eerste 7 dagen na de bevalling rondom de bevallen vrouw spuwen om haar en haar
    pas geboren kind tegen kwade geesten te behoeden, dewijl zij dan door den onaangenamen reuk ervan
    niet durven te naderen
